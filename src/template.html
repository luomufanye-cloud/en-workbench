<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="英语跃迁工作台">
<meta name="theme-color" content="#101f3b">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="luomu-logo.svg">
<title>Luomu English · 英语跃迁工作台</title>
<style>
:root{
  --bg:#FBF7F0; --surface:#FFFFFF; --surface-2:#F6F0E6;
  --ink:#3A352F; --muted:#8A8178; --line:#ECE3D6;
  --terra:#C26B4A; --terra-soft:#F2DFD3; --terra-d:#A8553A;
  --sage:#7A9B76; --sage-soft:#E4EDE1; --sage-d:#5F8260;
  --gold:#C9A24B; --danger:#C0473B; --danger-soft:#F6DEDB;
  --shadow:0 6px 22px rgba(90,70,50,.10); --radius:16px;
  --r-sm:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.55;
  -webkit-font-smoothing:antialiased; padding-bottom:80px;
}
.wrap{max-width:960px;margin:0 auto;padding:0 14px}
/* Header */
header.top{
  background:linear-gradient(135deg,#F3E7DA,#FBF7F0 60%);
  border-bottom:1px solid var(--line); padding:18px 0 14px;
}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:12px;background:var(--terra);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;box-shadow:var(--shadow)}
.brand h1{font-size:20px;margin:0;letter-spacing:.5px}
.brand p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.stats{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:8px 12px;min-width:78px;box-shadow:var(--shadow)}
.chip b{display:block;font-size:18px;color:var(--terra-d)}
.chip span{font-size:11.5px;color:var(--muted)}
/* Tabs */
nav.tabs{position:sticky;top:0;z-index:20;background:rgba(251,247,240,.92);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin-top:0}
.tabs .wrap{display:flex;gap:6px;overflow-x:auto;padding:10px 14px}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);
  color:var(--muted);padding:8px 15px;border-radius:999px;font-size:14px;cursor:pointer;
  display:flex;align-items:center;gap:6px;white-space:nowrap;transition:.15s}
.tab.active{background:var(--terra);color:#fff;border-color:var(--terra);font-weight:600}
.tab svg{width:16px;height:16px}
/* Sections */
section.panel{display:none;animation:fade .25s ease}
section.panel.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;margin-top:14px;box-shadow:var(--shadow)}
.card h2{font-size:16px;margin:0 0 4px;display:flex;align-items:center;gap:8px}
.card .sub{color:var(--muted);font-size:12.5px;margin:0 0 12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
/* Buttons */
.btn{border:1px solid var(--terra);background:var(--terra);color:#fff;padding:9px 16px;
  border-radius:11px;font-size:14px;cursor:pointer;font-weight:600;transition:.15s}
.btn:hover{background:var(--terra-d)}
.btn.ghost{background:var(--surface);color:var(--terra);border-color:var(--terra-soft)}
.btn.ghost:hover{background:var(--terra-soft)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:9px}
.btn.soft{background:var(--sage-soft);color:var(--sage-d);border-color:var(--sage-soft)}
.btn.soft:hover{background:#D7E6D2}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{border:none;background:transparent;cursor:pointer;color:var(--terra);padding:4px}
/* Badges */
.badge{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:600;white-space:nowrap}
.b-cet6{background:var(--sage-soft);color:var(--sage-d)}
.b-ielts{background:var(--terra-soft);color:var(--terra-d)}
.b-type{background:var(--surface-2);color:var(--muted)}
.b-danger{background:var(--danger-soft);color:var(--danger)}
.b-ok{background:var(--sage-soft);color:var(--sage-d)}
.b-wrong{background:var(--danger-soft);color:var(--danger)}
/* Inputs */
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);
  border:1px solid var(--line);border-radius:10px;padding:8px 11px;background:var(--surface);width:100%}
textarea{resize:vertical;min-height:64px}
select{width:auto;min-width:120px}
label.fld{display:block;font-size:12.5px;color:var(--muted);margin:8px 0 3px}
/* Task list */
.task{display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid var(--line);
  border-radius:12px;margin-bottom:8px;background:var(--surface)}
.task .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s}
.task.done .box{background:var(--sage);border-color:var(--sage)}
.task.done .tname{color:var(--muted);text-decoration:line-through}
.task .tname{font-weight:600}
.tag-core{font-size:10.5px;background:var(--terra-soft);color:var(--terra-d);padding:1px 7px;border-radius:999px}
.tag-flex{font-size:10.5px;background:var(--surface-2);color:var(--muted);padding:1px 7px;border-radius:999px}
.overdue{border-color:var(--danger);background:var(--danger-soft)}
/* Quiz */
.filterbar{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.filterbar .fitem{display:flex;flex-direction:column;gap:3px}
.filterbar label{font-size:11.5px;color:var(--muted)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.q .qhead{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.q .stem{white-space:pre-wrap;margin:4px 0 10px;font-size:14.5px}
.q .passage{background:#FBF9F5;border:1px solid var(--line);border-radius:12px;padding:12px;margin:4px 0 10px;font-size:14px;white-space:pre-wrap;line-height:1.7;color:#3A352F;position:relative}
.q .passage::before{content:'📖 阅读原文';display:block;font-size:11px;font-weight:700;color:var(--sage-d);margin-bottom:6px;letter-spacing:.5px}
.q .qtext{margin:4px 0 10px;font-size:14.5px;white-space:pre-wrap;line-height:1.6;color:var(--ink)}
.q .qtext::before{content:'🔍 ';font-weight:700;color:var(--terra-d)}
.opt{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);
  border-radius:10px;margin-bottom:7px;cursor:pointer;transition:.12s;background:var(--surface)}
.opt:hover{border-color:var(--terra)}
.opt.sel{border-color:var(--terra);background:var(--terra-soft)}
.opt.correct{border-color:var(--sage);background:var(--sage-soft)}
.opt.wrong{border-color:var(--danger);background:var(--danger-soft)}
.opt .mk{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-size:12px}
.opt.sel .mk{border-color:var(--terra);background:var(--terra);color:#fff}
.analysis{margin-top:8px;border-top:1px dashed var(--line);padding-top:10px;font-size:13px;color:#5b5249}
.analysis .at{font-weight:700;color:var(--terra-d);margin-bottom:3px}
.sample{background:var(--surface-2);border-radius:10px;padding:10px;font-size:13px;white-space:pre-wrap;margin-top:6px}
/* Daily reading — 梅花式一题一卡 */
.read-set{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.read-card{border-radius:16px;padding:16px;box-shadow:var(--shadow);position:relative;overflow:hidden;background:var(--surface)}
.read-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px}
.read-card.article{background:#FBF9F5;border:1px solid var(--line)}
.read-card.article::before{background:var(--sage)}
.read-card.question{border:1px solid var(--line)}
.read-card.question::before{background:var(--terra)}
.read-card.answer{border:1px dashed var(--terra-soft);background:#FFF9F5}
.read-card.answer::before{background:var(--terra)}
.read-hd{display:flex;align-items:center;gap:10px;margin-bottom:10px;position:relative;z-index:1}
.read-hd .ric{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:0 0 auto}
.read-card.article .ric{background:var(--sage-soft);color:var(--sage-d)}
.read-card.question .ric{background:var(--terra-soft);color:var(--terra-d)}
.read-card.answer .ric{background:var(--terra-soft);color:var(--terra-d)}
.read-hd h3{margin:0;font-size:15px;color:var(--ink)}
.read-hd .meta{margin-left:auto;font-size:11px;color:var(--muted);background:var(--surface-2);padding:3px 9px;border-radius:999px}
.read-passage{font-size:14.5px;line-height:1.75;color:#4a433c;white-space:pre-wrap;position:relative;z-index:1}
.read-question{font-size:15px;line-height:1.65;font-weight:700;color:var(--ink);margin-bottom:10px;position:relative;z-index:1}
.read-opts{display:flex;flex-direction:column;gap:7px;position:relative;z-index:1}
.read-opt{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:14px;cursor:pointer;transition:.12s}
.read-opt:hover{border-color:var(--terra)}
.read-opt.sel{border-color:var(--terra);background:var(--terra-soft)}
.read-opt .letter{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted);flex:0 0 auto}
.read-opt.sel .letter{border-color:var(--terra);background:var(--terra);color:#fff}
.read-details>summary{list-style:none;cursor:pointer}
.read-details>summary::-webkit-details-marker{display:none}
.read-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;background:none;border:none;padding:0;font-size:14px;font-weight:700;color:var(--terra-d);position:relative;z-index:1}
.read-summary{display:flex;align-items:center;gap:10px}
.read-answer{padding-top:12px;margin-top:12px;border-top:1px dashed var(--line);position:relative;z-index:1}
.read-answer .ans-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.read-answer .ans-val{font-size:20px;font-weight:800;color:var(--sage-d)}
.read-answer .ans-tag{font-size:11px;background:var(--sage-soft);color:var(--sage-d);padding:2px 9px;border-radius:999px;font-weight:600}
.read-answer .ans-body{font-size:13.5px;line-height:1.7;color:#5b5249;margin-top:8px}
/* Vocab */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.vcard{border:1px solid var(--line);border-radius:14px;padding:13px;background:var(--surface);box-shadow:var(--shadow)}
.vcard .vw{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.vcard .vp{color:var(--muted);font-size:13px}
.vcard .vm{margin:6px 0;font-size:13.5px}
.vcard .ve{font-size:12px;color:#6b6258;font-style:italic;border-left:3px solid var(--terra-soft);padding-left:8px}
.vcard .vact{display:flex;gap:6px;margin-top:8px}
.vcard.known{border-color:var(--sage);background:#F4F8F2}
.flash{text-align:center;max-width:520px;margin:0 auto}
.flash .fc{min-height:200px;border:1px solid var(--line);border-radius:18px;padding:30px 20px;text-align:center;
  background:var(--surface);box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;justify-content:center}
.flash .fc .big{font-size:30px;font-weight:700}
.flash .fc .ph{color:var(--muted);font-size:15px;margin-top:6px}
.flash .fc .ans{margin-top:14px;font-size:16px}
/* Resources */
.res{display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.res .ri{width:34px;height:34px;border-radius:9px;background:var(--terra-soft);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.res a{font-weight:600;color:var(--terra-d);text-decoration:none}
.res .rd{font-size:12px;color:var(--muted)}
/* Data */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px;overflow-x:auto;padding-bottom:6px}
.heat .d{width:13px;height:13px;border-radius:3px;background:var(--surface-2)}
.heat .d.l1{background:#E9D9C8}.heat .d.l2{background:#DCB89C}.heat .d.l3{background:#C98E66}.heat .d.l4{background:var(--terra)}
.logitem{border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:7px;font-size:13px;display:flex;justify-content:space-between;gap:8px}
.muted{color:var(--muted)}
/* 移动端右下角诊断按钮：默认小圆点，点击展开 */
.verchip{position:fixed;right:12px;bottom:78px;z-index:60;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:11px;padding:4px 10px;border-radius:999px;box-shadow:var(--shadow);cursor:pointer;font-family:inherit;transition:.2s}
.verchip.collapsed{padding:0;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px}
.verchip.collapsed .txt{display:none}
/* PWA install banner */
.pwa-install{position:fixed;top:0;left:0;right:0;z-index:80;background:var(--surface);border-bottom:1px solid var(--line);display:none;align-items:center;gap:10px;padding:8px 14px;box-shadow:var(--shadow)}
.pwa-install.show{display:flex}
.pwa-install .ico{font-size:20px}
.pwa-install .txt{flex:1;font-size:13.5px;color:var(--ink);line-height:1.4}
.pwa-install .txt b{display:block;font-size:14px}
.pwa-install .btn-sm{background:var(--terra);color:#fff;border:none;padding:6px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
.pwa-install .btn-sm:hover{opacity:.92}
.pwa-install .close{background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:2px 6px}
@media(max-width:480px){
  .verchip{padding:0;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px}
  .verchip .txt{display:none}
  .q{padding:10px;margin-bottom:8px;border-radius:10px}
  .q .stem{font-size:13.5px;margin:2px 0 6px}
  .q .passage{padding:8px;font-size:12.5px;border-radius:8px;margin:2px 0 6px;line-height:1.6}
  .q .passage::before{font-size:10px;margin-bottom:4px}
  .q .qtext{font-size:13.5px;margin:2px 0 6px;line-height:1.55}
  .q .qhead{gap:4px;margin-bottom:4px}
  .opt{padding:7px 9px;gap:8px;font-size:13.5px;border-radius:8px}
  .opt .mk{width:22px;height:22px;font-size:12px}
}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:11px 18px;border-radius:12px;font-size:13.5px;z-index:99;opacity:0;transition:.25s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
.empty{text-align:center;color:var(--muted);padding:26px;font-size:13.5px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:none;background:var(--surface);padding:7px 13px;cursor:pointer;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--terra);color:#fff;font-weight:600}
/* Weekly plan board */
.board{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px}
.col{flex:0 0 148px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:11px}
.col h3{font-size:13.5px;margin:0 0 1px}
.col .cdate{font-size:11px;color:var(--muted);margin-bottom:8px}
.col .cbar{height:5px;border-radius:3px;background:var(--surface);overflow:hidden;margin-bottom:8px}
.col .cbar i{display:block;height:100%;background:var(--sage);border-radius:3px}
.ptask{display:flex;gap:7px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 8px;margin-bottom:6px;font-size:12.5px}
.ptask.done .ptext{text-decoration:line-through;color:var(--muted)}
.ptask .pbox{width:16px;height:16px;border-radius:5px;border:2px solid var(--line);flex:0 0 auto;cursor:pointer;margin-top:1px;display:flex;align-items:center;justify-content:center}
.ptask.done .pbox{background:var(--sage);border-color:var(--sage)}
.ptask .pbox svg{width:11px;height:11px}
.ptask .pdel{margin-left:auto;cursor:pointer;color:var(--muted);border:none;background:none;font-size:13px;padding:0 2px}
.col .add{margin-top:4px}
.col .add input{padding:6px 8px;font-size:12.5px}
/* Speaking partner */
.spk-cat{margin-bottom:10px}
.prompt{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--surface);box-shadow:var(--shadow)}
.prompt .pq{font-size:16px;font-weight:700;line-height:1.5}
.prompt .ptip{font-size:12.5px;color:var(--muted);margin-top:6px}
.prompt .pwords{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.prompt .pwords span{font-size:11.5px;background:var(--sage-soft);color:var(--sage-d);padding:2px 8px;border-radius:999px}
.recbox{margin-top:12px}
.recbox textarea{min-height:80px}
.rate{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.model{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;font-size:13px}
.model .at{font-weight:700;color:var(--terra-d);margin-bottom:4px}
.model .mv{background:var(--surface-2);border-radius:10px;padding:10px;white-space:pre-wrap}
.sr-status{font-size:12.5px;color:var(--terra-d);margin-top:6px;min-height:18px}
/* Bottom nav (app shell) */
/* AI 搭子 */
.msgs{display:flex;flex-direction:column;gap:8px;max-height:54vh;overflow-y:auto;padding:4px 2px;scroll-behavior:smooth}
.msg{max-width:86%;padding:9px 12px;border-radius:14px;font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.msg.me{align-self:flex-end;background:var(--terra);color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg .spk{opacity:.65;cursor:pointer;margin-left:6px;font-size:12px}
.think{align-self:flex-start;color:var(--muted);font-size:13px;font-style:italic;padding:4px 8px}
.chatbar{display:flex;gap:8px;align-items:flex-end;margin-top:10px}
.chatbar textarea{flex:1;min-height:46px;max-height:120px;resize:none}
.cfgbox{border-top:1px dashed var(--line);padding-top:12px;margin-top:12px;display:flex;flex-direction:column;gap:8px}
.cfgbox .hint{font-size:12.5px;color:var(--muted);line-height:1.7}
.modehero{display:flex;align-items:center;gap:10px;margin:2px 0 10px}
.modehero .big{font-size:26px}
.bottomnav{display:none}
@media(max-width:560px){
  .stats .chip{min-width:64px;padding:7px 9px}
  .brand h1{font-size:18px}
  .vgrid{grid-template-columns:1fr}
  nav.tabs{display:none}
  .bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:rgba(251,247,240,.97);backdrop-filter:blur(8px);border-top:1px solid var(--line);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
  .btab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--muted);cursor:pointer;padding:3px 0}
  .btab svg{width:20px;height:20px}
  .btab.active{color:var(--terra)}
  body{padding-bottom:74px}
  .board{flex-wrap:nowrap}
}
/* ================= v2.5 杂志质感整体重设计 ================= */
:root{
  --bg:#F6F3EC; --surface:#FFFFFF; --surface-2:#F0ECE2;
  --ink:#1B1A17; --muted:#8C8577; --line:#E6E0D2;
  --acc:#2F5D4A; --acc-soft:#E8EFEA; --acc-d:#244839;
  --gold:#B08D3E; --danger:#B4432F; --danger-soft:#F7E4DF;
  --shadow:0 1px 2px rgba(27,26,23,.04),0 10px 30px rgba(27,26,23,.05);

<script>
const EN_DATA = /*__EN_DATA__*/null;
/* ============ utils ============ */
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}},
  set(k,v){localStorage.setItem(k,JSON.stringify(v));}};
const K={
  checkin:'wb_en_checkin_v3', quizLog:'wb_en_quizlog_v3', wrong:'wb_en_wrong_v3',
  mastery:'wb_en_vocab_mastery_v3', userVocab:'wb_en_user_vocab_v3',
  resources:'wb_en_resources_v3', impQ:'wb_en_imp_q_v3', impV:'wb_en_imp_v_v3',
  wrongStreak:'wb_en_wrong_streak_v1'
};
/* 日期层统一用本地时区（修复：toISOString 取 UTC 日期，东八区 0:00-7:59 会把今天记到前一天） */
const fmtD=d=>{const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());};
const TODAY=()=>fmtD(new Date());
function dateAdd(d,n){const x=new Date(d+'T00:00:00');x.setDate(x.getDate()+n);return fmtD(x);}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1900);}
let _voices=[],_vReady=false;
function loadVoices(){try{_voices=speechSynthesis.getVoices()||[];_vReady=true;}catch(e){}}
if('speechSynthesis'in window){loadVoices();try{speechSynthesis.onvoiceschanged=loadVoices;}catch(e){}}
function pickVoice(lang){if(!_voices.length)return null;
  const norm=s=>String(s||'').toLowerCase().replace('_','-');
  // 1) 精确匹配 en-US（兼容 en_US 写法）
  let v=_voices.find(x=>norm(x.lang)==='en-us');if(v)return v;
  // 2) 美式优先：en-US / en-CA(加拿大接近美式)
  v=_voices.find(x=>/^en[-_]?(us|ca)/i.test(x.lang||''));if(v)return v;
  // 3) 任意英语中排除英式/澳式/印度式/新西兰式
  const en=_voices.filter(x=>(x.lang||'').toLowerCase().startsWith('en'));
  if(en.length){const nb=en.find(x=>!/en[-_]?(gb|uk|au|nz|in)/i.test(x.lang));return nb||en[0];}
  // 4) 关键：找不到任何英文语音时返回 null —— 绝不回退到中文语音，
  //    否则会强制用中文引擎读英文（"shiwuth"问题的根源）
  return null;}
/* 把文本转成更自然的发音形式（解决 TTS 把 15th 读成 'fifteenth' 而不是 'one five th' 等问题） */
function oralize(t){
  if(!t)return t;
  const ones=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
  const tens=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
  const O=['th','st','nd','rd','th','th','th','th','th','th'];
  function num2words(n){
    if(n<20)return ones[n];
    if(n<100)return tens[Math.floor(n/10)]+(n%10?'-'+ones[n%10]:'');
    if(n<1000)return ones[Math.floor(n/100)]+' hundred'+(n%100?' '+num2words(n%100):'');
    return String(n);
  }
  function ordinal(n){
    if(n<20)switch(n){case 1:return 'first';case 2:return 'second';case 3:return 'third';case 4:return 'fourth';case 5:return 'fifth';case 8:return 'eighth';case 9:return 'ninth';case 11:return 'eleventh';case 12:return 'twelfth';case 13:return 'thirteenth';default:return ones[n]+(O[n%10]||'th');}
    // n >= 20: keep higher place words, convert only the last digit
    let parts=num2words(n).replace(/-/g,' ').split(' ');
    parts.pop();
    const m=n%10;
    let last;
    if(m===0){
      if(n<100){let w=tens[n/10];return w.replace(/y$/,'iet')+'h';}
      return num2words(n).replace(/-/g,' ')+'th';
    }else if(m===1)last='first';
    else if(m===2)last='second';
    else if(m===3)last='third';
    else if(m===5)last='fifth';
    else if(m===8)last='eighth';
    else if(m===9)last='ninth';
    else last=ones[m]+'th';
    parts.push(last);
    return parts.join(' ');
  }
  return t.replace(/\b(\d{1,3})(st|nd|rd|th)\b/g,(m,n)=>ordinal(Number(n)))
          .replace(/([a-zA-Z])-([a-zA-Z])/g,'$1 $2')
          .replace(/\//g,' ')
          .replace(/\s+/g,' ').trim();
}
function hasEnVoice(){return _voices.some(v=>(v.lang||'').toLowerCase().startsWith('en'));}
/* 在线美音降级：手机没装英文语音包时，用有道词典美音接口朗读（联网即可，无需装语音包） */
let _ttsAudioEl=null;
function getTtsAudioEl(){
  if(!_ttsAudioEl){
    _ttsAudioEl=document.createElement('audio');
    _ttsAudioEl.style.display='none';
    _ttsAudioEl.setAttribute('playsinline','true');
    document.body.appendChild(_ttsAudioEl);
  }
  return _ttsAudioEl;}
function playOnlineTTS(t){
  let txt=oralize(t).trim();if(!txt)return;
  const segs=txt.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[txt];
  const q=segs.map(s=>s.trim()).filter(s=>s.length>0&&s.length<=120);
  if(!q.length)q.push(txt.slice(0,120));
  const a=getTtsAudioEl();
  try{a.pause();a.src='';}catch(e){}
  let i=0;
  function next(){
    if(i>=q.length){a.src='';return;}
    const url='https://dict.youdao.com/dictvoice?type=2&audio='+encodeURIComponent(q[i++]);
    a.src=url;
    a.onended=function(){next();};
    a.onerror=function(){console.warn('TTS audio error',a.error);next();};
    function tryPlay(){
      a.play().catch(function(err){
        // 没加载好：等 canplaythrough 再试一次（某些浏览器允许）
        if(err.name==='NotSupportedError'||err.name==='NotAllowedError'||(err.message||'').includes('supported')||(err.message||'').includes('allowed')){
          a.oncanplaythrough=function(){a.oncanplaythrough=null;a.play().catch(function(){next();});};
          // 保险：2秒后如果还没响，跳过这句
          setTimeout(function(){if(a.src===url){next();}},2500);
        }else{next();}
      });
    }
    // 若已缓存或足够快则直接播；否则等 canplaythrough
    if(a.readyState>=3){tryPlay();}
    else{a.oncanplaythrough=function(){a.oncanplaythrough=null;tryPlay();};a.onerror=function(){next();};}
  }
  next();}
function speak(t){if(!t)return;
  if(!('speechSynthesis'in window)){playOnlineTTS(t);return;}
  if(!_voices.length)loadVoices();
  // 无英文语音包（含 voices 尚未加载的 0 个情况）→ 自动切在线美音
  if(!hasEnVoice()){
    if(!LS.get('wb_en_tts_tip_v1')){LS.set('wb_en_tts_tip_v1',1);toast('🔊 已用在线美音朗读（无需安装语音包，联网即可）');}
    playOnlineTTS(t);return;}
  try{speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(oralize(t));u.lang='en-US';u.rate=.95;
    if(!_voices.length)loadVoices();
    const v=pickVoice('en-US');if(v)u.voice=v;
    const fire=()=>{

// 拆分阅读题的 stem：原文 vs 题目
function splitReadingStem(stem){
  let s=String(stem||'').trim();
  // 1. 去掉开头的整行中文/非英文指令（如「阅读以下短文并回答问题。」）
  let lines=s.split(/\r?\n/);
  while(lines.length && !/[a-zA-Z]{4,}/.test(lines[0])) lines.shift();
  s=lines.join('\n').trim();
  // 2. 去掉 "Passage:" / "Passage excerpt:" 前缀
  s=s.replace(/^Passage excerpt:\s*/i,'').replace(/^Passage:\s*/i,'');
  // 3. 按题目标记切分（含 Question:）
  const marker=/(Question:?|According to the passage|Which of the following|What does the (?:author|passage|writer)|Why does the (?:author|writer)|How does the (?:author|writer)|The passage suggests|It can be inferred|In the passage, the word|The word [^ ]+ in the passage)/i.exec(s);
  let passage='',question=s;
  if(marker){
    passage=s.slice(0,marker.index).trim();
    question=s.slice(marker.index).replace(/^Question:?/i,'').trim();
  }else{
    const sentences=s.match(/[^.!?。！？]+[.!?。！？]+/g)||[s];
    if(sentences.length>1){passage=sentences[0].trim();question=sentences.slice(1).join(' ').trim();}
  }
  // 4. 清理引导/结尾引号与标点
  passage=passage.replace(/^['"‘“]/,'').replace(/['"’”]\.?\s*$/,'').trim();
  if(!passage){const qm=s.match(/['"]([^'"]{20,})['"]/);if(qm)passage=qm[1].trim();}
  return {passage,question};
}

function completion(tasks){const done=Object.values(tasks).filter(Boolean).length;return Math.round(done/DEFAULT_TASKS.length*100);}
function streak(){
  let s=0;const t=TODAY();
  // allow today not yet done -> count from yesterday
  let d=t; if(!getCheckin(d)) d=dateAdd(t,-1);
  while(getCheckin(d)){s++;d=dateAdd(d,-1);}
  return s;
}

      ${(q.type==='听力')?`<div class="row"><button class="btn sm ghost" data-spk="${esc(q.stem)}">🔊 朗读听力原文</button></div>`:''}`;
    if(q.options){
      q.options.forEach(op=>{
        const letter=op.split('.')[0];
        let cls='opt';if(q.sel===letter)cls+=' sel';
        if(q.revealed){if(letter===(q.answer||'').trim())cls+=' correct';else if(q.sel===letter)cls+=' wrong';}
        const mark=q.revealed?(letter===(q.answer||'').trim()?'✓':(q.sel===letter?'✗':letter)):letter;
        body+=`<div class="${cls}" data-i="${i}" data-letter="${letter}"><div class="mk">${mark}</div><div>${esc(op)}</div></div>`;
      });
    }else{
      body+=`<label class="fld">你的作答</label><textarea data-text="${i}" placeholder="在此作答...">${esc(q.text||'')}</textarea>`;
    }
    if(q.revealed){
      if(q.options){
        body+=`<div class="analysis"><div class="at">答案：${esc(q.answer)}</div>${esc(q.analysis)}</div>`;
      }else{
        body+=`<div class="analysis"><div class="at">参考答案</div><div class="sample">${esc(q.answer)}</div><div class="at" style="margin-top:8px">解析</div>${esc(q.analysis)}</div>`;
      }
    }
    body+=`</div>`;
  });
  return header+body;
}
function attachQuizHandlers(){
  $$('#tab-bank .opt').forEach(o=>o.onclick=()=>{
    const qi=+o.dataset.i;if(quiz[qi].revealed)return;
    quiz[qi].sel=o.dataset.letter;
    const card=o.closest('.q');
    card.querySelectorAll('.opt').forEach(op=>op.classList.toggle('sel',op.dataset.letter===quiz[qi].sel));
  });
  $$('#tab-bank textarea[data-text]').forEach(t=>t.oninput=e=>{quiz[+e.target.dataset.text].text=e.target.value;});
  const gb=$('#grade');if(gb)gb.onclick=grade;
  const bb=$('#backBank');if(bb)bb.onclick=()=>{quiz=null;renderBank();};
  const rd=$('#redo');if(rd)rd.onclick=()=>{if(quizMode==='wrong')startQuiz(true);else startQuiz(false);};
}
function grade(){
  let wrongIds=LS.get(K.wrong,[]);let anyChoice=false;
  // 错题本闭环：答错入本并清零连对计数；重做连对 2 次移出错题本，中途答错计数归零
  const wstreak=LS.get(K.wrongStreak,{});let removedWrong=0;
  quiz.forEach(q=>{if(q.options){anyChoice=true;
    if((q.sel||'')!==(q.answer||'').trim()){
      if(!wrongIds.includes(q.id))wrongIds.push(q.id);
      wstreak[q.id]=0;
    }else if(wrongIds.includes(q.id)){
      wstreak[q.id]=(wstreak[q.id]||0)+1;
      if(wstreak[q.id]>=2){wrongIds=wrongIds.filter(id=>id!==q.id);delete wstreak[q.id];removedWrong++;}
    }
    q.revealed=true;}else{q.revealed=true;}});
  LS.set(K.wrong,wrongIds);LS.set(K.wrongStreak,wstreak);
  // log
  const log=LS.get(K.quizLog,[]);
  const total=quiz.filter(q=>q.options).length;const correct=quiz.filter(q=>q.options&&(q.sel||'')===(q.answer||'').trim()).length;
  log.unshift({date:TODAY(),mode:quizMode==='wrong'?'错题':bankF.level,n:quiz.length,score:correct,total,acc:total?Math.round(correct/total*100):0});
  LS.set(K.quizLog,log.slice(0,60));
  renderBank();renderStats();
  toast(anyChoice?('已批改，查看解析'+(removedWrong?' · '+removedWrong+' 题连对2次移出错题本':'')):'已展示参考答案');
}

let vocabF={level:'全部',mode:'list',q:''};
function vocabPool(){return EN_DATA.vocab.concat(LS.get(K.impV,[]),LS.get(K.userVocab,[]));}
function mastery(){return LS.get(K.mastery,{});}
/* 生词本闭环：不认识→入本；掌握→出本 */
function addToUserVocab(w){
  const pool=vocabPool();
  const src=pool.find(v=>v.word===w)||{word:w,phonetic:'',pos:'',zh:'',example_en:'',example_zh:'',level:'CET6'};
  const uv=LS.get(K.userVocab,[]);
  if(uv.some(v=>v.word===w))return false;
  uv.unshift({word:src.word,phonetic:src.phonetic||'',pos:src.pos||'',zh:src.zh||'',example_en:src.example_en||'',example_zh:src.example_zh||'',level:src.level||'CET6'});
  LS.set(K.userVocab,uv);
  return true;
}

  LS.set(K.userVocab,LS.get(K.userVocab,[]).filter(v=>v.word!==w));

function importFile(e){
  const f=e.target.files[0];if(!f)return;const kind=e.target.dataset.kind;
  const r=new FileReader();r.onload=()=>{try{
    const d=JSON.parse(r.result);
    if(kind==='backup'){
      if(d.atlas && (!window.LuomuAtlas || !window.LuomuAtlas.validateState(d.atlas)))throw Error('词汇图鉴备份格式无效，未恢复任何数据');
      if(d.checkin)LS.set(K.checkin,d.checkin);
      if(d.quizLog)LS.set(K.quizLog,d.quizLog);
      if(d.wrong)LS.set(K.wrong,d.wrong);
      if(d.mastery)LS.set(K.mastery,d.mastery);
      if(d.userVocab)LS.set(K.userVocab,d.userVocab);
      if(d.resources)LS.set(K.resources,d.resources);
      if(d.impQ)LS.set(K.impQ,d.impQ);if(d.impV)LS.set(K.impV,d.impV);
      if(d.atlas)LS.set('wb_en_atlas_v1',d.atlas);
      if(d.plan)LS.set('wb_en_plan_v1',d.plan);
      if(d.wrongStreak)LS.set(K.wrongStreak,d.wrongStreak);
      toast('备份已恢复');boot();
    }else{
      let addedQ=0,addedV=0;
      if(Array.isArray(d.questions)){const cur=LS.get(K.impQ,[]);const ids=new Set(cur.map(x=>x.id));
        d.questions.forEach(q=>{if(q.id&&!ids.has(q.id)){cur.push(q);ids.add(q.id);addedQ++;}});LS.set(K.impQ,cur);}
      if(Array.isArray(d.vocab)){const cur=LS.get(K.impV,[]);const ws=new Set(cur.map(x=>x.word));
        d.vocab.forEach(v=>{if(v.word&&!ws.has(v.word)){cur.push(v);ws.add(v.word);addedV++;}});LS.set(K.impV,cur);}

/* ============ weekly plan ============ */
const K_PLAN='wb_en_plan_v1';
function weekDays(){
  const today=new Date();const dow=(today.getDay()+6)%7;
  const mon=new Date(today);mon.setDate(today.getDate()-dow);mon.setHours(0,0,0,0);
  const arr=[];for(let i=0;i<7;i++){const d=new Date(mon);d.setDate(mon.getDate()+i);arr.push(fmtD(d));}
  return arr;
}
function getPlan(){return LS.get(K_PLAN,{});}
function renderPlan(){
  const days=weekDays();const plan=getPlan();const wn=['周一','周二','周三','周四','周五','周六','周日'];
  let total=0,done=0;days.forEach(d=>(plan[d]||[]).forEach(t=>{total++;if(t.done)done++;}));
  const wp=total?Math.round(done/total*100):0;
  let h=`<div class="card">
    <h2>${ICONS.plan} 周计划看板</h2>
    <p class="sub">本周（周一 → 周日）· 完成 <b style="color:var(--sage-d)">${done}/${total}</b> · <b style="color:var(--terra-d)">${wp}%</b></p>
    <div class="row"><div class="spacer"></div><button class="btn sm ghost" id="clearWeek">清空本周</button></div></div>
    <div class="board">`;
  days.forEach((d,i)=>{
    const tasks=plan[d]||[];const cd=tasks.length?Math.round(tasks.filter(t=>t.done).length/tasks.length*100):0;
    const isToday=d===TODAY();
    h+=`<div class="col ${isToday?'today':''}"><h3>${wn[i]}${isToday?' · 今天':''}</h3><div class="cdate">${d.slice(5)}</div><div class="cbar"><i style="width:${cd}%"></i></div>`;
    tasks.forEach(t=>{
      h+=`<div class="ptask ${t.done?'done':''}" data-d="${d}" data-id="${t.id}">
        <div class="pbox">${t.done?'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg>':''}</div>
        <div class="ptext">${esc(t.text)}</div>
        <button class="pdel" data-del="${d}|${t.id}">✕</button></div>`;
    });
    h+=`<div class="add"><input placeholder="加任务，回车" data-adddate="${d}"></div></div>`;
  });
  h+=`</div>`;
  $('#tab-plan').innerHTML=h;
  $('#clearWeek').onclick=()=>{if(confirm('清空本周所有计划任务？')){const p=getPlan();days.forEach(d=>delete p[d]);LS.set(K_PLAN,p);renderPlan();renderStats();}};
  $$('#tab-plan .pbox').forEach(b=>b.onclick=()=>{
    const el=b.closest('.ptask');const d=el.dataset.d,id=el.dataset.id;
    const p=getPlan();p[d]=(p[d]||[]).map(t=>t.id==id?{...t,done:!t.done}:t);LS.set(K_PLAN,p);renderPlan();renderStats();
  });
  $$('#tab-plan .pdel').forEach(b=>b.onclick=()=>{
    const [d,id]=b.dataset.del.split('|');const p=getPlan();p[d]=(p[d]||[]).filter(t=>t.id!=id);LS.set(K_PLAN,p);renderPlan();renderStats();
  });
  $$('#tab-plan .add input').forEach(inp=>inp.onkeydown=e=>{
    if(e.key==='Enter'){const d=inp.dataset.adddate,text=inp.value.trim();if(!text)return;const p=getPlan();p[d]=p[d]||[];p[d].push({id:'p'+Date.now(),text,done:false});LS.set(K_PLAN,p);renderPlan();renderStats();}
  });
}

async function aiCall(messages){
  const cfg=aiCfg();

    body:JSON.stringify({model:cfg.model||'agnes-2.0-flash',messages,temperature:.8,max_tokens:600})
  });

    try{const e=await res.json();if(e&&e.error&&e.error.message)msg=e.error.message;}catch(_){}

  const doneQ=log.reduce((s,x)=>s+(x.score||0),0);
  const wpTotal=LS.get('wb_en_plan_v1',{});
  let pt=0,pd=0;weekDays().forEach(d=>(wpTotal[d]||[]).forEach(t=>{pt++;if(t.done)pd++;}));
  const cells=[
    ['🗓','周计划','本周看板 · 每日任务打卡',pt?`完成 ${pd}/${pt}`:'未开始','plan'],
    ['🤖','AI 搭子','树洞倾诉 & 英文口语陪练','Agnes 免费模型','ai'],
    ['📚','资料库','精选外站资源 + 私人收藏',`${LS.get(K.resources,[]).length} 条`,`lib`],
    ['📊','数据备份','打卡热力图 · 导出 / 恢复',`${dates.length} 天打卡`,'data']
  ];
  const h=`<div class="mine-hero">
    <div class="avatar">🎓</div>
    <div><h2>我的英语工坊</h2>
    <p>CET6 → 雅思 · 连续打卡 <b>${streak()}</b> 天 · 已练 <b>${doneQ}</b> 题 · 掌握 <b>${known}</b> 词</p></div></div>
    <div class="mine-grid">${cells.map(c=>`<div class="mcell" data-go="${c[4]}">
      <div class="mi">${c[0]}</div><div class="mt">${c[1]}</div>
      <div class="md">${c[2]}</div><span class="mv2">${c[3]}</span></div>`).join('')}</div>`;
  $('#tab-mine').innerHTML=h;
  $$('#tab-mine .mcell').forEach(el=>el.onclick=()=>goTab(el.dataset.go));
}
function goTab(id){
  $$('#tabBar .tab').forEach(x=>x.classList.toggle('active',x.dataset.t===id));
  $$('#bottomNav .btab').forEach(x=>x.classList.toggle('active',x.dataset.t===id));
  $$('section.panel').forEach(s=>s.classList.toggle('active',s.id==='tab-'+id));
  ({train:renderTrain,bank:renderBank,vocab:renderVocab,plan:renderPlan,speak:renderSpeak,ai:renderAi,lib:renderLib,data:renderData,mine:renderMine}[id])();
}
function renderTabs(){
  $('#tabBar').innerHTML=TABS.map((t,i)=>`<div class="tab ${i===0?'active':''}" data-t="${t[0]}">${t[2]}${t[1]}</div>`).join('');
  $('#bottomNav').innerHTML=BOTTOM_TABS.map(t=>`<div class="btab ${t[0]==='train'?'active':''}" data-t="${t[0]}">${t[2]}<span>${t[1]}</span></div>`).join('');
  $$('#tabBar .tab').forEach(el=>el.onclick=()=>goTab(el.dataset.t));
  $$('#bottomNav .btab').forEach(el=>el.onclick=()=>goTab(el.dataset.t));
}
function boot(){
  if(!EN_DATA||!EN_DATA.questions){document.body.innerHTML='<p style="padding:30px">数据加载失败</p>';return;}
  renderTabs();renderStats();
  renderTrain();renderBank();renderVocab();renderPlan();renderSpeak();renderLib();renderData();renderMine();
}
boot();
  // PWA: 注册 Service Worker（静默失败不影响页面）
  if('serviceWorker'in navigator){
    window.addEventListener('load',function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
</script>
