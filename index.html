 loop, swell and respond to players, problems a Brahms symphony never posed.'", "options": ["A. The biography of composer Johannes Brahms.", "B. Declining ticket sales for classical concerts.", "C. The challenge of scoring music that reacts to players.", "D. Sound engineering for silent films."], "answer": "C", "analysis": "段落重心在末句：游戏音乐需要循环、渐强并响应玩家，这是传统交响曲从未提出的问题，C 概括'为玩家交互而作曲的挑战'。B 只是背景；A 曲解了举例；D 与话题不符。"}, {"id": "yi-r-133", "level": "IELTS", "type": "阅读", "topic": "科技", "stem": "Read the paragraph and choose the most suitable heading. Paragraph: 'Subtitle glasses now stream captions to wearers' eyes during live theatre, so deaf audiences can sit anywhere in the house rather than in seats with restricted caption-board views. Early users report one adjustment: glancing between stage and text takes practice, and venues schedule familiarisation rehearsals.'", "options": ["A. Spectacle design in fashion week shows.", "B. Sign language interpreting on television.", "C. Assistive eyewear that frees seat choice at theatres.", "D. Laser projection systems for planetariums."], "answer": "C", "analysis": "段落核心：字幕眼镜把台词直接投射到佩戴者眼前，听障观众不再受字幕板座位限制，C 概括这一无障碍突破。B 是另一类服务形式；A、D 与剧院字幕无关。"}, {"id": "yi-r-134", "level": "IELTS", "type": "阅读", "topic": "文化", "stem": "Read the paragraph and choose the most suitable heading. Paragraph: 'When a commercial station abandoned the local frequency, volunteers took it over and now broadcast council meetings, school concerts and request shows in three community languages. Advertisers stayed away at first, but a listener-owned cooperative model keeps the transmitter humming.'", "options": ["A. Podcast subscriptions for language learners.", "B. Advertising strategies of national radio networks.", "C. Regulations governing broadcast licensing fees.", "D. A listener cooperative running a community station."], "answer": "D", "analysis": "段落两线：内容（议会会议、校园音乐会、三种社区语言）与生存模式（听众持股合作社），D 的'听众合作社运营社区电台'涵盖生存模式并隐含本地内容。B、C、A 均偏离主线。"}, {"id": "yi-r-135", "level": "IELTS", "type": "阅读", "topic": "文化", "stem": "Read the paragraph and choose the most suitable heading. Paragraph: 'In signed poetry, rhythm lives in the sweep of hands, and rhyme in the repetition of handshapes, so metre cannot simply be borrowed from the page. Translators of sign poems therefore work with hearing poets and choreographers, searching for visual equivalents for line breaks and stress.'", "options": ["A. The grammar of sign languages worldwide.", "B. Inventing visual form for poetic rhythm.", "C. Machine translation of sign dictionaries.", "D. Hearing tests for newborn babies."], "answer": "B", "analysis": "段落主线：手语诗的节奏在手的运动、韵在手形重复，翻译需要与编舞者合作寻找'视觉对等物'，B 概括'为诗的节奏发明视觉形式'。A 过宽（只谈语法）；C、D 完全无关。"}, {"id": "yi-r-136", "level": "IELTS", "type": "阅读", "topic": "社会", "stem": "Read the paragraph and choose the most suitable heading. Paragraph: 'Only a fraction of restaurants keep braille menus, and many that do keep a single dog-eared copy behind the bar. A campaign trains front-of-house staff to read menus aloud naturally and to offer the braille version without being asked, arguing that dignity should not depend on a diner's persistence.'", "options": ["A. The invention of the braille writing system.", "B. Beyond the single braille menu: service training for inclusion.", "C. Guide dog regulations in eating places.", "D. Smartphone apps for translating recipes."], "answer": "B", "analysis": "段落先摆问题（仅一份破旧盲文菜单藏在吧台后），再给方案（培训服务员自然朗读菜单、主动提供盲文版），B 概括'从一张菜单到服务培训的包容'。A、C、D 均偏离主线。"}, {"id": "yi-r-137", "level": "IELTS", "type": "阅读", "topic": "历史", "stem": "Read the paragraph and choose the most suitable heading. Paragraph: 'When the last workers of a shuttered shipyard were interviewed forty years on, their recordings overturned the official story: rather than a single closing date, the yard had faded through months of short weeks, tool auctions and farewell rosters that nobody had written down anywhere else.'", "options": ["A. Redevelopment plans for dockland housing.", "B. Shipbuilding techniques of the 1950s.", "C. Oral testimony correcting the written record.", "D. Trade union negotiations over severance pay."], "answer": "C", "analysis": "段落主线：口述访谈推翻了官方叙事——船厂不是在某个日期关闭，而是经数月缩短工时、工具拍卖逐渐消亡，C 概括'口述证词修正文献记载'。B、A、D 均未涉及口述历史的核心作用。"}, {"id": "yi-r-138", "level": "IELTS", "type": "阅读", "topic": "经济", "stem": "Read the paragraph and choose the most suitable heading. Paragraph: 'In the English town of Totnes, the pound notes accepted by local shops cannot be spent online or in chain stores by design. The currency loses value after a set period, nudging holders to spend quickly, and studies of similar schemes find the money recirculates among independent businesses far more often than national currency does.'", "options": ["A. Counterfeit detection for paper banknotes.", "B. The history of the Bank of England.", "C. Interest rate policy in small economies.", "D. A local currency engineered to keep spending local."], "answer": "D", "analysis": "段落说明设计机制：不能在网上或连锁店消费＋定期贬值促使尽快消费＋更常在独立商户间循环，D 的'被设计成留住本地消费'概括全部三点。B、C、A 与社区货币机制无关。"}, {"id": "yi-r-139", "level": "IELTS", "type": "阅读", "topic": "社会", "stem": "Read the paragraph and choose the most suitable heading. Paragraph: 'Members of a time bank earn one credit for each hour they spend driving neighbours to hospital appointments or mending their curtains, regardless of the task. Because an hour of legal advice and an hour of weeding are worth exactly the same, the scheme draws in retirees whose skills the market prices very differently.'", "options": ["A. Minimum wage legislation for care workers.", "B. Hour-for-hour exchange that equalises different skills.", "C. Volunteer firefighting in rural districts.", "D. Hospital transport budget shortfalls."], "answer": "B", "analysis": "段落的关键规则是'一小时＝一积分，任务不论贵贱'，正是这种把不同技能等值化的机制吸引了市场定价悬殊的退休者，B 精确概括。A、C、D 均与时间银行的交换逻辑无关。"}, {"id": "yi-r-140", "level": "IELTS", "type": "阅读", "topic": "环境", "stem": "Read the paragraph and choose the most suitable heading. Paragraph: 'Superapps now let restaurants with surplus evening meals sell them at a discount to customers who collect before closing. Food waste audits of participating kitchens show portions thrown away falling by up to a third, although critics note the app's discounts can nudge customers to buy meals they never intended to purchase.'", "options": ["A. Delivery riders' working conditions.", "B. Refrigeration standards for takeaway food.", "C. Discount apps that cut kitchen waste—with a catch.", "D. Restaurant licensing for evening trading."], "answer": "C", "analysis": "段落两面：参与餐厅的弃置食物最多减少三分之一；但批评指出折扣可能诱使顾客购买本不打算买的餐食，C 的'削减浪费但有附带问题'涵盖正反两面。B、A、D 均未涉及。"}, {"id": "yi-r-141", "level": "IELTS", "type": "阅读", "topic": "社会", "stem": "Read the paragraph and choose the most suitable heading. Paragraph: 'A chest freezer on a shopping street, unlocked and stocked by neighbours with spare lasagne or surplus courgettes, has become one street's quiet answer to hunger. Organisers publish only two rules—label your food and take what you need—and report that stock turns over faster than anyone predicted.'", "options": ["A. Refrigerator energy efficiency ratings.", "B. Commercial cold-chain logistics for supermarkets.", "C. Municipal regulations on food labelling.", "D. Community fridges run on trust and two rules."], "answer": "D", "analysis": "段落主景是街边的公共冰箱：邻居放多余食物、需要者自取，仅两条规则且周转快，D 的'靠信任与两条规则运转的社区冰箱'概括主旨。B、C、A 都把细节抽离成无关话题。"}, {"id": "yi-r-142", "level": "IELTS", "type": "阅读", "topic": "教育", "stem": "Read the paragraph and choose the most suitable heading. Paragraph: 'Pupils at one secondary school collect canteen peelings into insulated bins, and biology classes weigh and graph the haul each week. Within two terms the school had cut its general waste collections by half, but teachers point just as firmly to the spreadsheet skills pupils acquired on the way.'", "options": ["A. Composting as a vehicle for data literacy.", "B. School kitchen hygiene inspections.", "C. Gardening leave policies for teachers.", "D. Regional waste incineration contracts."], "answer": "A", "analysis": "段落用'but teachers point just as firmly'把落点放在第二重收益：学生通过称重、制表学到了数据处理能力，A 概括'堆肥成为数据素养的载体'。B、C、D 均与主线无关。"}, {"id": "yi-r-143", "level": "IELTS", "type": "阅读", "topic": "环境", "stem": "Read the paragraph and choose the most suitable heading. Paragraph: 'A Berlin supermarket aisle dispenses shampoo, muesli and detergent into customers' own containers, charging by weight with no deposit to chase. Shoppers must remember their jars, and forgetful ones pay a fee for loan containers—returned, washed and refilled an average of forty times before retirement.'", "options": ["A. Container-loan systems that make refills painless.", "B. Bulk food trends in nineteenth-century grocers.", "C. Plastic taxation under trade agreements.", "D. Home brewing of cleaning chemicals."], "answer": "A", "analysis": "段落核心机制：忘带容器的顾客可付押金借用，容器平均清洗复用四十次，A 概括'容器借用让散装复购变得容易'。B、C、D 均与'押金借用＋循环使用'的核心无关。"}, {"id": "yi-r-144", "level": "IELTS", "type": "阅读", "topic": "环境", "stem": "Read the paragraph and choose the most suitable heading. Paragraph: 'Under deposit-return schemes, buyers pay a small surcharge on each bottled drink and claw it back at reverse vending machines in supermarket lobbies. Return rates in well-run schemes top ninety per cent, and the recovered material is clean enough to be bottle-to-bottle recycled rather than downcycled into carpet fibre.'", "options": ["A. Deposit-return schemes achieving closed-loop recycling.", "B. Glassblowing techniques for artisan bottles.", "C. Supermarket loyalty points programmes.", "D. The global market for recycled carpet."], "answer": "A", "analysis": "段落因果链：小额押金→逆向自动机回收→回收率超九成→材料洁净到可以'瓶到瓶'循环而非降级利用，A 概括'押金返还实现闭环回收'。B、C、D 均为无关或细节话题。"}, {"id": "yi-r-145", "level": "IELTS", "type": "阅读", "topic": "环境", "stem": "Read the paragraph and choose the most suitable heading. Paragraph: 'Five years after plastic-bag charges were introduced, checkout data show disposable bag purchases down by more than ninety per cent. Yet refuse-wagon surveys find the thicker \"bags for life\" now discarded in such volumes that analysts debate whether the policy shifted material rather than shrinking it.'", "options": ["A. Bag charges: success complicated by rebound effects.", "B. The chemistry of biodegradable polymers.", "C. Checkout staffing levels in retail chains.", "D. Fashion trends in reusable totes."], "answer": "A", "analysis": "段落呈现矛盾两面：一次性袋购买骤降，但'终身袋'被大量丢弃，让人质疑政策是缩小还是转移了塑料总量，A 的'成功被回弹效应复杂化'概括两面。B、C、D 均偏离主线。"}, {"id": "yi-r-146", "level": "IELTS", "type": "阅读", "topic": "科技", "stem": "Read the paragraph and choose the most suitable heading. Paragraph: 'A solar-powered vessel cruises river mouths trailing a permeable boom that skims floating plastic from the water. Modelling soon tempered the fanfare: such interception catches only what rivers carry on the surface, a small fraction of the plastic mass that ocean surveys estimate lies below or on the seabed.'", "options": ["A. River clean-up vessels and their measured limits.", "B. Deep-sea mining rovers and sonar mapping.", "C. Solar panel efficiency in cloudy climates.", "D. Wildlife tourism aboard research ships."], "answer": "A", "analysis": "段落先介绍拦截船的功能，再用建模结果泼冷水——只能收集河面漂浮的一小部分，A 概括'清污船及其被测定的局限'。B、C、D 均与塑料拦截无关，属同域偏题。"}, {"id": "yi-r-147", "level": "IELTS", "type": "阅读", "topic": "经济", "stem": "Read the paragraph and choose the most suitable heading. Paragraph: 'Discarded fishing nets, the deadliest form of ocean plastic for entangled wildlife, are now collected at ports for a fee and shredded into nylon pellets. Carpet tiles woven from the pellets sell at a premium to offices that want their floor coverings to carry a verified marine-cleanup story.'", "options": ["A. From ghost nets to premium carpet: a recycling market.", "B. Nylon stockings in post-war fashion.", "C. Port authority customs inspection procedures.", "D. Wildlife rescue centres for injured seals."], "answer": "A", "analysis": "段落完整链条：废弃渔网有偿回收→粉碎成尼龙粒→织成高价地毯→买家为其'海洋清理'认证付费，A 概括这一再利用市场。B、C、D 均只触及边缘意象或无关话题。"}, {"id": "yi-r-148", "level": "IELTS", "type": "阅读", "topic": "城市", "stem": "Read the paragraph and choose the most suitable heading. Paragraph: 'Night-time now generates a growing share of city jobs, from logistics sorting to bar work, and with it a rising tide of complaints about bass, bottle banks and delivery vans. Several cities have appointed night mayors whose task is to broker agreements—quiet zones here, late licences there—rather than simply enforce closing times.'", "options": ["A. Night mayors negotiating the city's after-dark balance.", "B. The history of street lighting technologies.", "C. Shift-work rosters in parcel depots.", "D. Music festival licensing in rural counties."], "answer": "A", "analysis": "段落先摆出夜间经济的增长与噪声冲突，再引出'夜间市长'通过斡旋协议而非强制打烊来平衡各方，A 概括主旨。B、C、D 均偏离'夜间治理'这一核心。"}, {"id": "yi-r-149", "level": "IELTS", "type": "阅读", "topic": "城市", "stem": "Read the paragraph and choose the most suitable heading. Paragraph: 'A covered market whose stalls were half empty has been revived by a simple rule change: rents now rise with footfall, so the landlord profits only when traders do. Fishmongers sit beside fermentation workshops and a bicycle repair stall, and the once-deserted gallery now hosts cooking classes on slow afternoons.'", "options": ["A. Rent reform that revived a dying market.", "B. Fishing quotas and coastal conservation.", "C. Fermentation science in food laboratories.", "D. Bicycle tourism routes through old towns."], "answer": "A", "analysis": "段落的关键因果：租金改为随客流浮动→业主与商户利益绑定→市场复活且业态混合，A 概括'租金改革救活旧市场'。B、C、D 都把段内列举的业态抽出来当主题，属于以偏概全。"}, {"id": "yi-r-150", "level": "IELTS", "type": "阅读", "topic": "经济", "stem": "Read the paragraph and choose the most suitable heading. Paragraph: 'When the last bank branch left a Welsh market town, the post office counter began offering cash deposits and withdrawals for several banks at once. Regulators have since formalised the arrangement, and rural retailers report fewer long drives to manage daily takings, though some services still require a ninety-minute round trip to the nearest city.'", "options": ["A. Post offices stepping in where bank branches left.", "B. The history of savings banks in Wales.", "C. Cash-in-transit security for rural shops.", "D. Mobile network coverage in mountainous areas."], "answer": "A", "analysis": "段落主线：银行网点撤离→邮局柜台代行多家银行业务→监管予以正式化→商户少跑远路，A 概括'邮局填补银行空缺'。末句的九十分钟车程只是保留限制，不改变主线；B、C、D 均偏离。"}, {"id": "yi-v-001", "level": "IELTS", "type": "词汇", "topic": "健康", "stem": "Choose the word closest in meaning to 'alleviate' as used in: 'Nurse-led clinics helped alleviate the shortage of doctors in remote districts.'", "options": ["A. ease", "B. ignore", "C. worsen", "D. deny"], "answer": "A", "analysis": "'alleviate' 意为'减轻、缓解'，与 'ease' 同义，'缓解偏远地区医生短缺'语义通顺，选 A。B 'ignore'（忽视）和 D 'deny'（否认）未涉及减轻；C 'worsen'（加剧）是反义干扰。"}, {"id": "yi-v-002", "level": "IELTS", "type": "词汇", "topic": "社会", "stem": "The survey question was deliberately ___ , allowing respondents to interpret it in more than one way. Which word fits?", "options": ["A. concise", "B. ambiguous", "C. mandatory", "D. confidential"], "answer": "B", "analysis": "后文说'允许受访者做出多种解读'，正是 'ambiguous'（模棱两可的）的定义，选 B。A 'concise'（简洁）与多义无关；C 'mandatory'（强制的）、D 'confidential'（保密的）描述的是问卷属性而非措辞特征。"}, {"id": "yi-v-003", "level": "IELTS", "type": "词汇", "topic": "教育", "stem": "In academic writing, a 'coherent' argument is one that:", "options": ["A. quotes the largest number of sources.", "B. uses the longest sentences possible.", "C. has parts that logically connect.", "D. avoids all technical vocabulary."], "answer": "C", "analysis": "'coherent' 指'连贯的、条理清晰的'，即各部分逻辑上相互衔接，选 C。A 是'引用多'，B 是'句子长'，D 是'避免术语'——都与连贯无关，属于把好文章的其他特征偷换为该词义。"}, {"id": "yi-v-004", "level": "IELTS", "type": "词汇", "topic": "科技", "stem": "Choose the meaning of 'plausible' in: 'The researchers offered a plausible explanation for the anomaly, though it remains untested.'", "options": ["A. proven beyond doubt", "B. deliberately misleading", "C. impossible to verify", "D. seemingly reasonable"], "answer": "D", "analysis": "'plausible' 指'看似合理的、貌似可信的'，与 'seemingly reasonable' 对应；让步分句'尚未检验'恰好印证'只是貌似可信'，选 D。A '已被证实'与 'untested' 矛盾；B '误导'、C '无法验证'都不是该词含义。"}, {"id": "yi-v-005", "level": "IELTS", "type": "词汇", "topic": "教育", "stem": "The committee asked for ___ evidence rather than personal anecdotes before changing the admission rules. Which word fits?", "options": ["A. empirical", "B. hostile", "C. temporary", "D. verbal"], "answer": "A", "analysis": "与 'personal anecdotes'（个人轶事）相对的是 'empirical'（基于实证/数据的）证据，选 A。B 'hostile'（敌对的）、C 'temporary'（暂时的）与证据类型无关；D 'verbal'（口头的）恰好与要求的实证方向相反。"}, {"id": "yi-v-006", "level": "IELTS", "type": "词汇", "topic": "法律", "stem": "Choose the word closest in meaning to 'explicit' in: 'The licence contains explicit instructions about how the data may be shared.'", "options": ["A. vague", "B. clearly stated", "C. outdated", "D. optional"], "answer": "B", "analysis": "'explicit' 意为'明确表述的、清楚的'，与 'clearly stated' 同义，选 B。A 'vague'（模糊的）是典型反义词；C 'outdated'（过时的）、D 'optional'（可选的）与'明确'无关。"}, {"id": "yi-v-007", "level": "IELTS", "type": "词汇", "topic": "环境", "stem": "Scientists warn that some degree of further warming is now ___ , whatever policies governments adopt. Which word fits?", "options": ["A. avoidable", "B. optional", "C. inevitable", "D. deliberate"], "answer": "C", "analysis": "让步句'无论政府采取什么政策'说明变暖'不可避免'，'inevitable' 正合语境，选 C。A 'avoidable'（可避免的）与让步逻辑矛盾；B 'optional'（可选的）、D 'deliberate'（故意的）都不符合自然过程的描述。"}, {"id": "yi-v-008", "level": "IELTS", "type": "词汇", "topic": "经济", "stem": "The charity said the funds raised were ___ to rebuild even one school wing. Which word fits?", "options": ["A. excessive", "B. ample", "C. additional", "D. insufficient"], "answer": "D", "analysis": "'连一栋校舍侧翼都重建不了'说明资金'不足'，'insufficient' 正确，选 D。B 'ample'（充足的）与语义相反；A 'excessive'（过多的）、C 'additional'（额外的）都无法与'重建不了一栋'自洽。"}, {"id": "yi-v-009", "level": "IELTS", "type": "词汇", "topic": "艺术", "stem": "Choose the meaning of 'intrinsic' in: 'Curiosity seems intrinsic to good research rather than something imposed by deadlines.'", "options": ["A. essential and built-in", "B. externally rewarded", "C. recently discovered", "D. highly controversial"], "answer": "A", "analysis": "'intrinsic' 指'内在的、固有的'，与 'imposed by deadlines'（外部强加）形成对照，A 'essential and built-in' 正确。B 恰与对照方向相反；C、D 与'内在属性'无关。"}, {"id": "yi-v-010", "level": "IELTS", "type": "词汇", "topic": "科技", "stem": "The team's ___ approach—testing the sensor inside a live volcano—had never been tried before. Which word fits?", "options": ["A. cautious", "B. novel", "C. familiar", "D. standard"], "answer": "B", "analysis": "破折号内容'从未有人尝试过'正是 'novel'（新颖的）的释义，选 B。A 'cautious'（谨慎的）与在活火山内测试的行为矛盾；C 'familiar'、D 'standard'（标准的）都与'前所未有'相反。"}, {"id": "yi-v-011", "level": "IELTS", "type": "词汇", "topic": "教育", "stem": "In research methods, a 'rigorous' study is best described as:", "options": ["A. short and readable.", "B. generously funded.", "C. strictly careful and thorough.", "D. published quickly."], "answer": "C", "analysis": "'rigorous' 指'严谨的、一丝不苟的'，用于研究方法即'严格细致'，选 C。A、B、D 分别用'简短易读'、'经费多'、'发表快'偷换概念，均非严谨的含义。"}, {"id": "yi-v-012", "level": "IELTS", "type": "词汇", "topic": "健康", "stem": "The doctors gave only a ___ diagnosis, asking to see the scans again before committing themselves. Which word fits?", "options": ["A. final", "B. mistaken", "C. detailed", "D. tentative"], "answer": "D", "analysis": "'要求再看扫描结果才下结论'说明诊断是'试探性的、暂定的'，'tentative' 正确，选 D。A 'final'（最终的）与暂缓表态矛盾；B 'mistaken'（错误的）、C 'detailed'（详细的）不符合语境语气。"}, {"id": "yi-v-013", "level": "IELTS", "type": "词汇", "topic": "科技", "stem": "Bamboo is a ___ material: the same crop supplies scaffolding, fabric and food. Which word fits?", "options": ["A. versatile", "B. fragile", "C. scarce", "D. synthetic"], "answer": "A", "analysis": "冒号后列举竹子同时用于脚手架、织物与食物，说明其'用途多样'，'versatile'（多用途的）正确，选 A。B 'fragile'（易碎的）、C 'scarce'（稀缺的）、D 'synthetic'（合成的）都与'一物多用'的语境相反或无关。"}, {"id": "yi-v-014", "level": "IELTS", "type": "词汇", "topic": "经济", "stem": "Choose the word closest in meaning to 'feasible' in: 'Solar-powered desalination is technically feasible but not yet economically attractive.'", "options": ["A. fashionable", "B. achievable", "C. automatic", "D. profitable"], "answer": "B", "analysis": "'feasible' 指'可行的、能做到的'，与 'achievable' 同义；后半句'经济上尚不划算'恰好排除 D，选 B。A 'fashionable'（时髦的）、C 'automatic'（自动的）与可行性无关；D 'profitable' 被原文让步明确否定。"}, {"id": "yi-v-015", "level": "IELTS", "type": "词汇", "topic": "环境", "stem": "Economists remind ministers that the atmosphere's capacity to absorb waste is ___, not endless. Which word fits?", "options": ["A. infinite", "B. flexible", "C. finite", "D. restored"], "answer": "C", "analysis": "'not endless'（并非无穷）直接提示空格应填 'finite'（有限的），选 C。A 'infinite'（无限的）与转折语矛盾；B 'flexible'（灵活的）、D 'restored'（恢复的）不符合'吸收容量'的属性描述。"}, {"id": "yi-v-016", "level": "IELTS", "type": "词汇", "topic": "健康", "stem": "Choose the meaning of 'adverse' in: 'Patients reported no adverse reactions during the six-month trial.'", "options": ["A. unexpected allergic", "B. positive", "C. delayed", "D. harmful"], "answer": "D", "analysis": "'adverse reactions' 是固定搭配，指药物'不良反应/有害反应'，'adverse' 意为'不利的、有害的'，选 D。B 'positive'（积极的）是反义干扰；A、C 添加了原文没有的限定（过敏、延迟）。"}, {"id": "yi-v-017", "level": "IELTS", "type": "词汇", "topic": "社会", "stem": "Critics called the border checks ___ , since travellers from similar regions faced completely different questions. Which word fits?", "options": ["A. arbitrary", "B. efficient", "C. uniform", "D. lawful"], "answer": "A", "analysis": "'来自相似地区的旅客被问完全不同的问题'说明抽查'随意、无标准'，'arbitrary'（武断的、任意的）正确，选 A。B 'efficient'（高效的）、C 'uniform'（统一的）与'截然不同'的事实相反；D 'lawful'（合法的）非本题讨论点。"}, {"id": "yi-v-018", "level": "IELTS", "type": "词汇", "topic": "法律", "stem": "Choose the word closest in meaning to 'compel' in: 'New accounting rules compel listed firms to publish their tax payments country by country.'", "options": ["A. permit", "B. force", "C. invite", "D. allow"], "answer": "B", "analysis": "'compel' 意为'强迫、迫使'，与 'force' 同义；'强制上市公司逐国公布纳税额'语义成立，选 B。A 'permit'、D 'allow'（允许）方向相反——允许不等于强制；C 'invite'（邀请）力度远远不够。"}, {"id": "yi-v-019", "level": "IELTS", "type": "词汇", "topic": "经济", "stem": "Rising borrowing costs will ___ any plan to expand the metro network this year. Which word fits?", "options": ["A. accelerate", "B. fund", "C. constrain", "D. complete"], "answer": "C", "analysis": "'借贷成本上升'对扩建计划自然是'限制、制约'，'constrain' 正确，选 C。A 'accelerate'（加速）与资金压力的后果相反；B 'fund'（资助）颠倒了资金关系；D 'complete'（完成）无从谈起。"}, {"id": "yi-v-020", "level": "IELTS", "type": "词汇", "topic": "科学", "stem": "Choose the word closest in meaning to 'contradict' in: 'The new sediment cores contradict the accepted timeline of the eruption.'", "options": ["A. support", "B. translate", "C. summarise", "D. conflict with"], "answer": "D", "analysis": "'contradict' 意为'与……相矛盾'，与 'conflict with' 同义，选 D。A 'support'（支持）是反义干扰；B 'translate'（翻译）、C 'summarise'（总结）与'推翻既有年表'无关。"}, {"id": "yi-v-021", "level": "IELTS", "type": "词汇", "topic": "艺术", "stem": "A single photograph can ___ the misery of the flood more powerfully than pages of statistics. Which word fits?", "options": ["A. convey", "B. calculate", "C. conceal", "D. complicate"], "answer": "A", "analysis": "照片比统计数字'更有力地传递'灾难之苦，'convey'（传达）正确，选 A。B 'calculate'（计算）是统计的功能而非照片的；C 'conceal'（掩盖）与'更有力地表达'相反；D 'complicate'（使复杂）不符。"}, {"id": "yi-v-022", "level": "IELTS", "type": "词汇", "topic": "科学", "stem": "Choose the word closest in meaning to 'demonstrate' in: 'The field trial demonstrated that cover crops reduce soil erosion by half.'", "options": ["A. assumed", "B. showed", "C. denied", "D. proposed"], "answer": "B", "analysis": "'demonstrate' 意为'（用证据）证明、表明'，与 'showed' 同义，选 B。A 'assumed'（假定）与试验结论的确定性矛盾；C 'denied'（否认）方向相反；D 'proposed'（提议）只是提出而非证实。"}, {"id": "yi-v-023", "level": "IELTS", "type": "词汇", "topic": "教育", "stem": "Training helps new teachers ___ constructive feedback from mere criticism. Which word fits?", "options": ["A. blend", "B. ignore", "C. distinguish", "D. translate"], "answer": "C", "analysis": "'把建设性反馈与单纯批评区分开'正是 'distinguish'（区分、辨别）的含义，选 C。A 'blend'（混合）意思相反——要分清而非混同；B 'ignore'（忽视）、D 'translate'（翻译）不符合培训目标。"}, {"id": "yi-v-024", "level": "IELTS", "type": "词汇", "topic": "经济", "stem": "Two streaming platforms now ___ the market for live sport in that region. Which word fits?", "options": ["A. abandon", "B. dominate", "C. monitor", "D. subsidise"], "answer": "B", "analysis": "'两家平台___直播体育市场'搭配 'dominate'（主导、支配）最地道，即'瓜分并主导'，选 B。A 'abandon'（放弃）与市场格局不符；C 'monitor'（监控）、D 'subsidise'（补贴）都不是描述市场支配力的动词。"}, {"id": "yi-v-025", "level": "IELTS", "type": "词汇", "topic": "教育", "stem": "The report ___ that early vocabulary size, not family income alone, predicts later reading skill. Which word fits?", "options": ["A. emphasises", "B. doubts", "C. conceals", "D. denies"], "answer": "A", "analysis": "报告'强调'早期词汇量而非仅家庭收入可预测阅读能力，'emphasise'（强调）正确，选 A。B 'doubts'（怀疑）、D 'deny'（否认）与报告给出结论的语气相反；C 'conceals'（隐瞒）不合逻辑。"}, {"id": "yi-v-026", "level": "IELTS", "type": "词汇", "topic": "科技", "stem": "Wind farms can ___ electricity for two million homes once the offshore phase is complete. Which word fits?", "options": ["A. import", "B. generate", "C. consume", "D. store"], "answer": "B", "analysis": "风电场'发电'用 'generate electricity'，为固定搭配，选 B。A 'import'（进口）与本地发电矛盾；C 'consume'（消耗）方向相反；D 'store'（储存）并非该句表达的生产能力。"}, {"id": "yi-v-027", "level": "IELTS", "type": "词汇", "topic": "社会", "stem": "The city will ___ the new congestion charge in stages, beginning with the inner ring. Which word fits?", "options": ["A. abandon", "B. delay", "C. implement", "D. debate"], "answer": "C", "analysis": "'分阶段、从内环开始'说明是'实施'收费，'implement'（实施）正确，选 C。A 'abandon'（放弃）、B 'delay'（推迟）与'始于内环'的安排矛盾；D 'debate'（辩论）停留在讨论层面，与 in stages 的执行细节不符。"}, {"id": "yi-v-028", "level": "IELTS", "type": "词汇", "topic": "科技", "stem": "The updated app ___ feedback from dyslexic users at every stage of its redesign. Which word fits?", "options": ["A. excluded", "B. postponed", "C. ignored", "D. incorporated"], "answer": "D", "analysis": "'把读写障碍用户的反馈纳入设计的每个阶段'即 'incorporate'（吸收、纳入），选 D。A 'exclude'、C 'ignore' 都与'每阶段吸收反馈'相反；B 'postpone'（推迟）搭配不当。"}, {"id": "yi-v-029", "level": "IELTS", "type": "词汇", "topic": "社会", "stem": "The new campus will ___ teaching, housing and industry workshops in a single walkable site. Which word fits?", "options": ["A. integrate", "B. separate", "C. advertise", "D. measure"], "answer": "A", "analysis": "'把教学、住宿与工业车间结合在同一步行范围内'即 'integrate'（整合），选 A。B 'separate'（分离）与'同一场地'相反；C 'advertise'（宣传）、D 'measure'（测量）与空间整合无关。"}, {"id": "yi-v-030", "level": "IELTS", "type": "词汇", "topic": "教育", "stem": "Applicants must ___ their choice of elective courses with evidence of relevant experience. Which word fits?", "options": ["A. abandon", "B. justify", "C. conceal", "D. randomise"], "answer": "B", "analysis": "'用相关经历证明选修选择的合理性'即 'justify'（为……提供理由），选 B。A 'abandon'（放弃）、C 'conceal'（隐瞒）与申请逻辑相反；D 'randomise'（随机化）语义不通。"}, {"id": "yi-v-031", "level": "IELTS", "type": "词汇", "topic": "科技", "stem": "Engineers will ___ the bridge design after wind-tunnel tests revealed vibration risks. Which word fits?", "options": ["A. praise", "B. demolish", "C. modify", "D. patent"], "answer": "C", "analysis": "风洞测试发现振动风险后'修改设计'合乎逻辑，'modify'（修改）正确，选 C。A 'praise'（表扬）与发现问题矛盾；B 'demolish'（拆除）对象应是桥而非设计；D 'patent'（申请专利）时机不当。"}, {"id": "yi-v-032", "level": "IELTS", "type": "词汇", "topic": "健康", "stem": "People under sustained stress may not ___ warning signs such as disturbed sleep until they collapse. Which word fits?", "options": ["A. perceive", "B. transmit", "C. invent", "D. publish"], "answer": "A", "analysis": "'察觉到睡眠紊乱等预警信号'用 'perceive'（察觉、感知），选 A。B 'transmit'（传递）主客体颠倒；C 'invent'（编造）与预警的真实性矛盾；D 'publish'（发表）语境不合。"}, {"id": "yi-v-033", "level": "IELTS", "type": "词汇", "topic": "科学", "stem": "Even as antibiotics fail, some bacteria ___ inside hospitals that no disinfectant can touch. Which word fits?", "options": ["A. persist", "B. evaporate", "C. retreat", "D. soften"], "answer": "A", "analysis": "'即使抗生素失效仍继续存在、连消毒剂也无效'描述的是'持续存在'，'persist'（持续存在）正确，选 A。B 'evaporate'（蒸发）、C 'retreat'（撤退）、D 'soften'（软化）都与'无法清除'的语境矛盾。"}, {"id": "yi-v-034", "level": "IELTS", "type": "词汇", "topic": "教育", "stem": "Seeing peers succeed tends to ___ students' own belief that they can master the topic. Which word fits?", "options": ["A. weaken", "B. reinforce", "C. complicate", "D. postpone"], "answer": "B", "analysis": "'同伴成功→增强自身能学会的信念'即 'reinforce'（强化、巩固），选 B。A 'weaken'（削弱）方向相反；C 'complicate'（复杂化）、D 'postpone'（推迟）与信念增强无关。"}, {"id": "yi-v-035", "level": "IELTS", "type": "词汇", "topic": "经济", "stem": "E-commerce has ___ the village economy more in a decade than the railway did in a century. Which word fits?", "options": ["A. resemble", "B. delay", "C. transform", "D. record"], "answer": "C", "analysis": "'十年间的变化超过铁路一个世纪'说明电子商务'彻底改变'了村落经济，'transform'（变革）正确，选 C。A 'resemble'（类似）、B 'delay'（推迟）与巨大变化的语境矛盾；D 'record'（记录）搭配不当。"}, {"id": "yi-v-036", "level": "IELTS", "type": "词汇", "topic": "健康", "stem": "Sleep helps the brain ___ new vocabulary long after the lesson has ended. Which word fits?", "options": ["A. forget", "B. review", "C. translate", "D. retain"], "answer": "D", "analysis": "'课程结束后大脑仍能长期保持新词汇'即 'retain'（保持、记住），选 D。A 'forget'（遗忘）与原意相反；B 'review'（复习）不是睡眠中大脑的动作；C 'translate'（翻译）无关。"}, {"id": "yi-v-037", "level": "IELTS", "type": "词汇", "topic": "历史", "stem": "The bridge collapsed during construction; ___ , the engineer was tried for negligence. Which word fits?", "options": ["A. subsequently", "B. previously", "C. simultaneously", "D. hypothetically"], "answer": "A", "analysis": "先坍塌、'随后'工程师受审，时间顺序用 'subsequently'（随后），选 A。B 'previously'（之前）颠倒顺序；C 'simultaneously'（同时）不合逻辑；D 'hypothetically'（假设地）与真实审判矛盾。"}, {"id": "yi-v-038", "level": "IELTS", "type": "词汇", "topic": "社会", "stem": "The therapy produced remarkably ___ results across all age groups in the trial. Which word fits?", "options": ["A. varied", "B. uniform", "C. contradictory", "D. temporary"], "answer": "B", "analysis": "'remarkably ___ results across all age groups' 意为'在所有年龄组中结果出奇地一致'，'uniform'（一致的）正确，选 B。A 'varied'（各不相同的）是反义干扰；C 'contradictory'（相互矛盾的）、D 'temporary'（暂时的）都与'跨组一致'的文意不符。"}, {"id": "yi-v-039", "level": "IELTS", "type": "词汇", "topic": "经济", "stem": "Analysts doubt that the ferry route is commercially ___ without a public subsidy. Which word fits?", "options": ["A. famous", "B. illegal", "C. viable", "D. virtual"], "answer": "C", "analysis": "'没有补贴就难以在商业上___'应填 'viable'（可存续的、可行的），'commercially viable' 为固定搭配，选 C。A 'famous'（著名的）、B 'illegal'（非法的）与盈利能力无关；D 'virtual'（虚拟的）是形近干扰。"}, {"id": "yi-v-040", "level": "IELTS", "type": "词汇", "topic": "社会", "stem": "Choose the word closest in meaning to 'advocate' in: 'Residents' groups advocate slower traffic outside every school gate.'", "options": ["A. publicly call for", "B. quietly oppose", "C. reluctantly permit", "D. occasionally mention"], "answer": "A", "analysis": "'advocate' 作动词意为'提倡、主张'，与 'publicly call for'（公开呼吁）同义，选 A。B 'oppose'（反对）是反义干扰；C 'permit'（允许）缺少'奔走呼喊'的主动性；D 'mention'（提及）力度不足。"}, {"id": "yi-v-041", "level": "IELTS", "type": "词汇", "topic": "环境", "stem": "Numbers of the once-common sparrow have ___ sharply in city centres over thirty years. Which word fits?", "options": ["A. diminished", "B. stabilised", "C. multiplied", "D. migrated"], "answer": "A", "analysis": "'曾经常见的麻雀如今大幅减少'用 'diminish'（减少、缩减），选 A。B 'stabilise'（稳定）、C 'multiply'（倍增）与'骤减'矛盾；D 'migrate'（迁徙）只是位置变化，不表示数量下降。"}, {"id": "yi-v-042", "level": "IELTS", "type": "词汇", "topic": "法律", "stem": "Judges are trained to weigh ___ evidence, such as fingerprints and logs, before testimony. Which word fits?", "options": ["A. abstract", "B. concrete", "C. emotional", "D. second-hand"], "answer": "B", "analysis": "与'证词'相对、如指纹与记录般'具体的、实在的'证据用 'concrete'，选 B。A 'abstract'（抽象的）与指纹记录的实在性相反；C 'emotional'（情绪化的）恰是法庭要排除的；D 'second-hand'（二手的）与例证性质不符。"}, {"id": "yi-v-043", "level": "IELTS", "type": "词汇", "topic": "科学", "stem": "Auditors found a ___ between the recorded mileage and the fuel purchased by the depot. Which word fits?", "options": ["A. coincidence", "B. similarity", "C. discrepancy", "D. balance"], "answer": "C", "analysis": "'记录里程与购油量对不上'即存在'差异、出入'，'discrepancy'（不一致）正确，选 C。A 'coincidence'（巧合）、B 'similarity'（相似）、D 'balance'（平衡）都无法表达'账目对不上'的审计含义。"}, {"id": "yi-v-044", "level": "IELTS", "type": "词汇", "topic": "健康", "stem": "Interviewers were trained to ___ honest answers without leading the witness. Which word fits?", "options": ["A. suppress", "B. dictate", "C. fabricate", "D. elicit"], "answer": "D", "analysis": "'引出、诱发出真实回答'用 'elicit'（引出、引发），选 D。A 'suppress'（压制）方向相反；B 'dictate'（口述/强令）与'不引导'矛盾；C 'fabricate'（编造）是负面行为。"}, {"id": "yi-v-045", "level": "IELTS", "type": "词汇", "topic": "经济", "stem": "Demand for housing now ___ supply in almost every major city. Which word fits?", "options": ["A. exceeds", "B. equals", "C. trails", "D. ignores"], "answer": "A", "analysis": "'需求超过供给'用 'exceed'（超过），选 A。B 'equals'（相等）、C 'trails'（落后于）与住房紧缺的现实相反；D 'ignores'（忽视）搭配不合逻辑——需求无法'忽视'供给。"}, {"id": "yi-v-046", "level": "IELTS", "type": "词汇", "topic": "环境", "stem": "Beavers ___ their surroundings so thoroughly that valleys are re-engineered within seasons. Which word fits?", "options": ["A. abandon", "B. exploit", "C. survey", "D. decorate"], "answer": "B", "analysis": "'充分利用并改造环境'用 'exploit'（利用、开发），此处为中性用法，选 B。A 'abandon'（抛弃）与'彻底改造'矛盾；C 'survey'（勘察）只是测量；D 'decorate'（装饰）力度远不足。"}, {"id": "yi-v-047", "level": "IELTS", "type": "词汇", "topic": "社会", "stem": "Community hosts are trained to ___ introductions between newcomers and long-standing neighbours. Which word fits?", "options": ["A. prevent", "B. complicate", "C. facilitate", "D. cancel"], "answer": "C", "analysis": "'为新老住户之间的介绍牵线搭桥、使之更容易'用 'facilitate'（促进、使便利），选 C。A 'prevent'（阻止）、D 'cancel'（取消）方向相反；B 'complicate'（使复杂化）与促进交往的目的矛盾。"}, {"id": "yi-v-048", "level": "IELTS", "type": "词汇", "topic": "科学", "stem": "The paper describes a ___ scenario in which glaciers vanish by 2100, offered for comparison rather than prediction. Which word fits?", "options": ["A. hypothetical", "B. verified", "C. retrospective", "D. compulsory"], "answer": "A", "analysis": "'供比较而非预测'的情景是'假设性的'，'hypothetical' 正确，选 A。B 'verified'（已证实的）与'假设'矛盾；C 'retrospective'（回顾性的）方向相反；D 'compulsory'（强制的）搭配不通。"}, {"id": "yi-v-049", "level": "IELTS", "type": "词汇", "topic": "文化", "stem": "Though the invitation never said so ___ , black tie was clearly expected. Which word fits?", "options": ["A. implicitly", "B. explicitly", "C. legally", "D. accidentally"], "answer": "B", "analysis": "'请柬没有明说，但显然期待正装'——空格需要'明确地'与'从未明说'呼应，'explicitly' 正确，选 B。A 'implicitly'（含蓄地）与'never said'语义重复且不合语法逻辑；C、D 无关。"}, {"id": "yi-v-050", "level": "IELTS", "type": "词汇", "topic": "经济", "stem": "A tax break for first-time buyers acts as an ___ to enter the market earlier. Which word fits?", "options": ["A. obstacle", "B. incentive", "C. obligation", "D. penalty"], "answer": "B", "analysis": "'减税促使买家更早入市'即构成'激励'，'incentive'（激励）正确，选 B。A 'obstacle'（障碍）方向相反；C 'obligation'（义务）是强制而非吸引；D 'penalty'（处罚）与减税性质相反。"}, {"id": "yi-v-051", "level": "IELTS", "type": "词汇", "topic": "历史", "stem": "Remarkably, the monastery's stained glass survived the fire ___, though the roof above it did not. Which word fits?", "options": ["A. intact", "B. shattered", "C. faded", "D. relocated"], "answer": "A", "analysis": "'彩窗完好无损地躲过火灾'用 'intact'（完好无损的），与让步'屋顶却没能幸免'形成对照，选 A。B 'shattered'（破碎的）、C 'faded'（褪色的）与'幸存'矛盾；D 'relocated'（被迁移的）无中生有。"}, {"id": "yi-v-052", "level": "IELTS", "type": "词汇", "topic": "社会", "stem": "The two rival unions reached a ___ agreement to share picket duties during the dispute. Which word fits?", "options": ["A. mutual", "B. verbal only", "C. unequal", "D. binding only on one side"], "answer": "A", "analysis": "'双方约定分担纠察任务'是'相互的'协议，'mutual'（相互的）正确，选 A。B、C、D 都引入了原文没有的限定（仅口头、不对等、单方约束），破坏'分享职责'的对等含义。"}, {"id": "yi-v-053", "level": "IELTS", "type": "词汇", "topic": "科技", "stem": "Funding for the telescope upgrade is ___ , so observations will continue through the decade. Which word fits?", "options": ["A. exhausted", "B. withdrawn", "C. ongoing", "D. pending"], "answer": "C", "analysis": "'资金持续到位，观测将延续十年'用 'ongoing'（正在进行/持续的），选 C。A 'exhausted'（耗尽的）、B 'withdrawn'（撤回的）与'继续观测'矛盾；D 'pending'（待定的）与既定安排不符。"}, {"id": "yi-v-054", "level": "IELTS", "type": "词汇", "topic": "科学", "stem": "The scales were ___ to a tenth of a gram, revealing even the weight of the label. Which word fits?", "options": ["A. precise", "B. rough", "C. estimated", "D. average"], "answer": "A", "analysis": "'精确到十分之一克、连标签重量都能显现'说明'精确的'，'precise' 正确，选 A。B 'rough'（粗略的）、C 'estimated'（估计的）与精确刻度矛盾；D 'average'（平均的）概念无关。"}, {"id": "yi-v-055", "level": "IELTS", "type": "词汇", "topic": "社会", "stem": "She became a ___ voice in the campaign for safer cycling within a single year. Which word fits?", "options": ["A. reluctant", "B. marginal", "C. prominent", "D. silent"], "answer": "C", "analysis": "'一年之内成为运动中的领军人物'即'杰出的、显眼的'声音，'prominent' 正确，选 C。A 'reluctant'（不情愿的）、B 'marginal'（边缘的）、D 'silent'（沉默的）都与'一年成名'的语境相反。"}, {"id": "yi-v-056", "level": "IELTS", "type": "词汇", "topic": "政治", "stem": "The proposal to abolish school uniforms was once considered ___ ; now half the country supports it. Which word fits?", "options": ["A. moderate", "B. popular", "C. technical", "D. radical"], "answer": "D", "analysis": "'曾经被视为激进、如今半数人支持'的今昔对比说明当年'激进的'，'radical'（激进的）正确，选 D。A 'moderate'（温和的）、B 'popular'（受欢迎的）与'曾被排斥'的语义相反；C 'technical'（技术的）无关。"}, {"id": "yi-v-057", "level": "IELTS", "type": "词汇", "topic": "教育", "stem": "When marking essays, keep comments ___ to the question actually asked. Which word fits?", "options": ["A. relevant", "B. superior", "C. identical", "D. contrary"], "answer": "A", "analysis": "'评语要与所问问题相关'用 'relevant'（相关的），固定搭配 'relevant to'，选 A。B 'superior'（优越的）、C 'identical'（相同的）、D 'contrary'（相反的）都不能与'紧扣题目'的批改要求对应。"}, {"id": "yi-v-058", "level": "IELTS", "type": "词汇", "topic": "文化", "stem": "Most of the archive's sound recordings ___ in a basement unknown even to the university that owned them. Which word fits?", "options": ["A. circulated", "B. resided", "C. perished", "D. vanished"], "answer": "B", "analysis": "'多年来存放在连校方都不知道的地下室'用 'reside'（存在于、坐落于），选 B。A 'circulated'（流通）与'无人知晓'矛盾；C 'perished'（消亡）、D 'vanished'（消失）与'仍然保存'的事实相反。"}, {"id": "yi-v-059", "level": "IELTS", "type": "词汇", "topic": "健康", "stem": "Doctors may ___ a patient's diet before considering medication for mild hypertension. Which word fits?", "options": ["A. expand", "B. ignore", "C. restrict", "D. advertise"], "answer": "C", "analysis": "'考虑用药之前先限制饮食'是治疗轻症高血压的常规路径，'restrict'（限制）正确，选 C。A 'expand'（扩大）方向相反；B 'ignore'（忽视）与'先饮食后药物'的顺序矛盾；D 'advertise'（宣传）语义不通。"}, {"id": "yi-v-060", "level": "IELTS", "type": "词汇", "topic": "社会", "stem": "The city moved to ___ its water supply by buying up the surrounding catchment land. Which word fits?", "options": ["A. gamble", "B. drain", "C. abandon", "D. secure"], "answer": "D", "analysis": "'买下集水区土地以保障供水安全'用 'secure'（动词：保障、使安全），选 D。A 'gamble'（赌博）与稳妥的收购行为矛盾；B 'drain'（排空）与保护水源相反；C 'abandon'（放弃）方向相反。"}, {"id": "yi-v-061", "level": "IELTS", "type": "词汇", "topic": "科技", "stem": "The tiny sensor can ___ the accuracy of instruments ten times its price. Which word fits?", "options": ["A. surpass", "B. match only", "C. trail", "D. replace"], "answer": "A", "analysis": "'超过价格十倍仪器的精度'用 'surpass'（超过），选 A。B 'match only'（仅持平）弱化了原文的超越语气；C 'trail'（落后于）相反；D 'replace'（替代）与精度比较无关。"}, {"id": "yi-v-062", "level": "IELTS", "type": "词汇", "topic": "环境", "stem": "Coastal plants ___ salt spray that would kill most garden species within weeks. Which word fits?", "options": ["A. produce", "B. tolerate", "C. amplify", "D. attract"], "answer": "B", "analysis": "'能忍受让多数园艺植物致死的盐雾'用 'tolerate'（耐受），选 B。A 'produce'（产生盐雾）主客体颠倒；C 'amplify'（放大）与存活能力相反；D 'attract'（吸引）语义不通。"}, {"id": "yi-v-063", "level": "IELTS", "type": "词汇", "topic": "健康", "stem": "A single case of the virus was enough to ___ a full airport screening programme. Which word fits?", "options": ["A. conclude", "B. discourage", "C. trigger", "D. forgive"], "answer": "C", "analysis": "'一例病例足以引发全面机场筛查'用 'trigger'（引发、触发），选 C。A 'conclude'（结束）时序相反；B 'discourage'（阻止）与启动筛查矛盾；D 'forgive'（原谅）搭配不当。"}, {"id": "yi-v-064", "level": "IELTS", "type": "词汇", "topic": "经济", "stem": "Beneath the quarterly headlines, the ___ cause of the trade gap is a shortage of port capacity. Which word fits?", "options": ["A. superficial", "B. seasonal", "C. unrelated", "D. underlying"], "answer": "D", "analysis": "'标题之下的深层原因'用 'underlying'（根本的、深层的），选 D。A 'superficial'（表面的）与'深层'相反；B 'seasonal'（季节性的）与季度数字呼应但非根因；C 'unrelated'（无关的）与'是……的原因'矛盾。"}, {"id": "yi-v-065", "level": "IELTS", "type": "词汇", "topic": "环境", "stem": "A ___ amount of plastic enters the ocean every year, much of it from a handful of rivers. Which word fits?", "options": ["A. vast", "B. trivial", "C. shrinking", "D. measured"], "answer": "A", "analysis": "'每年大量塑料入海，其中大部分来自少数几条河'用 'vast'（巨大的）修饰量，选 A。B 'trivial'（微不足道的）、C 'shrinking'（缩小的）与治理压力的语境矛盾；D 'measured'（经过测量的）不能单独表量级。"}, {"id": "yi-v-066", "level": "IELTS", "type": "词汇", "topic": "历史", "stem": "The two authors reached the same conclusion, working independently and almost ___ in time. Which word fits?", "options": ["A. separately", "B. coincidentally", "C. unwillingly", "D. belatedly"], "answer": "B", "analysis": "两人各自独立研究却几乎同时得出相同结论，是'巧合地'同时发生，'coincidentally' 正确，选 B。A 'separately'（各自地）已被 independently 覆盖且不表达'同时'；C、D 与时间巧合无关。"}, {"id": "yi-v-067", "level": "IELTS", "type": "词汇", "topic": "社会", "stem": "New speed cameras were ___ at accident black spots across the county last month. Which word fits?", "options": ["A. removed", "B. debated", "C. deployed", "D. purchased only"], "answer": "C", "analysis": "'在事故黑点部署测速摄像头'用 'deploy'（部署、投入使用），选 C。A 'removed'（移除）相反；B 'debated'（辩论）停留在讨论；D 'purchased only'（仅购买）与'上月已装设'的事实不符。"}, {"id": "yi-v-068", "level": "IELTS", "type": "词汇", "topic": "动物", "stem": "Numbers of the nightingale have ___ to a fraction of their 1960s level. Which word fits?", "options": ["A. soared", "B. stabilised", "C. recovered", "D. dwindled"], "answer": "D", "analysis": "'锐减到 1960 年代的一小部分'用 'dwindle'（逐渐减少），与 'to a fraction' 搭配，选 D。A 'soared'（猛增）、B 'stabilised'（稳定）、C 'recovered'（恢复）都与'只剩零头'矛盾。"}, {"id": "yi-v-069", "level": "IELTS", "type": "词汇", "topic": "科技", "stem": "The rescue plan will ___ closing two branches and opening a single digital hub. Which word fits?", "options": ["A. entail", "B. cancel", "C. postpone", "D. deny"], "answer": "A", "analysis": "'该计划需要/包含关闭两家分行并开设一个数字中心'用 'entail'（必然涉及），选 A。B 'cancel'（取消）、C 'postpone'（推迟）、D 'deny'（否认）都与'计划的具体内容'相矛盾。"}, {"id": "yi-v-070", "level": "IELTS", "type": "词汇", "topic": "艺术", "stem": "Choose the word closest in meaning to 'embody' in: 'The rebuilt pavilion embodies the architect's idea that buildings should age gracefully.'", "options": ["A. disguise", "B. contradict", "C. merely mention", "D. give concrete form to"], "answer": "D", "analysis": "'embody' 意为'体现、使具体化'，与 'give concrete form to' 同义——展馆把'建筑应优雅老去'的理念变成实物，选 D。A 'disguise'（掩盖）、B 'contradict'（违背）方向相反；C 'merely mention'（仅提及）远不及'体现'。"}, {"id": "yi-g-001", "level": "IELTS", "type": "语法", "topic": "经济", "stem": "Which sentence is most suitable for an academic report (nominalisation)?", "options": ["A. The destruction of crops by flooding led to a sharp rise in food prices.", "B. Floods destroyed the crops, so food prices went up a lot.", "C. The crops got destroyed by floods and prices rose quickly.", "D. Because floods wrecked the crops, food prices shot up."], "answer": "A", "analysis": "学术写作偏好名词化结构：把动词短语 'floods destroyed crops' 压缩为名词短语 'the destruction of crops by flooding'，句子更紧凑客观，选 A。B、C、D 都使用口语化的动词链（went up、got destroyed、shot up），不符合学术语域。"}, {"id": "yi-g-002", "level": "IELTS", "type": "语法", "topic": "科技", "stem": "Fill the blank: 'Under no circumstances ___ shared with third parties without written consent.'", "options": ["A. data should be", "B. should data be", "C. should be data", "D. data be"], "answer": "B", "analysis": "'Under no circumstances' 是否定状语置于句首，句子必须部分倒装，助动词 should 提到主语 data 之前：'should data be shared'，选 B。A 未倒装；C 把 be 放在主语前，语序错误；D 缺少助动词。"}, {"id": "yi-g-003", "level": "IELTS", "type": "语法", "topic": "科学", "stem": "Fill the blank: 'Little ___ that the findings would be challenged within a year.'", "options": ["A. he knew", "B. he did know", "C. did he know", "D. knew he"], "answer": "C", "analysis": "'Little' 表示否定意义置于句首时触发部分倒装，需借助助动词 did：'Little did he know...'，选 C。A 是正常语序，未倒装；B 多余地加了 did 却又恢复了陈述语序；D 是全倒装，不符合'助动词提前'的规则。"}, {"id": "yi-g-004", "level": "IELTS", "type": "语法", "topic": "交通", "stem": "Fill the blank: 'Not only ___ travel times, but it also reduced accidents along the corridor.'", "options": ["A. does the scheme cut", "B. the scheme does cut", "C. does cut the scheme", "D. the scheme cut"], "answer": "A", "analysis": "'Not only' 位于句首时句子需部分倒装：助动词 does + 主语 + 原形动词，即 'Not only does the scheme cut...'，选 A。B 未倒装；C 颠倒了主语与动词的位置；D 时态也与后文 'reduced' 不一致。"}, {"id": "yi-g-005", "level": "IELTS", "type": "语法", "topic": "社会", "stem": "Which sentence uses the participial phrase correctly (no dangling modifier)?", "options": ["A. Having surveyed 3,000 households, the researchers concluded that energy use peaks at dusk.", "B. Having surveyed 3,000 households, it was concluded that energy use peaks at dusk.", "C. Surveying 3,000 households, the conclusion was that energy use peaks at dusk.", "D. Having been surveyed 3,000 households, the researchers concluded that energy use peaks at dusk."], "answer": "A", "analysis": "分词短语的逻辑主语必须与主句主语一致：'完成 3000 户调查'的应是 researchers，A 正确。B 主句主语是 it（形式主语），C 主句主语是 conclusion，都属于悬垂分词；D 的被动分词使 households 变成了被调查的'主语'，逻辑颠倒。"}, {"id": "yi-g-006", "level": "IELTS", "type": "语法", "topic": "历史", "stem": "Fill the blank: 'The sediments ___ last summer were dated to the Bronze Age.'", "options": ["A. which collected", "B. collected", "C. collecting", "D. which collecting"], "answer": "B", "analysis": "过去分词 'collected' 作后置定语，相当于 'which were collected'，表被动且最简洁，选 B。A 缺少被动助动词（应为 which were collected）；C 的现在分词表主动，与'沉积物被采集'的语义矛盾；D 结构残缺。"}, {"id": "yi-g-007", "level": "IELTS", "type": "语法", "topic": "城市", "stem": "Fill the blank: '___ that over half the city's water is lost to leaks.'", "options": ["A. People estimate it", "B. They estimated that", "C. It is estimated", "D.One is estimating"], "answer": "C", "analysis": "学术写作用非人称被动 'It is estimated that...' 报告观点，避免指明不确定的施动者，最客观地道，选 C。A、B 使用泛指的 people/they，语域不够正式；D 时态与语体都不合适。"}, {"id": "yi-g-008", "level": "IELTS", "type": "语法", "topic": "环境", "stem": "Fill the blank: 'If the dam ___ a decade earlier, thousands of homes would now be safe from flooding.'", "options": ["A. built", "B. was built", "C. has been built", "D. had been built"], "answer": "D", "analysis": "这是混合虚拟条件句：从句是对过去的假设（用过去完成时 had been built），主句是对现在的推测（would now be），选 D。A 缺少助动词；B、C 都是陈述语气，无法表达与过去事实相反的假设。"}, {"id": "yi-g-009", "level": "IELTS", "type": "语法", "topic": "交通", "stem": "Fill the blank: 'By 2030, the metro network ___ three additional lines.'", "options": ["A. will have gained", "B. will gain", "C. gains", "D. has gained"], "answer": "A", "analysis": "'By 2030' 表示到未来某时间点之前已完成的动作，需用将来完成时 'will have gained'，选 A。B 一般将来时不含'已完成'的含义；C 是现在时；D 现在完成时不能与将来的 by 时间点连用。"}, {"id": "yi-g-010", "level": "IELTS", "type": "语法", "topic": "社会", "stem": "Fill the blank: 'The minister announced that the report ___ the following week.'", "options": ["A. publishes", "B. would be published", "C. will be published", "D. is published"], "answer": "B", "analysis": "间接引语需'时态后移'：主句 announced 为过去时，从句 will 变 would；同时 report 与 publish 是被动关系，用 'would be published'，选 B。C 未后移时态；A、D 既未后移也忽略被动。"}, {"id": "yi-g-011", "level": "IELTS", "type": "语法", "topic": "社会", "stem": "Fill the blank: 'The committee ___ divided on the proposal, with four members abstaining from the vote.'", "options": ["A. is", "B. was", "C. are", "D. be"], "answer": "C", "analysis": "集体名词 committee 在强调内部成员各自的态度时（'四名成员弃权'），英式学术用法取复数动词：'The committee are divided'，选 C。A、B 把委员会当作统一整体，与'内部分歧'的语境不符；D 缺助动词，无法独立成句。"}, {"id": "yi-g-012", "level": "IELTS", "type": "语法", "topic": "健康", "stem": "Fill the blank: 'A number of trials ___ shown the vaccine to be safe in older adults.'", "options": ["A. has", "B. has been", "C. is", "D. have"], "answer": "D", "analysis": "'a number of + 复数名词' 作主语时谓语用复数：'A number of trials have shown...'，选 D。A、C 是单数动词，适用于 'the number of trials has shown' 的结构；B 引入被动完全没有必要。"}, {"id": "yi-g-013", "level": "IELTS", "type": "语法", "topic": "教育", "stem": "Fill the blank: 'The data ___ the study relies on were gathered anonymously.'", "options": ["A. which", "B. whose", "C. what", "D. who"], "answer": "A", "analysis": "先行词 data 是物，关系代词在从句中作 relies on 的宾语，用 'which'（或 that），选 A。B 'whose' 表所属关系；C 'what' 不能引导定语从句；D 'who' 只用于人。"}, {"id": "yi-g-014", "level": "IELTS", "type": "语法", "topic": "健康", "stem": "Fill the blank: 'Participants ___ consent had lapsed were contacted again before analysis began.'", "options": ["A. which", "B. whose", "C. who's", "D. that"], "answer": "B", "analysis": "从句 '___ consent had lapsed' 中空格与 consent 构成'参与者的知情同意'，表所属关系，用关系代词 'whose'，选 B。A、D 的 which/that 不能表所属；C 'who's' 是 who is 的缩写，属拼写陷阱。"}, {"id": "yi-g-015", "level": "IELTS", "type": "语法", "topic": "健康", "stem": "Fill the blank: 'The speed ___ the virus spread surprised the modellers.'", "options": ["A. what", "B. which", "C. at which", "D. that"], "answer": "C", "analysis": "'以……的速度传播'应为 'spread at a speed'，介词 at 提前构成 'the speed at which the virus spread'，选 C。A 的 what 不能引导定语从句；B、D 缺少介词 at，'the speed which the virus spread' 结构不完整。"}, {"id": "yi-g-016", "level": "IELTS", "type": "语法", "topic": "交通", "stem": "Choose the correct correlative structure: 'The region now hosts ___ electric buses ___ it did five years ago.'", "options": ["A. as many...than", "B. so many...as", "C. more...as", "D. twice as many...as"], "answer": "D", "analysis": "'倍数 + as many...as' 是标准结构：'twice as many electric buses as it did five years ago'，选 D。A 混用了 as...than；B 的 so many...as 用于否定句；C 的 more 与 as 不搭配（应为 more...than）。"}, {"id": "yi-g-017", "level": "IELTS", "type": "语法", "topic": "科学", "stem": "Which sentence is grammatically correct?", "options": ["A. Although the results were mixed, the authors stand by their conclusions.", "B. Although the mixed results, the authors stand by their conclusions.", "C. Despite the results were mixed, the authors stand by their conclusions.", "D. Despite of the mixed results, the authors stand by their conclusions."], "answer": "A", "analysis": "'Although' 是连词，后接完整从句 'the results were mixed'，A 正确。B 中 although 后接名词短语，误作介词；C 的 despite 是介词，不能接从句；D 的 'despite of' 是常见错误，despite 后直接接名词。"}, {"id": "yi-g-018", "level": "IELTS", "type": "语法", "topic": "经济", "stem": "Fill the blank: 'The model was adjusted ___ for inflation before the figures were compared.'", "options": ["A. without to account", "B. without accounting", "C. without to accounting", "D. without account"], "answer": "B", "analysis": "介词 without 后接动名词：'without accounting for inflation'，选 B。A 不定式不能作介词宾语；C 混用了不定式标记 to 与动名词；D 用动词原形，不符合介词宾语要求。"}, {"id": "yi-g-019", "level": "IELTS", "type": "语法", "topic": "城市", "stem": "Fill the blank: 'The council chose to repair the bridge ___ it entirely.'", "options": ["A. rather than replacing", "B. rather replacing than", "C. rather than replace", "D. rather to replace"], "answer": "C", "analysis": "'rather than' 表'而不是'时，其后接与前面并列的动词原形：'chose to repair...rather than replace'，前后形式对等，选 C。A 用动名词与前面的 to repair 不对称（不平行）；B 语序错误；D 的 to 破坏了平行结构。"}, {"id": "yi-g-020", "level": "IELTS", "type": "语法", "topic": "环境", "stem": "Fill the blank: '___ demand keeps rising, new reservoirs are unavoidable.'", "options": ["A. Giving that", "B. Given to", "C. Give that", "D. Given that"], "answer": "D", "analysis": "'Given that + 从句' 是正式的复合介词结构，表示'鉴于、考虑到'，选 D。A 把 given 误作 give 的现在分词；B 的 given to 后接名词；C 用动词原形，结构不存在。"}, {"id": "yi-g-021", "level": "IELTS", "type": "语法", "topic": "社会", "stem": "Fill the blank: 'The office lights are off, so the staff ___ already.'", "options": ["A. must have left", "B. must leave", "C. should have left", "D. can have left"], "answer": "A", "analysis": "对已发生情况进行有把握的推断用 'must have + 过去分词'：'the staff must have left already'，选 A。B 的 must leave 是对现在的推断或义务；C 的 should have left 表示'本应离开（却没离开）'，含责备；D 的 can have left 仅用于否定或疑问推测。"}, {"id": "yi-g-022", "level": "IELTS", "type": "语法", "topic": "教育", "stem": "Fill the blank: 'All applications ___ by two independent reviewers before the deadline.'", "options": ["A. should review", "B. should be reviewed", "C. should been reviewed", "D. should reviewing"], "answer": "B", "analysis": "applications 与 review 是被动关系，情态动词后接 be + 过去分词：'should be reviewed'，选 B。A 是主动语态，逻辑颠倒；C 缺少 be 的原形；D 用了动名词，结构错误。"}, {"id": "yi-g-023", "level": "IELTS", "type": "语法", "topic": "科学", "stem": "Fill the blank to maintain parallel structure: 'The interns were trained to collect, ___ and report the field data.'", "options": ["A. analysing", "B. for analysing", "C. analyse", "D. analysis"], "answer": "C", "analysis": "三个并列的不定式应保持同一形式：to collect, analyse and report（后两个共用 to），选 C。A 的动名词、B 的 for + 动名词、D 的名词都破坏了平行结构，是雅思写作中的常见扣分点。"}, {"id": "yi-g-024", "level": "IELTS", "type": "语法", "topic": "科学", "stem": "Fill the blank: '___ a properly matched control group.'", "options": ["A. The study lacks it is", "B. It is the study which lacks", "C. The study is lacking what", "D. What the study lacks is"], "answer": "D", "analysis": "强调句型 'What + 主语 + 谓语 + is + 名词' 把宾语置于句尾以示强调：'What the study lacks is a control group.'，选 D。A 结构混乱；B 的强调句型错误（which 应为 that，且语序不当）；C 语序颠倒，不合语法。"}, {"id": "yi-g-025", "level": "IELTS", "type": "语法", "topic": "科学", "stem": "Fill the blank: '___ the evidence is, the sample size still limits how far the findings can be generalised.'", "options": ["A. Compelling though", "B. Although compelling", "C. Though compelling it is", "D. Compelling as though"], "answer": "A", "analysis": "'形容词 + though + 主语 + be' 是让步倒装结构：'Compelling though the evidence is...' = 'Although the evidence is compelling'，选 A。B 缺少从句主谓结构；C 语序错误；D 的 'as though' 表'仿佛'，与让步义不符。"}, {"id": "yi-g-026", "level": "IELTS", "type": "语法", "topic": "健康", "stem": "Which version is punctuated correctly?", "options": ["A. A well designed, randomised trial was conducted at three sites.", "B. A well-designed, randomised trial was conducted at three sites.", "C. A well designed-randomised trial was conducted at three sites.", "D. A well-designed randomised-trial was conducted at three sites."], "answer": "B", "analysis": "复合形容词修饰名词时需连字符连接：'well-designed'；'well designed' 位于名词前不加连字符是常见错误，选 B。C 的连字符位置错误，把 designed 与 randomised 错误相连；D 给 trial 加连字符多余，因为它是被修饰的核心名词而非修饰语。"}, {"id": "yi-g-027", "level": "IELTS", "type": "语法", "topic": "历史", "stem": "Fill the blank: 'The restoration cost far less ___ .'", "options": ["A. than it previously thought", "B. than previously thinking", "C. than previously thought", "D. as previously thought"], "answer": "C", "analysis": "比较状语从句中的省略：'than (it was) previously thought'，省略主语与 be 动词后保留过去分词 thought，选 C。A 补上了 it 却缺 be（应为 than it was previously thought）；B 用现在分词，被动关系错误；D 的 as 不能与比较级 less 搭配。"}, {"id": "yi-g-028", "level": "IELTS", "type": "语法", "topic": "健康", "stem": "Fill the blank: 'Each of the participants ___ asked to keep a sleep diary for a fortnight.'", "options": ["A. were", "B. have been", "C. are", "D. was"], "answer": "D", "analysis": "'each of + 复数名词' 作主语时谓语用单数：'Each of the participants was asked...'，选 D。A、C 是复数动词；B 既复数又与过去语境不符。该规则同样适用于 every one of、neither of。"}, {"id": "yi-g-029", "level": "IELTS", "type": "语法", "topic": "社会", "stem": "Which sentence uses the appositive correctly?", "options": ["A. The findings, published last month, have already influenced regional policy.", "B. The findings published, last month have already influenced regional policy.", "C. The findings published last month, have already influenced regional policy.", "D. The findings, published last month have already influenced regional policy."], "answer": "A", "analysis": "插入性同位语（非限制性后置修饰）需成对使用逗号：'The findings, published last month, have...'，选 A。B 把第一个逗号错放在 published 之后，割裂了修饰关系；C 只在修饰语后有逗号；D 只在修饰语前有逗号，均为标点残缺。"}, {"id": "yi-g-030", "level": "IELTS", "type": "语法", "topic": "环境", "stem": "Fill the blank: 'The storm grew ___ violent ___ all flights were grounded.'", "options": ["A. such...that", "B. so...that", "C. so...as", "D. such...as"], "answer": "B", "analysis": "'so + 形容词 + that 从句' 表结果：'grew so violent that all flights were grounded'，选 B。A 的 such 后应接名词（such a violent storm that...）；C、D 的 as 不能引出结果状语从句。"}, {"id": "yi-w-001", "level": "IELTS", "type": "写作", "topic": "社会", "stem": "Task 2: 'Some people think public libraries are obsolete in the digital age; others disagree. Discuss both views.' Which is the best thesis statement?", "options": ["A. While digital resources have changed how people read, public libraries still provide free access, trained staff and community programmes that the internet cannot replicate, so continued government funding is justified.", "B. Libraries are useless old buildings and every one of them should be closed immediately to save money.", "C. This essay will discuss both views and then reach a conclusion about them in the end.", "D. Libraries are quite nice and many people enjoy visiting them at the weekend."], "answer": "A", "analysis": "A 既有明确立场（继续资助合理），又概括了核心论据（免费获取、专业人员、社区项目），并回应'数字时代'的对比语境，是最合格的 thesis。B 立场极端且未讨论双方；C 是空洞的'套话'，没有立场；D 表述口语化且无论证价值。"}, {"id": "yi-w-002", "level": "IELTS", "type": "写作", "topic": "社会", "stem": "Which is the best topic sentence for a paragraph about the drawbacks of remote work?", "options": ["A. Remote workers save money on travel and professional clothing.", "B. Remote work, however, can blur the boundary between professional and personal life, leaving employees feeling permanently 'on call'.", "C. There are many advantages and disadvantages to working from home these days.", "D. My friend works from home and she says it is sometimes a bit difficult."], "answer": "B", "analysis": "段落主题句应清楚预告该段的单一论点：B 点明'模糊工作与生活边界'这一缺点，并给出'永远待命'的具体后果。A 讲的是优点，方向相反；C 空泛且两点都想讲，缺少焦点；D 诉诸个人轶事，不符合学术议论文的语域。"}, {"id": "yi-w-003", "level": "IELTS", "type": "写作", "topic": "交通", "stem": "Task 1: The line graph shows electric-car sales, 2015–2021. Which sentence best describes the trend?", "options": ["A. In 2015 it was 2, in 2016 it was 4, in 2017 it was 7, in 2018 it was 11, in 2019 it was 13, in 2020 it was 13 and in 2021 it was 13.", "B. Electric cars are obviously the future and everyone should buy one as soon as possible.", "C. Sales of electric cars rose sharply between 2015 and 2019, before plateauing in the following two years.", "D. Sales of electric cars fell steadily throughout the period shown in the graph."], "answer": "C", "analysis": "C 用 'rose sharply...before plateauing' 精准概括'先快速增长、后趋于平缓'的整体趋势，符合 Task 1 对 overview 的要求。A 机械罗列逐年数据，没有概括；B 加入主观评价，违反 Task 1 客观描述的原则；D 与上升的总趋势相反。"}, {"id": "yi-w-004", "level": "IELTS", "type": "写作", "topic": "经济", "stem": "Task 1: The pie charts show a household's monthly spending. Which is the best overview sentence?", "options": ["A. The pie chart has seven slices and each slice is a different colour, which makes it easy to read.", "B. Spending was 2,000 dollars in total and this is quite a lot of money for one family.", "C. The biggest slice is bigger than the second biggest slice, which is bigger than the third one.", "D. Fuel and rent together accounted for over half of household spending, while transport made up the smallest share."], "answer": "D", "analysis": "好的 overview 应指出最显著的特征并做出比较：D 同时给出'占比最大的两项合计过半'与'最小的类别'。A 评论图表外观而非数据；B 引入图外信息与主观评价；C 只说大小关系却不含任何类别名或比例，信息量为零。"}, {"id": "yi-w-005", "level": "IELTS", "type": "写作", "topic": "科技", "stem": "Which example best supports the argument 'governments should regulate AI in hiring'?", "options": ["A. In 2023, an Amsterdam court ruled that an algorithmic hiring tool had discriminated against applicants by age, forcing the company to abandon automated screening.", "B. It is easy to imagine that maybe someday some company might possibly misuse an algorithm somewhere.", "C. A famous actor once said in an interview that he did not trust computers very much.", "D. My cousin applied for a job online once and did not hear back for several weeks."], "answer": "A", "analysis": "A 提供了具体、可核查的例证（时间、地点、机构、后果），直接支撑'需要监管'的论点。B 全是模糊情态词，是无效的假设性例子；C 诉诸名人意见且与招聘无关；D 是无关的个人轶事，证据效力最弱。"}, {"id": "yi-w-006", "level": "IELTS", "type": "写作", "topic": "交通", "stem": "Which sentence makes the best concession followed by a rebuttal?", "options": ["A. Building new railways costs too much money, so it is a terrible idea in every possible way.", "B. Admittedly, building new railways is expensive; however, their long-term returns in reduced congestion and lower emissions justify the initial outlay.", "C. New railways are expensive and cheap at the same time, depending on how you look at it.", "D. Nobody has ever complained about railways, so there is nothing to concede here."], "answer": "B", "analysis": "B 用 'Admittedly...however...' 先承认对方最有力的论点（造价高），再以长期收益回应，是标准的让步—反驳结构。A 一味否定，未处理反方论点；C 前后矛盾，等于什么都没说；D 直接否认存在异议，论证姿态封闭。"}, {"id": "yi-w-007", "level": "IELTS", "type": "写作", "topic": "环境", "stem": "A paragraph discusses throwaway fashion. Which sentence provides the best cohesive link to a new point about microfibres?", "options": ["A. Another thing about clothes is that washing machines were invented a long time ago.", "B. In 1874, a scientist wrote about textiles in a journal that no longer exists.", "C. This throwaway culture, in turn, drives demand for cheap synthetic fabrics that shed microfibres with every wash.", "D. Microfibres are very small and most people cannot see them with the naked eye."], "answer": "C", "analysis": "C 用 'This throwaway culture' 回指上段主题，'in turn' 表明因果推进，并把新话题（微纤维）与前文（快时尚）逻辑衔接。A 只是空泛的过渡；B 的历史细节与论证无关；D 虽提及微纤维，但缺少与前文的衔接手段，是孤立的句子。"}, {"id": "yi-w-008", "level": "IELTS", "type": "写作", "topic": "教育", "stem": "Task 2: 'University education should be free for everyone. To what extent do you agree?' Which introduction best paraphrases the question?", "options": ["A. The question asks whether university education should be free for everyone, and I will answer it now.", "B. Free university is a topic that many people have opinions about in many countries.", "C. Should university be free? Yes or no? This is what I am going to talk about.", "D. Whether students or taxpayers should bear the cost of higher education is hotly contested; this essay will argue that fees should be means-tested rather than abolished."], "answer": "D", "analysis": "D 把'免费上大学'改述为'成本由谁承担'这一更精确的表述，并预告了立场（按收入收费而非全免）。A、C 只是复述或抄写原题；B 泛泛而谈，没有改写也没有立场——好的引言应同时做到 paraphrase + position。"}, {"id": "yi-w-009", "level": "IELTS", "type": "写作", "topic": "交通", "stem": "Which is the best concluding sentence for an essay arguing for public transport investment?", "options": ["A. In conclusion, while road expansion offers short-term relief, only sustained investment in public transport can reduce urban congestion in the long run.", "B. In conclusion, I have talked about roads and also about public transport, as you can see above.", "C. So that is why buses and trains and trams and metros are all really great, isn't it?", "D. In conclusion, this essay was about transport, which is a very important modern topic."], "answer": "A", "analysis": "A 重申立场并包含让步（扩建道路只是短期缓解），同时给出结论的核心逻辑（只有持续投入公共交通才能长期治堵），是有效的结论。B 只是自我指涉的空话；C 口语化且反问削弱正式性；D 只复述话题，没有总结任何论点。"}, {"id": "yi-w-010", "level": "IELTS", "type": "写作", "topic": "社会", "stem": "Task 1: The bar chart shows commuting modes by gender. Which sentence reports the data most effectively?", "options": ["A. Men cycled more than women, which is probably because of clothing and hair and things like that.", "B. Men were almost twice as likely as women to cycle to work, at 9% and 5% respectively.", "C. The bars for men are taller than the bars for women in the picture that I saw.", "D. Cycling was 9% for men, and for women it was 5%, and 9 is bigger than 5."], "answer": "B", "analysis": "B 用 'twice as likely...as' 的比较结构并分别给出数据（respectively 引导对应关系），既概括又精确。A 引入未经图表支持的猜测原因；C 描述的是图形外观而非数据本身；D 只罗列数字，缺少学术化的比较表达。"}, {"id": "yi-w-011", "level": "IELTS", "type": "写作", "topic": "文化", "stem": "Task 1: The diagram shows olive-oil production. Which sentence best describes a process step?", "options": ["A. First of all, somebody goes and gets some olives from a tree somewhere.", "B. Olives are very important in Mediterranean culture and have been for centuries.", "C. Once the olives have been washed, they are crushed into a paste, which is then spun to separate the oil from water and solids.", "D. The machine in the middle of the diagram looks quite complicated and probably costs a lot."], "answer": "C", "analysis": "流程图写作需用被动语态按顺序描述各阶段：C 用 'Once...have been washed'（时间衔接）+ 'are crushed...is then spun'（被动 + 顺序词），准确串联两个工序。A 口语化且无流程细节；B 是背景知识，不是流程描述；D 评论图形外观，与任务无关。"}, {"id": "yi-w-012", "level": "IELTS", "type": "写作", "topic": "经济", "stem": "Task 1: The chart shows household spending categories. Which sentence presents a proportion most appropriately?", "options": ["A. Groceries were the biggest thing by miles and nothing else came close at all.", "B. Groceries cost a lot of dollars every single month for the family in question.", "C. The grocery slice is coloured blue, and blue is normally a nice calm colour.", "D. Groceries represented the largest category of spending, at just under two fifths of the total."], "answer": "D", "analysis": "D 用 'represented the largest category, at just under two fifths' 同时给出排名与比例，是标准的 Task 1 数据表达。A 是夸张的口语评价；B 谈绝对金额且含主观评论；C 描述配色，完全不涉及数据。"}, {"id": "yi-w-013", "level": "IELTS", "type": "写作", "topic": "健康", "stem": "Which sentence uses hedging most appropriately in a discussion essay?", "options": ["A. The results suggest, though they do not prove, that screen time is associated with poorer sleep quality.", "B. Screen time one hundred per cent definitely causes bad sleep in every single child.", "C. Screen time and sleep have absolutely nothing to do with each other whatsoever.", "D. Everyone knows that screens ruin sleep, so no evidence is needed here."], "answer": "A", "analysis": "讨论类写作需要恰当的模糊限制语：A 用 'suggest...though they do not prove...associated with' 区分了'提示相关'与'证明因果'，措辞严谨。B、C 都使用绝对化表述，学术上站不住脚；D 诉诸常识并拒绝举证，是反论证的写法。"}, {"id": "yi-w-014", "level": "IELTS", "type": "写作", "topic": "教育", "stem": "Which sentence best presents a counter-argument and then rebuts it?", "options": ["A. Opponents claim homework consolidates classroom learning; yet studies comparing homework loads across schools find little effect on attainment in the primary years.", "B. Some teachers say homework helps, but they would say that, wouldn't they?", "C. Homework is good for some students and bad for others, so there is no point discussing it.", "D. Everyone in the whole world agrees that homework is the single most important issue."], "answer": "A", "analysis": "A 先以 'Opponents claim...' 客观呈现反方观点，再用 'yet + 证据'（跨校比较研究）加以反驳，结构完整、证据具体。B 用人身攻击代替反驳；C 以'因人而异'回避论证；D 虚构全人类共识，无任何反驳可言。"}, {"id": "yi-w-015", "level": "IELTS", "type": "写作", "topic": "健康", "stem": "Which sentence combines the evidence into the best complex sentence?", "options": ["A. The trial was short. It only lasted six months. The improvements were consistent. They were in all age groups.", "B. Although the trial lasted only six months, the improvements in lung function were consistent across all age groups.", "C. The trial lasted six months, and the improvements were consistent, and all age groups were involved.", "D. The trial, which improvements, across groups, six months, lung function consistent."], "answer": "B", "analysis": "B 用让步状语从句 Although... 把'试验期短'这一限制与'效果一致'这一发现整合成一句，信息密度高且逻辑关系明确。A 全是短句碎片，无衔接；C 只用 and 平铺并列，未体现'让步'逻辑；D 结构完全混乱不成句。"}, {"id": "yi-w-016", "level": "IELTS", "type": "写作", "topic": "教育", "stem": "Which is the best topic sentence for a paragraph on the benefits of online education?", "options": ["A. Online courses are cheap, flexible, accessible, modern, interesting, popular and useful too.", "B. My brother did an online course once and he said it was okay on the whole.", "C. The internet was invented in the twentieth century and changed many things.", "D. Online courses have democratised access to higher education by removing barriers of distance, cost and rigid timetables."], "answer": "D", "analysis": "D 一句话点明论点（ democratise access）并预告三个支撑维度（距离、费用、时间），是高效的主题句。A 是形容词堆砌，没有可展开的论点；B 是轶事证据；C 是背景铺垫，与本段论点无直接关系。"}, {"id": "yi-w-017", "level": "IELTS", "type": "写作", "topic": "环境", "stem": "Task 2: 'Protecting the environment is the responsibility of governments, not individuals. Do you agree?' Which thesis is strongest?", "options": ["A. Meaningful environmental progress requires coordinated government action, but it is unlikely to succeed without changes in individual behaviour, so responsibility must be shared between both.", "B. Governments are big and powerful and individuals are small and weak, so obviously governments should do it.", "C. This essay agrees with the statement in the question because that is what the question says.", "D. The environment is very important for everyone living on the planet Earth today."], "answer": "A", "analysis": "A 给出 nuanced 立场（责任共担），并用逻辑链（政府行动不可或缺 + 缺个人改变难以成功）支撑，直接回应题目的对立设定。B 用'大小强弱'的类比代替论证；C 只是盲目附和题目；D 是与立场无关的套话。"}, {"id": "yi-w-018", "level": "IELTS", "type": "写作", "topic": "健康", "stem": "Task 1: The table shows life expectancy in four countries, 2000–2020. Which sentence best describes the table's overall trend?", "options": ["A. Table 1 shows life expectancy in four countries in 2000 and also in 2020, which is twenty years apart.", "B. Across all four countries, life expectancy rose over the period, with the sharpest increase occurring in Vietnam.", "C. Life expectancy went up in some countries, went down in some countries and stayed the same in others.", "D. Life expectancy is when statisticians calculate how many years a person can expect to live."], "answer": "B", "analysis": "B 先概括全局趋势（四国均上升），再点出最突出的细节（越南增幅最大），是标准的 table overview 写法。A 只是复述表格信息的元描述；C 的描述与'全部上升'的假定事实不符且含混；D 给定义而非描述数据。"}, {"id": "yi-w-019", "level": "IELTS", "type": "写作", "topic": "城市", "stem": "Which example best supports the essay point 'cities should restrict cars in the centre'?", "options": ["A. I once visited a city centre with lots of cars and the traffic was quite annoying for me personally.", "B. Cars were invented more than a hundred years ago and are used all over the world nowadays.", "C. Cities such as Amsterdam, which restricted car access in the centre while expanding tram lines, saw cycling and transit use rise by roughly a third within a decade.", "D. Some experts probably think that maybe restricting cars could possibly work in certain situations."], "answer": "C", "analysis": "C 提供了有名有姓的案例（阿姆斯特丹）、具体措施（限行 + 扩建 tram）和可量化结果（十年增长约三分之一），证据链完整。A 是个人经历；B 是无关背景；D 全是模糊情态词的堆叠，不构成证据。"}, {"id": "yi-w-020", "level": "IELTS", "type": "写作", "topic": "科技", "stem": "Which sentence best refutes the claim 'electric cars will solve urban air pollution'?", "options": ["A. It is sometimes argued that electric cars will solve urban air pollution; however, their non-exhaust emissions from tyres and brakes remain comparable to those of petrol vehicles.", "B. Electric cars are perfect and anyone who criticises them simply hates technology and progress.", "C. Maybe electric cars are good or maybe they are bad; more research is definitely needed into this.", "D. Petrol cars are also quite dirty, so electric cars cannot really be blamed for anything."], "answer": "A", "analysis": "A 先呈现对方论点，再用具体反证（轮胎与刹车的非尾气排放仍与燃油车相当）指出其漏洞，反驳有力且克制。B 是攻击批评者的稻草人式辩护；C 骑墙且无实质内容；D 转移论题，未回应'能否解决空气污染'这一原命题。"}, {"id": "yi-l-001", "level": "IELTS", "type": "听力", "topic": "社会", "stem": "Section 1 (conversation). Transcript: W: I'd like to cancel my gym membership, please. M: I'm sorry to hear that. Is there a problem with the facilities? W: Not at all—I'm moving to another city next month for work. M: In that case, you'll need to fill in a cancellation form, and since you're relocating, the usual notice period is waived. Question: Why is the woman cancelling her membership?", "options": ["A. She is relocating for her job.", "B. She is unhappy with the equipment.", "C. She found a cheaper gym nearby.", "D. She has been injured and cannot exercise."], "answer": "A", "analysis": "女士明确说 'I'm moving to another city next month for work'，搬家是取消的原因，选 A。她还主动否认了设施问题（Not at all），排除 B；C、D 均未提及。"}, {"id": "yi-l-002", "level": "IELTS", "type": "听力", "topic": "教育", "stem": "Section 2 (monologue). Transcript: 'Good morning, and welcome to the university's orientation session. As your student welfare officer, I'll be walking you through the support services available this term, from counselling appointments to financial advice clinics.' Question: Who is the speaker?", "options": ["A. A visiting professor of economics.", "B. The head of the admissions office.", "C. A student welfare officer.", "D. A librarian in charge of orientation."], "answer": "C", "analysis": "说话人自我介绍 'As your student welfare officer'，身份是学生福利专员，选 C。注意 admissions office（招生办）、professor（教授）、librarian（图书馆员）均与原文身份不符，属于相近职业的干扰项。"}, {"id": "yi-l-003", "level": "IELTS", "type": "听力", "topic": "社会", "stem": "Section 1 (conversation). Transcript: M: Front desk, how may I help? W: The heating in my room hasn't worked since last night. M: I do apologise. I'll send an engineer up within the hour, and in the meantime, would you like to use the lounge where it's warmer? Question: What does the man offer to do immediately?", "options": ["A. Move the guest to another hotel.", "B. Refund the room rate in full.", "C. Invite her to wait in the warm lounge.", "D. Bring her an extra heater to the room."], "answer": "C", "analysis": "男士即刻提供了两个安排：一小时内派工程师，同时邀请她先到温暖的休息室等候，选 C。A 的换酒店、B 的全额退款均未提及；D 是把'去休息室'误解为'送取暖器'。"}, {"id": "yi-l-004", "level": "IELTS", "type": "听力", "topic": "教育", "stem": "Section 1 (conversation, number detail). Transcript: W: How much is the evening pottery course? M: It's £345 for the full twelve weeks, and that includes all materials and firing. W: And is there a discount for early booking? M: Yes—book before the end of the month and it drops to £290. Question: What is the full standard price of the course?", "options": ["A. £290", "B. £312", "C. £345 plus materials", "D. £345 including materials"], "answer": "D", "analysis": "标准价为 345 英镑且'包含所有材料与烧制费用'，选 D。£290 是早鸟折扣价，为 A 的干扰；B 的 312 未出现；C 错在'另收材料费'，与 includes all materials 相反。数字题要区分'原价/折扣价'与'含/不含材料'两组信息。"}, {"id": "yi-l-005", "level": "IELTS", "type": "听力", "topic": "教育", "stem": "Section 3 (discussion). Transcript: M: The tutor said our presentation lacked a clear structure. W: I know—we jumped straight from the background to the results. M: Perhaps we should add a slide explaining our research question before the method. Question: What was the tutors' main criticism?", "options": ["A. Their slides contained too many spelling errors.", "B. The presentation was poorly organised.", "C. They spoke too quietly for the audience.", "D. The research results were inaccurate."], "answer": "B", "analysis": "导师的意见是 'lacked a clear structure'（缺少清晰结构），且两人承认从背景直接跳到结果，可见批评的是组织结构问题，选 B。A 的拼写、C 的音量、D 的结果准确性均未提及。"}, {"id": "yi-l-006", "level": "IELTS", "type": "听力", "topic": "文化", "stem": "Section 2 (monologue). Transcript: 'Before the gallery opens to the public on Saturday, staff and volunteers are invited to a preview evening on Thursday. It's also the only chance to see the conservation studio, where our restorers will demonstrate how they clean oil paintings.' Question: What is special about the Thursday evening event?", "options": ["A. Entry is free for the general public.", "B. All paintings will be sold at auction.", "C. The conservation studio will be open to visitors.", "D. Refreshments are provided in the sculpture garden."], "answer": "C", "analysis": "原文说周四预展是'唯一能看到修复室'的机会，修复师将演示油画清洁，对应 C 项。A 的'对公众免费'与'先对员工与志愿者开放'不符；B、D 均未提及。"}, {"id": "yi-l-007", "level": "IELTS", "type": "听力", "topic": "健康", "stem": "Section 1 (conversation). Transcript: M: Surgery, good morning. W: Hello, I have an appointment with Dr Khan on Thursday, but something's come up. Could I move it to later next week? M: Dr Khan is away at a conference on Friday, so the earliest I can offer is the following Tuesday at 9:15. Question: What is the woman calling to do?", "options": ["A. Cancel her appointment permanently.", "B. Reschedule her appointment to a later date.", "C. Complain about Dr Khan's absence.", "D. Book a first appointment with a new doctor."], "answer": "B", "analysis": "女士问 'Could I move it to later next week?'，来电目的是改期而非取消，选 B。A 与 'move' 矛盾；C 她并未抱怨医生外出；D 她已有预约，不是新病人。"}, {"id": "yi-l-008", "level": "IELTS", "type": "听力", "topic": "教育", "stem": "Section 1 (conversation, date detail). Transcript: M: When does the linguistics conference begin? W: It runs from the 12th to the 15th of June, but your panel is on the 14th, the second day... no, sorry, the third day. M: So I should arrive by the 13th at the latest. Question: On which date is the man's panel?", "options": ["A. The 12th of June", "B. The 13th of June", "C. The 15th of June", "D. The 14th of June"], "answer": "D", "analysis": "女士先说 14 日又自我纠正，最终确认 panel 在'第三天'，即 6 月 12 日开幕后的第三天＝14 日，选 D。13 日是男士自行计划的到达期限；12、15 日分别是开幕与闭幕日。日期题要特别注意自我修正（correction）陷阱。"}, {"id": "yi-l-009", "level": "IELTS", "type": "听力", "topic": "教育", "stem": "Section 3 (discussion). Transcript: W: I'm struggling with my literature review—everything I read seems relevant. M: Try narrowing it to studies from the last ten years that actually measure the same outcome. W: So focus on the most recent comparable research, rather than everything ever written? Question: What does the man advise the woman to do?", "options": ["A. Read every source she can find.", "B. Write the methods chapter before the review.", "C. Restrict the review to recent comparable studies.", "D. Ask her supervisor for a list of books."], "answer": "C", "analysis": "男士建议'缩小到近十年、测量同一结果的研究'，即聚焦近期可比研究，选 C。A 与 'narrowing' 相反；B、D 均未提及。同义替换：narrow...to recent comparable = restrict to recent comparable。"}, {"id": "yi-l-010", "level": "IELTS", "type": "听力", "topic": "社会", "stem": "Section 2 (monologue). Transcript: 'Our weekend volunteering programme is open to anyone over sixteen, but volunteers under eighteen will need a signed form from a parent or guardian. No experience is required—training is provided on the first morning.' Question: Who can join the volunteering programme?", "options": ["A. Only experienced adults over twenty-one.", "B. Anyone over sixteen, with extra paperwork for under-eighteens.", "C. University students with references only.", "D. Retired residents of the local district."], "answer": "B", "analysis": "原文说'16 岁以上皆可参加，18 岁以下需家长或监护人签字'，B 概括两层数字信息。A 附加了'有经验、满 21 岁'等限制；C、D 均无中生有。"}, {"id": "yi-l-011", "level": "IELTS", "type": "听力", "topic": "经济", "stem": "Section 1 (conversation). Transcript: M: To open the account, you'll need two documents—one to confirm your identity, like a passport, and one to prove your address, such as a utility bill dated within three months. Question: What must the customer provide?", "options": ["A. A passport and a recent utility bill.", "B. A driving licence and a rent receipt.", "C. A birth certificate and a bank statement.", "D. An employment contract and a tax return."], "answer": "A", "analysis": "原文要求两类文件：护照等身份证明＋三个月内的水电账单等住址证明，选 A。B、C、D 的文件组合均与原文列举不符。细节题要准确核对'文件类型＋时间限定'。"}, {"id": "yi-l-012", "level": "IELTS", "type": "听力", "topic": "社会", "stem": "Section 1 (conversation, spelling detail). Transcript: W: Could I take your surname for the delivery? M: It's Whitfield—W-H-I-T, then F-I-E-L-D. W: Thank you, Mr Whitfi
