t people.", "B. Phones should be banned permanently.", "C. Benefits fade without lasting habit change.", "D. Guests rarely return home rested."], "answer": "C", "analysis": "心理学家提醒：若不同时改变日常习惯，一周离屏的效果难以延续回家之后。A 未提及价格；B 过度推断；D 与‘第三天如释重负’的体验不符。"}, {"id": "y6-r-019", "level": "CET6", "type": "阅读", "topic": "工作", "stem": "Coworking spaces boomed as freelancers and small teams sought desks without long leases. When the pandemic emptied offices, many operators struggled; demand then rebounded in a new form — companies renting flexible space near employees' homes instead of one big headquarters downtown. Question: How has the demand for coworking space changed?", "options": ["A. It vanished after the pandemic.", "B. It has shifted toward spaces near where employees live.", "C. It is still limited to freelancers.", "D. It now requires longer leases than before."], "answer": "B", "analysis": "疫情后需求以新形态反弹：公司在员工住所附近租用灵活空间。A 与 rebounded 矛盾；C 与‘企业租用’的新主体不符；D 与 coworking 免长约的初衷相反。"}, {"id": "y6-r-020", "level": "CET6", "type": "阅读", "topic": "文化", "stem": "Once prosecuted as vandalism, street art now anchors urban regeneration: murals draw tourists, and councils commission festivals to repaint drab districts. Some artists welcome the visibility but lament that soaring rents often follow the paint, displacing the very communities their work celebrates. Question: What paradox does the passage highlight about street art?", "options": ["A. Murals reduce tourism in city centers.", "B. Artists prefer to paint on blank walls.", "C. Councils have banned mural festivals.", "D. Regeneration can displace local residents."], "answer": "D", "analysis": "悖论在于：涂鸦带来士绅化、推高房租，反而挤走作品所礼赞的社区。A 与‘吸引游客’相反；B 未提及；C 与‘政府委托办节’矛盾。"}, {"id": "y6-r-021", "level": "CET6", "type": "阅读", "topic": "教育", "stem": "Language apps promise fluency through five-minute daily drills, and hundreds of millions have downloaded them. Studies find they excel at building vocabulary and maintaining streaks of practice, but spoken interaction — conversation partners, mistakes corrected in real time — remains hard to gamify. Question: According to studies, what do language apps do well?", "options": ["A. Building vocabulary", "B. Correcting pronunciation", "C. Simulating real conversations", "D. Preparing students for oral exams"], "answer": "A", "analysis": "研究表明应用擅长积累词汇、维持打卡。B、C 均与‘口语互动难以游戏化’的局限矛盾；D 文中未涉及考试。"}, {"id": "y6-r-022", "level": "CET6", "type": "阅读", "topic": "旅行", "stem": "Volunteer trips that mix sightseeing with charity work attract students seeking meaningful holidays. Evaluations of orphanage placements, however, found that short-term visitors rarely improve outcomes and that constant turnover of caregivers can harm children. Reputable operators now favor sending money and hiring locally over unskilled foreign labor. Question: What lesson have reputable operators drawn from the evaluations?", "options": ["A. Children prefer foreign volunteers.", "B. Longer visas would solve the problem.", "C. Funding local staff beats unskilled visits.", "D. Sightseeing should be banned outright."], "answer": "C", "analysis": "可靠机构转而选择出资并雇佣本地人，取代无技能的外国志愿者。A 与‘照护者频繁更替有害’矛盾；B 文中未提签证；D 过度推断。"}, {"id": "y6-r-023", "level": "CET6", "type": "阅读", "topic": "环境", "stem": "Repair cafes — free meeting points where volunteers fix toasters, clothes, and bikes — have spread to over two thousand towns. Beyond extending product life, organizers say the venues rebuild skills that consumer culture eroded: each repaired kettle is a small protest against throwaway design. Question: What do organizers value beyond the repairs themselves?", "options": ["A. Profits from selling spare parts", "B. Reviving repair skills among the public", "C. Competing with professional shops", "D. Collecting antique appliances"], "answer": "B", "analysis": "主办方强调修复咖啡馆重建了被消费文化侵蚀的手艺。A 与‘免费聚会点’矛盾；C、D 均无依据。"}, {"id": "y6-r-024", "level": "CET6", "type": "阅读", "topic": "社会", "stem": "Cities from Amsterdam to Seoul have appointed night mayors to manage life after dark, mediating between clubs, residents, and police. Nightlife, they argue, is an economic engine worth protecting, not a nuisance to suppress. Results include negotiated noise limits and safer late-night transport pilots. Question: What is the role of a night mayor?", "options": ["A. Closing clubs earlier", "B. Policing the streets personally", "C. Banning late-night transport", "D. Balancing nightlife with residents' needs"], "answer": "D", "analysis": "夜市长在俱乐部、居民与警方之间斡旋，即平衡夜间经济与居民需求。A、C 与‘保护而非压制夜生活’的理念相反；B 与‘斡旋协调’而非执法的定位不符。"}, {"id": "y6-r-025", "level": "CET6", "type": "阅读", "topic": "健康", "stem": "The trillions of microbes in the human gut influence digestion, immunity, and even mood, according to a wave of recent research. Diets rich in fiber and fermented foods appear to diversify these communities, while repeated antibiotic courses can flatten them. Scientists caution that probiotic supplements remain poorly understood. Question: According to the passage, gut microbes are linked to ___.", "options": ["A. digestion and possibly mood", "B. digestion only", "C. hair growth mainly", "D. antibiotic effectiveness"], "answer": "A", "analysis": "首句指出肠道菌群影响消化、免疫乃至情绪。B 的 only 与‘甚至情绪’矛盾；C 未提及；D 曲解文意，抗生素影响菌群而非相反。"}, {"id": "y6-r-026", "level": "CET6", "type": "阅读", "topic": "科技", "stem": "Drone delivery pilots promise parcels in thirty minutes, skipping traffic entirely. Early results are mixed: drones excel at urgent medical supplies to clinics but struggle with weight limits, weather, and the sheer math of replacing delivery vans in dense cities. Question: According to the passage, which use case suits drones best?", "options": ["A. Furniture shipping", "B. Bulk groceries", "C. Urgent medical deliveries", "D. Long-haul freight"], "answer": "C", "analysis": "文中说无人机在向诊所运送紧急医疗物资上表现出色。A、B 受‘载重限制’制约；D 与城市短途配送的场景不符。"}, {"id": "y6-r-027", "level": "CET6", "type": "阅读", "topic": "工作", "stem": "New laws in several countries force job ads to disclose pay ranges. Early evidence suggests posted salaries narrow gender pay gaps at the listing stage, though some employers respond by advertising suspiciously wide ranges — 'up to' figures that obscure rather than clarify. Question: How do some employers undercut the law's intent?", "options": ["A. By refusing to hire women", "B. By posting overly broad pay ranges", "C. By lowering all salaries", "D. By banning online job ads"], "answer": "B", "analysis": "部分雇主以‘高达某数’的宽泛区间模糊真实薪酬，架空立法本意。A 未提及且不合规；C、D 文中均无依据。"}, {"id": "y6-r-028", "level": "CET6", "type": "阅读", "topic": "文化", "stem": "In immersive theatre, the audience walks through the story, following characters through warehouses and hotels. Productions sell intimacy: no seat, no fourth wall. The format's challenge is scale — every show needs small crowds and large custom spaces, which keeps ticket prices high. Question: What keeps immersive theatre expensive?", "options": ["A. Fees for famous film stars", "B. Long rehearsal periods", "C. Government entertainment taxes", "D. Small audiences in large custom venues"], "answer": "D", "analysis": "文中指每场观众少、场地大且需定制，推高了票价。A、B、C 均未在文中出现。"}, {"id": "y6-r-029", "level": "CET6", "type": "阅读", "topic": "文化", "stem": "From thatching to stonemasonry, heritage crafts report a growing shortage of practitioners as masters retire. Heritage bodies have responded with apprenticeship bursaries and school demonstrations, betting that hands-on tradition can compete with screen-based careers once young people actually try it. Question: What strategy do heritage bodies use to attract newcomers?", "options": ["A. Importing foreign craftsmen", "B. Bursaries and school demonstrations", "C. Raising prices for craftwork", "D. Recording crafts on video only"], "answer": "B", "analysis": "遗产机构以学徒奖学金与校园展示吸引年轻人。A、C 未提及；D 的‘仅录像’与‘亲手尝试’的思路相反。"}, {"id": "y6-r-030", "level": "CET6", "type": "阅读", "topic": "社会", "stem": "Public libraries have quietly become daytime refuges: warm seats, free internet, and no purchase required. Librarians report rising demand from homeless visitors and have added training in naloxone use and social-work referrals — tasks far beyond the job description, and, critics note, beyond the budget. Question: What added burden do librarians face, according to the passage?", "options": ["A. Teaching evening reading classes", "B. Extending opening hours to midnight", "C. Social-service roles without matching budgets", "D. Competing with chain bookstores"], "answer": "C", "analysis": "馆员承担了纳洛酮培训、社工转介等职责，而预算并未跟上。A、B、D 文中均未提及，属无关干扰。"}, {"id": "y6-r-031", "level": "CET6", "type": "阅读", "topic": "经济", "stem": "Japan's silver market — goods and services for older consumers — now rivals the size of many national economies, from ergonomic housing to travel packages paced for slower walkers. Firms once chased youth; demographic arithmetic now rewards those who design for age. The blind spot, economists note, is marketing: advertisements still feature the young, even when the wallet is old. Question: According to the passage, companies' main blind spot lies in ___.", "options": ["A. product design", "B. marketing aimed at the young", "C. travel services", "D. ergonomic housing"], "answer": "B", "analysis": "末句明确指出盲点在营销：广告仍以年轻人为主角。A、D 与文中‘适老化设计已获回报’的表述相反；C 只是举例之一，并非盲点。"}, {"id": "y6-r-032", "level": "CET6", "type": "阅读", "topic": "环境", "stem": "Painting dark rooftops white reflects sunlight and can lower indoor temperatures by several degrees during heat waves. New York and other cities have run voluntary coating programs since 2009. The effect is local and cheap, though it does nothing to cool the planet as a whole. Question: What benefit of white roofs is highlighted in the passage?", "options": ["A. Cheap, local cooling during heat waves", "B. Global temperature reduction", "C. Lower construction costs of buildings", "D. Absorbing more sunlight in winter"], "answer": "A", "analysis": "文中强调其效果是‘局部的且便宜的’降温。B 与‘无助于给全球降温’直接矛盾；C 偷换概念，是涂刷成本而非建筑造价；D 与‘反射阳光’相反。"}, {"id": "y6-r-033", "level": "CET6", "type": "阅读", "topic": "科技", "stem": "Machine translation now handles routine documents almost instantly and nearly free. Translators have not disappeared; instead, the work has shifted to editing machine drafts and handling high-stakes texts — contracts, literature, diplomacy — where a subtle error is costly. Paradoxically, demand for human translators in these niches has risen. Question: What has happened to human translators, according to the passage?", "options": ["A. They have been fully replaced by machines.", "B. Demand for their work has vanished.", "C. Their work has shifted toward editing and high-stakes texts.", "D. They now translate only routine documents."], "answer": "C", "analysis": "文中指出译者转向润色机翻草稿和处理高风险文本，且该领域需求上升。A、B 与‘译者并未消失’矛盾；D 恰是机器包揽的部分。"}, {"id": "y6-r-034", "level": "CET6", "type": "阅读", "topic": "健康", "stem": "East Asia's myopia boom tracks closely with schooling: children who spend less time outdoors develop nearsightedness at far higher rates. Singapore now schedules outdoor time in schools; Taiwan reported the world's first reversal after mandating daily playground breaks. Glasses correct vision but prevent nothing. Question: What measure did Taiwan take against myopia?", "options": ["A. Banning screens at home", "B. Providing free glasses to all pupils", "C. Shortening the school day", "D. Mandating daily outdoor playground breaks"], "answer": "D", "analysis": "文中说台湾在强制每日户外课间休息后首次实现近视率逆转。A、C 未提及；B 与末句‘眼镜只矫正不预防’的结论矛盾。"}, {"id": "y6-r-035", "level": "CET6", "type": "阅读", "topic": "经济", "stem": "Clothing rental subscriptions promise a rotating wardrobe without the clutter. An audit of the actual logistics complicates the green pitch: dry cleaning between wears and round-trip shipping can erase the environmental savings. Rentals shine for occasion wear — a suit worn once — and least for daily basics. Question: According to the passage, when does clothing rental make the most environmental sense?", "options": ["A. For garments worn rarely, such as occasion wear", "B. For daily basics such as T-shirts", "C. When shipping is fastest", "D. When dry cleaning is cheapest"], "answer": "A", "analysis": "文中指出租赁最适于‘只穿一次的礼服’等场合装。B 与‘日常基础款收益最小’相反；C、D 把物流与干洗说成有利条件，恰是抵消环保收益的因素。"}, {"id": "y6-r-036", "level": "CET6", "type": "阅读", "topic": "环境", "stem": "Some restaurants now print carbon labels beside dishes, the way calories are shown. Early trials report modest shifts toward lower-impact meals, especially when labels compare items directly rather than showing abstract grams. Critics call the numbers guesswork; supporters answer that perfect accuracy is not the point — direction is. Question: What do supporters of carbon labels argue?", "options": ["A. They should replace price labels entirely.", "B. Indicating direction matters more than perfect accuracy.", "C. Labels must show exact grams of carbon.", "D. They mainly serve to cut restaurant costs."], "answer": "B", "analysis": "支持者认为关键在‘指明方向’而非精确无误。A、D 无依据；C 恰与‘抽象克数效果差’的发现相反。"}, {"id": "y6-r-037", "level": "CET6", "type": "阅读", "topic": "社会", "stem": "With pension ages rising, employers face a workforce that includes seventy-year-olds. Firms that redesigned shifts — shorter standing time, flexible scheduling, mentoring roles — report better retention of older staff than those that simply rebranded job advertisements. The lesson: retention follows job design, not slogans. Question: What determines the retention of older workers, according to the passage?", "options": ["A. Higher pension payments", "B. Rebranding job advertisements", "C. Redesigning how jobs themselves are structured", "D. Stricter mandatory retirement ages"], "answer": "C", "analysis": "末句点明结论：留任取决于岗位设计而非口号。B 正是被对比否定的做法；A、D 文中未涉及。"}, {"id": "y6-r-038", "level": "CET6", "type": "阅读", "topic": "教育", "stem": "Universities increasingly welcome deferred entry for gap years, citing research that students arrive more focused after structured time out. The caveat is 'structured': a year of aimless scrolling predicts worse outcomes, not better. Programs pairing travel with service or work show the clearest gains. Question: What does the research suggest about gap years?", "options": ["A. They always improve academic results.", "B. Any kind of deferral is beneficial.", "C. Universities have now banned them.", "D. They work best when paired with work or service."], "answer": "D", "analysis": "文中说‘旅行+服务/工作’的 structured 间隔年收益最明显。A、B 的 always/any 与‘无目的刷手机反而更糟’矛盾；C 与‘欢迎延期入学’相反。"}, {"id": "y6-r-039", "level": "CET6", "type": "阅读", "topic": "健康", "stem": "Plant-based burgers have slid from novelty to supermarket staple, yet sales growth has stalled among the curious majority. Taste, surveys repeat, is the obstacle — not price, not ethics. Food scientists now chase fat sizzle and juiciness, betting the climate dividend follows the taste buds. Question: What do surveys identify as the main barrier to plant-based food?", "options": ["A. Taste, not price", "B. High prices", "C. Ethical doubts", "D. Limited availability"], "answer": "A", "analysis": "调查反复显示障碍在于口味，而非价格或伦理。B、C 被原文明确排除；D 未提及。"}, {"id": "y6-r-040", "level": "CET6", "type": "阅读", "topic": "环境", "stem": "Beekeeping has become a hobbyist boom on city rooftops from Paris to Melbourne. Honeybees, however, are essentially livestock: dense hives can outcompete wild bees and hoverflies that pollinate native plants. Ecologists suggest planting for pollinators instead of adding more hives. Question: What concern do ecologists raise about urban beekeeping?", "options": ["A. Honey quality is poor in cities.", "B. Honeybees may outcompete wild pollinators.", "C. Rooftop hives are usually illegal.", "D. Bees spread disease to humans."], "answer": "B", "analysis": "生态学家指出密集蜂箱会排挤为本土植物授粉的野生蜂类与食蚜蝇。A、C、D 文中均未提及，属无关干扰项。"}, {"id": "y6-r-041", "level": "CET6", "type": "阅读", "topic": "社会", "stem": "Minimalism — owning fewer things — sells books and decluttering shows by the millions. Sociologists note the irony: rejecting consumption has itself become a market. Still, practitioners report real gains in savings and calm, suggesting the trend is more than a hashtag. Question: What irony do sociologists point out about minimalism?", "options": ["A. Minimalists actually buy more than average.", "B. Decluttering shows rarely sell well.", "C. Rejecting consumption has itself become a market.", "D. Books about minimalism are always free."], "answer": "C", "analysis": "文中明言‘拒绝消费本身已成一门生意’。A 未提及；B 与‘销量数百万’矛盾；D 明显荒谬。"}, {"id": "y6-r-042", "level": "CET6", "type": "阅读", "topic": "教育", "stem": "Several governments have moved to forgive portions of student debt, arguing that debt delays homeownership and family formation. Opponents counter that forgiveness is regressive — graduates already out-earn non-graduates — and that the money would be better spent widening access. Both camps agree on the underlying problem: tuition has outrun inflation for decades. Question: What do both sides of the student-debt debate agree on?", "options": ["A. Forgiveness is regressive", "B. Graduates earn too little", "C. All debt should be forgiven", "D. Runaway tuition growth is the root problem"], "answer": "D", "analysis": "末句指出双方共识：学费涨幅数十年来远超通胀。A 只是一方观点；B 与‘毕业生收入更高’矛盾；C 任何一方都未主张。"}, {"id": "y6-r-043", "level": "CET6", "type": "阅读", "topic": "科技", "stem": "Electric-vehicle batteries retire with much of their capacity intact, opening a second life powering grid storage before recycling. Recovering lithium and cobalt remains expensive, so policy now requires manufacturers to take batteries back. The rule turns a cost nobody wanted into an industry. Question: What does the take-back policy achieve, according to the passage?", "options": ["A. It turns battery disposal into an industry opportunity.", "B. It bans all battery imports.", "C. It raises the price of new cars directly.", "D. It ends second-life grid storage."], "answer": "A", "analysis": "末句‘把没人想要的成本变成一个产业’点明政策效果。B、D 文中未提及且与文意相反；C 无依据。"}, {"id": "y6-r-044", "level": "CET6", "type": "阅读", "topic": "环境", "stem": "Satellites now photograph rainforest clearings daily, and alert systems ping enforcement teams within hours. Deforestation in monitored hotspots has fallen where governments act on the alerts. Where they don't, the data simply archives the loss. Question: What does the passage say about satellite alert systems?", "options": ["A. They have replaced ground patrols entirely.", "B. They help only when governments act on the alerts.", "C. They have failed to detect clearings.", "D. They mainly archive data for tourists."], "answer": "B", "analysis": "文中对比：‘政府响应警报的地方毁林下降，不响应的地方数据只是存档’。A 过度推断；C 与‘数小时内即告警’矛盾；D 曲解 archives the loss 的语境。"}, {"id": "y6-r-045", "level": "CET6", "type": "阅读", "topic": "工作", "stem": "Formal mentoring programs pair junior staff with senior colleagues, and retention studies favor them: mentees stay longer and report faster promotion. The catch is matching — badly paired mentoring is worse than none, breeding resentment on both sides. Programs that let pairs opt in outperform those that assign them randomly. Question: What determines mentoring success, according to the passage?", "options": ["A. The length of the program", "B. The size of the company", "C. Whether pairs are well matched or self-chosen", "D. A seniority gap of at least ten years"], "answer": "C", "analysis": "文中强调‘匹配是关键’，自愿组合优于随机指派。A、B、D 文中均未提及，与成败无关。"}, {"id": "y6-r-046", "level": "CET6", "type": "阅读", "topic": "社会", "stem": "Courts increasingly confront a novel question: who inherits a dead person's photos, messages, and domains? Terms of service usually grant platforms broad licenses, and families may be locked out of accounts holding decades of memories. Some countries now let next of kin demand data access, treating digital assets like heirlooms. Question: What legal development is described in the passage?", "options": ["A. Platforms must delete all data immediately.", "B. Digital assets automatically belong to the state.", "C. Passwords must be published in wills.", "D. Some countries let relatives demand access to a deceased person's data."], "answer": "D", "analysis": "末句指出一些国家允许近亲属要求获取数据，把数字资产当作传家物。A、B、C 均为文中未出现的极端说法。"}, {"id": "y6-r-047", "level": "CET6", "type": "阅读", "topic": "工作", "stem": "The open-plan office promised collaboration and delivered, studies find, mostly noise: face-to-face interaction actually dropped after walls came down, as workers retreated into headphones. Hybrid designs — quiet rooms plus shared hubs — now command the evidence-based high ground. Question: What did studies find about open-plan offices?", "options": ["A. They reduced face-to-face interaction.", "B. They boosted collaboration as promised.", "C. They cut costs and staff turnover.", "D. They improved acoustic comfort."], "answer": "A", "analysis": "研究发现拆墙后面对面交流反而减少，员工躲进耳机。B 与 promised... delivered mostly noise 的反讽相反；C、D 与‘噪音为主’的结论矛盾。"}, {"id": "y6-r-048", "level": "CET6", "type": "阅读", "topic": "健康", "stem": "Energy drinks now outsell coffee among teenagers in several countries, and pediatricians are alarmed: caffeine can aggravate anxiety and disrupt already-short adolescent sleep. Some stores voluntarily shelve the cans behind counters. Whether that is enough, without advertising limits, remains contested. Question: Why are pediatricians concerned about energy drinks?", "options": ["A. Teenagers prefer coffee to canned drinks.", "B. Caffeine worsens anxiety and sleep in adolescents.", "C. Energy drinks are cheaper than coffee.", "D. Stores refuse to sell the drinks at all."], "answer": "B", "analysis": "儿科医生担忧咖啡因会加重青少年焦虑并干扰睡眠。A、C 与‘功能饮料销量超过咖啡’的背景矛盾；D 与‘部分门店自愿放柜台后’不符。"}, {"id": "y6-r-049", "level": "CET6", "type": "阅读", "topic": "旅行", "stem": "Slow travel — one base, trains instead of flights, weeks rather than days — is marketed as the antidote to checklist tourism. Convert numbers are modest; the barrier is annual leave. Where four weeks' vacation is normal, slow travel is a scheduling choice; where two weeks is the ceiling, it is a fantasy. Question: According to the passage, what limits the spread of slow travel?", "options": ["A. Train fares", "B. Lack of traveler interest", "C. Short annual leave entitlements", "D. Hotel shortages"], "answer": "C", "analysis": "文中点明障碍是年假：‘两周封顶的地方，慢旅行只是幻想’。A、D 未提及；B 与‘营销火热’只是转化受限于假期的逻辑不符。"}, {"id": "y6-r-050", "level": "CET6", "type": "阅读", "topic": "文化", "stem": "Historic quarters everywhere face the same arc: artists move in, cafes follow, then chains, then rents that expel the artists who lent the charm. City councils from Lisbon to Seoul have tried rent controls and artisan leases to freeze the arc in place. Success is partial at best; charm, it turns out, is hard to zone. Question: What have cities tried to do about their historic districts?", "options": ["A. Demolish the old quarters", "B. Ban cafes entirely", "C. Convert the quarters into offices", "D. Keep artisans in place through rent controls and leases"], "answer": "D", "analysis": "各城市尝试以租金管制与工匠租约留住原有人文生态。A、B、C 均与‘保护街区魅力’的意图相反。"}, {"id": "y6-r-051", "level": "CET6", "type": "阅读", "topic": "媒体", "stem": "Short-video feeds deliver a new clip every fifteen seconds, and attention researchers report a measurable cost: viewers abandon longer videos faster than five years ago. Correlation is not causation, the field cautions — but streaming platforms have quietly begun promoting 'slow' hour-long content again. Question: What have streaming platforms started doing?", "options": ["A. Promoting longer 'slow' content again", "B. Shortening all videos to seconds", "C. Removing research on attention", "D. Banning short videos outright"], "answer": "A", "analysis": "末句指出平台悄然重新推广一小时左右的‘慢’内容。B 与此举方向相反；C、D 为无中生有。"}, {"id": "y6-r-052", "level": "CET6", "type": "阅读", "topic": "媒体", "stem": "As advertisers chase social platforms, newsrooms lean harder on subscriptions — paywalls now guard most quality journalism. The risk is a two-tier public: those who pay stay informed, while others browse free fragments and rumor. Public libraries have become an unexpected bridge, lending free access to paywalled press with a library card. Question: What unintended role have libraries taken on?", "options": ["A. Buying newspapers for recycling", "B. Providing free access to paywalled journalism", "C. Writing their own news reports", "D. Hosting advertising platforms"], "answer": "B", "analysis": "文中说图书馆凭读者证免费提供付费墙媒体的访问，成为桥梁。A、C、D 均无依据。"}, {"id": "y6-r-053", "level": "CET6", "type": "阅读", "topic": "社会", "stem": "Community gardens convert vacant lots into vegetable plots, and the harvest is only partly edible. Studies of garden sites report lower neighborhood crime, more intergenerational contact, and measurable cooling of summer air. The vegetables, gardeners confess, are sometimes the smallest yield. Question: What point does the final sentence make?", "options": ["A. Vegetables are the gardens' only real value.", "B. Gardening is too difficult for most residents.", "C. The social and environmental benefits can outweigh the crops.", "D. Gardens should grow flowers instead of food."], "answer": "C", "analysis": "‘蔬菜有时是最小的收成’呼应前文：降犯罪、促交流、给街区降温才是主要产出。A 与句意相反；B、D 文中未提。"}, {"id": "y6-r-054", "level": "CET6", "type": "阅读", "topic": "社会", "stem": "Library-run smartphone classes for older adults fill within hours of being announced. The curriculum is humbler than coding: video calls with grandchildren, spotting scam texts, booking medical appointments. Instructors report that the first lesson is always confidence, not clicks. Question: According to instructors, what matters first in teaching seniors?", "options": ["A. Fast typing speed", "B. Free hardware for everyone", "C. Expensive specialized software", "D. Building confidence before technical skills"], "answer": "D", "analysis": "末句点明：第一课永远是建立信心而非操作。A、B、C 均与课程定位相反或无据。"}, {"id": "y6-r-055", "level": "CET6", "type": "阅读", "topic": "健康", "stem": "Antibiotic resistance — bacteria surviving the drugs designed to kill them — now contributes to millions of deaths a year. The pipeline of new antibiotics has slowed to a trickle, because new drugs are used sparingly and priced accordingly low, a poor business model. Publicly funded development prizes are one proposed fix. Question: Why have new antibiotics slowed to a trickle?", "options": ["A. Science has hit a permanent wall.", "B. Poor commercial returns discourage development.", "C. Doctors refuse to prescribe new drugs.", "D. Patients avoid taking antibiotics."], "answer": "B", "analysis": "文中解释：新抗生素被谨慎使用、定价随之走低，商业模式差导致研发停滞。A、C、D 均非文中给出的原因。"}, {"id": "y6-r-056", "level": "CET6", "type": "阅读", "topic": "经济", "stem": "The race to the bottom in garment pricing has repeatedly surfaced in factory disasters, and some exporting countries have responded with higher minimum wages and unannounced inspections. Brands now publish supplier lists they once guarded as secrets. Transparency, campaigners admit, has outrun accountability — knowing a factory's name is not the same as fixing its roof. Question: What limitation does the final sentence identify?", "options": ["A. Supplier lists are routinely falsified.", "B. Minimum wages are set too high.", "C. Publishing suppliers' names does not itself fix working conditions.", "D. Factory inspections are now banned."], "answer": "C", "analysis": "‘知道工厂名字不等于修好它的屋顶’，即透明度跑在了问责之前。A、D 无依据；B 与‘应对灾难’的背景矛盾。"}, {"id": "y6-r-057", "level": "CET6", "type": "阅读", "topic": "科技", "stem": "Solar storms can fry power grids, GPS signals, and airline radios, and space-weather forecasters watch the sun the way coastal cities watch hurricanes. The difficulty is lead time: the fastest particles arrive within minutes, leaving operators to react rather than prepare. Hardening infrastructure in advance, engineers argue, beats forecasting alone. Question: What do engineers argue for?", "options": ["A. Better hurricane prediction models", "B. More television satellites", "C. Hardening infrastructure in advance rather than relying on forecasts", "D. Retiring the power grid altogether"], "answer": "C", "analysis": "工程师主张‘预先加固基础设施胜过单靠预报’。A 类比混淆对象；B、D 与文意无关或荒谬。"}, {"id": "y6-r-058", "level": "CET6", "type": "阅读", "topic": "环境", "stem": "China's sponge cities program paves streets with permeable materials, restores wetlands, and gardens rooftops so that rain soaks in rather than flooding subways. Pilot districts have cut flood damage substantially, but scaling up faces a mundane obstacle: retrofitting old neighborhoods costs far more than building sponge features into new ones. Question: What obstacle does the sponge city program face in expanding?", "options": ["A. Permeable pavement is illegal", "B. Retrofitting older districts is costly", "C. Restored wetlands cause floods", "D. Rooftop gardens always leak"], "answer": "B", "analysis": "文中明说障碍是‘改造老旧街区远贵于新建时内置’。A、D 无据；C 与湿地吸纳雨水的功能相反。"}, {"id": "y6-r-059", "level": "CET6", "type": "阅读", "topic": "工作", "stem": "Countries that reserved part of parental leave for fathers — so-called daddy quotas — saw take-up leap when the leave became use-it-or-lose-it. Where leave is transferable, mothers take the overwhelming share, and employers quietly price the difference into hiring. Design, not slogans, changes behavior. Question: What increased fathers' take-up of parental leave?", "options": ["A. Non-transferable, use-it-or-lose-it quotas", "B. Longer maternity leave", "C. Cash bonuses alone", "D. Voluntary encouragement campaigns"], "answer": "A", "analysis": "‘不用即作废’的专属配额使父亲休假率跃升。B 与‘可转让时母亲占大头’的对比无关；C、D 与‘设计而非口号’的结论相悖。"}, {"id": "y6-r-060", "level": "CET6", "type": "阅读", "topic": "社会", "stem": "Dockless bike-share flooded cities, then receded: broken bikes littered sidewalks, and municipalities began capping fleet sizes and assigning parking zones. The equilibrium now emerging — fewer bikes, but better maintained and geofenced — is less dazzling and more durable than the original chaos. Question: What does the emerging equilibrium in bike-sharing look like?", "options": ["A. Unlimited fleets with no rules", "B. Smaller, better-maintained, geofenced fleets", "C. A total ban on shared bikes", "D. Only privately owned bicycles"], "answer": "B", "analysis": "新平衡是‘车更少、维护更好、电子围栏停放’。A 是被否定的原始混乱；C、D 与‘更可持续的新平衡’矛盾。"}, {"id": "y6-r-061", "level": "CET6", "type": "阅读", "topic": "媒体", "stem": "Influencer marketing now moves more advertising money than digital display ads among young audiences. Regulation lags the format: gifted products and paid posts often pass as ordinary opinions. Platforms have started enforcing disclosure labels, and fines for hidden advertising are rising. Question: What regulatory problem does influencer marketing face?", "options": ["A. Advertisements are too expensive", "B. Platforms ban all influencers", "C. Paid content often appears as genuine opinion without disclosure", "D. Young audiences ignore products online"], "answer": "C", "analysis": "文中指出监管滞后：付费内容常以‘普通观点’的面目出现。A 与媒介成本无关；B 与‘平台开始强制标注’不符；D 与‘广告投入更大’矛盾。"}, {"id": "y6-r-062", "level": "CET6", "type": "阅读", "topic": "文化", "stem": "Sign languages are full languages with their own grammar, not gestured English, linguists emphasize. Yet deaf children with cochlear implants increasingly attend mainstream schools, and some districts have cut sign programs entirely. Deaf associations argue the two paths should not be rivals — implants and signing can coexist. Question: What position do deaf associations take?", "options": ["A. Cochlear implants should be banned.", "B. Sign language should replace speech therapy.", "C. Mainstream schools are always preferable.", "D. Implants and sign language can coexist."], "answer": "D", "analysis": "聋人协会主张人工耳蜗与手语‘不应互为对手、可以共存’。A、B 均把两条路径对立，与文意相反；C 与‘部分学区砍掉手语课被质疑’的语境不符。"}, {"id": "y6-r-063", "level": "CET6", "type": "阅读", "topic": "教育", "stem": "Dyslexia affects roughly one in ten readers, but screening often waits until a child has already failed for years. Early phonics-based screening at age six is cheap, and interventions work best before reading avoidance hardens into identity. The gap, specialists say, is between what schools can test and what they choose to. Question: What do specialists emphasize about dyslexia?", "options": ["A. Early screening before failure compounds", "B. Dyslexia is extremely rare", "C. Interventions are useless after age eight", "D. Testing is too expensive to attempt"], "answer": "A", "analysis": "专家强调六岁筛查便宜且干预宜早。B 与‘约十分之一’矛盾；C 的‘八岁后无用’过于绝对；D 与‘筛查成本低廉’相反。"}, {"id": "y6-r-064", "level": "CET6", "type": "阅读", "topic": "健康", "stem": "Diabetes apps that log glucose and nudge patients toward better habits show real gains in trials — and poor retention in the real world. Patients abandon logs that demand minutes daily; the apps winning at scale ask for seconds, piggybacking on data that devices already collect. Question: What distinguishes the apps that succeed at scale?", "options": ["A. Rich daily questionnaires", "B. Minimal data demands, using what devices already collect", "C. Alarms prescribed by doctors", "D. Weekly phone calls from nurses"], "answer": "B", "analysis": "规模化成功的应用只需‘几秒钟’，并复用设备已有的数据。A 与‘日耗数分钟即被弃用’相反；C、D 文中未提及。"}, {"id": "y6-r-065", "level": "CET6", "type": "阅读", "topic": "健康", "stem": "Therapists report rising eco-anxiety, particularly among clients in their twenties. Counterintuitively, the most effective remedy is not reassurance but agency: joining local projects, however small, outperforms talk alone. Despair, clinicians note, thrives in isolation. Question: According to clinicians, what remedy works best for eco-anxiety?", "options": ["A. Avoiding climate news altogether", "B. Reassurance from family members", "C. Taking part in concrete local action", "D. Long-term medication"], "answer": "C", "analysis": "临床经验表明‘参与本地行动’的掌控感比单纯宽慰更有效。A、B 均为被否定的 reassurance 思路；D 文中未提及。"}, {"id": "y6-r-066", "level": "CET6", "type": "阅读", "topic": "旅行", "stem": "A large cruise ship can emit as much sulfur as millions of cars, a comparison the industry now counters with shore power and scrubbers. Port cities from Venice to Barcelona have capped ship numbers and pushed terminals away from historic centers. The seas, however, remain the least regulated part of the equation. Question: What does the final sentence imply?", "options": ["A. Ships are cleaner than cars overall", "B. Ports benefit greatly from cruise tourism", "C. Cars pollute more than ships", "D. Emissions at sea remain largely unregulated"], "answer": "D", "analysis": "末句指出‘海上仍是最缺乏监管的一环’，暗示公海排放失控。A、C 与开篇的硫排放对比矛盾；B 与‘港口城市限流外迁’的做法相悖。"}, {"id": "y6-r-067", "level": "CET6", "type": "阅读", "topic": "文化", "stem": "Immersive digital art — projected Van Goghs, walk-in Kandinskys — packs arenas and divides critics. Purists miss brushstrokes; defenders answer that a ticket costs a fraction of a flight to Amsterdam, and many visitors later seek out the originals. Both sides, notably, report long queues. Question: What argument do defenders of immersive exhibitions make?", "options": ["A. They are affordable previews that lead audiences to the originals", "B. Projections should replace museums", "C. Brushstrokes are irrelevant to art appreciation", "D. Museums are always empty"], "answer": "A", "analysis": "辩护者的理由：票价远低于飞往阿姆斯特丹，且许多观众随后会去看原作。B 为主张‘取代’，过于极端；C、D 无依据。"}, {"id": "y6-r-068", "level": "CET6", "type": "阅读", "topic": "工作", "stem": "The wave of resignations after the pandemic, HR analysts found, was less about laziness than renegotiation: workers traded pay for flexibility, and quit most often when employers ordered blanket returns to offices. Firms that offered genuine flexibility kept staff at markedly higher rates. Question: According to analysts, what most triggered resignations?", "options": ["A. Slightly higher wages elsewhere", "B. Forced returns to the office without flexibility", "C. Long commutes alone", "D. New retirement rules"], "answer": "B", "analysis": "分析显示辞职最常发生在‘强制全员返岗’之时，本质是重新谈判灵活性。A 与‘宁可用薪酬换灵活’矛盾；C、D 未提及。"}, {"id": "y6-r-069", "level": "CET6", "type": "阅读", "topic": "经济", "stem": "Young graduates once fled small towns for coastal megacities; e-commerce has begun reversing the flow. Selling hometown crafts and produce online pays urban salaries without urban rents. Local governments now race to add the missing ingredient — cold-chain logistics and fast broadband — that turns a trend into a living. Question: What are local governments investing in?", "options": ["A. Office towers in coastal megacities", "B. Subsidies for moving away", "C. Cold-chain logistics and broadband for online businesses", "D. Large shopping malls"], "answer": "C", "analysis": "文中指出政府竞相补上冷链物流与快速宽带。A、B 与‘返乡潮’的背景相反；D 未提及。"}, {"id": "y6-r-070", "level": "CET6", "type": "阅读", "topic": "科技", "stem": "Smartwatches record heart rhythms, sleep, and location continuously, a treasure trove for medicine — and for litigation: prosecutors have already subpoenaed fitness data in criminal cases. Health researchers celebrate the datasets; privacy scholars note that consent was signed, mostly unread, years ago. Question: What concern do privacy scholars raise about wearables?", "options": ["A. The watches are medically useless", "B. Athletes share too little data", "C. Battery life is too short", "D. Health data may end up in court, based on consent few people actually read"], "answer": "D", "analysis": "隐私学者担忧健康数据已被司法机关调取，而用户当年签字的授权大多未经细读。A 与‘医学宝库’的评价相反；B、C 与隐私议题无关。"}, {"id": "y6-r-071", "level": "CET6", "type": "阅读", "topic": "健康", "stem": "Heat waves now kill more people in some countries than hurricanes, and outdoor workers — roofers, farmhands, couriers — absorb the worst of it. A few states have drafted heat-specific workplace rules: shade, water, rest breaks. Enforcement is thin, and most places have no such rules at all. Question: What problem does the passage identify regarding heat protection?", "options": ["A. Hurricanes are more deadly than heat waves.", "B. Heat rules are weakly enforced or altogether absent.", "C. Workers refuse to take rest breaks.", "D. Roofers are paid too little to care."], "answer": "B", "analysis": "文中指出执法乏力、多数地区根本没有相关规则。A 与首句事实相反；C、D 文中未提及。"}, {"id": "y6-r-072", "level": "CET6", "type": "阅读", "topic": "媒体", "stem": "Open-access journals let anyone read papers free, funded by fees charged to authors instead of subscribers. Access has widened; so have predatory journals that will publish anything for a fee. Indexing services now blacklist the worst offenders. Question: What downside of the open-access model is mentioned?", "options": ["A. Predatory journals exploiting the author-pays model", "B. Readers being forced to pay subscription fees", "C. A general decline in readership", "D. Government censorship of papers"], "answer": "A", "analysis": "文中指出开放获取催生了‘给钱就发’的掠夺性期刊。B 与‘读者免费’相反；C、D 无依据。"}, {"id": "y6-r-073", "level": "CET6", "type": "阅读", "topic": "科技", "stem": "Demand for battery metals has pushed prospectors toward the Pacific seabed, where nodules rich in nickel and cobalt lie scattered like potatoes. Biologists warn that mining could erase species unknown to science; companies reply that land mining does far more damage. No commercial license has yet been granted. Question: What is the current status of deep-sea mining?", "options": ["A. It is fully operational worldwide.", "B. It has been permanently banned.", "C. No commercial permit has been issued yet.", "D. It takes place only in the Atlantic."], "answer": "C", "analysis": "末句明确指出‘尚未颁发任何商业许可’。A 与之矛盾；B 未提及禁令；D 与太平洋海域的描述不符。"}, {"id": "y6-r-074", "level": "CET6", "type": "阅读", "topic": "文化", "stem": "Home DNA kits have reunited adoptees with birth families and traced migration stories — and occasionally revealed that the father of record is not. Geneticists remind buyers that ancestry percentages are statistical estimates that shift with reference databases. The gift of a kit, ethicists add, is not a gift to oneself alone: relatives are implicated too. Question: What point do ethicists make about DNA test kits?", "options": ["A. They are too expensive for ordinary families.", "B. Results also affect relatives who never consented.", "C. Ancestry percentages are always exact.", "D. Adoptees should never use them."], "answer": "B", "analysis": "伦理学者指出：基因检测的礼物流向的不止本人，亲属也被卷入其中。A 未提及；C 与‘统计估计会变动’矛盾；D 过度推断。"}, {"id": "y6-r-075", "level": "CET6", "type": "阅读", "topic": "教育", "stem": "Schools that banned phones during lessons report calmer classrooms within a term. Students, initially furious, largely admit to relief — evidence, the bans' defenders say, that the devices were compulsive rather than essential. Detractors counter that phones are the calculator, dictionary, and camera of modern life. Question: According to defenders, what does the students' eventual relief show?", "options": ["A. Phone use was compulsive rather than necessary.", "B. Phones improve classroom focus.", "C. Students prefer year-round confiscation.", "D. Bans always harm academic results."], "answer": "A", "analysis": "支持者把学生后来如释重负引为证据：手机是‘强迫性’而非‘必需’。B 与禁令逻辑相反；C 的‘常年没收’无依据；D 是 detractors 的立场而非 defenders 的。"}, {"id": "y6-r-076", "level": "CET6", "type": "阅读", "topic": "环境", "stem": "A century of suppressing every wildfire left forests dense with fuel, turning occasional blazes into landscape-destroying infernos. Fire ecologists advocate prescribed burns: small, deliberate fires set in cool seasons. Smoke complaints and escaped-fire liability make officials wary, even as the alternative grows worse. Question: Why are prescribed burns hard to implement?", "options": ["A. They are the same as wild infernos.", "B. Ecologists oppose them.", "C. They are illegal everywhere.", "D. Smoke complaints and liability risks make officials cautious."], "answer": "D", "analysis": "文中指出烟雾投诉与‘跑火’追责令官员心存顾虑。A 曲解‘计划烧除’；B 与‘生态学家倡导’相反；C 无依据。"}, {"id": "y6-r-077", "level": "CET6", "type": "阅读", "topic": "文化", "stem": "As stations consolidate, community radio persists by serving what giants ignore: local election results in dialect, high-school sports, lost pets. Advertising barely covers the electricity; the true currency is volunteers, many past retirement. When a station goes dark, its town loses more than music. Question: What does the final sentence suggest about a station's closure?", "options": ["A. The town loses its electrical supply.", "B. The town loses a community voice, beyond music.", "C. Fewer lost pets will be found.", "D. Advertising becomes cheaper."], "answer": "B", "analysis": "‘失去的不止音乐’呼应全文：社区电台承载地方选举、体育与邻里互助的声音。A 是字面曲解；C、D 均为细枝末节的反向推断。"}, {"id": "y6-r-078", "level": "CET6", "type": "阅读", "topic": "科技", "stem": "Cultivated meat, grown from animal cells in bioreactors, has cleared regulatory hurdles in two countries and remains a science project everywhere else. The technology works; the economics do not — a kilogram still costs many times the farmed equivalent. Investors now fund scale-up, betting the cost curve bends as it did for solar panels. Question: What is the main barrier to cultivated meat?", "options": ["A. Regulatory bans in every country", "B. Unproven safety of the technology", "C. Consumer complaints about taste", "D. Production costs remain far too high"], "answer": "D", "analysis": "文中说‘技术可行，经济不可行’——每公斤成本仍数倍于养殖肉。A 与‘两国已获批’矛盾；B 与‘技术可行’相反；C 未提及。"}, {"id": "y6-r-079", "level": "CET6", "type": "阅读", "topic": "社会", "stem": "Car-sharing schemes — hourly rentals parked around the neighborhood — claim to take private cars off the road: each shared vehicle, studies suggest, replaces a dozen owned ones. The catch is discipline: members who mistreat rentals raise costs for everyone, and cities that hand out parking spots carelessly clog the very streets they meant to clear. Question: What threatens the benefits of car sharing?", "options": ["A. Falling membership numbers", "B. Rising private car ownership", "C. Misuse by members and careless parking policies", "D. Unreliable vehicle technology"], "answer": "C", "analysis": "威胁有二：会员糟蹋车辆抬高成本，城市滥划车位反而堵路。A、B 与‘一辆共享车替代十几辆私车’的积极数据矛盾；D 未提及。"}, {"id": "y6-r-080", "level": "CET6", "type": "阅读", "topic": "工作", "stem": "Software that scores job candidates' facial expressions and voice tone has been marketed as bias-free screening. Audits found the opposite: the models penalized accents and nervous tics, replicating the very bias they promised to remove. Several jurisdictions have since restricted emotion recognition in hiring. Question: What did audits reveal about emotion-recognition hiring tools?", "options": ["A. They reproduced the bias they claimed to eliminate.", "B. They screened out accents successfully.", "C. They cut recruitment costs sharply.", "D. They were approved in every jurisdiction."], "answer": "A", "analysis": "审计发现模型惩罚口音与紧张的小动作，复制了本应消除的偏见。B 是对‘惩罚口音’的反向曲解；C、D 与‘多地已限制使用’的事实矛盾。"}, {"id": "y6-c-001", "level": "CET6", "type": "完形", "topic": "社会", "stem": "The dam was hailed as an engineering triumph, yet within a decade its reservoir had ___ dozens of villages and displaced thousands. Officials promised compensation, but many families are still waiting. Choose the best word for the blank.", "options": ["A. decorated", "B. surveyed", "C. submerged", "D. purchased"], "answer": "C", "analysis": "水库蓄水会淹没村庄，submerged 意为‘淹没’。decorated 装饰、surveyed 勘测、purchased 购买，均与水库造成居民搬迁的因果不符。"}, {"id": "y6-c-002", "level": "CET6", "type": "完形", "topic": "工作", "stem": "When the CEO's memo leaked, employees ___ between relief and anxiety. Some welcomed the transparency; others read it as a warning of layoffs. Choose the best word for the blank.", "options": ["A. hesitated", "B. oscillated", "C. retreated", "D. colluded"], "answer": "B", "analysis": "员工在宽慰与焦虑之间摇摆，oscillated 意为‘摇摆、波动’，与 between ... and 呼应。hesitated 犹豫（不定式搭配）；retreated 撤退；colluded 勾结，均不合语境。"}, {"id": "y6-c-003", "level": "CET6", "type": "完形", "topic": "健康", "stem": "The vaccine rollout faced an unexpected ___: rural clinics had the doses but not the freezers to store them. Engineers retrofitted beer coolers as a stopgap. Choose the best word for the blank.", "options": ["A. hurdle", "B. bonus", "C. shortcut", "D. banquet"], "answer": "A", "analysis": "有疫苗而无冷库是‘障碍’，hurdle 意为‘难关、障碍’。bonus 红利、shortcut 捷径、banquet 宴会，均与冒号后的困境解释不符。"}, {"id": "y6-c-004", "level": "CET6", "type": "完形", "topic": "文化", "stem": "Audiences initially ___ at the three-hour runtime, yet word of mouth turned the film into a sleeper hit. Its director insisted that not a single scene be cut. Choose the best word for the blank.", "options": ["A. flocked", "B. rejoiced", "C. volunteered", "D. balked"], "answer": "D", "analysis": "观众起初对三小时片长望而却步，balked at 意为‘对…畏缩不前’，与 yet 转折后才成为黑马的逻辑一致。flocked 蜂拥而至、rejoiced 欢欣，均与‘起初’的保留态度矛盾；volunteered 自告奋勇，搭配不当。"}, {"id": "y6-c-005", "level": "CET6", "type": "完形", "topic": "文化", "stem": "Archaeologists dated the coins with remarkable ___, narrowing the burial to within a single decade. Such precision is rare for frontier sites. Choose the best word for the blank.", "options": ["A. precision", "B. hesitation", "C. abundance", "D. secrecy"], "answer": "A", "analysis": "后文‘这样的精确度在边疆遗址很少见’直接提示空白处填 precision（精确）。hesitation 犹豫、abundance 丰富、secrecy 保密，均无法由下文复现。"}, {"id": "y6-c-006", "level": "CET6", "type": "完形", "topic": "经济", "stem": "The startup's pitch was slick, but the numbers did not ___ under scrutiny; investors soon uncovered inflated user counts. Choose the best word for the blank.", "options": ["A. show off", "B. take off", "C. hold up", "D. pay off"], "answer": "C", "analysis": "hold up under scrutiny 意为‘经得起审查’，与‘随后发现用户数据注水’呼应。show off 炫耀；take off 起飞；pay off 回报，均不合‘数据经不起细看’的语义。"}, {"id": "y6-c-007", "level": "CET6", "type": "完形", "topic": "环境", "stem": "The city's air quality has improved ___ since the coal plants switched to natural gas; hospital admissions for asthma have fallen accordingly. Choose the best word for the blank.", "options": ["A. marginally", "B. markedly", "C. scarcely", "D. allegedly"], "answer": "B", "analysis": "哮喘住院随之下降说明改善显著，markedly 意为‘显著地’。marginally 略微地、scarcely 几乎不，程度不足；allegedly 据称，与可核实的住院数据不符。"}, {"id": "y6-c-008", "level": "CET6", "type": "完形", "topic": "教育", "stem": "Rather than dictate answers, the tutor ___ questions back to the students, forcing them to defend their own reasoning. Choose the best word for the blank.", "options": ["A. suppressed", "B. collected", "C. ignored", "D. deflected"], "answer": "D", "analysis": "导师把问题‘反弹’回去，deflected 意为‘使转向、弹回’，与 rather than dictate answers 的教学方式一致。suppressed 压制、ignored 无视，与启发式教学相反；collected 收集，语义不搭。"}, {"id": "y6-c-009", "level": "CET6", "type": "完形", "topic": "社会", "stem": "The peace treaty was signed with great ___, but implementing it proved far harder than drafting it. Choose the best word for the blank.", "options": ["A. ceremony", "B. hesitation", "C. urgency", "D. reluctance"], "answer": "A", "analysis": "with great ceremony 意为‘仪式隆重地’，与‘起草易、落实难’的反差呼应。hesitation 犹豫、reluctance 勉强与‘郑重签署’矛盾；urgency 紧迫，搭配不当。"}, {"id": "y6-c-010", "level": "CET6", "type": "完形", "topic": "环境", "stem": "Salmon farming eased pressure on wild stocks but created a new problem: parasites thrive in the crowded net pens and ___ to passing wild fish. Choose the best word for the blank.", "options": ["A. confine", "B. return", "C. spread", "D. yield"], "answer": "C", "analysis": "密集网箱滋生的寄生虫会向游经的野生鱼传播，spread 意为‘蔓延、传播’。confine 限制（方向相反）；return 返回；yield 让步/产出，均不合疾病传播的语境。"}, {"id": "y6-c-011", "level": "CET6", "type": "完形", "topic": "媒体", "stem": "Journalists who report on organized crime often work under police protection; their sources risk ___ if identities leak. Choose the best word for the blank.", "options": ["A. promotion", "B. retaliation", "C. applause", "D. subsidy"], "answer": "B", "analysis": "报道有组织犯罪的记者一旦线人身份泄露，线人面临报复，retaliation 意为‘报复’。promotion 晋升、applause 喝彩、subsidy 补贴，均与黑恶势力泄密的危险无关。"}, {"id": "y6-c-012", "level": "CET6", "type": "完形", "topic": "文化", "stem": "The manuscript survived fire, flood, and two wars, remarkably ___ for a document six centuries old. Choose the best word for the blank.", "options": ["A. fragile", "B. illegible", "C. obsolete", "D. intact"], "answer": "D", "analysis": "历经火灾洪水与战乱仍保存完好，intact 意为‘完好无损的’。fragile 易碎的、illegible 无法辨认的、obsolete 过时的，均与‘幸存’的语境矛盾。"}, {"id": "y6-c-013", "level": "CET6", "type": "完形", "topic": "社会", "stem": "During the week-long blackout, neighbors who had never spoken ___ generators, candles, and phone chargers without being asked. Choose the best word for the blank.", "options": ["A. shared", "B. hoarded", "C. sold", "D. stole"], "answer": "A", "analysis": "素不相识的邻居主动共享物资，shared 意为‘分享’，与‘无需请求’的互助精神一致。hoarded 囤积、sold 出售、stole 偷窃，均与守望相助的氛围相反。"}, {"id": "y6-c-014", "level": "CET6", "type": "完形", "topic": "科技", "stem": "The professor warned that the theory, however elegant, remains ___ without independent replication. Choose the best word for the blank.", "options": ["A. proven", "B. obsolete", "C. unverified", "D. celebrated"], "answer": "C", "analysis": "未经独立重复验证的理论仍是‘未证实的’，unverified 与 without independent replication 呼应。proven 已证实的，与 without 矛盾；obsolete 过时的；celebrated 广受赞誉的，均不合学术审慎逻辑。"}, {"id": "y6-c-015", "level": "CET6", "type": "完形", "topic": "工作", "stem": "As the deadline approached, the team's initial enthusiasm gave way to ___ fatigue; several members worked through the night to finish. Choose the best word for the blank.", "options": ["A. virtual", "B. mounting", "C. fading", "D. mutual"], "answer": "B", "analysis": "交稿日临近，疲劳不断累积，mounting 意为‘渐增的’，与 as the deadline approached 的时间推进一致。fading 消退的（方向相反）；virtual 虚拟的；mutual 相互的，均不合语境。"}, {"id": "y6-c-016", "level": "CET6", "type": "完形", "topic": "文化", "stem": "The gallery acquired the painting at auction, unaware that its ___ would be challenged in court a year later. Choose the best word for the blank.", "options": ["A. price", "B. beauty", "C. frame", "D. provenance"], "answer": "D", "analysis": "画作来源遭法庭质疑，provenance 意为‘（艺术品的）来历、流传出处’，是拍卖与诉讼的核心概念。price 价格可查、beauty 外观、frame 画框，均不会被法庭挑战一年之久。"}, {"id": "y6-c-017", "level": "CET6", "type": "完形", "topic": "经济", "stem": "Some economists argue that inflation, once ___ into expectations, becomes far harder to bring down. Choose the best word for the blank.", "options": ["A. baked", "B. broken", "C. banned", "D. borrowed"], "answer": "A", "analysis": "be baked into 为经济学惯用表达，意为‘（通胀）固化进预期’。broken into 闯入；banned into 搭配不存在；borrowed into 亦无此用法，均不合语义。"}, {"id": "y6-c-018", "level": "CET6", "type": "完形", "topic": "经济", "stem": "The new bridge cut the commute in half, and property values on the far bank ___ accordingly within two years. Choose the best word for the blank.", "options": ["A. stagnated", "B. plummeted", "C. climbed", "D. fluctuated"], "answer": "C", "analysis": "通勤时间减半，对岸房价随之上涨，climbed 与 accordingly 的因果一致。stagnated 停滞、plummeted 暴跌，与利好消息相反；fluctuated 波动，不能体现趋势性上涨。"}, {"id": "y6-c-019", "level": "CET6", "type": "完形", "topic": "社会", "stem": "In his memoir, the diplomat ___ over the decision he calls 'the mistake of a career' — a single sentence in a telegram. Choose the best word for the blank.", "options": ["A. glances", "B. lingers", "C. skips", "D. lies"], "answer": "B", "analysis": "linger over 意为‘反复思量、久久停留’，外交家对终生憾事反复咀嚼。glances over 粗略扫过；skips over 跳过，均与‘悔恨’的心情矛盾；lies over 非固定搭配。"}, {"id": "y6-c-020", "level": "CET6", "type": "完形", "topic": "环境", "stem": "Wildlife corridors let animals ___ highways safely, reconnecting habitats fragmented by roads. Choose the best word for the blank.", "options": ["A. avoid", "B. abandon", "C. inspect", "D. cross"], "answer": "D", "analysis": "生态廊道让动物安全穿过公路，cross 意为‘横穿’，与 reconnecting habitats 呼应。avoid 绕开公路则无需廊道；abandon 抛弃；inspect 检查，均不合逻辑。"}, {"id": "y6-t-001", "level": "CET6", "type": "翻译", "topic": "教育", "stem": "请选择最佳译句：随着互联网的普及，在线教育已成为许多大学生活中不可或缺的一部分。", "options": ["A. With the popularization of the Internet, online education has become an indispensable part of many college students' lives.", "B. As the Internet popularizes, online education became an indispensable part for many university student's life.", "C. The Internet being popular, online education becomes a part that cannot lack in many college students' lives.", "D. With the Internet popularizing, online education has become an indispensable part in the life of many college student."], "answer": "A", "analysis": "A 项 with 独立主格引出背景、时态（has become）与‘已成为’匹配、part of 搭配地道，为最佳。B 项 became 时态错误且 student's 所有格单复数混乱；C 项 'a part that cannot lack' 中式直译且不合语法；D 项 many college student 单复数错误。"}, {"id": "y6-t-002", "level": "CET6", "type": "翻译", "topic": "科技", "stem": "请选择最佳译句：毫无疑问，人工智能将在未来的医疗领域发挥越来越重要的作用。", "options": ["A. There is no doubt that artificial intelligence will act as an important role in the medical area in future.", "B. Artificial intelligence no doubt will act as a more and more important role in medical field in the future.", "C. There is no doubt that artificial intelligence will play an increasingly important role in the field of healthcare in the future.", "D. It is no doubt that artificial intelligence is playing more and more significant function of the medical field."], "answer": "C", "analysis": "C 项 There is no doubt that 句型正确，play a role in 搭配地道，increasingly important 比 more and more 更书面。A、B 项 act as a role 搭配错误（应为 play a role），B 项语序亦欠妥；D 项 It is no doubt 应用 There is no doubt，且 function of 搭配错误。"}, {"id": "y6-t-003", "level": "CET6", "type": "翻译", "topic": "环境", "stem": "请选择最佳译句：只有当人们充分认识到环境保护的重要性，才能实现可持续发展。", "options": ["A. Only when people fully realize the importance of environmental protection, sustainable development can be achieved.", "B. Only when people realized fully the importance of environmental protection, can they achieve sustainable development.", "C. Only when people fully realize how important is the environmental protection, sustainable development can be realized.", "D. Only when people fully realize the importance of environmental protection can sustainable development be achieved."], "answer": "D", "analysis": "‘只有…才…’译为 only when 且 only 置于句首时主句须部分倒装，D 项倒装正确、语序自然。A、C 项未倒装；B 项 realized fully 语序不当且前后主语混乱（people 与 they）；C 项还犯了宾语从句 how important is 疑问语序的错误。"}, {"id": "y6-t-005", "level": "CET6", "type": "翻译", "topic": "社会", "stem": "请选择最佳译句：近几年来，越来越多的城市开始重视历史建筑的保护与再利用。", "options": ["A. In recent years, more and more cities began to pay attention to the protection and reuse of historic buildings.", "B. In recent years, a growing number of cities have begun to value the protection and reuse of historic buildings.", "C. In the recent years, more and more cities begin to attach importance to protect and reuse historic buildings.", "D. Recently, a growing number of cities has begun to emphasize protecting and reusing historic buildings."], "answer": "B", "analysis": "‘近几年来’的持续影响要求现在完成时，B 项 have begun 正确，a growing number of 比 more and more 更书面。A 项 began 时态错误；C 项 begin 时态错误且 attach importance to 后应接动名词；D 项主语 a growing number of cities 为复数，has begun 主谓不一致。"}, {"id": "y6-c-021", "level": "CET6", "type": "完形", "topic": "工作", "stem": "The negotiation dragged on for hours, but neither side showed any sign of ___; both delegations refused to budge on the tariff question. Choose the best word for the blank.", "options": ["A. celebration", "B. concession", "C. promotion", "D. expansion"], "answer": "B", "analysis": "双方都不肯让步，concession 意为‘让步’。celebration 庆祝、promotion 晋升、expansion 扩张，均与‘谈判僵持’的语境不符。"}, {"id": "y6-c-022", "level": "CET6", "type": "完形", "topic": "环境", "stem": "City planners chose hardy tree species that could ___ both drought and salt spray along the coastal boulevard. Choose the best word for the blank.", "options": ["A. surrender to", "B. examine", "C. deny", "D. withstand"], "answer": "D", "analysis": "沿海大道的树种须耐旱并耐盐雾，withstand 意为‘经受住、耐受’。surrender to 屈服于；examine 检查；deny 否认，均不合选种的逻辑。"}, {"id": "y6-c-023", "level": "CET6", "type": "完形", "topic": "社会", "stem": "The charity has its accounts audited and published annually, a gesture of ___ toward its donors. Choose the best word for the blank.", "options": ["A. gratitude", "B. transparency", "C. authority", "D. urgency"], "answer": "B", "analysis": "账目审计并公开是对捐赠者的‘透明’姿态，transparency 意为‘透明度’。gratitude 感激（与审计公开的行为不直接对应）；authority 权威；urgency 紧迫，均不合语境。"}, {"id": "y6-c-024", "level": "CET6", "type": "完形", "topic": "文化", "stem": "The chef insists on sourcing ingredients locally even when imports would be cheaper; freshness, she argues, cannot be ___. Choose the best word for the blank.", "options": ["A. tolerated", "B. delegated", "C. compromised", "D. enlarged"], "answer": "C", "analysis": "新鲜度不容妥协，compromise 意为‘折中、损害’。tolerate 容忍；delegate 委派；enlarge 扩大，均不能与 freshness 构成‘不可被牺牲’的语义。"}, {"id": "y6-c-025", "level": "CET6", "type": "完形", "topic": "文化", "stem": "The young author's first novel was ___ ignored, but her second won a major national prize. Choose the best word for the blank.", "options": ["A. universally", "B. scarcely", "C. randomly", "D. superficially"], "answer": "A", "analysis": "处女作遭到‘普遍’忽视，universally 意为‘普遍地’，与 but 之后的获奖形成反差。scarcely 几乎不（表‘几乎没有被忽视’，语义颠倒）；randomly 随机地；superficially 肤浅地，均不合逻辑。"}, {"id": "y6-c-026", "level": "CET6", "type": "完形", "topic": "健康", "stem": "Doctors stress that the two conditions, though similar in symptoms, call for ___ different treatments. Choose the best word for the blank.", "options": ["A. identically", "B. similarly", "C. entirely", "D. loosely"], "answer": "C", "analysis": "症状相似但治疗‘完全’不同，entirely different 强调差异之大。identically 与 similarly（相同地/相似地）与 different 逻辑矛盾；loosely 松散地，语义不搭。"}, {"id": "y6-c-027", "level": "CET6", "type": "完形", "topic": "社会", "stem": "Rather than punish the whistle-blower, the board voted to ___ her and review her complaint in full. Choose the best word for the blank.", "options": ["A. ignore", "B. demote", "C. expel", "D. commend"], "answer": "D", "analysis": "董事会决定表彰吹哨人并彻查其投诉，commend 意为‘表扬’。ignore 无视、demote 降职、expel 开除，均与 rather than punish 的正向转向矛盾。"}, {"id": "y6-c-028", "level": "CET6", "type": "完形", "topic": "科技", "stem": "The bridge's steel cables are inspected weekly; even a single ___ strand triggers an alarm and a lane closure. Choose the best word for the blank.", "options": ["A. frayed", "B. polished", "C. welded", "D. painted"], "answer": "A", "analysis": "钢缆‘磨损起毛’会触发警报，frayed 意为‘磨损的’。polished 抛光的、welded 焊接的、painted 涂漆的，均不构成安全警报的理由。"}, {"id": "y6-c-029", "level": "CET6", "type": "完形", "topic": "工作", "stem": "During the product launch crunch, the office doubled as a dormitory: the founders ___ on sofas for three weeks straight. Choose the best word for the blank.", "options": ["A. filed", "B. camped", "C. traded", "D. hosted"], "answer": "B", "analysis": "创始人在沙发上‘打地铺’三周，camp 意为‘露营、临时安顿’，camped on sofas 生动贴切。file 归档；trade 交易；host 接待，均不合语境。"}, {"id": "y6-c-030", "level": "CET6", "type": "完形", "topic": "科技", "stem": "The lecture hall fell silent as the researcher ___ the first images returned by the deep-space probe. Choose the best word for the blank.", "options": ["A. postponed", "B. concealed", "C. deleted", "D. unveiled"], "answer": "D", "analysis": "研究人员‘公布’探测器传回的首批图像，unveil 意为‘揭幕、首次公开’。postpone 推迟、conceal 隐瞒、delete 删除，均与现场安静期待的氛围矛盾。"}, {"id": "y6-l-001", "level": "CET6", "type": "听力", "topic": "工作", "stem": "Transcript: M: Did you manage to book the seminar room for Thursday? W: Thursday's fully booked, but Friday afternoon is open. M: Friday works — the guest speaker can only come after three anyway. Question: When will the seminar be held?", "options": ["A. Thursday morning", "B. Thursday afternoon", "C. Friday afternoon", "D. Friday morning"], "answer": "C", "analysis": "女士说周四订满、周五下午有空，男士确认 Friday works，故研讨会在周五下午。A、B 与‘周四已订满’矛盾；D 的上午与‘演讲人三点以后才有空’不符。"}, {"id": "y6-l-002", "level": "CET6", "type": "听力", "topic": "环境", "stem": "Transcript: W: I thought the recycling pickup was on Tuesdays. M: It used to be, but since March they come every other Monday. W: That explains why our bins were missed this week. Question: How often is recycling collected now?", "options": ["A. Every two weeks on Mondays", "B. Every Tuesday", "C. Twice a week", "D. Every day"], "answer": "A", "analysis": "every other Monday 意为‘每隔一个周一’，即每两周一次。B 是旧安排；C、D 曲解频率。"}, {"id": "y6-l-003", "level": "CET6", "type": "听力", "topic": "文化", "stem": "Transcript: M: The museum's free night has moved to the first Saturday of the month. W: Good to know — I'll bring my niece this Saturday then; she's been wanting to see the dinosaur exhibit. Question: What will the woman probably do this Saturday?", "options": ["A. Visit the new library", "B. Take her niece to the museum", "C. Work an extra shift", "D. Attend a concert"], "answer": "B", "analysis": "女士说这个周六要带侄女去看恐龙展。A、C、D 均与对话内容无关。"}, {"id": "y6-l-004", "level": "CET6", "type": "听力", "topic": "社会", "stem": "Transcript: A city council report recommends extending the tram line to the airport by 2028. Construction, if approved this autumn, would take about three years, with service expected before the summer travel season of 2028. Question: When could airport tram service begin?", "options": ["A. This autumn", "B. In three months", "C. By next summer", "D. Before summer 2028"], "answer": "D", "analysis": "独白明确说‘预计 2028 年夏季旅游季前通车’。A 是可能获批的时间；B、C 与三年工期和 2028 年的节点矛盾。"}, {"id": "y6-l-005", "level": "CET6", "type": "听力", "topic": "教育", "stem": "Transcript: W: Professor Lee's office hours are fully booked this week. M: Try the writing center — they help with structure even for literature essays. W: I will; the draft is due Friday. Question: What does the man suggest the woman do?", "options": ["A. Get help at the writing center", "B. Change her essay topic", "C. Hand in her draft late", "D. Email the professor a draft"], "answer": "A", "analysis": "男士建议去写作中心（Try the writing center）。B、C、D 对话中均未提及。"}, {"id": "y6-l-006", "level": "CET6", "type": "听力", "topic": "工作", "stem": "Transcript: M: Have you seen my badge? I can't get into the lab without it. W: Check the lost-and-found at reception — someone turned in a badge this morning. Question: What does the woman imply?", "options": ["A. The man should buy a new badge", "B. The badge may have been handed in at reception", "C. She has taken the badge", "D. The lab is closed today"], "answer": "B", "analysis": "女士提到今早有人上交了一枚徽章，暗示他的工牌可能就在前台失物招领处。A 与‘可能已找到’的暗示相反；C、D 无依据。"}, {"id": "y6-l-007", "level": "CET6", "type": "听力", "topic": "健康", "stem": "Transcript: The health clinic will be closed for renovations from the fifth to the nineteenth of next month. During the closure, patients should visit the Riverside clinic on Miller Street; prescriptions can be collected at any pharmacy. Question: Where should patients go during the closure?", "options": ["A. The campus pharmacy", "B. Miller Pharmacy", "C. The Riverside clinic", "D. The hospital emergency room"], "answer": "C", "analysis": "独白明确指引进Miller街的 Riverside clinic。B 项 Miller Pharmacy 把街名与药房混淆；A、D 均非指定替代地点。"}, {"id": "y6-l-008", "level": "CET6", "type": "听力", "topic": "经济", "stem": "Transcript: W: I'd like to return this kettle — it stopped heating after a week. M: No problem. Do you have the receipt? W: Only the online order confirmation on my phone. M: That's fine; a refund will reach your card within five working days. Question: How will the woman get her money back?", "options": ["A. Cash at the register", "B. Store credit only", "C. A check by mail", "D. A refund to her bank card"], "answer": "D", "analysis": "男士说退款将在五个工作日内退回她的银行卡（reach your card）。A、B、C 均与对话中的退款方式不符。"}, {"id": "y6-l-009", "level": "CET6", "type": "听力", "topic": "旅行", "stem": "Transcript: M: Did you catch the weather for tomorrow's hike? W: The forecast says sunny in the morning but thunderstorms after two. M: Then let's start at dawn and be off the ridge by noon. Question: What is the speakers' plan?", "options": ["A. Set out early and finish before noon", "B. Cancel the hike entirely", "C. Hike only in the afternoon", "D. Postpone it to next weekend"], "answer": "A", "analysis": "男士提议‘黎明出发、正午前下山’以避开下午的雷雨。B、C、D 与对话中的安排矛盾。"}, {"id": "y6-l-010", "level": "CET6", "type": "听力", "topic": "文化", "stem": "Transcript: The library's rare manuscripts room will reopen on the third of May, with extended hours on Wednesdays until nine. Weekend visits still require booking a slot online at least 48 hours ahead. Question: What must visitors do to enter the manuscripts room on a Saturday?", "options": ["A. Arrive before nine o'clock", "B. Book a slot online at least two days in advance", "C. Join a guided tour only", "D. Pay an entrance fee"], "answer": "B", "analysis": "周末参观须至少提前 48 小时（两天）在线预约。A 的九点是周三延时开放时间；C、D 未提及。"}, {"id": "y6-l-011", "level": "CET6", "type": "听力", "topic": "工作", "stem": "Transcript: W: The team meeting moved from three to four, right? M: Actually it's pushed to tomorrow morning at ten — the client's flight was delayed. Question: When is the team meeting now?", "options": ["A. At three today", "B. At four today", "C. At ten tomorrow morning", "D. Tomorrow afternoon"], "answer": "C", "analysis": "男士纠正：会议改到明天上午十点。A、B 是被否定的旧时间；D 与‘上午十点’不符。"}, {"id": "y6-l-012", "level": "CET6", "type": "听力", "topic": "社会", "stem": "Transcript: M: Are you walking to the conference or taking the metro? W: The metro line's closed for maintenance this weekend. M: Then let's share a taxi — splitting the fare, it's cheaper than parking downtown. Question: How will the speakers get to the conference?", "options": ["A. On foot", "B. By metro", "C. By driving their own car", "D. By taxi together"], "answer": "D", "analysis": "地铁停运后两人决定合乘出租车。A 未提及步行方案；B 与‘线路关闭’矛盾；C 与‘比市区停车便宜’的比较矛盾。"}, {"id": "y6-l-013", "level": "CET6", "type": "听力", "topic": "社会", "stem": "Transcript: City officials announced that water mains on Oak Street will be flushed Sunday night between ten and six, so residents may notice temporary discoloration. The water remains safe, and taps should run clear by Monday morning. Question: What are Oak Street residents told about the discolored water?", "options": ["A. It is safe to use", "B. It must be boiled first", "C. It should be reported at once", "D. It signals contamination"], "answer": "A", "analysis": "公告明确说明‘水质仍然安全’。B、C、D 均与官方安抚的口径相反。"}, {"id": "y6-l-014", "level": "CET6", "type": "听力", "topic": "工作", "stem": "Transcript: W: I've finished the survey analysis, but the charts look messy. M: The template on the shared drive might help — Jane designed one last quarter. Question: What does the man recommend?", "options": ["A. Redoing the entire survey", "B. Using a chart template from the shared drive", "C. Asking Jane to analyze the data", "D. Deleting the charts"], "answer": "B", "analysis": "男士建议使用共享盘上 Jane 设计的图表模板。A、C、D 均非对话中的建议。"}, {"id": "y6-l-015", "level": "CET6", "type": "听力", "topic": "社会", "stem": "Transcript: M: Did the courier leave my parcel with the neighbor? W: There's a note saying it's at the pickup point on King's Road, behind the bakery. Question: Where is the man's parcel?", "options": ["A. With his neighbor", "B. At the bakery counter", "C. At the pickup point on King's Road", "D. At the main post office"], "answer": "C", "analysis": "便条写明包裹在 King's Road 的自提点。A 与‘没有留在邻居家’矛盾；B 把‘面包店后面’曲解为面包店柜台；D 未提及。"}, {"id": "y6-l-016", "level": "CET6", "type": "听力", "topic": "教育", "stem": "Transcript: The scholarship covers full tuition and a monthly stipend, but not accommodation. Applications close on the fifteenth; interviews follow in early June for shortlisted candidates. Question: What does the scholarship NOT cover?", "options": ["A. Tuition fees", "B. A monthly stipend", "C. Travel to interviews", "D. Accommodation costs"], "answer": "D", "analysis": "独白明确说‘不含住宿’。A、B 均在覆盖范围内；C 未提及且并非资助项目内容。"}, {"id": "y6-l-017", "level": "CET6", "type": "听力", "topic": "教育", "stem": "Transcript: W: The workshop on time management was fully booked before I even saw the email. M: They're repeating it next Wednesday lunchtime — smaller room, same speaker. Question: What does the man say about the workshop?", "options": ["A. It will be offered again next Wednesday", "B. It has been cancelled", "C. It requires a new speaker", "D. It will move to a bigger room"], "answer": "A", "analysis": "男士说下周三午间会加开一场。B 与‘重复开讲’矛盾；C 与‘同一位讲者’相反；D 与‘更小的房间’相反。"}, {"id": "y6-l-018", "level": "CET6", "type": "听力", "topic": "工作", "stem": "Transcript: M: Should I print the handouts for the seminar — thirty copies? W: The attendance list has fifteen names now — three people dropped out yesterday. Question: How many copies should be printed?", "options": ["A. Thirty", "B. Fifteen", "C. Eighteen", "D. Ten"], "answer": "B", "analysis": "名单现有十五人（十八人减去退出的三人），按名单打印十五份。A 是最初的估计；C 忽略了三人退出；D 与名单数字不符。"}, {"id": "y6-l-019", "level": "CET6", "type": "听力", "topic": "旅行", "stem": "Transcript: Attention, passengers on the delayed 14:40 service to Leeds: the platform has changed from 6 to 9, and the train now departs at 15:05. We apologize for the inconvenience. Question: What time does the Leeds train now leave?", "options": ["A. 14:40", "B. 14:45", "C. 15:05", "D. 15:40"], "answer": "C", "analysis": "广播明确说现在 15:05 发车。A 是原定时间；B、D 为干扰数字。"}, {"id": "y6-l-020", "level": "CET6", "type": "听力", "topic": "科技", "stem": "Transcript: W: My laptop keeps restarting every few minutes. M: Could be the recent update. Try restoring yesterday's settings before bringing it in. W: I'll try that tonight. Question: What does the man advise the woman to do first?", "options": ["A. Buy a new laptop", "B. Uninstall all her programs", "C. Bring it to the shop immediately", "D. Restore the previous settings"], "answer": "D", "analysis": "男士建议先‘恢复到昨天的设置’试试。C 与 before bringing it in 的先后顺序矛盾；A、B 未提及。"}, {"id": "yi-r-001", "level": "IELTS", "type": "阅读", "topic": "动物", "stem": "Passage excerpt: 'A third of global food crops depend at least partly on insect pollination, and studies show that wild bees pollinate many flowers more efficiently than managed honeybee colonies.' Question: Managed honeybees pollinate flowers more efficiently than wild bees. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "B", "analysis": "原文明确指出野生蜂对许多花卉的传粉效率高于饲养的蜜蜂群，题干把比较关系颠倒了，与原文直接矛盾，选 FALSE。若题干与原文一致应选 TRUE；若原文根本未比较两者效率则选 NOT GIVEN。"}, {"id": "yi-r-002", "level": "IELTS", "type": "阅读", "topic": "科技", "stem": "Passage excerpt: 'Vertical farms in Japan can achieve lettuce yields up to one hundred times greater per square metre than open fields, since crops grow in stacked layers under artificial light.' Question: Vertical farming can produce far more food per unit of area than conventional farming. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "A", "analysis": "原文说垂直农场每平方米的生菜产量可达露天种植的一百倍，'单位面积产量远高于传统农业'正是原文的重述，选 TRUE。若原文说产量更低才选 FALSE；若原文未提产量对比则选 NOT GIVEN。"}, {"id": "yi-r-003", "level": "IELTS", "type": "阅读", "topic": "动物", "stem": "Passage excerpt: 'Humpback whale songs evolve as males borrow elements from neighbouring populations, and researchers track these changes to map cultural exchange between ocean basins.' Question: Humpback whales use signature whistles to identify individual animals. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "C", "analysis": "原文只讨论座头鲸歌曲的演变与文化传递，从未提及'特征哨声'这种识别个体的机制，属于原文未涉及的信息，选 NOT GIVEN。选 TRUE 需原文明确支持，选 FALSE 需原文明确反驳，此处两者都没有。"}, {"id": "yi-r-004", "level": "IELTS", "type": "阅读", "topic": "历史", "stem": "Passage excerpt: 'Scientists studying Roman harbours discovered that lime clasts in seawater concrete react with water to form crystals that seal newly formed cracks automatically.' Question: Roman seawater concrete could seal its own cracks without human repair. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "A", "analysis": "原文指出混凝土中的石灰颗粒遇水生成晶体、自动封填新裂缝，'无需人工修复即可自行封闭裂缝'与文意一致，选 TRUE。若原文说需要人工修补才选 FALSE；若未提裂缝则选 NOT GIVEN。"}, {"id": "yi-r-005", "level": "IELTS", "type": "阅读", "topic": "环境", "stem": "Passage excerpt: 'The International Seabed Authority has issued dozens of exploration licences for polymetallic nodules, but its rules for commercial deep-sea mining have not yet been finalised.' Question: Regulations permitting commercial deep-sea mining have already been approved. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "B", "analysis": "原文明确说商业开采规则'尚未最终确定'，题干却说'已获批准'，与原文直接矛盾，选 FALSE。若原文说规则已通过则选 TRUE；若只发执照而完全不谈规则状态才可能选 NOT GIVEN，此处原文有明确表述。"}, {"id": "yi-r-006", "level": "IELTS", "type": "阅读", "topic": "历史", "stem": "Passage excerpt: 'Along the Silk Road, silk travelled west while glass, silver and horses moved east, and Buddhist manuscripts were carried by monks between oasis towns.' Question: The average journey along the Silk Road took about two years. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "C", "analysis": "原文只介绍丝绸之路上货物流向与手稿的传播，完全没有提及旅程所需时间，属于原文未给出的信息，选 NOT GIVEN。做此类题只能依据原文：原文没有的内容既不能判定 TRUE 也不能判定 FALSE。"}, {"id": "yi-r-007", "level": "IELTS", "type": "阅读", "topic": "环境", "stem": "Passage excerpt: 'Migratory birds navigate partly by starlight, and brightly lit skyscrapers disorient them; a Chicago study found that switching off decorative lighting during migration seasons significantly reduced bird collisions.' Question: Artificial city lighting can disorient migrating birds. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "A", "analysis": "原文说强光会让迁徙鸟类迷失方向，芝加哥的研究还证明熄灯能减少撞击，题干是原文的直接重述，选 TRUE。若原文说灯光对鸟类无影响才选 FALSE；若未讨论灯光则选 NOT GIVEN。"}, {"id": "yi-r-008", "level": "IELTS", "type": "阅读", "topic": "环境", "stem": "Passage excerpt: 'Underwater noise from commercial shipping has roughly doubled every decade in some ocean regions, masking the low-frequency calls that whales use to communicate.' Question: Ocean noise levels have remained stable in recent decades. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "B", "analysis": "原文说某些海域的航运噪声每十年约翻一番，题干说噪声水平'保持稳定'，与原文矛盾，选 FALSE。'每十年翻番'与'稳定'互斥；若原文未提噪声变化趋势则应选 NOT GIVEN。"}, {"id": "yi-r-009", "level": "IELTS", "type": "阅读", "topic": "交通", "stem": "Passage excerpt: 'After Stockholm introduced its congestion charge in 2006, inner-city traffic fell by around twenty per cent, and a subsequent referendum voted to keep the scheme permanently.' Question: Stockholm's congestion charge reduced traffic in the city centre. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "A", "analysis": "原文明确指出收费后市中心交通量下降约两成，题干与原文一致，选 TRUE。若原文说交通量上升或不变得选 FALSE；若只介绍收费而不给交通数据才选 NOT GIVEN。"}, {"id": "yi-r-010", "level": "IELTS", "type": "阅读", "topic": "交通", "stem": "Passage excerpt: 'In Copenhagen, sixty-two per cent of residents commute to work or school by bicycle, supported by an expanding network of cycle superhighways.' Question: The number of cyclists injured in Copenhagen has fallen since the superhighways opened. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "C", "analysis": "原文只给出骑车通勤比例和自行车高速路网络的信息，未提及任何交通事故或伤亡数据，选 NOT GIVEN。做 TFNG 题时不能凭常识推断安全性的变化，只能依据原文是否明确陈述。"}, {"id": "yi-r-011", "level": "IELTS", "type": "阅读", "topic": "环境", "stem": "Passage excerpt: 'Desalination plants across the Gulf region supply fresh water to millions, but they discharge hypersaline brine that can smother coastal seagrass meadows.' Question: The brine released by desalination plants is less salty than ordinary seawater. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "B", "analysis": "原文说排放的是'高盐卤水'，即比海水更咸，题干说'比海水盐度低'，与原文矛盾，选 FALSE。若原文说卤水盐度与海水相同则不构成矛盾；若根本未提卤水盐度才选 NOT GIVEN。"}, {"id": "yi-r-012", "level": "IELTS", "type": "阅读", "topic": "环境", "stem": "Passage excerpt: 'Satellite measurements reveal that northern India is losing groundwater faster than any other region on Earth, largely because farmers pump water for irrigation.' Question: Irrigation is the main reason for groundwater loss in northern India. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "A", "analysis": "原文用'largely because'指出灌溉是地下水流失的主因，题干与原文一致，选 TRUE。若原文把主因归于城市用水或工业才选 FALSE；若只给流失速度而不解释原因则选 NOT GIVEN。"}, {"id": "yi-r-013", "level": "IELTS", "type": "阅读", "topic": "城市", "stem": "Passage excerpt: 'Los Angeles has begun coating selected streets with a light-coloured reflective material in an effort to lower surface temperatures in heat-prone neighbourhoods.' Question: The reflective coating used in Los Angeles costs less than ordinary asphalt. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "C", "analysis": "原文只说明涂层的用途（反射阳光、降低地表温度），完全没有比较涂层与普通沥青的成本，选 NOT GIVEN。题干引入的'价格更低'是原文没有的信息，不能凭主观判断为 TRUE 或 FALSE。"}, {"id": "yi-r-014", "level": "IELTS", "type": "阅读", "topic": "环境", "stem": "Passage excerpt: 'Roughly one third of all food produced for human consumption is lost or wasted, and this waste is responsible for an estimated eight to ten per cent of global greenhouse gas emissions.' Question: Food waste accounts for more than half of global greenhouse gas emissions. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "B", "analysis": "原文说食物浪费约占全球温室气体排放的百分之八到十，题干说'超过一半'，数字被夸大到与原文矛盾的程度，选 FALSE。注意：只要原文给出了明确数据而题干数据与之相抵触，就应选 FALSE 而不是 NOT GIVEN。"}, {"id": "yi-r-015", "level": "IELTS", "type": "阅读", "topic": "科技", "stem": "Passage excerpt: 'The price of a laboratory-grown hamburger fell from roughly $330,000 in 2013 to under $10 for prototype products by 2023, thanks to advances in cell culture techniques.' Question: The cost of producing cultured meat has fallen dramatically over the past decade. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "A", "analysis": "原文给出从 33 万美元降到 10 美元以内的对比，'成本大幅下降'是对该数据的合理同义转述，选 TRUE。若原文说价格停滞或上涨则选 FALSE；若未给任何价格信息才选 NOT GIVEN。"}, {"id": "yi-r-016", "level": "IELTS", "type": "阅读", "topic": "科技", "stem": "Passage excerpt: 'Black soldier fly larvae can convert tonnes o
