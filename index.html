eld. Question: How is the man's surname spelled?", "options": ["A. W-H-I-T-F-I-E-L-D", "B. W-H-I-T-F-E-I-L-D", "C. W-H-I-T-T-F-I-E-L-D", "D. W-H-Y-T-F-I-E-L-D"], "answer": "A", "analysis": "男士拼读为 W-H-I-T-F-I-E-L-D，选 A。B 把 ie 颠倒为 ei，是拼写题经典陷阱；C 多了一个 T；D 把 Whit 换成 Whyt。拼写题需逐个字母与读音对照，尤其留意 i/e 顺序与双写字母。"}, {"id": "yi-l-013", "level": "IELTS", "type": "听力", "topic": "科学", "stem": "Section 3 (discussion). Transcript: M: Our measurements look odd—the control tank shows more growth than the treated one. W: Could the lamps have been closer to the control side? M: Good point. Light intensity wasn't something we controlled. Question: What do the students suspect caused the unexpected results?", "options": ["A. The plants in both tanks were diseased.", "B. The measuring instruments were incorrectly calibrated.", "C. Unequal lighting between the two tanks.", "D. The treatment solution had expired."], "answer": "C", "analysis": "女生提出'灯是否离对照组更近'，男生承认没有控制光照强度，因此可疑变量是两侧光照不均，对应 C 项。A 的病害、B 的校准、D 的试剂过期均未提及。"}, {"id": "yi-l-014", "level": "IELTS", "type": "听力", "topic": "动物", "stem": "Section 4 (lecture). Transcript: 'Urban bees face a patchwork landscape: parks offer rich forage in bursts, while flowerless office districts create food deserts. Researchers found colonies in bee-friendly neighbourhoods stored more pollen and reared more offspring, suggesting city planning directly shapes pollinator health.' Question: What does the lecturer conclude about urban bees?", "options": ["A. Urban planning affects the health of bee colonies.", "B. City bees are healthier than rural bees in all respects.", "C. Bees should be banned from city centres.", "D. Office districts provide the best food sources."], "answer": "A", "analysis": "讲者由证据（蜜源友好街区蜂群储粉更多、育幼更多）得出结论：城市规划直接影响传粉者健康，选 A。B 过度推断（未与农村全面比较）；C 无中生有；D 与'无花办公区是食物荒漠'相反。"}, {"id": "yi-l-015", "level": "IELTS", "type": "听力", "topic": "科技", "stem": "Section 1 (conversation). Transcript: W: My laptop keeps switching itself off, even when the battery shows half full. M: Hmm—when did it start? W: Right after I installed the video-editing software. M: That software is demanding; the fan may be clogged with dust, so the machine overheats and shuts down to protect itself. Question: What is the likely cause of the problem?", "options": ["A. A faulty battery that no longer holds charge.", "B. The laptop is overheating, possibly due to a blocked fan.", "C. The screen inverter is failing.", "D. The software deleted her personal files."], "answer": "B", "analysis": "技师判断是散热问题：风扇积灰导致过热、机器自动关机保护，选 B。'电池显示一半电量'排除了 A；C、D 均未提及。因果关系链：装大型软件→高负载→风扇积灰→过热→关机。"}, {"id": "yi-l-016", "level": "IELTS", "type": "听力", "topic": "社会", "stem": "Section 1 (conversation, number detail). Transcript: M: Do you have the booking reference? W: Yes, it's C-7-2-9-4-8. M: C-7-2-9... W: 4-8. Yes, that's it. Question: What is the complete booking reference?", "options": ["A. C72984", "B. C72849", "C. C72948", "D. C79248"], "answer": "C", "analysis": "女士逐位拼出 C-7-2-9-4-8，即 C72948，选 C。A 把 4 与 8 前后互换；B 颠倒了 9、4、8 的顺序；D 交换了 2 与 9。听数字串时应边听边默写，核对时注意相邻易混数字。"}, {"id": "yi-l-017", "level": "IELTS", "type": "听力", "topic": "历史", "stem": "Section 4 (lecture). Transcript: 'Coffee arrived in Europe in the seventeenth century, and the first coffee houses quickly became centres of trade news—merchants gathered there to exchange information about ship arrivals and prices long before newspapers printed it.' Question: According to the lecturer, early European coffee houses functioned as:", "options": ["A. informal hubs for trading information.", "B. government tax collection offices.", "C. training schools for baristas.", "D. warehouses for storing beans."], "answer": "A", "analysis": "原文说咖啡馆成为'贸易新闻的中心'，商人在报纸刊印之前就在此交换船只到港与价格信息，即'非正式的信息交易枢纽'，选 A。B、C、D 均无中生有；D 混淆了'交换消息'与'存放货物'。"}, {"id": "yi-l-018", "level": "IELTS", "type": "听力", "topic": "历史", "stem": "Section 2 (tour guide). Transcript: 'We're now standing in the old ropewalk, where hemp rope for ships was twisted by hand. You'll notice it's over 300 metres long—the length a single rope had to reach. On your right, the crane house is being restored, so regrettably it's closed to visitors this season.' Question: What does the guide say visitors cannot do?", "options": ["A. Enter the crane house, which is under restoration.", "B. Walk the full length of the ropewalk.", "C. Watch rope being twisted by hand.", "D. Photograph the harbour from the quay."], "answer": "A", "analysis": "导游说右边的起重机房正在修复，'本季不向游客开放'，选 A。B 与'沿绳道行走'的参观安排相反；C 未被禁止；D 未提及。"}, {"id": "yi-l-019", "level": "IELTS", "type": "听力", "topic": "教育", "stem": "Section 3 (discussion). Transcript: W: I can only find blog posts about my topic—nothing academic. M: Have you tried the library's subject databases? You can filter for peer-reviewed journals there. W: I didn't know we had access to those. M: Log in with your student ID—the workshop on Thursday covers the basics too. Question: What does the man suggest the woman use?", "options": ["A. A general internet search engine.", "B. The library's peer-reviewed subject databases.", "C. Printed encyclopaedias in the reading room.", "D. Blog posts written by field researchers."], "answer": "B", "analysis": "男士的核心建议是使用图书馆的'学科数据库并筛选同行评审期刊'，选 B。A 恰是她现在无效的做法；C 未提及；D 是她遇到的困难而非建议。周四的工作坊只是补充信息。"}, {"id": "yi-l-020", "level": "IELTS", "type": "听力", "topic": "交通", "stem": "Section 2 (announcement, time detail). Transcript: 'The 14:05 service to Carlisle will now depart from Platform 6 rather than Platform 2, and it has been retimed to 14:20 due to signalling work. Passengers for intermediate stations should note the connecting bus at Preston leaves at 16:45.' Question: At what time will the Carlisle train now leave?", "options": ["A. 14:05", "B. 16:45", "C. 14:02", "D. 14:20"], "answer": "D", "analysis": "广播明确说发车时间由 14:05 改为 14:20，选 D。14:05 是原时间；16:45 是普雷斯顿接驳巴士的时间；14:02 是把站台号 2 拼进时间的干扰。时间题要区分'原时间/新时间'与'火车/巴士'两套信息。"}, {"id": "yi-l-021", "level": "IELTS", "type": "听力", "topic": "教育", "stem": "Section 4 (lecture). Transcript: 'Contrary to the view of play as mere recreation, developmental psychologists argue that pretend play is where children first rehearse self-regulation—negotiating roles, waiting for turns and suppressing impulses are all practised long before formal schooling begins.' Question: What is the lecturer's main argument about pretend play?", "options": ["A. It trains self-regulation skills before formal education starts.", "B. It wastes time that could be spent on early literacy.", "C. It should be replaced by structured drilling.", "D. It only benefits children with siblings."], "answer": "A", "analysis": "讲者用 'Contrary to...' 表明立场：假装游戏不是单纯娱乐，而是儿童最早练习自我调节（协商角色、轮流、克制冲动）的场所，选 A。B、C 与讲者的正面评价相反；D 的'独生子女'限定无中生有。"}, {"id": "yi-l-022", "level": "IELTS", "type": "听力", "topic": "社会", "stem": "Section 1 (conversation). Transcript: M: The rent is £680 a month, which covers water and internet, but you'll need to set up your own electricity account. The building also has a laundry room in the basement. Question: What is included in the rent?", "options": ["A. Electricity and water", "B. Water and internet", "C. Internet and electricity", "D. All utilities plus laundry tokens"], "answer": "B", "analysis": "原文说房租包含'水费和上网费'，电费需自行开户，选 B。A、C 都把不含的电费算入；D 的'全部公用事业＋洗衣代币'与 'set up your own electricity account' 矛盾。洗衣房是公共设施，但题干问的是租金包含项目。"}, {"id": "yi-l-023", "level": "IELTS", "type": "听力", "topic": "交通", "stem": "Section 2 (radio announcement). Transcript: 'On Sunday morning, Harbor Road will be closed from the roundabout to the marina between six and eleven for the city marathon. Diversions will be signposted, and the park-and-ride service will run every ten minutes instead of the usual twenty.' Question: Why is the road closure necessary?", "options": ["A. Resurfacing works on the roundabout.", "B. A film production on the marina.", "C. The city marathon on Sunday morning.", "D. Annual maintenance of the park-and-ride."], "answer": "C", "analysis": "公告说明 Harbor Road 周日上午封闭的原因是'city marathon'，选 C。A 的重铺路面、B 的电影拍摄均未提及；D 把增频的 park-and-ride 误当作封路原因。因果细节题要抓 'for + 原因'。"}, {"id": "yi-l-024", "level": "IELTS", "type": "听力", "topic": "社会", "stem": "Section 2 (monologue, number detail). Transcript: 'For the litter-picking event we need at least fifteen volunteers per shift, though last year only twelve turned up for the afternoon one. This year we have twenty-two confirmed for the morning already.' Question: How many volunteers are needed for each shift?", "options": ["A. Twelve", "B. Twenty-two", "C. Thirty", "D. Fifteen"], "answer": "D", "analysis": "原文说'每个班次需要至少 15 人'，选 D。12 是去年下午班实到人数；22 是今年上午已确认人数；30 无中生有。数字题需区分'需要的人数/实到人数/已确认人数'三类。"}, {"id": "yi-l-025", "level": "IELTS", "type": "听力", "topic": "历史", "stem": "Section 4 (lecture). Transcript: 'Roman aqueducts maintained a gradient of roughly one part in four thousand—so gentle that water moved silently, without the erosion that steeper channels cause. Surveyors achieved this precision over dozens of kilometres using simple instruments: chorobates and gromas.' Question: What does the lecturer emphasise about Roman aqueducts?", "options": ["A. Their extremely gentle, precisely maintained gradient.", "B. Their use of pumped pressure to move water uphill.", "C. The speed at which the water travelled.", "D. Their reliance on imported engineers."], "answer": "A", "analysis": "讲者强调约 1:4000 的极缓坡度，水因而安静流动、不侵蚀渠道，且测量员凭简单仪器在数十公里内维持这一精度，选 A。B 的'泵压上山'与重力输水相反；C 强调的是'安静'而非'速度'；D 无中生有。"}, {"id": "yi-l-026", "level": "IELTS", "type": "听力", "topic": "教育", "stem": "Section 3 (discussion). Transcript: W: I've looked at your methodology chapter. The sample of thirty is workable, but you don't explain how you selected participants. M: They're students from my halls of residence. W: That's convenience sampling—you'll need to acknowledge it as a limitation. Question: What does the supervisor point out?", "options": ["A. The sampling method is convenience sampling and should be acknowledged as a limitation.", "B. The sample is too small to analyse at all.", "C. The participants should have been strangers.", "D. The methodology chapter should be deleted."], "answer": "A", "analysis": "导师指出'从自己宿舍选人'属于便利抽样，并要求在论文中承认为局限，选 A。B 与 'sample of thirty is workable' 相反；C、D 均未提及。考点是学术术语 convenience sampling 与 limitation 的对应。"}, {"id": "yi-l-027", "level": "IELTS", "type": "听力", "topic": "健康", "stem": "Section 1 (conversation). Transcript: W: I keep getting headaches in the afternoon. M: Do you drink much coffee? W: Three or four cups before noon. M: Try cutting to one, and sip water through the day—caffeine withdrawal and dehydration are common triggers. Come back in a fortnight if it persists. Question: What does the pharmacist advise?", "options": ["A. To stop drinking coffee immediately and completely.", "B. To take prescription painkillers every afternoon.", "C. To reduce caffeine and drink more water.", "D. To see an eye doctor about her vision."], "answer": "C", "analysis": "药剂师建议把咖啡减到一杯并在白天持续补水，指出咖啡因与脱水是常见诱因，选 C。A 的'立即完全戒断'过于绝对（是'减到一杯'）；B、D 均未提及。"}, {"id": "yi-l-028", "level": "IELTS", "type": "听力", "topic": "教育", "stem": "Section 3 (discussion, date detail). Transcript: M: My draft is due on the 5th of November, but I've had a family emergency. W: You can apply for a five-day extension—that takes it to the 10th. M: And if I need longer? W: Then it goes to the extensions committee, which meets on the 12th. Question: What is the new deadline if the extension is granted?", "options": ["A. The 5th of November", "B. The 12th of November", "C. The 15th of November", "D. The 10th of November"], "answer": "D", "analysis": "五天延期把截止日期从 5 日推到 10 日，选 D。5 日是原截止日；12 日是委员会会议日期（仅在需更长期限时相关）；15 日无中生有。日期推算题要边听边做加法。"}, {"id": "yi-l-029", "level": "IELTS", "type": "听力", "topic": "健康", "stem": "Section 4 (lecture). Transcript: 'Schools near flight paths report a pattern: reading comprehension scores dip during take-off hours and recover once planes stop. Laboratory work corroborates this—tasks requiring recall of word lists are measurably slower under aircraft noise, though simple arithmetic seems unaffected.' Question: What did the laboratory studies find?", "options": ["A. All cognitive tasks are slowed equally by aircraft noise.", "B. Aircraft noise has no measurable effect on any task.", "C. Word-list recall slows under aircraft noise, but simple arithmetic is largely unaffected.", "D. Students near flight paths score higher than average."], "answer": "C", "analysis": "实验室研究的结果是：飞机噪声下'词汇表回忆明显变慢'，但'简单算术似乎不受影响'，C 完整对应两点。A 的'所有任务同等变慢'与算术不受影响矛盾；B 与回忆变慢矛盾；D 与阅读分数下降相反。"}, {"id": "yi-l-030", "level": "IELTS", "type": "听力", "topic": "交通", "stem": "Section 2 (monologue). Transcript: 'From this month, every bicycle kept on campus must be registered—free of charge—at the security office. Registered frames are etched with a serial number, which has cut theft at other universities by half. Unregistered bikes left in racks after exams will be removed.' Question: What will happen to unregistered bicycles left after exams?", "options": ["A. They will be sold at auction.", "B. They will be given to charity shops.", "C. They will be confiscated and their owners fined £50.", "D. They will be removed by the university."], "answer": "D", "analysis": "原文最后一句明确：'考试后留在车架上的未注册自行车将被移走'，选 D。A 的拍卖、B 的捐赠、C 的 50 英镑罚款均未提及。注册免费、刻号防盗是背景信息，不是本题所问。"}, {"id": "yi-l-031", "level": "IELTS", "type": "听力", "topic": "教育", "stem": "Section 3 (discussion). Transcript: M: Shall we split the presentation—you take the historical background, I'll do the case studies? W: Actually, the brief says the analysis section carries the most marks, so maybe we should work on that together. M: Fair enough—we'll each draft a background chapter, then combine them into the analysis. Question: What do the speakers decide?", "options": ["A. To collaborate on the high-value analysis section.", "B. To divide the work into two separate halves.", "C. To present only the case studies.", "D. To ask for an extension on the presentation."], "answer": "A", "analysis": "女生指出'分析部分占分最高'，两人决定共同完成该部分，选 A。B 的'各分一半'是最初提议、最终被否；C、D 均未提及。听力对话题要注意'提议—修正—最终决定'的推进。"}, {"id": "yi-l-032", "level": "IELTS", "type": "听力", "topic": "社会", "stem": "Section 1 (conversation, spelling detail). Transcript: M: And your delivery address? W: Flat 4, 28 Larchmont Avenue—that's L-A-R-C-H-M-O-N-T. M: Larchfield, was it? W: No—Larchmont, like the tree. Question: How is the street name spelled?", "options": ["A. L-A-R-C-H-F-I-E-L-D", "B. L-A-R-C-H-M-O-N-T", "C. L-A-T-C-H-M-O-N-T", "D. L-A-R-C-H-M-O-U-N-T"], "answer": "B", "analysis": "女士拼读并纠正了男士的误听：L-A-R-C-H-M-O-N-T（'像那种树一样'），选 B。A 是男士的误听 Larchfield；C 把 R 换成 T；D 在结尾多了 U。拼写题务必听清纠正式对话的最终版本。"}, {"id": "yi-l-033", "level": "IELTS", "type": "听力", "topic": "历史", "stem": "Section 4 (lecture). Transcript: 'Shackleton's Endurance sank in 1915, yet the expedition is remembered as a triumph of leadership: after months drifting on ice, he sailed a small boat 1,300 kilometres to South Georgia and returned to rescue every one of his stranded men.' Question: Why does the lecturer call the expedition a triumph?", "options": ["A. Because the ship reached the South Pole first.", "B. Because valuable minerals were discovered.", "C. Because all the crew members were eventually rescued.", "D. Because the ship survived the ice undamaged."], "answer": "C", "analysis": "讲者称其为领导力的胜利：乘小艇 1300 公里到南乔治亚岛后返回，救回'每一名'被困船员，选 C。A 与'船沉没、目标失败'的背景不符；B 无中生有；D 与 sank in 1915 矛盾。"}, {"id": "yi-l-034", "level": "IELTS", "type": "听力", "topic": "经济", "stem": "Section 1 (conversation). Transcript: M: Insurance claims department. W: I want to claim for a laptop damaged during a flight last week. M: Do you have the baggage tag and the damage report from the airline? W: I kept the tag, but nobody at the airport gave me a report. M: Without that report we can't process the claim—I'd suggest contacting the airline's customer relations today. Question: What does the man tell the woman to do first?", "options": ["A. Post the damaged laptop for inspection.", "B. Contact the airline's customer relations to obtain the damage report.", "C. Pay an excess fee before the claim starts.", "D. Submit photos of her boarding pass."], "answer": "B", "analysis": "缺少航空公司的损坏报告就无法理赔，男士建议'今天就联系航司客服关系部门'，选 B。A 的寄检、C 的自付额、D 的登机牌照片均未提及。流程类听力要抓 'first/without...can't' 的先后与条件关系。"}, {"id": "yi-l-035", "level": "IELTS", "type": "听力", "topic": "动物", "stem": "Section 2 (zoo announcement). Transcript: 'Please note that the penguin feeding has moved from 2 p.m. to 3:30, to match the birds' natural activity peak. The sea lion show continues twice daily, at 11 and 4, as before.' Question: What has changed at the zoo?", "options": ["A. The sea lion show now runs three times a day.", "B. The penguin feeding has been moved to a later time.", "C. The zoo now closes earlier in winter.", "D. The penguin enclosure is closed for cleaning."], "answer": "B", "analysis": "公告只宣布一处变化：企鹅喂食从下午 2 点改到 3:30，以配合其自然活动高峰，即'推迟'，选 B。海狮秀'照旧'每天 11 点与 4 点两场，排除 A；C、D 均未提及。"}, {"id": "yi-l-036", "level": "IELTS", "type": "听力", "topic": "经济", "stem": "Section 2 (news item, number detail). Transcript: 'Season tickets on the coastal line will rise by an average of four per cent from April, slightly below last year's increase of six per cent. Off-peak fares, however, will be frozen at current levels.' Question: By how much will season tickets rise?", "options": ["A. Six per cent", "B. Ten per cent", "C. Zero per cent", "D. Four per cent"], "answer": "D", "analysis": "季票平均上涨 4%，选 D。6% 是去年涨幅；0% 是'非高峰票价冻结'，属张冠李戴；10% 无中生有。百分比题要区分'今年/去年'与'季票/非高峰票价'两组对照。"}, {"id": "yi-l-037", "level": "IELTS", "type": "听力", "topic": "健康", "stem": "Section 4 (lecture). Transcript: 'Children recognise brand logos before they can read, and studies show cartoon characters on packaging raise a product's perceived taste rating among five-year-olds. Several countries now restrict such characters on foods high in sugar, treating them as advertising to an audience that cannot critically evaluate it.' Question: Why do some countries restrict cartoon characters on sugary food packaging?", "options": ["A. Because the characters increase shipping costs.", "B. Because young children cannot critically evaluate the advertising.", "C. Because the cartoons are protected by copyright.", "D. Because packaging designs confuse parents."], "answer": "B", "analysis": "原文的政策理由是：卡通形象面向的是'无法批判性评估广告的受众'，即低龄儿童，选 B。A 的物流成本、C 的版权、D 的'让父母困惑'均未提及；考点在 'an audience that cannot critically evaluate it' 的同义转换。"}, {"id": "yi-l-038", "level": "IELTS", "type": "听力", "topic": "教育", "stem": "Section 3 (discussion). Transcript: W: I understood the lectures, but the exam questions ask me to choose which test to apply—I never know. M: The drop-in statistics clinic runs Tuesday afternoons. W: I went once; it was packed and I barely got five minutes. M: Book the online slots then—they open Fridays at noon and go fast. Question: What does the man recommend in the end?", "options": ["A. Attending the crowded Tuesday clinic without booking.", "B. Dropping the statistics module altogether.", "C. Booking one of the online slots released on Fridays.", "D. Hiring a private tutor for exam revision."], "answer": "C", "analysis": "对话的最终建议是'预约每周五中午开放的网络时段'，选 C。A 是已被否定的做法（拥挤、只有五分钟）；B、D 均未提及。注意 'in the end' 类题要选最后确定的方案，而非先前的失败尝试。"}, {"id": "yi-l-039", "level": "IELTS", "type": "听力", "topic": "社会", "stem": "Section 1 (conversation). Transcript: M: Lost property office, how can I help? W: I think I left a blue umbrella on the 42 bus this morning. M: Anything distinctive about it? W: It has a wooden handle with a small brass duck carved on it. M: Let me check... yes, one was handed in at about 11. You can collect it with photo ID. Question: How can the woman identify her umbrella?", "options": ["A. It is the only blue umbrella on the bus.", "B. It has a wooden handle with a small brass duck.", "C. Her name is printed on the canopy.", "D. It folds into a matching blue sleeve."], "answer": "B", "analysis": "女士描述伞的特征是'木柄上刻有一只小铜鸭'，这也是失物招领处的辨识依据，选 B。A 的'唯一'无从得知；C 的姓名、D 的收纳套均未提及。"}, {"id": "yi-l-040", "level": "IELTS", "type": "听力", "topic": "交通", "stem": "Section 1 (conversation, time detail). Transcript: M: Your flight BA-417 is now scheduled to arrive at 22:40, forty minutes later than planned, because of a late departure from Madrid. The last airport express bus leaves at 23:15, so you should still catch it if the flight isn't further delayed. Question: What is the new arrival time of the flight?", "options": ["A. 22:00", "B. 23:15", "C. 21:40", "D. 22:40"], "answer": "D", "analysis": "航班新的到达时间是 22:40，比原计划晚 40 分钟（原为 22:00），选 D。23:15 是末班机场大巴时间；21:40 是'提前 40 分钟'的错误推算。时间题要区分'到达/发车'与'新旧时间'。"}]};

function loadVoices(){try{_voices=speechSynthesis.getVoices()||[];_vReady=true;}catch(e){}}

function pickVoice(lang){if(!_voices.length)return null;
  const norm=s=>String(s||'').toLowerCase().replace('_','-');
  // 1) 精确匹配 en-US（兼容 en_US 写法）
  let v=_voices.find(x=>norm(x.lang)==='en-us');if(v)return v;
  // 2) 美式优先：en-US / en-CA(加拿大接近美式)
  v=_voices.find(x=>/^en[-_]?(us|ca)/i.test(x.lang||''));if(v)return v;
  // 3) 任意英语中排除英式/澳式/印度式/新西兰式
  const en=_voices.filter(x=>(x.lang||'').toLowerCase().startsWith('en'));
  if(en.length){const nb=en.find(x=>!/en[-_]?(gb|uk|au|nz|in)/i.test(x.lang));return nb||en[0];}
  // 4) 关键：找不到任何英文语音时返回 null —— 绝不回退到中文语音，
  //    否则会强制用中文引擎读英文（"shiwuth"问题的根源）
  return null;}
/* 把文本转成更自然的发音形式（解决 TTS 把 15th 读成 'fifteenth' 而不是 'one five th' 等问题） */
function oralize(t){
  if(!t)return t;
  const ones=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
  const tens=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
  const O=['th','st','nd','rd','th','th','th','th','th','th'];
  function num2words(n){
    if(n<20)return ones[n];
    if(n<100)return tens[Math.floor(n/10)]+(n%10?'-'+ones[n%10]:'');
    if(n<1000)return ones[Math.floor(n/100)]+' hundred'+(n%100?' '+num2words(n%100):'');
    return String(n);
  }
  function ordinal(n){
    if(n<20)switch(n){case 1:return 'first';case 2:return 'second';case 3:return 'third';case 4:return 'fourth';case 5:return 'fifth';case 8:return 'eighth';case 9:return 'ninth';case 11:return 'eleventh';case 12:return 'twelfth';case 13:return 'thirteenth';default:return ones[n]+(O[n%10]||'th');}
    // n >= 20: keep higher place words, convert only the last digit
    let parts=num2words(n).replace(/-/g,' ').split(' ');
    parts.pop();
    const m=n%10;
    let last;
    if(m===0){
      if(n<100){let w=tens[n/10];return w.replace(/y$/,'iet')+'h';}
      return num2words(n).replace(/-/g,' ')+'th';
    }else if(m===1)last='first';
    else if(m===2)last='second';
    else if(m===3)last='third';
    else if(m===5)last='fifth';
    else if(m===8)last='eighth';
    else if(m===9)last='ninth';
    else last=ones[m]+'th';
    parts.push(last);
    return parts.join(' ');
  }
  return t.replace(/\b(\d{1,3})(st|nd|rd|th)\b/g,(m,n)=>ordinal(Number(n)))
          .replace(/([a-zA-Z])-([a-zA-Z])/g,'$1 $2')
          .replace(/\//g,' ')
          .replace(/\s+/g,' ').trim();
}
function hasEnVoice(){return _voices.some(v=>(v.lang||'').toLowerCase().startsWith('en'));}
/* 在线美音降级：手机没装英文语音包时，用有道词典美音接口朗读（联网即可，无需装语音包） */
let _ttsAudioEl=null;
function getTtsAudioEl(){
  if(!_ttsAudioEl){
    _ttsAudioEl=document.createElement('audio');
    _ttsAudioEl.style.display='none';
    _ttsAudioEl.setAttribute('playsinline','true');
    document.body.appendChild(_ttsAudioEl);
  }
  return _ttsAudioEl;}
function playOnlineTTS(t){
  let txt=oralize(t).trim();if(!txt)return;
  const segs=txt.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[txt];
  const q=segs.map(s=>s.trim()).filter(s=>s.length>0&&s.length<=120);
  if(!q.length)q.push(txt.slice(0,120));
  const a=getTtsAudioEl();
  try{a.pause();a.src='';}catch(e){}
  let i=0;
  function next(){
    if(i>=q.length){a.src='';return;}
    const url='https://dict.youdao.com/dictvoice?type=2&audio='+encodeURIComponent(q[i++]);
    a.src=url;
    a.onended=function(){next();};
    a.onerror=function(){console.warn('TTS audio error',a.error);next();};
    function tryPlay(){
      a.play().catch(function(err){
        // 没加载好：等 canplaythrough 再试一次（某些浏览器允许）
        if(err.name==='NotSupportedError'||err.name==='NotAllowedError'||(err.message||'').includes('supported')||(err.message||'').includes('allowed')){
          a.oncanplaythrough=function(){a.oncanplaythrough=null;a.play().catch(function(){next();});};
          // 保险：2秒后如果还没响，跳过这句
          setTimeout(function(){if(a.src===url){next();}},2500);
        }else{next();}
      });
    }
    // 若已缓存或足够快则直接播；否则等 canplaythrough
    if(a.readyState>=3){tryPlay();}
    else{a.oncanplaythrough=function(){a.oncanplaythrough=null;tryPlay();};a.onerror=function(){next();};}
  }
  next();}
function speak(t){if(!t)return;
  if(!('speechSynthesis'in window)){playOnlineTTS(t);return;}
  if(!_voices.length)loadVoices();
  // 无英文语音包（含 voices 尚未加载的 0 个情况）→ 自动切在线美音
  if(!hasEnVoice()){
    if(!LS.get('wb_en_tts_tip_v1')){LS.set('wb_en_tts_tip_v1',1);toast('🔊 已用在线美音朗读（无需安装语音包，联网即可）');}
    playOnlineTTS(t);return;}
  try{speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(oralize(t));u.lang='en-US';u.rate=.95;
    if(!_voices.length)loadVoices();
    const v=pickVoice('en-US');if(v)u.voice=v;
    const fire=()=>{
      if(!u.voice){loadVoices();const v2=pickVoice('en-US');if(v2)u.voice=v2;}
      try{speechSynthesis.speak(u);}catch(e){toast('朗读失败：'+(e.message||e));}};
    if(_voices.length)fire();else setTimeout(fire,150);
    u.onerror=e=>{if(e.error&&e.error!=='canceled'&&e.error!=='interrupted')toast('朗读出错：'+e.error);};
  }catch(e){toast('朗读失败：'+(e.message||e));}}

document.addEventListener('click',function(e){const t=e.target;const b=t.closest?t.closest('[data-spk]'):null;if(b){e.preventDefault();speak(b.getAttribute('data-spk'));}});

    if(vs.length>20)msg+='\n（其余 '+(vs.length-20)+' 个略）';
  }else{
    msg+='（暂未获取到——部分手机加载较慢，可过几秒再点一次）';
  }
  if(online){
    msg+='\n\n朗读将使用：🔊 在线美音（有道词典）\n无需安装语音包，联网即可标准美音朗读';
  }else{
    msg+='\n\n朗读将使用：'+(v?((v.name||'?')+' ['+(v.lang||'?')+']'):'系统默认语音（按 en-US 自动路由）');
  }
  if(!v||!(v.lang||'').toLowerCase().startsWith('en')){
    msg+='\n\n⚠️ 未检测到英文语音包，这就是读音不像美式的原因。\n';
    msg+='安卓修复：设置 → 辅助功能（或语言和输入法）→ 文字转语音 → 选 Google 文字转语音引擎 → 安装/下载 英语(美国) 语音数据\n';
    msg+='iPhone：系统自带 Samantha(en-US)，一般无需设置；若仍异常请检查 设置→辅助功能→朗读内容→声音';
  }
  // 追加测试按钮提示
  msg+='\n\n【测试】点击"确定"后，再点右下角 🔧 → 会尝试播放一句在线美音。';
  if(confirm(msg+'\n\n是否现在测试在线美音？')){
    playOnlineTTS('Hello, this is a test of the online American English pronunciation.');
  }
}

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
// 拆分阅读题的 stem：原文 vs 题目
function splitReadingStem(stem){
  let s=String(stem||'').trim();
  // 1. 去掉开头的整行中文/非英文指令（如「阅读以下短文并回答问题。」）
  let lines=s.split(/\r?\n/);
  while(lines.length && !/[a-zA-Z]{4,}/.test(lines[0])) lines.shift();
  s=lines.join('\n').trim();
  // 2. 去掉 "Passage:" / "Passage excerpt:" 前缀
  s=s.replace(/^Passage excerpt:\s*/i,'').replace(/^Passage:\s*/i,'');
  // 3. 按题目标记切分（含 Question:）
  const marker=/(Question:?|According to the passage|Which of the following|What does the (?:author|passage|writer)|Why does the (?:author|writer)|How does the (?:author|writer)|The passage suggests|It can be inferred|In the passage, the word|The word [^ ]+ in the passage)/i.exec(s);
  let passage='',question=s;
  if(marker){
    passage=s.slice(0,marker.index).trim();
    question=s.slice(marker.index).replace(/^Question:?/i,'').trim();
  }else{
    const sentences=s.match(/[^.!?。！？]+[.!?。！？]+/g)||[s];
    if(sentences.length>1){passage=sentences[0].trim();question=sentences.slice(1).join(' ').trim();}
  }
  // 4. 清理引导/结尾引号与标点
  passage=passage.replace(/^['"‘“]/,'').replace(/['"’”]\.?\s*$/,'').trim();
  if(!passage){const qm=s.match(/['"]([^'"]{20,})['"]/);if(qm)passage=qm[1].trim();}
  return {passage,question};
}

const TABS=[['train','今日训练',ICONS.train],['bank','题库',ICONS.bank],['vocab','词汇本',ICONS.vocab],['plan','周计划',ICONS.plan],['speak','口语',ICONS.speak],['ai','AI搭子',ICONS.ai],['lib','资料库',ICONS.lib],['data','数据',ICONS.data]];

/* ============ training ============ */
const DEFAULT_TASKS=[
 {id:'vocab',name:'词汇',core:true,desc:'背 20 个新词 + 复习生词'},
 {id:'listen',name:'听力',core:true,desc:'精听 1 篇（BBC / 真题）'},
 {id:'speak',name:'口语',core:true,desc:'跟读 + 自言自语 5 分钟'},
 {id:'read',name:'阅读',core:true,desc:'读 1 篇外刊 / 真题'},
 {id:'bank',name:'题库',core:false,desc:'刷一套 CET6 / 雅思题'}
];
function getCheckin(date){const all=LS.get(K.checkin,{});return all[date];}
function setCheckin(date,rec){const all=LS.get(K.checkin,{});all[date]=rec;LS.set(K.checkin,all);}
function completion(tasks){const done=Object.values(tasks).filter(Boolean).length;return Math.round(done/DEFAULT_TASKS.length*100);}
function streak(){
  let s=0;const t=TODAY();
  // allow today not yet done -> count from yesterday
  let d=t; if(!getCheckin(d)) d=dateAdd(t,-1);
  while(getCheckin(d)){s++;d=dateAdd(d,-1);}
  return s;
}
function renderTrain(){
  const today=TODAY();
  const rec=getCheckin(today)||{tasks:{},note:''};
  // overdue: past 7 days not 100%
  let overdue=[];
  for(let i=1;i<=7;i++){const d=dateAdd(today,-i);const r=getCheckin(d);
    if(!r||completion(r.tasks)<100) overdue.push({date:d,r});}
  let h=`<div class="card">
    <h2>${ICONS.train} 今日训练 & 打卡</h2>
    <p class="sub">${today} · 连续打卡 <b style="color:var(--terra-d)">${streak()}</b> 天</p>`;
  if(overdue.length){
    h+=`<div style="margin-bottom:10px"><div class="muted" style="font-size:12.5px;margin-bottom:6px">⚠ 待补打卡（逾期未完成）</div>`;
    overdue.forEach(o=>{
      const pct=o.r?completion(o.r.tasks):0;
      h+=`<div class="task overdue"><div><div class="tname">${o.date}</div><div class="muted" style="font-size:12px">完成度 ${pct}%</div></div><div class="spacer"></div>
        <button class="btn sm soft" data-makeup="${o.date}">一键补打卡</button></div>`;
    });
    h+=`</div>`;
  }
  h+=`<div class="muted" style="font-size:12.5px;margin:6px 0">今天要处理</div>`;
  DEFAULT_TASKS.forEach(t=>{
    const done=!!rec.tasks[t.id];
    h+=`<div class="task ${done?'done':''}" data-task="${t.id}">
      <div class="box">${done?'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg>':''}</div>
      <div><div class="tname">${t.name} ${t.core?'<span class="tag-core">核心</span>':'<span class="tag-flex">弹性</span>'}</div>
      <div class="muted" style="font-size:12px">${t.desc}</div></div></div>`;
  });
  const pct=completion(rec.tasks);
  h+=`<div class="row" style="margin-top:10px">
      <div class="spacer"></div>
      <div class="muted">完成度 <b style="color:var(--terra-d)">${pct}%</b></div>
      <button class="btn" data-checkin>完成今日打卡</button></div>`;
  h+=`<label class="fld">今日复盘 / 一句英文</label><textarea id="trainNote" placeholder="今天印象最深的一个词 / 一句想记住的话...">${esc(rec.note||'')}</textarea>`;
  // daily reading — 梅花式：原文 / 题目 / 解析 三卡分离
  const reads=EN_DATA.questions.filter(q=>q.type==='阅读');
  if(reads.length){
    const rd=reads[Math.floor((new Date().getDate())%reads.length)];
    const {passage,question}=splitReadingStem(rd.stem);
    let ansText=rd.answer;
    if(rd.options){const ao=rd.options.find(o=>o.trim().startsWith(rd.answer.trim()));if(ao)ansText=ao;}
    const optsHtml=rd.options?`<div class="read-opts">`+rd.options.map(op=>{
      const letter=op.split('.')[0];
      const text=op.substring(op.indexOf('.')+1).trim();
      return `<div class="read-opt"><span class="letter">${letter}</span><span>${esc(text)}</span></div>`;
    }).join('')+`</div>`:'';
    h+=`<div class="read-set">
      <div class="read-card article">
        <div class="read-hd"><div class="ric">原文</div><h3>阅读原文</h3><span class="meta">${rd.level} · ${rd.topic}</span></div>
        <div class="read-passage">${esc(passage||'（未提取到原文）')}</div>
        <div style="margin-top:12px"><button class="btn sm ghost" data-spk="${esc(passage||'')}">🔊 朗读原文</button></div>
      </div>
      <div class="read-card question">
        <div class="read-hd"><div class="ric">题目</div><h3>今日一题</h3></div>
        <div class="read-question">${esc(question||'（未提取到题目）')}</div>
        ${optsHtml}
      </div>
      <div class="read-card answer">
        <details class="read-details"><summary class="read-toggle"><span class="read-summary"><div class="ric">解析</div><span>查看答案与解析</span></span><span>▼</span></summary>
          <div class="read-answer">
            <div class="ans-row"><span class="ans-tag">正确答案</span><span class="ans-val">${esc(rd.answer)}</span><span class="muted">${esc(ansText)}</span></div>
            <div class="ans-body">${esc(rd.analysis)}</div>
          </div>
        </details>
      </div>
    </div>`;
  }
  h+=`</div>`;
  $('#tab-train').innerHTML=h;
  // events
  $$('#tab-train .task[data-task]').forEach(el=>el.onclick=()=>{
    const id=el.dataset.task;const r=getCheckin(today)||{tasks:{},note:''};r.tasks[id]=!r.tasks[id];setCheckin(today,r);renderTrain();renderStats();
  });
  $$('#tab-train [data-makeup]').forEach(b=>b.onclick=()=>{
    const d=b.dataset.makeup;const r=getCheckin(d)||{tasks:{},note:'补打卡'};
    DEFAULT_TASKS.forEach(t=>r.tasks[t.id]=true);r.note=(r.note||'')+'（补打卡）';setCheckin(d,r);toast('已补打卡 '+d);renderTrain();renderStats();
  });
  $('[data-checkin]').onclick=()=>{
    const r=getCheckin(today)||{tasks:{},note:''};
    DEFAULT_TASKS.forEach(t=>{if(r.tasks[t.id]===undefined)r.tasks[t.id]=false;});
    r.note=$('#trainNote').value;
    setCheckin(today,r);toast('今日打卡已记录 ✓');renderTrain();renderStats();
  };
}

/* ============ question bank ============ */
let bankF={level:'全部',type:'全部',topic:'全部',n:10};
let quiz=null, quizMode='practice'; // practice | wrong
function allQuestions(){return EN_DATA.questions.concat(LS.get(K.impQ,[]));}
function topics(){const s=new Set(allQuestions().map(q=>q.topic));return ['全部',...[...s].filter(Boolean)];}
function filteredQs(){
  return allQuestions().filter(q=>
    (bankF.level==='全部'||q.level===bankF.level)&&
    (bankF.type==='全部'||q.type===bankF.type)&&
    (bankF.topic==='全部'||q.topic===bankF.topic));
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function renderBank(){
  const qs=filteredQs();
  const lv=()=>['全部','CET6','雅思'].map(l=>`<button class="seg-btn ${bankF.level===l?'on':''}" data-lv="${l}">${l==='全部'?'全部':(l==='CET6'?'CET6':'雅思')}</button>`).join('');
  const ty=['全部','词汇','语法','阅读','完形','翻译','听力','写作'];
  const tys=ty.map(t=>`<button class="seg-btn ${bankF.type===t?'on':''}" data-ty="${t}">${t}</button>`).join('');
  let h=`<div class="card">
    <h2>${ICONS.bank} 题库 · CET6 & 雅思</h2>
    <p class="sub">共 ${allQuestions().length} 题（CET6 ${EN_DATA.questions.filter(q=>q.level==='CET6').length} · 雅思 ${EN_DATA.questions.filter(q=>q.level==='IELTS').length}）· 每题均带解析</p>
    <div class="filterbar">
      <div class="fitem"><label>级别</label><div class="seg" id="segLv">${lv()}</div></div>
      <div class="fitem"><label>题型</label><div class="seg" id="segTy">${tys}</div></div>
      <div class="fitem"><label>主题</label><select id="selTopic">${topics().map(t=>`<option ${bankF.topic===t?'selected':''}>${t}</option>`).join('')}</select></div>
      <div class="fitem"><label>抽题数</label><input id="qn" type="number" min="1" max="${qs.length}" value="${Math.min(bankF.n,qs.length)}" style="width:80px"></div>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="btn" id="startQuiz">开始练习（随机）</button>
      <button class="btn ghost" id="startWrong">错题本（${LS.get(K.wrong,[]).length}）</button>
      <div class="spacer"></div>
      <span class="muted">筛选命中 ${qs.length} 题</span>
    </div></div>`;
  if(quiz) h+=renderQuiz();
  $('#tab-bank').innerHTML=h;
  if(quiz) attachQuizHandlers();
  $$('#segLv .seg-btn').forEach(b=>b.onclick=()=>{bankF.level=b.dataset.lv;renderBank();});
  $$('#segTy .seg-btn').forEach(b=>b.onclick=()=>{bankF.type=b.dataset.ty;renderBank();});
  $('#selTopic').onchange=e=>{bankF.topic=e.target.value;renderBank();};
  $('#qn').onchange=e=>{bankF.n=Math.max(1,parseInt(e.target.value)||10);};
  $('#startQuiz').onclick=()=>{quizMode='practice';startQuiz(false);};
  $('#startWrong').onclick=()=>{quizMode='wrong';startQuiz(true);};
}
function startQuiz(fromWrong){
  let pool=filteredQs();
  if(fromWrong){const ws=new Set(LS.get(K.wrong,[]));pool=pool.filter(q=>ws.has(q.id));}
  if(!pool.length){toast('没有符合条件的题目');return;}
  const n=Math.min(bankF.n,pool.length);
  quiz=shuffle(pool).slice(0,n).map(q=>({...q,sel:null,revealed:false,text:''}));
  renderBank();const _el=$('#tab-bank');if(_el&&_el.scrollIntoView)_el.scrollIntoView({behavior:'smooth'});
}
function renderQuiz(){
  const allRev=quiz.every(q=>q.revealed);
  let header;
  if(allRev){
    let correct=0,total=0;
    quiz.forEach(q=>{if(q.options){total++;if((q.sel||'')===(q.answer||'').trim())correct++;}});
    const acc=total?Math.round(correct/total*100):0;
    header=`<div class="card"><div class="row"><h2 style="margin:0">批改结果</h2><div class="spacer"></div>
      <b style="color:var(--terra-d)">得分 ${correct}/${total} · 正确率 ${acc}%</b>
      <button class="btn sm ghost" id="backBank">返回</button>
      <button class="btn sm soft" id="redo">再来一组</button></div></div>`;
  }else{
    header=`<div class="card"><div class="row"><h2 style="margin:0">练习中</h2><div class="spacer"></div>
      <button class="btn sm ghost" id="backBank">返回</button>
      <button class="btn sm" id="grade">批改并看解析</button></div>
      <p class="sub">共 ${quiz.length} 题 · 选择后点“批改”，每题显示对错与解析</p></div>`;
  }
  let body='';
  quiz.forEach((q,i)=>{
    body+=`<div class="q" data-i="${i}"><div class="qhead">
      <span class="badge ${q.level==='CET6'?'b-cet6':'b-ielts'}">${q.level}</span>
      <span class="badge b-type">${q.type}</span><span class="badge b-type">${q.topic}</span>
      ${q.revealed&&q.options?`<span class="badge ${(q.sel||'')===(q.answer||'').trim()?'b-ok':'b-wrong'}">${(q.sel||'')===(q.answer||'').trim()?'✓ 正确':'✗ 错误'}</span>`:''}
      <div class="spacer"></div><span class="muted" style="font-size:12px">#${i+1}</span></div>
      <div class="stem">${esc(q.stem)}</div>${(q.type==='听力')?`<div class="row"><button class="btn sm ghost" data-spk="${esc(q.stem)}">🔊 朗读听力原文</button></div>`:''}`;
    if(q.options){
      q.options.forEach(op=>{
        const letter=op.split('.')[0];
        let cls='opt';if(q.sel===letter)cls+=' sel';
        if(q.revealed){if(letter===(q.answer||'').trim())cls+=' correct';else if(q.sel===letter)cls+=' wrong';}
        const mark=q.revealed?(letter===(q.answer||'').trim()?'✓':(q.sel===letter?'✗':letter)):letter;
        body+=`<div class="${cls}" data-i="${i}" data-letter="${letter}"><div class="mk">${mark}</div><div>${esc(op)}</div></div>`;
      });
    }else{
      body+=`<label class="fld">你的作答</label><textarea data-text="${i}" placeholder="在此作答...">${esc(q.text||'')}</textarea>`;
    }
    if(q.revealed){
      if(q.options){
        body+=`<div class="analysis"><div class="at">答案：${esc(q.answer)}</div>${esc(q.analysis)}</div>`;
      }else{
        body+=`<div class="analysis"><div class="at">参考答案</div><div class="sample">${esc(q.answer)}</div><div class="at" style="margin-top:8px">解析</div>${esc(q.analysis)}</div>`;
      }
    }
    body+=`</div>`;
  });
  return header+body;
}
function attachQuizHandlers(){
  $$('#tab-bank .opt').forEach(o=>o.onclick=()=>{
    const qi=+o.dataset.i;if(quiz[qi].revealed)return;
    quiz[qi].sel=o.dataset.letter;
    const card=o.closest('.q');
    card.querySelectorAll('.opt').forEach(op=>op.classList.toggle('sel',op.dataset.letter===quiz[qi].sel));
  });
  $$('#tab-bank textarea[data-text]').forEach(t=>t.oninput=e=>{quiz[+e.target.dataset.text].text=e.target.value;});
  const gb=$('#grade');if(gb)gb.onclick=grade;
  const bb=$('#backBank');if(bb)bb.onclick=()=>{quiz=null;renderBank();};
  const rd=$('#redo');if(rd)rd.onclick=()=>{if(quizMode==='wrong')startQuiz(true);else startQuiz(false);};
}
function grade(){
  let wrongIds=LS.get(K.wrong,[]);let anyChoice=false;
  quiz.forEach(q=>{if(q.options){anyChoice=true;if((q.sel||'')!==(q.answer||'').trim()){if(!wrongIds.includes(q.id))wrongIds.push(q.id);}q.revealed=true;}else{q.revealed=true;}});
  LS.set(K.wrong,wrongIds);
  // log
  const log=LS.get(K.quizLog,[]);
  const total=quiz.filter(q=>q.options).length;const correct=quiz.filter(q=>q.options&&(q.sel||'')===(q.answer||'').trim()).length;
  log.unshift({date:TODAY(),mode:quizMode==='wrong'?'错题':bankF.level,n:quiz.length,score:correct,total,acc:total?Math.round(correct/total*100):0});
  LS.set(K.quizLog,log.slice(0,60));
  renderBank();renderStats();
  toast(anyChoice?'已批改，查看解析':'已展示参考答案');
}

/* ============ vocabulary ============ */
let vocabF={level:'全部',mode:'list',q:''};
function vocabPool(){return EN_DATA.vocab.concat(LS.get(K.impV,[]),LS.get(K.userVocab,[]));}
function mastery(){return LS.get(K.mastery,{});}
let vocabLimit=80;
function renderVocab(){
  const pool=vocabPool();
  const vis=pool.filter(v=>(vocabF.level==='全部'||v.level===vocabF.level)&&
    (!vocabF.q||(v.word+v.zh).toLowerCase().includes(vocabF.q.toLowerCase())));
  const m=mastery();
  const known=pool.filter(v=>m[v.word]==='known').length;
  let h=`<div class="card">
    <h2>${ICONS.vocab} 词汇本 · CET6 → 雅思</h2>
    <p class="sub">词库 ${pool.length} 词 · 已掌握 ${known}（${pool.length?Math.round(known/pool.length*100):0}%）· 点击 🔊 跟读</p>
    <div class="filterbar">
      <div class="seg" id="vLv">${['全部','CET6','雅思'].map(l=>`<button class="seg-btn ${vocabF.level===l?'on':''}" data-lv="${l}">${l}</button>`).join('')}</div>
      <input id="vSearch" placeholder="搜单词 / 释义" value="${esc(vocabF.q)}" style="max-width:180px">
      <div class="spacer"></div>
      <div class="seg" id="vMode">${[['list','列表'],['flash','闪卡'],['add','生词本']].map(x=>`<button class="seg-btn ${vocabF.mode===x[0]?'on':''}" data-mode="${x[0]}">${x[1]}</button>`).join('')}</div>
    </div></div>`;
  if(vocabF.mode==='list'){
    if(!vis.length)h+=`<div class="empty">没有匹配的单词</div>`;
    else{
      const shown=vis.slice(0,vocabLimit);
      h+=`<div class="vgrid">`+shown.map(v=>{
      const mk=m[v.word];
      return `<div class="vcard ${mk==='known'?'known':''}">
        <div class="vw">${esc(v.word)} <button class="icon-btn" data-spk="${esc(v.word)}">🔊</button></div>
        <div class="vp">${esc(v.phonetic||'')} ${esc(v.pos||'')}</div>
        <div class="vm">${esc(v.zh)}</div>
        <div class="ve">${esc(v.example_en||'')}<br>${esc(v.example_zh||'')}</div>
        <div class="vact">
          <button class="btn sm soft" data-know="${esc(v.word)}">${mk==='known'?'已掌握 ✓':'认识'}</button>
          <button class="btn sm ghost" data-unk="${esc(v.word)}">生词</button>
        </div></div>`;
    }).join('')+`</div>`;
      if(vis.length>vocabLimit)h+=`<div style="text-align:center;margin:14px 0"><button class="btn soft" id="vMore">显示更多（${Math.min(vocabLimit,vis.length)} / ${vis.length}）</button></div>`;
    }
  }else if(vocabF.mode==='flash'){
    const list=vis.length?vis:pool;
    if(!list.length)h+=`<div class="empty">没有可闪卡的单词</div>`;
    else{
      const v=list[Math.floor(Math.random()*list.length)];
      h+=`<div class="flash"><div class="fc" id="fc" data-w="${esc(v.word)}">
        <div class="big">${esc(v.word)}</div><div class="ph">${esc(v.phonetic||'')}</div>
        <div class="ans" style="display:none">${esc(v.pos||'')} ${esc(v.zh)}<br><span style="font-style:italic;color:#6b6258">${esc(v.example_en||'')}</span></div>
        <div class="muted" style="margin-top:14px;font-size:12px">点击卡片翻面</div></div>
        <div class="row" style="justify-content:center;margin-top:14px">
          <button class="btn ghost" id="fk">认识</button><button class="btn soft" id="fu">不认识</button>
          <button class="btn" id="fn">下一张</button></div></div>`;
    }
  }else{
    const uv=LS.get(K.userVocab,[]);
    h+=`<div class="card"><h2>我的生词本（${uv.length}）</h2>
      <div class="row"><input id="uw" placeholder="单词"><input id="up" placeholder="音标(可空)" style="max-width:140px"><input id="uz" placeholder="释义"></div>
      <button class="btn sm" id="addW" style="margin-top:8px">添加</button></div>`;
    if(uv.length)h+=`<div class="vgrid">`+uv.map(v=>`<div class="vcard"><div class="vw">${esc(v.word)} <button class="icon-btn" data-spk="${esc(v.word)}">🔊</button></div>
      <div class="vp">${esc(v.phonetic||'')}</div><div class="vm">${esc(v.zh)}</div>
      <div class="vact"><button class="btn sm ghost" data-delw="${esc(v.word)}">删除</button></div></div>`).join('')+`</div>`;
  }
  $('#tab-vocab').innerHTML=h;
  $$('#vLv .seg-btn').forEach(b=>b.onclick=()=>{vocabF.level=b.dataset.lv;vocabLimit=80;renderVocab();});
  $$('#vMode .seg-btn').forEach(b=>b.onclick=()=>{vocabF.mode=b.dataset.mode;renderVocab();});
  const vm2=$('#vMore');if(vm2)vm2.onclick=()=>{vocabLimit+=120;renderVocab();};
  const vs=$('#vSearch');if(vs)vs.oninput=e=>{vocabF.q=e.target.value;vocabLimit=80;renderVocab();};
  $$('#tab-vocab [data-know]').forEach(b=>b.onclick=()=>{const m=mastery();m[b.dataset.know]='known';LS.set(K.mastery,m);renderVocab();renderStats();});

/* ============ weekly plan ============ */
const K_PLAN='wb_en_plan_v1';
function weekDays(){
  const today=new Date();const dow=(today.getDay()+6)%7;
  const mon=new Date(today);mon.setDate(today.getDate()-dow);mon.setHours(0,0,0,0);
  const arr=[];for(let i=0;i<7;i++){const d=new Date(mon);d.setDate(mon.getDate()+i);arr.push(d.toISOString().slice(0,10));}
  return arr;
}
function getPlan(){return LS.get(K_PLAN,{});}
function renderPlan(){
  const days=weekDays();const plan=getPlan();const wn=['周一','周二','周三','周四','周五','周六','周日'];
  let total=0,done=0;days.forEach(d=>(plan[d]||[]).forEach(t=>{total++;if(t.done)done++;}));
  const wp=total?Math.round(done/total*100):0;
  let h=`<div class="card">
    <h2>${ICONS.plan} 周计划看板</h2>
    <p class="sub">本周（周一 → 周日）· 完成 <b style="color:var(--sage-d)">${done}/${total}</b> · <b style="color:var(--terra-d)">${wp}%</b></p>
    <div class="row"><div class="spacer"></div><button class="btn sm ghost" id="clearWeek">清空本周</button></div></div>
    <div class="board">`;
  days.forEach((d,i)=>{
    const tasks=plan[d]||[];const cd=tasks.length?Math.round(tasks.filter(t=>t.done).length/tasks.length*100):0;
    h+=`<div class="col"><h3>${wn[i]}</h3><div class="cdate">${d.slice(5)}</div><div class="cbar"><i style="width:${cd}%"></i></div>`;
    tasks.forEach(t=>{
      h+=`<div class="ptask ${t.done?'done':''}" data-d="${d}" data-id="${t.id}">
        <div class="pbox">${t.done?'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg>':''}</div>
        <div class="ptext">${esc(t.text)}</div>
        <button class="pdel" data-del="${d}|${t.id}">✕</button></div>`;
    });
    h+=`<div class="add"><input placeholder="加任务，回车" data-adddate="${d}"></div></div>`;
  });
  h+=`</div>`;
  $('#tab-plan').innerHTML=h;
  $('#clearWeek').onclick=()=>{if(confirm('清空本周所有计划任务？')){const p=getPlan();days.forEach(d=>delete p[d]);LS.set(K_PLAN,p);renderPlan();renderStats();}};
  $$('#tab-plan .pbox').forEach(b=>b.onclick=()=>{
    const el=b.closest('.ptask');const d=el.dataset.d,id=el.dataset.id;
    const p=getPlan();p[d]=(p[d]||[]).map(t=>t.id==id?{...t,done:!t.done}:t);LS.set(K_PLAN,p);renderPlan();renderStats();
  });
  $$('#tab-plan .pdel').forEach(b=>b.onclick=()=>{
    const [d,id]=b.dataset.del.split('|');const p=getPlan();p[d]=(p[d]||[]).filter(t=>t.id!=id);LS.set(K_PLAN,p);renderPlan();renderStats();
  });
  $$('#tab-plan .add input').forEach(inp=>inp.onkeydown=e=>{
    if(e.key==='Enter'){const d=inp.dataset.adddate,text=inp.value.trim();if(!text)return;const p=getPlan();p[d]=p[d]||[];p[d].push({id:'p'+Date.now(),text,done:false});LS.set(K_PLAN,p);renderPlan();renderStats();}
  });
}

async function aiCall(messages){
  const cfg=aiCfg();
  const base=(cfg.base||'https://apihub.agnes-ai.com/v1').replace(/\/+$/,'');
  const res=await fetch(base+'/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},
    body:JSON.stringify({model:cfg.model||'agnes-2.0-flash',messages,temperature:.8,max_tokens:600})
  });
  if(!res.ok){
    let msg='HTTP '+res.status;
    try{const e=await res.json();if(e&&e.error&&e.error.message)msg=e.error.message;}catch(_){}
    if(res.status===401)msg='API Key 无效或未填写（401）';
    throw new Error(msg);
  }
  const data=await res.json();
  const t=data&&data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content;
  if(!t||!String(t).trim())throw new Error('模型返回了空回复，请重试');
  return String(t).trim();
}
async function aiSend(text){
  text=(text||'').trim();
  if(!text||aiF.busy)return;
  const cfg=aiCfg();
  if(!cfg.key){aiF.cfgOpen=true;renderAi();toast('请先填写 Agnes API Key（免费申请）');return;}
  const hist=aiHist();hist.push({r:'me',t:text});aiSetHist(hist);
  aiF.draft='';aiF.busy=true;renderAi();
  const msgs=[{role:'system',content:AI_MODES[aiF.mode].sys}]
    .concat(hist.slice(-16).map(m=>({role:m.r==='me'?'user':'assistant',content:m.t})));
  try{
    const reply=await aiCall(msgs);
    const h=aiHist();h.push({r:'ai',t:reply});aiSetHist(h);
    if(aiF.mode==='mate'&&aiF.autoSpeak)speak(reply.replace(/💡[^\n]*/g,'').trim());
  }catch(err){
    const h=aiHist();h.push({r:'ai',t:'⚠️ '+err.message+'\n排查：① Key 是否正确（platform.agnes-ai.com 免费）②当前网络能否访问 apihub.agnes-ai.com ③稍后重试'});aiSetHist(h);
  }finally{aiF.busy=false;renderAi();}
}
function aiMic(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast('当前浏览器不支持语音识别，请手动输入');return;}
  try{
    const r=new SR();r.lang=AI_MODES[aiF.mode].rec;r.interimResults=false;r.maxAlternatives=1;
    r.onresult=e=>{const t=e.results[0][0].transcript;const ta=$('#aiInput');if(ta){ta.value=t;aiF.draft=t;}toast('已识别，可直接发送');};
    r.onerror=e=>toast('识别出错：'+e.error);
    r.start();toast('🎤 正在聆听…（语音输入需 HTTPS 或 localhost，局域网 http 请手动输入）');
  }catch(err){toast('无法启动麦克风');}
}
function renderAi(){
  const mode=AI_MODES[aiF.mode];const hist=aiHist();const cfg=aiCfg();
  const storedCfg=LS.get(AI_CFG_KEY,{});const hasBaked=!!AI_DEFAULT_KEY;
  let h=`<div class="card">
    <h2>${ICONS.ai} AI 搭子 · Agnes 免费模型</h2>
    <p class="sub">树洞 = 中文情绪树洞 ｜ 口语搭子 = 英文对话陪练（回复自动美音朗读）</p>
    <div class="filterbar">
      <div class="seg" id="aiMode">${Object.keys(AI_MODES).map(k=>`<button class="seg-btn ${aiF.mode===k?'on':''}" data-m="${k}">${AI_MODES[k].emoji} ${AI_MODES[k].name}</button>`).join('')}</div>
      <div class="spacer"></div>
      <button class="btn sm ghost" id="aiCfgBtn">⚙ 接入</button>
      <button class="btn sm ghost" id="aiClear">清空</button>
    </div></div>`;
  if(aiF.cfgOpen){
    h+=`<div class="card"><div class="cfgbox">
      <b>接入 Agnes 免费 AI（30秒搞定）</b>
      <div class="hint">① 电脑/手机打开 <b>platform.agnes-ai.com</b> 邮箱注册 → 控制台「设置 → API 密钥 → 创建新的密钥」复制 sk- 开头的 Key；② 粘贴到下面保存即可。模型 <b>agnes-2.0-flash 永久免费</b>、不限次数。</div>
      <div class="fld">API Key<input id="cfgKey" placeholder="${storedCfg.key?'sk-...':(hasBaked?'已内置默认 Key（留空即用，粘贴可覆盖）':'sk-...')}" value="${esc(storedCfg.key||'')}"></div>
      <div class="fld">接口地址<input id="cfgBase" value="${esc(cfg.base)}"></div>
      <div class="fld">模型<input id="cfgModel" value="${esc(cfg.model)}"></div>
      <div class="row"><button class="btn" id="cfgSave">保存</button><button class="btn ghost" id="cfgClose">收起</button><span class="muted" style="font-size:12px;align-self:center">${storedCfg.key?'✅ 已配置':(hasBaked?'✅ 已内置默认 Key':'⬜ 未配置')}</span></div>
    </div></div>`;
  }
  h+=`<div class="card"><div class="chatbox">
    <div class="modehero"><span class="big">${mode.emoji}</span><div><b>${mode.name}</b><div class="muted" style="font-size:12.5px">${esc(mode.intro)}</div></div></div>
    <div class="msgs" id="aiMsgs">`;
  if(!hist.length)h+=`<div class="msg ai">${esc(mode.intro)}</div>`;
  else h+=hist.map(m=>m.r==='me'
    ?`<div class="msg me">${esc(m.t)}</div>`
    :`<div class="msg ai">${esc(m.t)}<span class="spk" data-spk="${esc(m.t)}">🔊</span></div>`).join('');
  if(aiF.busy)h+=`<div class="think">AI 正在输入…</div>`;
  h+=`</div>
    ${aiF.mode==='mate'?`<div class="row" style="margin-top:8px"><label style="font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:5px"><input type="checkbox" id="aiAuto" ${aiF.autoSpeak?'checked':''}> 自动朗读回复（美音）</label></div>`:''}
    <div class="chatbar">
      <button class="btn sm" id="aiMic" title="语音输入">🎤</button>
      <textarea id="aiInput" placeholder="${aiF.mode==='mate'?'Type in English…':'跟树洞说说…（回车发送）'}">${esc(aiF.draft)}</textarea>
      <button class="btn" id="aiSend">${aiF.busy?'…':'发送'}</button>
    </div>
  </div></div>`;
  $('#tab-ai').innerHTML=h;
  const box=$('#aiMsgs');if(box)box.scrollTop=box.scrollHeight;
  $$('#aiMode .seg-btn').forEach(b=>b.onclick=()=>{aiF.mode=b.dataset.m;aiF.draft='';renderAi();});
  $('#aiCfgBtn').onclick=()=>{aiF.cfgOpen=!aiF.cfgOpen;renderAi();};
  $('#aiClear').onclick=()=>{if(confirm('清空当前模式的聊天记录？')){aiSetHist([]);renderAi();}};
  if($('#cfgSave')){$('#cfgSave').onclick=()=>{
    const c={key:$('#cfgKey').value.trim(),base:$('#cfgBase').value.trim()||'https://apihub.agnes-ai.com/v1',model:$('#cfgModel').value.trim()||'agnes-2.0-flash'};
    LS.set(AI_CFG_KEY,c);aiF.cfgOpen=false;renderAi();toast(c.key?'已保存，可以开始聊天了 ✅':'Key 为空，请填写后再保存');};
    $('#cfgClose').onclick=()=>{aiF.cfgOpen=false;renderAi();};}
  if($('#aiAuto'))$('#aiAuto').onchange=e=>{aiF.autoSpeak=e.target.checked;};
  $('#aiMic').onclick=aiMic;
  const ta=$('#aiInput');
  if(ta){ta.oninput=e=>aiF.draft=e.target.value;
    ta.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();aiSend(ta.value);}};}
  if($('#aiSend'))$('#aiSend').onclick=()=>aiSend(aiF.draft||($('#aiInput')?$('#aiInput').value:''));
}


/* ============ export wrong book ============ */
function exportWrongBook(){
  const ids=new Set(LS.get(K.wrong,[]));
  const qs=allQuestions().filter(q=>ids.has(q.id));
  if(!qs.length){toast('还没有错题');return;}
  const body=qs.map(q=>{
    let opts='';if(q.options)opts='<ol type="A">'+q.options.map(o=>`<li>${esc(o)}</li>`).join('')+'</ol>';
    return `<div class="q"><div class="h">${esc(q.level)} · ${esc(q.type)} · ${esc(q.topic)}</div>
      <div class="stem">${esc(q.stem)}</div>${opts}
      <div class="ans"><b>答案：</b>${esc(q.answer)}</div>
      <div class="an"><b>解析：</b>${esc(q.analysis)}</div></div>`;
  }).join('');
  const html=`<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<title>错题本 · ${TODAY()}</title>
<style>body{font-family:system-ui,"Microsoft YaHei",sans-serif;max-width:820px;margin:24px auto;padding:0 16px;color:#3A352F;line-height:1.6}
h1{border-bottom:3px solid #C26B4A;padding-bottom:8px}.q{border:1px solid #ECE3D6;border-radius:12px;padding:14px;margin:12px 0}.h{font-size:12px;color:#8A8178;margin-bottom:6px}
.stem{font-size:15px;white-space:pre-wrap}.ans{margin-top:8px;color:#5F8260}.an{color:#5b5249;font-size:14px}ol{margin:6px 0}</style></head>
<body><h1>错题本 · ${TODAY()} · 共 ${qs.length} 题</h1>${body}</body></html>`;
  const blob=new Blob([html],{type:'text/html'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='错题本_'+TODAY()+'.html';a.click();
  toast('已导出错题本（'+qs.length+' 题）');
}

/* ============ stats / boot ============ */
function renderStats(){
  const all=LS.get(K.checkin,{});const dates=Object.keys(all);
  const log=LS.get(K.quizLog,[]);const totalQ=allQuestions().length;const known=vocabPool().filter(v=>mastery()[v.word]==='known').length;
  const chips=[
    ['连续打卡',streak()+'天'],['累计打卡',dates.length+'天'],
    ['词库',vocabPool().length],['已练题',log.reduce((s,x)=>s+x.n,0)]
  ];
  $('#statStrip').innerHTML=chips.map(c=>`<div class="chip"><b>${esc(c[1])}</b><span>${c[0]}</span></div>`).join('');
}
function renderTabs(){
  $('#tabBar').innerHTML=TABS.map((t,i)=>`<div class="tab ${i===0?'active':''}" data-t="${t[0]}">${t[2]}${t[1]}</div>`).join('');
  $('#bottomNav').innerHTML=TABS.map(t=>`<div class="btab" data-t="${t[0]}">${t[2]}<span>${t[1]}</span></div>`).join('');
  const go=el=>{
    $$('#tabBar .tab').forEach(x=>x.classList.remove('active'));
    $$('#bottomNav .btab').forEach(x=>x.classList.remove('active'));
    el.classList.add('active');
    $$('section.panel').forEach(s=>s.classList.remove('active'));
    $('#tab-'+el.dataset.t).classList.add('active');
    ({train:renderTrain,bank:renderBank,vocab:renderVocab,plan:renderPlan,speak:renderSpeak,ai:renderAi,lib:renderLib,data:renderData}[el.dataset.t])();
  };
  $$('#tabBar .tab').forEach(el=>el.onclick=()=>go(el));
  $$('#bottomNav .btab').forEach(el=>el.onclick=()=>go(el));
}
function boot(){
  if(!EN_DATA||!EN_DATA.questions){document.body.innerHTML='<p style="padding:30px">数据加载失败</p>';return;}
  renderTabs();renderStats();
  renderTrain();renderBank();renderVocab();renderPlan();renderSpeak();renderLib();renderData();
}
boot();
</script>
