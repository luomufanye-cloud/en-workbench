": "语法", "topic": "语法", "stem": "Had I known about the traffic jam, I ___ earlier.", "options": ["A. would have left", "B. will leave", "C. left", "D. leave"], "answer": "A", "analysis": "Had I known 是 if I had known 的倒装，表示与过去事实相反的虚拟条件，主句用 would have done。will leave/leave/left 均为陈述语气，不能用于虚拟结果句。"}, {"id": "x6-g-006", "level": "CET6", "type": "语法", "topic": "语法", "stem": "The committee recommends that the budget ___ cut by ten percent.", "options": ["A. be", "B. is", "C. was", "D. has been"], "answer": "A", "analysis": "recommend 后的宾语从句需用(should)+动词原形的虚拟语气，故用 be。is/was/has been 为陈述语气，不能表达建议性要求。"}, {"id": "x6-g-007", "level": "CET6", "type": "语法", "topic": "语法", "stem": "It was not the policy but the implementation ___ drew public criticism.", "options": ["A. that", "B. which", "C. what", "D. who"], "answer": "A", "analysis": "本句是强调句 It was...that... 结构，强调主语 not the policy but the implementation。强调句统一用 that（指人也可用 who，但此处为事物），which/what/who 均不适用。"}, {"id": "x6-g-008", "level": "CET6", "type": "语法", "topic": "语法", "stem": "By the time the rescue team arrived, the villagers ___ for two days.", "options": ["A. had been trapped", "B. have trapped", "C. were trapping", "D. are trapped"], "answer": "A", "analysis": "by the time + 过去时 表示“到过去某时为止”，主句动作在此之前持续，用过去完成进行时 had been trapped 强调受困两天的持续状态。have trapped 为现在时，were trapping 表主动进行，均错。"}, {"id": "x6-g-009", "level": "CET6", "type": "语法", "topic": "语法", "stem": "The doctor warned him that smoking ___ his recovery from surgery.", "options": ["A. would delay", "B. will delay", "C. delays", "D. delayed"], "answer": "A", "analysis": "主句 warned 为过去时，宾语从句需用过去将来时 would delay 表示“会延误”。will delay 为一般将来，与主句时态不一致；delays/delayed 不能体现“将会”的含义。"}, {"id": "x6-g-010", "level": "CET6", "type": "语法", "topic": "语法", "stem": "Only after the experiment failed ___ the flaw in the design.", "options": ["A. did they notice", "B. they noticed", "C. they did notice", "D. noticed they"], "answer": "A", "analysis": "Only after 置于句首引起主句部分倒装，助动词 did 提前。B 未倒装，C 语序错误，D 主谓颠倒，均违反 only+状语前置的倒装规则。"}, {"id": "x6-g-011", "level": "CET6", "type": "语法", "topic": "语法", "stem": "She is the only one of the students who ___ awarded the scholarship.", "options": ["A. was", "B. were", "C. have been", "D. are"], "answer": "A", "analysis": "the only one of + 复数名词 + who 从句，关系代词 who 指代 the only one（单数），谓语动词用单数 was。were/have been/are 为复数，与先行词单数不一致。"}, {"id": "x6-g-012", "level": "CET6", "type": "语法", "topic": "语法", "stem": "So absorbed ___ in the book that he didn't hear the doorbell.", "options": ["A. was he", "B. he was", "C. did he", "D. he did"], "answer": "A", "analysis": "So + 形容词 置于句首引起主句完全倒装，be 动词 was 提前，故 was he。he was 未倒装，did he 误用助动词（absorbed 是形容词需 be 动词），均错。"}, {"id": "x6-g-013", "level": "CET6", "type": "语法", "topic": "语法", "stem": "I wish I ___ a more useful suggestion at yesterday's meeting.", "options": ["A. had offered", "B. offered", "C. would offer", "D. offer"], "answer": "A", "analysis": "wish 后接与过去事实相反的愿望用过去完成时 had offered，对应 yesterday's meeting 的过去情境。offered 表与现在相反，would offer/offer 不用于已过去的事。"}, {"id": "x6-g-014", "level": "CET6", "type": "语法", "topic": "语法", "stem": "The novel, ___ in 1999, won the national literature prize.", "options": ["A. published", "B. publishing", "C. being published", "D. to publish"], "answer": "A", "analysis": "过去分词 published 作后置定语，表示小说“被出版”的被动完成状态。publishing 表主动进行，being published 强调进行中，to publish 表将来，均不符合已完成出版的语境。"}, {"id": "x6-g-015", "level": "CET6", "type": "语法", "topic": "语法", "stem": "Despite ___ heavy losses, the company remained optimistic.", "options": ["A. suffering", "B. suffer", "C. to suffer", "D. suffered"], "answer": "A", "analysis": "despite 是介词，后接动名词 suffering 作宾语。suffer 为动词原形，to suffer 为不定式，suffered 为过去式，均不能直接置于介词后。"}, {"id": "x6-g-016", "level": "CET6", "type": "语法", "topic": "语法", "stem": "Neither the manager nor the assistants ___ aware of the error.", "options": ["A. were", "B. was", "C. is", "D. has been"], "answer": "A", "analysis": "neither...nor... 连接主语时谓语就近一致，靠近 assistants（复数）故用 were。was/is 为单数，has been 单数完成时，均违反了就近原则。"}, {"id": "x6-g-017", "level": "CET6", "type": "语法", "topic": "语法", "stem": "Hardly ___ the office when the phone started ringing.", "options": ["A. had he left", "B. he had left", "C. did he leave", "D. he left"], "answer": "A", "analysis": "Hardly 置于句首引起部分倒装，且 hardly...when 表“刚……就……”，主句用过去完成时 had he left。he had left 未倒装，did he leave 时态错误，he left 未倒装。"}, {"id": "x6-g-018", "level": "CET6", "type": "语法", "topic": "语法", "stem": "The teacher demanded that the assignment ___ on time.", "options": ["A. be finished", "B. is finished", "C. was finished", "D. finishes"], "answer": "A", "analysis": "demand 后的宾语从句用(should)+动词原形虚拟语气，被动用 be finished。is/was finished 为陈述语气被动，finishes 主动单数，均不符合虚拟要求。"}, {"id": "x6-g-019", "level": "CET6", "type": "语法", "topic": "语法", "stem": "___ from the hill, the village looked peaceful and small.", "options": ["A. Seen", "B. Seeing", "C. To see", "D. See"], "answer": "A", "analysis": "过去分词 Seen 作状语，主语 the village 与 see 是被动关系（村庄被看）。Seeing 表主动，To see 表目的，See 动词原形不能作状语，均错。"}, {"id": "x6-g-020", "level": "CET6", "type": "语法", "topic": "语法", "stem": "It is essential that every citizen ___ the new regulation.", "options": ["A. know", "B. knows", "C. knew", "D. will know"], "answer": "A", "analysis": "It is essential that... 从句用(should)+动词原形虚拟语气，故用 know。knows 为单数陈述，knew 过去式，will know 将来时，均不符合虚拟语气要求。"}, {"id": "x6-g-021", "level": "CET6", "type": "语法", "topic": "语法", "stem": "The more you practice, ___ you will become at public speaking.", "options": ["A. the more confident", "B. more confident", "C. the most confident", "D. confident"], "answer": "A", "analysis": "“the+比较级..., the+比较级...”为固定句型表示“越……越……”，前半有 the more you practice，后半须用 the more confident。B 缺 the，C 用最高级，D 原级，均错。"}, {"id": "x6-g-022", "level": "CET6", "type": "语法", "topic": "语法", "stem": "Were it not for your help, I ___ the deadline.", "options": ["A. would have missed", "B. will miss", "C. missed", "D. miss"], "answer": "A", "analysis": "Were it not for 是 if it were not for 的倒装，表与现在/将来相反虚拟，但语境指已过的截止日期，主句用 would have missed 表示“本会错过”。will/miss/missed 均为陈述语气。"}, {"id": "x6-g-023", "level": "CET6", "type": "语法", "topic": "语法", "stem": "Such ___ his determination that nothing could stop him.", "options": ["A. was", "B. is", "C. has", "D. did"], "answer": "A", "analysis": "Such 置于句首引起主句完全倒装，正常语序 his determination was such that，倒装为 Such was his determination。is 现在时与后句 could 过去时不一致，has/did 不能接 such 表语。"}, {"id": "x6-g-024", "level": "CET6", "type": "语法", "topic": "语法", "stem": "The students, as well as the teacher, ___ excited about the field trip.", "options": ["A. are", "B. is", "C. was", "D. be"], "answer": "A", "analysis": "as well as 连接主语时，谓语动词与前面的核心主语一致；核心主语 the students 为复数，故用 are。is/was 为单数，be 为原形，均不符合主谓一致规则。"}, {"id": "x6-g-025", "level": "CET6", "type": "语法", "topic": "语法", "stem": "No sooner ___ the building than the fire alarm went off.", "options": ["A. had they entered", "B. they had entered", "C. did they enter", "D. they entered"], "answer": "A", "analysis": "No sooner 置于句首引起部分倒装，且 no sooner...than 表“刚……就……”，主句用过去完成时 had they entered。they had entered 未倒装，did 时态错误，they entered 未倒装。"}, {"id": "x6-r-001", "level": "CET6", "type": "阅读", "topic": "环境", "stem": "阅读以下短文并回答问题。\n\nGlobal biodiversity is declining at an unprecedented rate. A recent UN report warns that one million species face extinction, largely due to habitat loss, climate change, and overexploitation. While conservation efforts have saved some species, scientists argue that piecemeal actions are insufficient. They call for systemic change: reducing consumption, protecting ecosystems, and shifting to renewable energy.\n\nQuestion: What is the main cause of species extinction according to the passage?", "options": ["A. Habitat loss, climate change and overexploitation", "B. Lack of scientific research", "C. Natural evolution processes", "D. Overpopulation of certain species"], "answer": "A", "analysis": "原文明确提到物种面临灭绝“largely due to habitat loss, climate change, and overexploitation”，对应 A。B 文中未提及研究不足，C 与文意为人为因素相悖，D 过度繁衍并非文中所述原因。"}, {"id": "x6-r-002", "level": "CET6", "type": "阅读", "topic": "科技", "stem": "阅读以下短文并回答问题。\n\nArtificial intelligence is reshaping the labor market. A 2024 study found that while AI eliminates some routine jobs, it also creates roles in data analysis and AI supervision. The key challenge is reskilling: workers must learn to collaborate with machines rather than compete against them. Governments and firms are urged to invest in lifelong learning.\n\nQuestion: What is identified as the key challenge brought by AI?", "options": ["A. Reskilling the workforce", "B. Eliminating all routine jobs", "C. Replacing human managers", "D. Reducing corporate investment"], "answer": "A", "analysis": "短文指出“The key challenge is reskilling”，即劳动力再培训是核心挑战，对应 A。B 表述绝对（AI 也创造岗位），C 文中未提取代管理者，D 与文中呼吁加大投资相反。"}, {"id": "x6-r-003", "level": "CET6", "type": "阅读", "topic": "教育", "stem": "阅读以下短文并回答问题。\n\nTraditional exams are increasingly criticized for measuring memorization over understanding. Some universities now use portfolios and peer assessment to evaluate deeper learning. Proponents argue these methods better reflect real-world skills, though critics worry about consistency and fairness across evaluators.\n\nQuestion: Why do proponents favor portfolios and peer assessment?", "options": ["A. They better reflect real-world skills", "B. They are easier to grade", "C. They reduce the need for teachers", "D. They guarantee absolute fairness"], "answer": "A", "analysis": "原文说支持者认为这些方法“better reflect real-world skills”，对应 A。B 文中未说更易评分，C 与减少教师无关，D 与批评者担忧公平性（fairness）相反，且“保证绝对公平”过于绝对。"}, {"id": "x6-r-004", "level": "CET6", "type": "阅读", "topic": "经济", "stem": "阅读以下短文并回答问题。\n\nInflation has cooled from its peak, but central banks remain cautious. Raising interest rates too quickly could stall growth, while acting too slowly risks reigniting prices. Policymakers thus signal a “higher for longer” stance, keeping rates elevated until inflation durably returns to target.\n\nQuestion: What does the “higher for longer” stance mean?", "options": ["A. Keeping interest rates elevated for an extended period", "B. Immediately cutting rates to zero", "C. Abandoning inflation targets", "D. Printing more money"], "answer": "A", "analysis": "文中解释该立场为“keeping rates elevated until inflation durably returns to target”，即长期维持高利率，对应 A。B 立即降息、C 放弃目标、D 印钞均与谨慎维持高利率相反。"}, {"id": "x6-r-005", "level": "CET6", "type": "阅读", "topic": "社会", "stem": "阅读以下短文并回答问题。\n\nRemote work surged during the pandemic and has persisted. Supporters cite flexibility and saved commute time; opponents note isolation and blurred boundaries between work and life. A hybrid model—part office, part home—is emerging as a compromise that balances both sides.\n\nQuestion: What is the hybrid model presented as?", "options": ["A. A compromise balancing flexibility and social contact", "B. A full return to the office", "C. A permanent work-from-home policy", "D. A rejection of remote work"], "answer": "A", "analysis": "文中称混合模式是“a compromise that balances both sides”，兼顾灵活性与社交联系，对应 A。B 全面返岗、C 永久居家、D 拒绝远程均与“折中”相悖。"}, {"id": "x6-r-006", "level": "CET6", "type": "阅读", "topic": "健康", "stem": "阅读以下短文并回答问题。\n\nSleep deprivation is linked to impaired memory, weakened immunity, and higher accident risk. Yet many adults sacrifice sleep for work or screens. Experts recommend consistent schedules and limiting evening screen time, noting that quality matters as much as quantity.\n\nQuestion: According to experts, what matters about sleep?", "options": ["A. Both quality and quantity", "B. Only total hours", "C. Only deep sleep stages", "D. Late-night awakenings"], "answer": "A", "analysis": "原文明确“quality matters as much as quantity”，即质量与数量同样重要，对应 A。B 仅看时长片面，C 仅深度睡眠文中未强调，D 夜间觉醒是问题而非专家强调的重点。"}, {"id": "x6-r-007", "level": "CET6", "type": "阅读", "topic": "文化", "stem": "阅读以下短文并回答问题。\n\nCultural heritage sites face threats from tourism, pollution, and climate change. Digital preservation—3D scanning and virtual tours—offers a way to document and share them without physical damage. However, some argue that digital copies cannot replace the authenticity of experiencing the original.\n\nQuestion: What is a benefit of digital preservation mentioned?", "options": ["A. Documenting sites without physical damage", "B. Replacing original artifacts", "C. Eliminating the need for tourism", "D. Increasing ticket revenue"], "answer": "A", "analysis": "文中说数字化保存能“document and share them without physical damage”，对应 A。B 与文中“不能替代原作真实性”相反，C 消除旅游需求未提及，D 增加门票收入无关。"}, {"id": "x6-r-008", "level": "CET6", "type": "阅读", "topic": "工作", "stem": "阅读以下短文并回答问题。\n\nBurnout is rising among young professionals, driven by long hours and constant connectivity. Unlike ordinary fatigue, burnout involves cynicism and a sense of ineffectiveness. Experts suggest setting boundaries, taking real breaks, and seeking support before exhaustion becomes chronic.\n\nQuestion: How does burnout differ from ordinary fatigue?", "options": ["A. It includes cynicism and feeling ineffective", "B. It is cured by more sleep", "C. It only affects older workers", "D. It disappears on weekends"], "answer": "A", "analysis": "原文指出倦怠“involves cynicism and a sense of ineffectiveness”，区别于普通疲劳，对应 A。B 多睡眠可治愈错误，C 只影响年长者为反，D 周末消失与慢性特征矛盾。"}, {"id": "x6-r-009", "level": "CET6", "type": "阅读", "topic": "环境", "stem": "阅读以下短文并回答问题。\n\nCities are experimenting with “15-minute cities,” where daily needs are reachable within a short walk or bike ride. Proponents say this cuts emissions and improves well-being; critics fear it restricts mobility and raises property prices near centers. The concept remains debated.\n\nQuestion: What is a criticism of the 15-minute city concept?", "options": ["A. It may raise property prices near centers", "B. It increases car emissions", "C. It eliminates public transport", "D. It reduces walkable areas"], "answer": "A", "analysis": "文中批评者担忧“raises property prices near centers”，对应 A。B 与减少排放相反，C 取消公交未提及，D 缩减步行区与理念相反。"}, {"id": "x6-r-010", "level": "CET6", "type": "阅读", "topic": "科技", "stem": "阅读以下短文并回答问题。\n\nQuantum computing promises to solve problems impossible for classical machines, such as simulating molecules for drug discovery. But the technology is fragile and error-prone, requiring extreme cooling. Practical, widespread use may still be a decade away despite recent breakthroughs.\n\nQuestion: What is a major obstacle to quantum computing?", "options": ["A. Its fragility and need for extreme cooling", "B. Lack of useful problems", "C. High availability of classical computers", "D. Resistance from drug companies"], "answer": "A", "analysis": "原文指出该技术“fragile and error-prone, requiring extreme cooling”，对应 A。B 无有用问题错误（文中举了药物例子），C 传统电脑普及不是障碍，D 药企抵制未提及。"}, {"id": "x6-r-011", "level": "CET6", "type": "阅读", "topic": "教育", "stem": "阅读以下短文并回答问题。\n\nBilingual children often outperform monolinguals in tasks requiring mental flexibility. Learning two languages seems to strengthen the brain's executive control. However, the advantage is modest and depends on sustained practice in both languages.\n\nQuestion: What strengthens executive control according to the text?", "options": ["A. Learning and using two languages", "B. Starting school earlier", "C. Watching foreign films", "D. Taking memory pills"], "answer": "A", "analysis": "文中“Learning two languages seems to strengthen the brain's executive control”，对应 A。B 早入学、C 看外语片、D 记忆药丸均未在文中作为原因提及。"}, {"id": "x6-r-012", "level": "CET6", "type": "阅读", "topic": "经济", "stem": "阅读以下短文并回答问题。\n\nThe gig economy offers flexibility but leaves workers without benefits or stable income. A growing movement pushes for portable benefits—protections tied to the worker, not the employer. Supporters say this fits modern, fluid careers; skeptics question who funds it.\n\nQuestion: What are “portable benefits” designed to do?", "options": ["A. Attach protections to the worker, not the employer", "B. Increase gig platform profits", "C. Replace full-time employment", "D. Eliminate labor taxes"], "answer": "A", "analysis": "原文定义 portable benefits 为“protections tied to the worker, not the employer”，对应 A。B 增加平台利润非目的，C 取代全职就业未提，D 取消劳保税无关。"}, {"id": "x6-r-013", "level": "CET6", "type": "阅读", "topic": "社会", "stem": "阅读以下短文并回答问题。\n\nMisinformation spreads faster on social media than verified news, partly because false stories evoke stronger emotion. Platforms now use labels and algorithms to slow it, yet critics argue these tools are inconsistent and can be gamed by sophisticated actors.\n\nQuestion: Why does misinformation spread quickly?", "options": ["A. False stories provoke stronger emotion", "B. Platforms promote them for profit", "C. Verified news is banned", "D. Users cannot read"], "answer": "A", "analysis": "文中“false stories evoke stronger emotion”解释传播快的原因，对应 A。B 平台为盈利推广未提及，C 核实新闻被禁错误，D 用户不会阅读荒谬。"}, {"id": "x6-r-014", "level": "CET6", "type": "阅读", "topic": "健康", "stem": "阅读以下短文并回答问题。\n\nRegular exercise lowers the risk of chronic disease, yet only a minority meet guidelines. Barriers include time, cost, and unsafe neighborhoods. Urban design that adds parks and bike lanes can quietly nudge residents toward more activity.\n\nQuestion: How can urban design encourage exercise?", "options": ["A. By adding parks and bike lanes", "B. By banning cars completely", "C. By subsidizing gyms only", "D. By taxing unhealthy food"], "answer": "A", "analysis": "原文“Urban design that adds parks and bike lanes can nudge residents toward more activity”，对应 A。B 完全禁车过度，C 仅补贴健身房片面，D 对不健康食品征税未提及。"}, {"id": "x6-r-015", "level": "CET6", "type": "阅读", "topic": "文化", "stem": "阅读以下短文并回答问题。\n\nIndigenous languages are vanishing at alarming speed; of roughly 7,000 tongues, half may disappear this century. Revival efforts include recording elders and teaching children. Success requires community ownership, not top-down policy alone.\n\nQuestion: What is essential for language revival according to the passage?", "options": ["A. Community ownership of the effort", "B. Government bans on other languages", "C. Foreign tourism", "D. Universal compulsory schooling"], "answer": "A", "analysis": "文中“Success requires community ownership, not top-down policy alone”，对应 A。B 禁其他语言错误，C 外国旅游未提，D 强制义务教育与社区主导相悖。"}, {"id": "x6-r-016", "level": "CET6", "type": "阅读", "topic": "工作", "stem": "阅读以下短文并回答问题。\n\nAutomation anxiety is common, but history shows technology also creates new roles. The transition, however, is uneven: workers without adaptable skills bear the cost, while others thrive. Education systems must therefore teach adaptability, not just specific trades.\n\nQuestion: What should education systems teach according to the author?", "options": ["A. Adaptability, not just specific trades", "B. One lifelong trade", "C. How to avoid technology", "D. Only theoretical knowledge"], "answer": "A", "analysis": "原文“teach adaptability, not just specific trades”，对应 A。B 单一终身行业错误，C 回避技术相反，D 仅理论违背实用适应力。"}, {"id": "x6-r-017", "level": "CET6", "type": "阅读", "topic": "环境", "stem": "阅读以下短文并回答问题。\n\nPlastic recycling rates remain low because many plastics are hard to sort and reprocess. Chemical recycling, which breaks plastic into basic chemicals, offers hope but is energy-intensive and costly. Until it scales up, reducing use remains the most effective step.\n\nQuestion: What is the most effective current step regarding plastic?", "options": ["A. Reducing plastic use", "B. Chemical recycling everywhere", "C. Banning all packaging", "D. Shipping waste overseas"], "answer": "A", "analysis": "原文“reducing use remains the most effective step”，对应 A。B 化学回收尚未规模化，C 全面禁包装极端，D 外运废物非解决根本。"}, {"id": "x6-r-018", "level": "CET6", "type": "阅读", "topic": "科技", "stem": "阅读以下短文并回答问题。\n\nSocial media algorithms optimize for engagement, often surfacing divisive content because it holds attention. This can polarize public debate. Some researchers propose giving users more control over what the algorithm shows them.\n\nQuestion: Why might algorithms surface divisive content?", "options": ["A. It holds user attention longer", "B. It is always accurate", "C. Regulators require it", "D. It costs less to produce"], "answer": "A", "analysis": "文中“surfacing divisive content because it holds attention”，对应 A。B 总是准确错误，C 监管者要求未提，D 制作成本低无关。"}, {"id": "x6-r-019", "level": "CET6", "type": "阅读", "topic": "经济", "stem": "阅读以下短文并回答问题。\n\nA universal basic income (UBI) gives citizens regular cash with no conditions. Pilots show it reduces stress and improves some health outcomes, but critics warn it may discourage work and strain budgets. Its long-term effects remain uncertain.\n\nQuestion: What is a concern critics raise about UBI?", "options": ["A. It may discourage work and strain budgets", "B. It increases bureaucratic control", "C. It only helps the rich", "D. It causes inflation immediately"], "answer": "A", "analysis": "原文批评者担忧“discourage work and strain budgets”，对应 A。B 增加官僚控制未提，C 只帮富人错误，D 立即引发通胀过度肯定。"}, {"id": "x6-r-020", "level": "CET6", "type": "阅读", "topic": "社会", "stem": "阅读以下短文并回答问题。\n\nUrban loneliness is rising even as cities grow denser, as weak community ties replace close neighbors. Shared spaces like libraries and community gardens can rebuild connection. Small, frequent interactions matter more than grand events.\n\nQuestion: What helps rebuild community connection in cities?", "options": ["A. Shared spaces like libraries and gardens", "B. Moving to rural areas", "C. Larger crowded events", "D. Avoiding neighbors"], "answer": "A", "analysis": "文中“Shared spaces like libraries and community gardens can rebuild connection”，对应 A。B 搬到农村与城市语境无关，C 大型拥挤活动不如日常小互动，D 回避邻居相反。"}, {"id": "x6-r-021", "level": "CET6", "type": "阅读", "topic": "健康", "stem": "阅读以下短文并回答问题。\n\nProcessed food is cheap and convenient but linked to obesity and diabetes. Reforms like clearer labels and taxes on sugary drinks aim to nudge healthier choices. Yet personal education remains crucial, since information alone rarely changes habit.\n\nQuestion: Why is personal education still crucial?", "options": ["A. Information alone rarely changes habit", "B. Labels are illegal", "C. Taxes do not exist", "D. Food is free"], "answer": "A", "analysis": "原文“personal education remains crucial, since information alone rarely changes habit”，对应 A。B 标签非法错误，C 税不存在错误，D 食物免费荒谬。"}, {"id": "x6-r-022", "level": "CET6", "type": "阅读", "topic": "文化", "stem": "阅读以下短文并回答问题。\n\nMuseums are shifting from passive display to active engagement, using apps and interactive exhibits. This attracts younger visitors but raises questions about depth versus entertainment. Curators must balance fun with substance.\n\nQuestion: What challenge do museums face with interactive exhibits?", "options": ["A. Balancing fun with educational substance", "B. Running out of artifacts", "C. Banning smartphones", "D. Losing older visitors entirely"], "answer": "A", "analysis": "文中“raises questions about depth versus entertainment”及“balance fun with substance”，对应 A。B 文物耗尽未提，C 禁手机相反，D 完全失去老年观众过度。"}, {"id": "x6-r-023", "level": "CET6", "type": "阅读", "topic": "工作", "stem": "阅读以下短文并回答问题。\n\nFour-day work weeks, tested in several countries, show maintained or improved productivity with better well-being. Skeptics note results vary by industry and that some roles cannot compress hours. Wider adoption needs careful design.\n\nQuestion: What is a limitation of the four-day week?", "options": ["A. Some roles cannot compress hours", "B. It always lowers output", "C. Workers quit more", "D. It requires no planning"], "answer": "A", "analysis": "原文“some roles cannot compress hours”说明局限，对应 A。B 总是降低产出与文中产出维持/提升相反，C 离职增多未提，D 无需规划错误。"}, {"id": "x6-r-024", "level": "CET6", "type": "阅读", "topic": "科技", "stem": "阅读以下短文并回答问题。\n\nFacial recognition aids security but sparks privacy fears, as databases can be misused or hacked. Regulations in some regions now require consent and limit retention. The debate pits safety against civil liberty.\n\nQuestion: What privacy concern does facial recognition raise?", "options": ["A. Databases can be misused or hacked", "B. It is too expensive", "C. It never works", "D. It replaces passwords"], "answer": "A", "analysis": "文中“databases can be misused or hacked”是隐私担忧，对应 A。B 太贵未提，C 从不奏效错误，D 取代密码非隐私担忧。"}, {"id": "x6-r-025", "level": "CET6", "type": "阅读", "topic": "教育", "stem": "阅读以下短文并回答问题。\n\nCritical thinking—questioning assumptions and weighing evidence—is now seen as core to education, beyond rote knowledge. Schools increasingly use debates and case studies. Yet standardized tests still reward memory, creating tension between goals and measurement.\n\nQuestion: What tension exists in education today?", "options": ["A. Goals of critical thinking versus memory-based tests", "B. Too few teachers", "C. No use of technology", "D. Banning of debates"], "answer": "A", "analysis": "文中“creating tension between goals and measurement”，目标（批判思维）与测验（记忆）冲突，对应 A。B 教师少未提，C 不用科技相反，D 禁辩论错误。"}, {"id": "x6-c-001", "level": "CET6", "type": "完形", "topic": "社会", "stem": "完形填空：阅读短文，选择最合适的词。\n\nModern cities depend on complex systems that most citizens never (1)___. When one system fails, others can collapse in a chain reaction. Resilience, therefore, means designing with failure in (2)___, not assuming perfect operation. Planners who (3)___ this lesson build cities that recover faster.", "options": ["A. notice / mind / learn", "B. notice / mind / ignore", "C. ignore / body / learn", "D. create / mind / learn"], "answer": "A", "analysis": "第1空 citizens never notice（从不留意）符合“依赖复杂系统却无感知”；第2空 in mind 是固定搭配“考虑到”；第3空 learn this lesson（吸取教训）语义通顺。B 的 ignore 第3空矛盾，C 的 ignore/in body 错，D 的 create 第1空不符。"}, {"id": "x6-c-002", "level": "CET6", "type": "完形", "topic": "环境", "stem": "完形填空：阅读短文，选择最合适的词。\n\nClimate adaptation is no longer optional. Coastal towns must (1)___ rising seas by building barriers or relocating. The cost is high, yet in(2)___ is the price of doing nothing. Communities that plan early suffer (3)___ losses later.", "options": ["A. confront / action / fewer", "B. confront / action / more", "C. ignore / action / fewer", "D. confront / silence / fewer"], "answer": "A", "analysis": "第1空 confront（应对）海平面上升；第2空 in action 意为“采取行动”，与“无所作为的代价”对应；第3空 early planning 带来 fewer losses（更少损失）。B 的 more 与早规划益处相反，C 的 ignore 矛盾，D 的 silence 不构成固定搭配。"}, {"id": "x6-c-003", "level": "CET6", "type": "完形", "topic": "科技", "stem": "完形填空：阅读短文，选择最合适的词。\n\nAlgorithms shape what we see, yet they are not (1)___. They reflect the choices of their designers and the data they were (2)___ on. Understanding this helps users stay (3)___ rather than passive consumers of information.", "options": ["A. neutral / trained / critical", "B. neutral / trained / passive", "C. biased / built / critical", "D. neutral / ignored / critical"], "answer": "A", "analysis": "第1空 neutral（中立）与后文“反映设计者选择”形成对比，说明算法并非中立；第2空 trained on data 是机器学习固定搭配；第3空 stay critical（保持批判性）呼应而非被动。B 的 passive 与 rather than passive 矛盾，C 的 biased 与 not 冲突，D 的 ignored 语义错。"}, {"id": "x6-c-004", "level": "CET6", "type": "完形", "topic": "教育", "stem": "完形填空：阅读短文，选择最合适的词。\n\nGood teaching is not about (1)___ facts but inspiring curiosity. Students remember lessons that (2)___ them emotionally long after they forget details. A teacher's warmth can (3)___ a lifelong love of learning.", "options": ["A. dumping / move / spark", "B. sharing / move / spark", "C. dumping / bore / spark", "D. dumping / move / kill"], "answer": "A", "analysis": "第1空 dump facts（灌输事实）与 inspire curiosity 对比；第2空 move them emotionally（情感上打动）符合记忆规律；第3空 spark（激发）热爱。B 的 sharing 语气过中性不如 dump 形成对比，C 的 bore 与记住矛盾，D 的 kill 与热爱相反。"}, {"id": "x6-c-005", "level": "CET6", "type": "完形", "topic": "经济", "stem": "完形填空：阅读短文，选择最合适的词。\n\nSmall businesses are the (1)___ of local economies, yet they struggle to access credit. When banks (2)___, community lenders often step in. Supporting them is not charity but a (3)___ for shared prosperity.", "options": ["A. backbone / retreat / investment", "B. backbone / advance / investment", "C. burden / retreat / waste", "D. backbone / retreat / loss"], "answer": "A", "analysis": "第1空 backbone（支柱）比喻小企业的核心作用；第2空 retreat（退缩）指银行收紧信贷；第3空 investment（投资）对应 shared prosperity。B 的 advance 与挣扎语境相反，C 的 burden/waste 贬义不符，D 的 loss 与繁荣投资矛盾。"}, {"id": "x6-c-006", "level": "CET6", "type": "完形", "topic": "健康", "stem": "完形填空：阅读短文，选择最合适的词。\n\nStress is not always (1)___; mild pressure can sharpen focus. The problem arises when it becomes (2)___ and unrelenting, (3)___ both body and mind over time.", "options": ["A. harmful / chronic / draining", "B. harmful / brief / draining", "C. helpful / chronic / draining", "D. harmful / chronic / restoring"], "answer": "A", "analysis": "第1空 harmful 与后文“适度压力有益”形成 not always harmful；第2空 chronic（慢性的、长期的）对应 unrelenting；第3空 draining（消耗）符合长期压力后果。B 的 brief 与 unrelenting 矛盾，C 的 helpful 与 not always 冲突，D 的 restoring 语义相反。"}, {"id": "x6-c-007", "level": "CET6", "type": "完形", "topic": "文化", "stem": "完形填空：阅读短文，选择最合适的词。\n\nFestivals (1)___ a community's values and history. They are not mere entertainment but moments when identity is (2)___ across generations. Losing them means losing a (3)___ to the past.", "options": ["A. reflect / passed / link", "B. reflect / passed / break", "C. hide / passed / link", "D. reflect / forgotten / link"], "answer": "A", "analysis": "第1空 reflect（反映）价值观与历史；第2空 passed across generations（代代相传）固定搭配；第3空 link（联系）通往过去。B 的 break 与传承相反，C 的 hide 矛盾，D 的 forgotten 与传递冲突。"}, {"id": "x6-c-008", "level": "CET6", "type": "完形", "topic": "工作", "stem": "完形填空：阅读短文，选择最合适的词。\n\nTrust is earned slowly and lost quickly at work. A leader who (1)___ credit to the team builds loyalty, while one who (2)___ it breeds resentment. Culture is shaped less by slogans than by (3)___ behavior.", "options": ["A. shares / hoards / daily", "B. shares / shares / daily", "C. hoards / hoards / daily", "D. shares / hoards / rare"], "answer": "A", "analysis": "第1空 shares credit（分享功劳）建立忠诚；第2空 hoards（独占）引发怨恨，与 shares 形成对比；第3空 daily behavior（日常行为）比口号更重要。B 的 shares 第二空矛盾，C 全 hoards 与第一空逻辑反，D 的 rare 与“日常塑造”不符。"}, {"id": "x6-c-009", "level": "CET6", "type": "完形", "topic": "环境", "stem": "完形填空：阅读短文，选择最合适的词。\n\nUrban trees do more than (1)___ streets; they cool cities and absorb noise. Yet many are planted without (2)___ for their mature size, leading to cracked sidewalks. Planning with foresight (3)___ such problems.", "options": ["A. decorate / regard / prevents", "B. decorate / regard / causes", "C. darken / regard / prevents", "D. decorate / neglect / prevents"], "answer": "A", "analysis": "第1空 decorate（美化）街道；第2空 without regard for（不顾及）成熟尺寸；第3空 prevents（预防）问题。B 的 causes 与有远见规划矛盾，C 的 darken 语义错，D 的 neglect 与 without regard 重复且不当。"}, {"id": "x6-c-010", "level": "CET6", "type": "完形", "topic": "科技", "stem": "完形填空：阅读短文，选择最合适的词。\n\nData is often called the new oil, but unlike oil it is (1)___ through use. More data can improve a model, yet (2)___ data can mislead it. Quality, not (3)___, decides value.", "options": ["A. enriched / biased / quantity", "B. enriched / clean / quantity", "C. depleted / biased / quantity", "D. enriched / biased / quality"], "answer": "A", "analysis": "第1空 enriched（被丰富）对应“越用越多”区别于石油消耗；第2空 biased（有偏的）数据会误导；第3空 quality not quantity（质量而非数量）点题。B 的 clean 与 mislead 矛盾，C 的 depleted 与数据特性相反，D 的 quality 与 not 冲突。"}, {"id": "x6-c-011", "level": "CET6", "type": "完形", "topic": "社会", "stem": "完形填空：阅读短文，选择最合适的词。\n\nEmpathy declines when people interact mainly through screens. A (1)___ smile or a hesitant voice carries meaning texts cannot. Rebuilding face-to-face habits is (2)___ but (3)___ for healthy communities.", "options": ["A. genuine / hard / essential", "B. genuine / easy / essential", "C. fake / hard / essential", "D. genuine / hard / optional"], "answer": "A", "analysis": "第1空 genuine（真诚的）微笑承载文本没有的意义；第2空 hard（困难）重建习惯；第3空 essential（必要）对健康社区。B 的 easy 与现实矛盾，C 的 fake 与真诚相反，D 的 optional 与 essential 冲突。"}, {"id": "x6-c-012", "level": "CET6", "type": "完形", "topic": "经济", "stem": "完形填空：阅读短文，选择最合适的词。\n\nInflation erodes savings, (1)___ those on fixed incomes most. Central banks raise rates to (2)___ it, but that can slow hiring. Policymaking is a (3)___ of trade-offs.", "options": ["A. hitting / curb / series", "B. hitting / fuel / series", "C. sparing / curb / series", "D. hitting / curb / lack"], "answer": "A", "analysis": "第1空 hitting（打击）固定收入者最甚；第2空 curb（遏制）通胀；第3空 a series of trade-offs（一系列权衡）。B 的 fuel 与遏制相反，C 的 sparing（豁免）与 most 矛盾，D 的 lack 与权衡现实不符。"}, {"id": "x6-c-013", "level": "CET6", "type": "完形", "topic": "教育", "stem": "完形填空：阅读短文，选择最合适的词。\n\nChildren learn language by (1)___, not by studying rules first. They (2)___ patterns from context long before they can name them. Formal instruction later (3)___ what intuition already built.", "options": ["A. immersion / absorb / refines", "B. immersion / reject / refines", "C. isolation / absorb / refines", "D. immersion / absorb / destroys"], "answer": "A", "analysis": "第1空 immersion（沉浸）习得语言；第2空 absorb（吸收）语境中的模式；第3空 refines（精炼）直觉已建立的东西。B 的 reject 矛盾，C 的 isolation 与沉浸式相反，D 的 destroys 与 refine 冲突。"}, {"id": "x6-c-014", "level": "CET6", "type": "完形", "topic": "健康", "stem": "完形填空：阅读短文，选择最合适的词。\n\nSleep is when the brain (1)___ the day's memories. Skipping it (2)___ learning and mood. Prioritizing rest is not laziness but a (3)___ of performance.", "options": ["A. consolidates / impairs / foundation", "B. consolidates / improves / foundation", "C. erases / impairs / foundation", "D. consolidates / impairs / luxury"], "answer": "A", "analysis": "第1空 consolidates（巩固）记忆是睡眠功能；第2空 impairs（损害）学习与情绪；第3空 foundation（基础）而非奢侈。B 的 improves 与 skipping 负面矛盾，C 的 erases 错误，D 的 luxury 与基础重要性相反。"}, {"id": "x6-c-015", "level": "CET6", "type": "完形", "topic": "文化", "stem": "完形填空：阅读短文，选择最合适的词。\n\nTranslation is more than swapping words; it (1)___ meaning across cultures. A skilled translator (2)___ nuance that a machine may miss, (3)___ the author's intent faithfully.", "options": ["A. carries / preserves / conveying", "B. carries / distorts / conveying", "C. loses / preserves / conveying", "D. carries / preserves / hiding"], "answer": "A", "analysis": "第1空 carries（传递）意义跨越文化；第2空 preserves（保留）机器可能遗漏的细微差别；第3空 conveying（传达）作者意图。B 的 distorts 与 faithfully 矛盾，C 的 loses 与传递相反，D 的 hiding 冲突。"}, {"id": "x6-t-001", "level": "CET6", "type": "翻译", "topic": "文化", "stem": "请将下列句子翻译成英文：随着 globalization 的深入，保护非物质文化遗产已成为国际社会共同关注的议题。", "answer": "With the deepening of globalization, protecting intangible cultural heritage has become a shared concern of the international community.", "analysis": "核心结构为“With the deepening of...，主句 has become...”。“非物质文化遗产”固定译法 intangible cultural heritage；“共同关注的议题”译为 a shared concern。注意用现在完成时体现“已成为”的当前状态，避免逐字直译。"}, {"id": "x6-t-002", "level": "CET6", "type": "翻译", "topic": "环境", "stem": "请将下列句子翻译成英文：只有采取紧急且协调一致的行动，我们才能遏制气候变化带来的灾难性后果。", "answer": "Only by taking urgent and coordinated action can we curb the catastrophic consequences brought by climate change.", "analysis": "“Only by + 动名词”置于句首引起部分倒装，主句用 can we...。关键词：coordinated action（协调一致的行动），curb（遏制），catastrophic consequences（灾难性后果）。倒装是得分点，需把 can 提至主语 we 前。"}, {"id": "x6-t-003", "level": "CET6", "type": "翻译", "topic": "教育", "stem": "请将下列句子翻译成英文：研究表明，批判性思维能力的培养应贯穿于基础教育的各个阶段。", "answer": "Research shows that the cultivation of critical thinking should run through every stage of basic education.", "analysis": "主干“Research shows that...”后接宾语从句。“批判性思维能力的培养”译为 the cultivation of critical thinking；“贯穿于”用 run through 或 be integrated into 均可；“各个阶段”为 every stage。注意 that 从句用 should + 动词原形表建议性常态。"}, {"id": "x6-t-004", "level": "CET6", "type": "翻译", "topic": "科技", "stem": "请将下列句子翻译成英文：人工智能的迅速发展既创造了新的就业机会，也对传统行业构成了前所未有的挑战。", "answer": "The rapid development of artificial intelligence has both created new job opportunities and posed unprecedented challenges to traditional industries.", "analysis": "结构“...has both created...and posed...”并列谓语。“前所未有的”用 unprecedented；“对……构成挑战”为 pose challenges to。注意现在完成时 has 体现对当下的持续影响，both...and... 连接两个动宾结构保持平行。"}, {"id": "x6-t-005", "level": "CET6", "type": "翻译", "topic": "经济", "stem": "请将下列句子翻译成英文：尽管面临诸多困难，该公司仍致力于拓展海外市场以提升竞争力。", "answer": "Despite many difficulties, the company remains committed to expanding overseas markets to enhance its competitiveness.", "analysis": "“尽管”用 Despite + 名词短语（many difficulties）或 Although 从句。“致力于”译为 remain committed to（to 为介词，后接动名词 expanding）；“拓展海外市场”expanding overseas markets；“以提升”用不定式 to enhance 表目的。注意 committed to 后须接 -ing。"}, {"id": "x6-t-006", "level": "CET6", "type": "翻译", "topic": "社会", "stem": "请将下列句子翻译成英文：城市化进程中，如何平衡经济发展与公共服务供给，是各国政府必须面对的难题。", "answer": "In the process of urbanization, how to balance economic development with the provision of public services is a challenge that governments of all countries must face.", "analysis": "主语为 how to 不定式短语，“平衡……与……”用 balance A with B；“公共服务供给”译为 the provision of public services；“必须面对的难题”用 a challenge that...must face 定语从句。注意 urbanization 与 provision 等名词化表达更正式。"}, {"id": "x6-t-007", "level": "CET6", "type": "翻译", "topic": "健康", "stem": "请将下列句子翻译成英文：规律的体育锻炼不仅有助于预防慢性疾病，还能显著改善人们的心理健康。", "answer": "Regular physical exercise not only helps prevent chronic diseases but also significantly improves people's mental health.", "analysis": "结构“not only...but also...”连接并列谓语。“预防慢性疾病”prevent chronic diseases（help 后接动词原形）；“显著改善”significantly improve；“心理健康”mental health。注意 not only 与 but also 后语法成分须平行（均为动词短语）。"}, {"id": "x6-t-008", "level": "CET6", "type": "翻译", "topic": "工作", "stem": "请将下列句子翻译成英文：越来越多的年轻人倾向于选择能够兼顾工作与生活平衡的职业。", "answer": "A growing number of young people tend to choose careers that allow them to balance work and life.", "analysis": "“越来越多”译为 A growing number of；“倾向于”tend to；“兼顾……平衡”balance work and life；“能够……”用 that 引导定语从句修饰 careers。注意 tend to 后接动词原形 choose，定语从句谓语 allow 与 careers 复数一致。"}, {"id": "x6-t-009", "level": "CET6", "type": "翻译", "topic": "环境", "stem": "请将下列句子翻译成英文：为了实现可持续发展，我们必须转变过度依赖化石燃料的能源消费模式。", "answer": "To achieve sustainable development, we must transform the energy consumption pattern that overly relies on fossil fuels.", "analysis": "“为了实现”用 To achieve 不定式表目的；“转变”transform；“过度依赖”overly rely on 或 excessive reliance on；“化石燃料”fossil fuels。注意 sustainable development 为固定术语，定语从句 that relies on 修饰 pattern 保持单数与 pattern 一致。"}, {"id": "x6-t-010", "level": "CET6", "type": "翻译", "topic": "文化", "stem": "请将下列句子翻译成英文：这部纪录片生动地展现了传统手工艺人在现代社会中所面临的困境与坚持。", "answer": "This documentary vividly depicts the dilemmas and perseverance faced by traditional craftsmen in modern society.", "analysis": "主干“This documentary depicts...”。“生动地”vividly；“展现”用 depicts 或 portrays；“困境与坚持”译为 dilemmas and perseverance（抽象名词并列）；“面临”用 faced by 过去分词作后置定语。注意 craftsmen 为 craftsman 复数，perseverance 不可数。"}, {"id": "x6-l-001", "level": "CET6", "type": "听力", "topic": "工作", "stem": "听力理解（对话）：男：The deadline for the project is next Monday. 女：But we're still waiting for the client's feedback. 男：Then we'd better prioritize the report section. 问题：What will they likely do next?", "answer": "They will focus on completing the report section first while awaiting client feedback.", "analysis": "对话核心：项目周一截止但仍在等客户反馈，男方建议 prioritize the report section（优先做报告部分）。听力要点是捕捉“prioritize”与“waiting for feedback”的因果关系，推断下一步是先把能做的报告部分搞定，而非空等客户。"}, {"id": "x6-l-002", "level": "CET6", "type": "听力", "topic": "环境", "stem": "听力理解（独白）：The city council voted to ban single-use plastics from next year. Restaurants must switch to biodegradable packaging. Fines will apply to violators. 问题：What is required of restaurants?", "answer": "Restaurants must switch to biodegradable packaging and face fines if they violate the ban.", "analysis": "独白关键信息：council 投票明年禁一次性塑料，餐馆必须改用 biodegradable packaging（可降解包装），违规罚款。听力重点为捕捉 must switch to 与 fines 两个义务性信息，避免把“ban”误听为仅限消费者。"}, {"id": "x6-l-003", "level": "CET6", "type": "听力", "topic": "教育", "stem": "听力理解（对话）：女：I failed the history exam again. 男：Maybe you should try group study instead of reading alone. 女：Good idea, I'll join the study group. 问题：What advice does the man give?", "answer": "He suggests trying group study rather than studying alone.", "analysis": "对话中男方建议“try group study instead of reading alone”，女方接受。听力要点是识别建议句型 should + try...instead of...，区分建议内容与女方原本行为（alone reading），答案须体现 group study 与 alone 的对比。"}, {"id": "x6-l-004", "level": "CET6", "type": "听力", "topic": "经济", "stem": "听力理解（新闻）：The central bank raised its key interest rate by 0.5 percent to combat inflation. Economists say further hikes are possible if prices keep rising. 问题：Why did the central bank raise rates?", "answer": "To combat inflation, with possible further hikes if prices keep rising.", "analysis": "新闻要点：央行加息 0.5% 是为 combat inflation（对抗通胀）；经济学家称若物价继续涨可能 further hikes。听力关键是捕捉目的状语 to combat 与条件句 if prices keep rising，避免把“further hikes”当作已决定事项。"}, {"id": "x6-l-005", "level": "CET6", "type": "听力", "topic": "科技", "stem": "听力理解（对话）：男：My phone's battery dies in two hours. 女：Have you tried disabling background apps? That extends life significantly. 男：I'll check the settings now. 问题：What solution is suggested?", "answer": "Disabling background apps to extend battery life, which the man will try in settings.", "analysis": "对话建议：女方提议 disabling background apps（关闭后台应用）以显著延长续航，男方答应去设置里查。听力要点是识别建议动作 disable 与效果 extends life，并抓住男方将付诸行动的结尾。"}, {"id": "x6-l-006", "level": "CET6", "type": "听力", "topic": "健康", "stem": "听力理解（独白）：Doctors recommend at least 150 minutes of moderate exercise weekly. Walking counts, and consistency matters more than intensity. 问题：What do doctors recommend?", "answer": "At least 150 minutes of moderate weekly exercise such as walking, with consistency valued over intensity.", "analysis": "独白要点：医生推荐每周至少 150 分钟中等强度运动，步行算数，坚持比强度重要。听力关键是数字 150 minutes、moderate 与 consistency matters more than intensity 的对比，避免把 walking 误听为唯一方式。"}, {"id": "x6-l-007", "level": "CET6", "type": "听力", "topic": "社会", "stem": "听力理解（对话）：女：The new park opened, but it's crowded every evening. 男：That's because it's the only green space nearby. 女：True, we need more of them. 问题：What does the woman conclude?", "answer": "She concludes that the neighborhood needs more green spaces, not just one crowded park.", "analysis": "对话逻辑：新公园每晚拥挤，因为附近唯一绿地；女方总结“we need more of them”。听力要点是捕捉因果（only green space）与结论句 need more，推断她主张增加而非减少绿地。"}, {"id": "x6-l-008", "level": "CET6", "type": "听力", "topic": "文化", "stem": "听力理解（独白）：The museum will host a free night every Friday, featuring local artists and guided tours. Regular admission applies on other days. 问题：When is admission free?", "answer": "Admission is free every Friday night, while other days require regular admission.", "analysis": "独白要点：博物馆每周五晚免费夜，含本地艺术家与导览；其余日子正常收费。听力关键是锁定时间 every Friday 与 free 的对应，并留意 other days 收费的对比信息，避免扩大免费范围。"}, {"id": "x6-l-009", "level": "CET6", "type": "听力", "topic": "工作", "stem": "听力理解（对话）：男：Should we hire another intern? 女：Our budget is tight, but the workload is heavy. 男：Let's reassign tasks first before hiring. 问题：What is the man's decision?", "answer": "He decides to reassign tasks first and delay hiring another intern due to a tight budget.", "analysis": "对话中女方指出预算紧但工作量大，男方决定先 reassign tasks 再考虑招聘。听力要点是识别决策句 Let's...first before hiring，结合 budget is tight 推断暂不招人，先内部调配。"}, {"id": "x6-l-010", "level": "CET6", "type": "听力", "topic": "教育", "stem": "听力理解（新闻）：A new app uses AI to give students instant feedback on essays, but teachers warn it shouldn't replace human grading. 问题：What is teachers' concern?", "answer": "Teachers warn the AI app should not replace human grading of essays.", "analysis": "新闻要点：新 AI 应用可即时反馈作文，但教师警告不应取代人工评分。听力关键是 but 后的转折——teachers warn it shouldn't replace human grading，抓住转折词与 replace 这一核心担忧。"}, {"id": "xi-r-001", "level": "IELTS", "type": "阅读", "topic": "环境", "stem": "Passage excerpt: 'The national carbon tax was introduced in 2019 and applied to all major emitters.' According to the passage, the carbon tax was introduced before 2020.", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "A", "analysis": "原文明确说明碳税于2019年推出，因此‘在2020年前实施’与文意一致，选 TRUE。FALSE 用于文意相反的情况，而此处时间表述相符。NOT GIVEN 用于文中未提及，本文已提供确切年份，故不适用。"}, {"id": "xi-r-002", "level": "IELTS", "type": "阅读", "topic": "科技", "stem": "Passage excerpt: 'Researchers observed a slight increase in battery efficiency but did not measure long-term degradation.' The study confirmed that the batteries last more than ten years.", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "C", "analysis": "文中只提到效率略有提升且未测量长期衰减，并未给出‘可使用十年以上’的任何结论。因此该陈述属于文中未提及的信息，选 NOT GIVEN。TRUE 需要明确支持，FALSE 需要明确否定，二者均缺乏依据。"}, {"id": "xi-r-003", "level": "IELTS", "type": "阅读", "topic": "教育", "stem": "Passage excerpt: 'School enrolment rose sharply after the reform, yet dropout rates remained unchanged.' The education reform reduced the number of students leaving school early.", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "B", "analysis": "原文指出辍学率‘保持不变’，与‘改革降低了早退学生人数’直接矛盾，因此选 FALSE。TRUE 与文意相反；NOT GIVEN 不适用，因为文中已明确说明辍学率未变。"}, {"id": "xi-r-004", "level": "IELTS", "type": "阅读", "topic": "社会", "stem": "Passage excerpt: 'Urban populations grew, and commuting times increased as a result.' The growth of cities caused longer journeys to work.", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "A", "analysis": "原文用‘as a result’表明通勤时间增加是城市人口增长的结果，因果关系明确，选 TRUE。FALSE 用于否定该关系，NOT GIVEN 用于缺少因果表述，此处均不符合。"}, {"id": "xi-r-005", "level": "IELTS", "type": "阅读", "topic": "经济", "stem": "Passage excerpt: 'Exports fell by 3% while domestic consumption stayed steady.' The country's total economic output declined during the period.", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "C", "analysis": "文中只提到出口下降3%、国内消费平稳，并未说明整体经济产出的变化。整体 GDP 是否下降文中未给出，故选 NOT GIVEN。TRUE 与 FALSE 都需要对总量下结论，而文中信息不足。"}, {"id": "xi-r-006", "level": "IELTS", "type": "阅读", "topic": "健康", "stem": "Passage excerpt: 'The new vaccine showed 90% effectiveness in clinical trials conducted in 2021.' The vaccine was proven safe for children under five.", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "C", "analysis": "原文仅报告了疫苗在2021年试验中的有效性（90%），并未提及五岁以下儿童的安全性数据。因此该陈述文中未提及，选 NOT GIVEN。TRUE 与 FALSE 都缺乏文本支撑。"}, {"id": "xi-r-007", "level": "IELTS", "type": "阅读", "topic": "文化", "stem": "Passage excerpt: 'Traditional festivals declined in cities but remained vibrant in rural areas.' City dwellers celebrate traditional festivals more than rural residents.", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "B", "analysis": "原文明确指出传统节日在城市衰退、在农村依然活跃，二者对比与陈述相反，选 FALSE。TRUE 颠倒了城乡情况；NOT GIVEN 不适用，因为对比信息已经明确给出。"}, {"id": "xi-r-008", "level": "IELTS", "type": "阅读", "topic": "媒体", "stem": "Passage excerpt: 'News outlets increased their online presence, though print circulation continued to fall.' The total number of readers across all formats grew.", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "C", "analysis": "文中说明线上影响力增加、纸质发行量下降，但并未给出所有渠道读者总数的变化。整体读者量是否增长无法判断，选 NOT GIVEN。TRUE 与 FALSE 都需要总量结论，文中未提供。"}, {"id": "xi-r-009", "level": "IELTS", "type": "阅读", "topic": "环境", "stem": "Passage excerpt: 'Deforestation slowed after the 2015 ban, but illegal logging persisted.' The 2015 ban completely stopped illegal logging.", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "B", "analysis": "原文明确说‘非法砍伐仍然存在’，与‘完全阻止’直接矛盾，选 FALSE。TRUE 与文意相反；NOT GIVEN 不适用，因为文中已给出明确相反信息。"}, {"id": "xi-r-010", "level": "IELTS", "type": "阅读", "topic": "科技", "stem": "Passage excerpt: 'The algorithm processed images faster, but its accuracy was no better than previous models.' The new algorithm was more accurate than earlier systems.", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "B", "analysis": "原文指出新算法准确性‘并不比此前模型更好’，直接否定了‘更准确’的说法，选 FALSE。TRUE 与文意相反；NOT GIVEN 不适用，因为准确性对比已经明确。"}, {"id": "xi-r-011", "level": "IELTS", "type": "阅读", "topic": "教育", "stem": "Passage excerpt: 'Funding for arts programmes was cut, and science budgets were expanded.' More money was allocated to science than to the arts.", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "A", "analysis": "原文说明艺术项目经费被削减、科学预算扩大，二者对比支持‘科学拨款多于艺术’，选 TRUE。FALSE 与文意相反；NOT GIVEN 不适用，因为资金方向已明确。"}, {"id": "xi-r-012", "level": "IELTS", "type": "阅读", "topic": "社会", "stem": "Passage excerpt: 'Volunteer numbers doubled, although participation by young people declined.' Most volunteers were under the age of 25.", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "C", "analysis": "文中提到志愿者总数翻倍但年轻人参与下降，并未说明志愿者中多数是否低于25岁。该比例信息文中未提供，选 NOT GIVEN。TRUE 与 FALSE 都需要明确的年龄分布数据。"}, {"id": "xi-r-013", "level": "IELTS", "type": "阅读", "topic": "经济", "stem": "Passage excerpt: 'Inflation reached 5% in 2022, the highest in a decade.' Prices were stable throughout 2022.", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "B", "analysis": "原文指出2022年通胀达5%、为十年来最高，与‘价格全年稳定’完全矛盾，选 FALSE。TRUE 与文意相反；NOT GIVEN 不适用，因为通胀数据已明确否定稳定。"}, {"id": "xi-r-014", "level": "IELTS", "type": "阅读", "topic": "健康", "stem": "Passage excerpt: 'Exercise reduced stress levels in the study group, but sleep quality was not assessed.' Physical activity improved participants' sleep.", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "C", "analysis": "原文说明锻炼降低了压力，但未评估睡眠质量，因此‘改善睡眠’缺乏文本依据。该结论文中未提及，选 NOT GIVEN。TRUE 需要明确支持，FALSE 需要明确否定，二者均无。"}, {"id": "xi-r-015", "level": "IELTS", "type": "阅读", "topic": "文化", "stem": "Passage excerpt: 'The museum attracted record visitors after free admission was introduced.' Free entry led to a rise in museum attendance.", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "A", "analysis": "原文表明免费开放后参观人数创纪录，因果关系清晰，支持‘免费导致参观人数上升’，选 TRUE。FALSE 与文意相反；NOT GIVEN 不适用，因为前后变化已经明确对应。"}, {"id": "xi-r-016", "level": "IELTS", "type": "阅读", "topic": "媒体", "stem": "Passage excerpt: 'Social media amplified both accurate and misleading reports during the crisis.' The platform only spread false information.", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "B", "analysis": "原文说明平台同时放大了准确和误导性信息，与‘只传播虚假信息’直接矛盾，选 FALSE。TRUE 与文意相反；NOT GIVEN 不适用，因为文中已明确否定‘只’这一绝对表述。"}, {"id": "xi-r-017", "level": "IELTS", "type": "阅读", "topic": "环境", "stem": "Passage excerpt: 'Renewable energy supplied 40% of power in 2023, up from 25% a decade earlier.' Solar power alone provided the majority of electricity.", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "C", "analysis": "文中给出可再生能源占比40%，但未说明其中太阳能是否占多数（多数应为超过50%）。太阳能的具体份额文中未提及，选 NOT GIVEN。TRUE 与 FALSE 都缺乏细分数据支撑。"}, {"id": "xi-r-018", "level": "IELTS", "type": "阅读", "topic": "科技", "stem": "Passage excerpt: 'The robot completed the task in half the time of human workers.' The machine performed the job more quickly than people.", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "A", "analysis": "原文明确说机器人用时为人类的一半，即更快，与陈述一致，选 TRUE。FALSE 与文意相反；NOT GIVEN 不适用，因为速度对比已直接给出。"}, {"id": "xi-r-019", "level": "IELTS", "type": "阅读", "topic": "教育", "stem": "Passage excerpt: 'Remote learning improved access but lowered test scores in some subjects.' Online education benefited all academic outcomes.", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "B", "analysis": "原文指出远程学习虽扩大了可及性，但部分科目分数下降，与‘所有学业结果都受益’矛盾，选 FALSE。TRUE 过于绝对且与文意相反；NOT GIVEN 不适用。"}, {"id": "xi-r-020", "level": "IELTS", "type": "阅读", "topic": "社会", "stem": "Passage excerpt: 'The policy aimed to reduce inequality, though its effects were modest.' The policy eliminated the wealth gap.", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "B", "analysis": "原文称政策效果‘有限’，与‘消除贫富差距’这一绝对结论直接矛盾，选 FALSE。TRUE 夸大效果且相反；NOT GIVEN 不适用，因为文中已明确说明效果有限。"}, {"id": "xi-r-021", "level": "IELTS", "type": "阅读", "topic": "经济", "stem": "Passage excerpt: 'The company expanded abroad while domestic sales stagnated.' International growth compensated for weak home markets.", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "C", "analysis": "文中提到海外扩张、国内销售停滞，但并未说明海外增长是否‘弥补’了国内疲软。弥补这一因果结果文中未给出，选 NOT GIVEN。TRUE 与 FALSE 都缺少明确的补偿关系表述。"}, {"id": "xi-r-022", "level": "IELTS", "type": "阅读", "topic": "健康", "stem": "Passage excerpt: 'Smoking rates fell following the public health campaign.' The campaign caused a decline in smoking.", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "A", "analysis": "原文表明控烟宣传后吸烟率下降，时间先后与因果指向一致，支持该陈述，选 TRUE。FALSE 与文意相反；NOT GIVEN 不适用，因为前后变化已对应。"}, {"id": "xi-r-023", "level": "IELTS", "type": "阅读", "topic": "文化", "stem": "Passage excerpt: 'Immigrants enriched the local cuisine without replacing native dishes.' The arrival of immigrants destroyed traditional food culture.", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "B", "analysis": "原文说移民丰富了当地饮食且未取代本土菜肴，与‘摧毁传统饮食文化’相反，选 FALSE。TRUE 与文意矛盾；NOT GIVEN 不适用，因为文中已明确否定破坏。"}, {"id": "xi-r-024", "level": "IELTS", "type": "阅读", "topic": "媒体", "stem": "Passage excerpt: 'Readers trusted independent outlets more than state-controlled media.' Government media was the most trusted source.", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "B", "analysis": "原文指出读者更信任独立媒体而非国家控制的媒体，与‘政府媒体最可信’相反，选 FALSE。TRUE 与文意相反；NOT GIVEN 不适用，因为信任对比已明确。"}, {"id": "xi-r-025", "level": "IELTS", "type": "阅读", "topic": "环境", "stem": "Passage excerpt: 'Coral reefs declined, and ocean temperatures rose during the same period.' Rising sea temperatures damaged the coral.", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "C", "analysis": "文中说明珊瑚礁衰退与海水升温同时发生，但并未断言升温‘导致’了损害。二者因果关系文中未明确，选 NOT GIVEN。TRUE 需要明确的因果表述，FALSE 需要否定因果，文中均未给出。"}, {"id": "xi-r-026", "level": "IELTS", "type": "阅读", "topic": "科技", "stem": "What is the main purpose of the third paragraph?", "options": ["A. To compare two competing theories", "B. To introduce a new research method", "C. To summarise the previous findings", "D. To criticise government policy"], "answer": "B", "analysis": "第三段描述了研究者采用的一种全新实验手段，核心是介绍新方法，故 B 正确。A 混淆了段落内容，文中并未并列比较两种理论。C 与 D 分别把段落误判为总结或批评，均不符合该段以‘方法’为主的行文。"}, {"id": "xi-r-027", "level": "IELTS", "type": "阅读", "topic": "教育", "stem": "According to the author, the primary benefit of small class sizes is:", "options": ["A. Lower operational costs", "B. More individual attention", "C. Faster curriculum coverage", "D. Improved discipline records"], "answer": "B", "analysis": "作者强调小班能让教师给予学生更多个性化关注，B 为原文核心观点。A 与事实相反，小班通常成本更高。C 与 D 属于文中未强调或未被支持的推论，属于干扰项。"}, {"id": "xi-r-028", "level": "IELTS", "type": "阅读", "topic": "环境", "stem": "The writer suggests that reforestation is effective because it:", "options": ["A. Removes carbon from the air", "B. Increases urban density", "C. Reduces rainfall", "D. Replaces fossil fuels"], "answer": "A", "analysis": "文中指出森林通过光合作用吸收大气中的碳，因此重新造林能固碳，A 正确。B 与造林无关；C 与 D 在文中均未作为再造林的作用被提出，属于无依据选项。"}, {"id": "xi-r-029", "level": "IELTS", "type": "阅读", "topic": "社会", "stem": "Which factor is described as the main driver of urban migration?", "options": ["A. Climate change", "B. Better job prospects", "C. Lower housing costs", "D. Improved healthcare"], "answer": "B", "analysis": "文章将‘更好的就业前景’列为人口流向城市的首要原因，B 正确。A 并非文中主因；C 与文意相反，城市住房往往更贵；D 是附带好处而非主要驱动力。"}, {"id": "xi-r-030", "level": "IELTS", "type": "阅读", "topic": "经济", "stem": "The passage indicates that the tax reform was intended to:", "options": ["A. Protect domestic industries", "B. Encourage foreign investment", "C. Reduce public debt", "D. Simplify the system"], "answer": "D", "analysis": "文中说明改革的目标是简化繁琐的税制，D 符合原意。A、B、C 虽可能是副作用，但均非作者明确指出的改革初衷，属于过度推断的干扰项。"}, {"id": "xi-r-031", "level": "IELTS", "type": "阅读", "topic": "健康", "stem": "What does the study conclude about Mediterranean diets?", "options": ["A. They prevent all heart disease", "B. They lower certain health risks", "C. They are cheaper than others", "D. They require supplements"], "answer": "B", "analysis": "研究结论为地中海饮食能降低部分健康风险，B 表述严谨且符合原文。A 中‘预防所有’过于绝对，文中未支持。C 与 D 在文中均未提及，是典型干扰项。"}, {"id": "xi-r-032", "level": "IELTS", "type": "阅读", "topic": "文化", "stem": "The author's attitude toward globalisation is best described as:", "options": ["A. Entirely negative", "B. Cautiously positive", "C. Indifferent", "D. Hostile"], "answer": "B", "analysis": "作者既承认全球化带来的便利，也指出其风险，整体态度是审慎乐观，B 正确。A 与 D 过度负面，C 不符文中细致讨论的立场。"}, {"id": "xi-r-033", "level": "IELTS", "type": "阅读", "topic": "媒体", "stem": "Why does the writer mention the 2016 incident?", "options": ["A. To prove a general rule", "B. To illustrate a problem", "C. To introduce the topic", "D. To refute an argument"], "answer": "B", "analysis": "作者引用2016年事件是为了举例说明虚假信息扩散的问题，B 正确。A 夸大了个案的代表性；C 与 D 不符合该例在文中的支撑性作用。"}, {"id": "xi-r-034", "level": "IELTS", "type": "阅读", "topic": "科技", "stem": "The word 'robust' in line 12 is closest in meaning to:", "options": ["A. Fragile", "B. Complex", "C. Strong", "D. Temporary"], "answer": "C", "analysis": "在语境中‘robust’描述系统可靠、抗干扰，意为‘强健的/稳固的’，C 正确。A 是反义；B 与 D 均不符合该词在文中的技术含义。"}, {"id": "xi-r-035", "level": "IELTS", "type": "阅读", "topic": "教育", "stem": "What challenge does the programme face?", "options": ["A. Lack of volunteers", "B. Insufficient funding", "C. Poor attendance", "D. Weak curriculum"], "answer": "B", "analysis": "文章将资金不足列为该教育项目面临的主要困难，B 正确。A、C、D 在文中或被否定或未提及，属于干扰项。"}, {"id": "xi-r-036", "level": "IELTS", "type": "阅读", "topic": "环境", "stem": "The author recommends which action to combat flooding?", "options": ["A. Building higher dams", "B. Restoring wetlands", "C. Relocating cities", "D. Banning agriculture"], "answer": "B", "analysis": "作者主张恢复湿地以自然蓄洪，B 正确。A 只是工程手段且文中未优先推荐；C 与 D 过于极端，文中未提出。"}, {"id": "xi-r-037", "level": "IELTS", "type": "阅读", "topic": "社会", "stem": "According to the passage, community centres mainly serve to:", "options": ["A. Generate profit", "B. Build social ties", "C. Enforce rules", "D. Provide childcare"], "answer": "B", "analysis": "文中说明社区中心的核心功能是促进社会联结，B 正确。A 与公益性质相悖；C 与 D 是次要或未被强调的作用，属干扰项。"}, {"id": "xi-r-038", "level": "IELTS", "type": "阅读", "topic": "经济", "stem": "The phrase 'trickle-down effect' in paragraph 4 refers to:", "options": ["A. Rapid inflation", "B. Benefits reaching lower groups", "C. Export decline", "D. Tax evasion"], "answer": "B", "analysis": "‘trickle-down effect’指经济增长的利益逐渐惠及底层群体，B 正确。A、C、D 均与该经济学术语含义无关，是干扰项。"}, {"id": "xi-r-039", "level": "IELTS", "type": "阅读", "topic": "健康", "stem": "What is identified as the leading cause of the outbreak?", "options": ["A. Poor sanitation", "B. Air travel", "C. Climate shifts", "D. Genetic factors"], "answer": "A", "analysis": "文章将卫生条件差确定为疫情爆发的主因，A 正确。B 与 C 是次要推动因素；D 在文中未被支持，属干扰项。"}, {"id": "xi-r-040", "level": "IELTS", "type": "阅读", "topic": "文化", "stem": "The passage implies that language loss is driven by:", "options": ["A. Natural disasters", "B. Dominant languages", "C. Reduced population", "D. Religious change"], "answer": "B", "analysis": "文中暗示弱势语言因强势通用语的挤压而消失，B 正确。A、C、D 虽可能影响文化，但并非文中指出的语言流失主因。"}, {"id": "xi-r-041", "level": "IELTS", "type": "阅读", "topic": "媒体", "stem": "Which statement best reflects the writer's view of algorithms?", "options": ["A. They are entirely neutral", "B. They need oversight", "C. They replace editors", "D. They reduce bias"], "answer": "B", "analysis": "作者认为推荐算法存在偏见，需要监管，B 正确。A 与文中批判立场相反；C 与 D 均非作者观点，属干扰项。"}, {"id": "xi-r-042", "level": "IELTS", "type": "阅读", "topic": "科技", "stem": "The study found that automation most affected:", "options": ["A. Creative roles", "B. Routine tasks", "C. Management", "D. Research"], "answer": "B", "analysis": "研究发现自动化主要取代重复性常规工作，B 正确。A、C、D 属难以自动化的岗位，文中说明受冲击较小，是干扰项。"}, {"id": "xi-r-043", "level": "IELTS", "type": "阅读", "topic": "环境", "stem": "Which heading best matches Paragraph A? Paragraph A discusses the historical background of climate agreements.", "options": ["A. A brief history of accords", "B. Economic impacts", "C. Individual action", "D. Future predictions", "E. Scientific debate", "F. Political resistance", "G. Technological fixes", "H. Public opinion"], "answer": "A", "analysis": "段落A讲述气候协议的历史背景，与标题‘协定的简史’完全对应，A 正确。B 谈经济、C 谈个人行动等均与历史背景无关，属干扰标题。"}, {"id": "xi-r-044", "level": "IELTS", "type": "阅读", "topic": "教育", "stem": "Which heading best matches Paragraph B? Paragraph B explains how early childhood education improves later outcomes.", "options": ["A. Funding models", "B. Long-term benefits", "C. Teacher training", "D. Curriculum design", "E. Global comparisons", "F. Technology use", "G. Parental role", "H. Assessment methods"], "answer": "B", "analysis": "段落B聚焦早期教育对后续结果的长期益处，标题‘长期收益’最贴切，B 正确。A、C、D 等讨论的是其他维度，与段落主旨不符。"}, {"id": "xi-r-045", "level": "IELTS", "type": "阅读", "topic": "科技", "stem": "Which heading best matches Paragraph C? Paragraph C warns about privacy risks of smart devices.", "options": ["A. Market growth", "B. Design trends", "C. Privacy concerns", "D. Energy use", "E. Legal frameworks", "F. User habits", "G. Cost reduction", "H. Network speed"], "answer": "C", "analysis": "段落C警告智能设备的隐私风险，标题‘隐私担忧’直接对应，C 正确。A、B、D 等偏离了隐私这一核心议题，是干扰项。"}, {"id": "xi-r-046", "level": "IELTS", "type": "阅读", "topic": "社会", "stem": "Which heading best matches Paragraph D? Paragraph D describes rising inequality between regions.", "options": ["A. Urban planning", "B. Regional disparities", "C. Migration flows", "D. Healthcare access", "E. Education gaps", "F. Cultural shift", "G. Crime rates", "H. Ageing population"], "answer": "B", "analysis": "段落D描述地区间日益加剧的不平等，标题‘地区差异’最匹配，B 正确。C 谈迁移、D 谈医疗等虽相关但非本段主旨，属干扰。"}, {"id": "xi-r-047", "level": "IELTS", "type": "阅读", "topic": "经济", "stem": "Which heading best matches Paragraph E? Paragraph E outlines steps to stabilise the currency.", "options": ["A. Trade deficits", "B. Inflation control", "C. Stabilisation measures", "D. Labour markets", "E. Tax reform", "F. Debt crisis", "G. Foreign aid", "H. Banking rules"], "answer": "C", "analysis": "段落E列出稳定货币的步骤，标题‘稳定措施’准确概括，C 正确。B 与 E 虽属经济话题，但本段特指货币稳定而非通胀或税制。"}, {"id": "xi-r-048", "level": "IELTS", "type": "阅读", "topic": "健康", "stem": "Which heading best matches Paragraph F? Paragraph F reviews evidence on exercise and mental health.", "options": ["A. Diet plans", "B. Exercise and mood", "C. Sleep hygiene", "D. Medical costs", "E. Ageing issues", "F. Vaccine safety", "G. Hospital reform", "H. Genetic risk"], "answer": "B", "analysis": "段落F综述运动与心理健康（情绪）的证据，标题‘运动与情绪’最贴切，B 正确。A、C、D 等偏离运动—心理这一主题，属干扰。"}, {"id": "xi-r-049", "level": "IELTS", "type": "阅读", "topic": "文化", "stem": "Which heading best matches Paragraph G? Paragraph G examines how films spread cultural values.", "options": ["A. Film and values", "B. Music trends", "C. Literary canon", "D. Sport identity", "E. Food culture", "F. Fashion industry", "G. Religious art", "H. Digital media"], "answer": "A", "analysis": "段落G探讨电影如何传播文化价值，标题‘电影与价值观’直接对应，A 正确。B、C、D 等讨论其他文化载体，与电影主题不符。"}, {"id": "xi-r-050", "level": "IELTS", "type": "阅读", "topic": "媒体", "stem": "Which heading best matches Paragraph H? Paragraph H questions the reliability of viral news.", "options": ["A. News production", "B. Trust in viral content", "C. Advertising income", "D. Editorial standards", "E. Audience growth", "F. Platform design", "G. Regulation debate", "H. Local journalism"], "answer": "B", "analysis": "段落H质疑病毒式新闻的可靠性，标题‘对病毒内容的信任’最匹配，B 正确。A、C、D 等讨论新闻业其他方面，未触及可信度质疑。"}, {"id": "xi-v-001", "level": "IELTS", "type": "词汇", "topic": "环境", "stem": "The word 'mitigate' in the context of climate policy most nearly means:", "options": ["A. worsen", "B. reduce", "C. ignore", "D. analyse"], "answer": "B", "analysis": "‘mitigate’意为‘减轻、缓解’，在气候语境中指减少负面影响，B 正确。A 是反义；C 与 D 不符合该词含义，属干扰项。"}, {"id": "xi-v-002", "level": "IELTS", "type": "词汇", "topic": "教育", "stem": "Choose the synonym of 'comprehensive' as used in academic texts:", "options": ["A. brief", "B. thorough", "C. optional", "D. confusing"], "answer": "B", "analysis": "‘comprehensive’意为‘全面的、详尽的’，近义词为 thorough，B 正确。A 是反义；C 与 D 不符合词义，属干扰。"}, {"id": "xi-v-003", "level": "IELTS", "type": "词汇", "topic": "科技", "stem": "In 'the device is obsolete', 'obsolete' means:", "options": ["A. outdated", "B. expensive", "C. reliable", "D. portable"], "answer": "A", "analysis": "‘obsolete’指‘过时、淘汰的’，A 正确。B、C、D 均与该词含义无关，是常见干扰项。"}, {"id": "xi-v-004", "level": "IELTS", "type": "词汇", "topic": "社会", "stem": "The term 'marginalised' groups refers to those who are:", "options": ["A. wealthy", "B. excluded", "C. educated", "D. organised"], "answer": "B", "analysis": "‘marginalised’意为‘被边缘化的、被排斥的’，B 正确。A 与 C 往往与之相反；D 不符合词义，属干扰。"}, {"id": "xi-v-005", "level": "IELTS", "type": "词汇", "topic": "经济", "stem": "Select the best definition of 'fluctuate':", "options": ["A. remain constant", "B. vary irregularly", "C. decline sharply", "D. double"], "answer": "B", "analysis": "‘fluctuate’指‘波动、不规则变化’，B 正确。A 是反义；C 与 D 描述具体变化方向，未体现‘波动’本质，属干扰。"}, {"id": "xi-v-006", "level": "IELTS", "type": "词汇", "topic": "健康", "stem": "'Sedentary' lifestyle is best described as:", "options": ["A. active", "B. inactive", "C. stressful", "D. outdoor"], "answer": "B", "analysis": "‘sedentary’指‘久坐的、缺乏活动的’，B 正确。A 是反义；C 与 D 不描述运动量，属干扰项。"}, {"id": "xi-v-007", "level": "IELTS", "type": "词汇", "topic": "文化", "stem": "The word 'assimilate' in cultural contexts means to:", "options": ["A. reject", "B. absorb", "C. isolate", "D. preserve"], "answer": "B", "analysis": "‘assimilate’指‘同化、吸收（融入）’，B 正确。A 与 C 是反义方向；D 指保留，与同化相反，属干扰。"}, {"id": "xi-v-008", "level": "IELTS", "type": "词汇", "topic": "媒体", "stem": "A 'biased' report is one that is:", "options": ["A. balanced", "B. partial", "C. accurate", "D. brief"], "answer": "B", "analysis": "‘biased’意为‘有偏见的、不公正的’，对应 partial，B 正确。A 与 C 是反义；D 描述篇幅，与偏见无关，属干扰。"}, {"id": "xi-v-009", "level": "IELTS", "type": "词汇", "topic": "环境", "stem": "Choose the antonym of 'sustainable':", "options": ["A. renewable", "B. depletable", "C. efficient", "D. natural"], "answer": "B", "analysis": "‘sustainable’意为‘可持续的’，反义词为‘不可再生的/会耗尽的’depletable，B 正确。A 是近义；C 与 D 不构成反义，属干扰。"}, {"id": "xi-v-010", "level": "IELTS", "type": "词汇", "topic": "教育", "stem": "The phrase 'peer review' refers to evaluation by:", "options": ["A. students", "B. equals", "C. teachers", "D. the public"], "answer": "B", "analysis": "‘peer review’指‘同行评审’，由同等地位的专家评估，B 正确。A、C、D 均不对应‘peer（同侪）’含义，属干扰。"}, {"id": "xi-v-011", "level": "IELTS", "type": "词汇", "topic": "科技", "stem": "In computing, 'interface' most closely means:", "options": ["A. a connection point", "B. a virus", "C. a battery", "D. a file"], "answer": "A", "analysis": "‘interface’指‘界面、连接点’，A 正确。B、C、D 均为计算机其他部件，与该词无关，属干扰。"}, {"id": "xi-v-012", "level": "IELTS", "type": "词汇", "topic": "社会", "stem": "The word 'cohesion' in 'social cohesion' means:", "options": ["A. conflict", "B. unity", "C. growth", "D. decline"], "answer": "B", "analysis": "‘cohesion’意为‘凝聚力、团结’，B 正确。A 是反义；C 与 D 描述变化方向，不表达‘凝聚’含义，属干扰。"}, {"id": "xi-v-013", "level": "IELTS", "type": "词汇", "topic": "经济", "stem": "Select the meaning of 'inflation':", "options": ["A. price rise", "B. unemployment", "C. trade surplus", "D. tax cut"], "answer": "A", "analysis": "‘inflation’指‘通货膨胀、物价普遍上涨’，A 正确。B、C、D 是其他经济现象，不与通胀同义，属干扰。"}, {"id": "xi-v-014", "level": "IELTS", "type": "词汇", "topic": "健康", "stem": "'Prevalent' in a medical study means:", "options": ["A. rare", "B. widespread", "C. fatal", "D. new"], "answer": "B", "analysis": "‘prevalent’意为‘普遍的、流行的’，B 正确。A 是反义；C 与 D 描述严重程度或新颖性，不表达‘普遍’，属干扰。"}, {"id": "xi-v-015", "level": "IELTS", "type": "词汇", "topic": "文化", "stem": "The word 'heritage' refers to:", "options": ["A. future plans", "B. inherited tradition", "C. foreign goods", "D. modern art"], "answer": "B", "analysis": "‘heritage’指‘遗产、传承的传统’，B 正确。A 与 D 指向现代或未来；C 指外来物品，均不对应，属干扰。"}, {"id": "xi-v-016", "level": "IELTS", "type": "词汇", "topic": "媒体", "stem": "A 'credible' source is one that is:", "options": ["A. entertaining", "B. believable", "C. popular", "D. free"], "answer": "B", "analysis": "‘credible’意为‘可信的’，对应 believable，B 正确。A、C、D 描述趣味、人气或价格，与可信度无必然联系，属干扰。"}, {"id": "xi-v-017", "level": "IELTS", "type": "词汇", "topic": "环境", "stem": "'Biodiversity' is best defined as:", "options": ["A. clean air", "B. variety of life", "C. forest area", "D. water supply"], "answer": "B", "analysis": "‘biodiversity’指‘生物多样性’，即生命的丰富种类，B 正确。A、C、D 是环境要素但不等同于生物多样性，属干扰。"}, {"id": "xi-v-018", "level": "IELTS", "type": "词汇", "topic": "教育", "stem": "The word 'curriculum' means:", "options": ["A. a building", "B. course of study", "C. a teacher", "D. a exam"], "answer": "B", "analysis": "‘curriculum’指‘课程体系、学习计划’，B 正确。A、C、D 均与该词无关，属干扰项。"}, {"id": "xi-v-019", "level": "IELTS", "type": "词汇", "topic": "科技", "stem": "Choose the meaning of 'algorithm':", "options": ["A. a set of steps", "B. a machine", "C. a language", "D. a network"], "answer": "A", "analysis": "‘algorithm’指‘算法、一套计算步骤’，A 正确。B、C、D 是相关但不同的概念，不定义算法本身，属干扰。"}, {"id": "xi-v-020", "level": "IELTS", "type": "词汇", "topic": "社会", "stem": "The term 'demographic' relates to:", "options": ["A. population", "B. weather", "C. religion", "D. technology"], "answer": "A", "analysis": "‘demographic’指‘人口统计的’，与 population 相关，A 正确。B、C、D 是其他领域，不对应人口含义，属干扰。"}, {"id": "xi-v-021", "level": "IELTS", "type": "词汇", "topic": "经济", "stem": "'Subsidy' refers to:", "options": ["A. a tax", "B. financial aid", "C. a loan", "D. a fine"], "answer": "B", "analysis": "‘subsidy’指‘补贴、财政援助’，B 正确。A 与 D 是反向资金流动；C 是需偿还的贷款，与无偿补贴不同，属干扰。"}, {"id": "xi-v-022", "level": "IELTS", "type": "词汇", "topic": "健康", "stem": "The word 'chronic' describes a condition that is:", "options": ["A. sudden", "B. long-lasting", "C. contagious", "D. minor"], "answer": "B", "analysis": "‘chronic’指‘慢性的、长期的’，B 正确。A 是急性（acute）的反义；C 与 D 不描述病程长短，属干扰。"}, {"id": "xi-v-023", "level": "IELTS", "type": "词汇", "topic": "文化", "stem": "Select the meaning of 'diversity':", "options": ["A. similarity", "B. variety", "C. conflict", "D. decline"], "answer": "B", "analysis": "‘diversity’意为‘多样性’，对应 variety，B 正确。A 是反义；C 与 D 不表达多样性含义，属干扰。"}, {"id": "xi-v-024", "level": "IELTS", "type": "词汇", "topic": "媒体", "stem": "A 'headline' is:", "options": ["A. the main title", "B. the author", "C. the date", "D. the photo"], "answer": "A", "analysis": "‘headline’指‘标题、大字标题’，A 正确。B、C、D 是新闻其他要素，不对应标题，属干扰。"}, {"id": "xi-v-025", "level": "IELTS", "type": "词汇", "topic": "环境", "stem": "The word 'emission' in 'carbon emission' means:", "options": ["A. absorption", "B. release", "C. storage", "D. measurement"], "answer": "B", "analysis": "‘emission’指‘排放、释放’，B 正确。A 是吸收，反义；C 与 D 不表达排放动作，属干扰。"}, {"id": "xi-g-002", "level": "IELTS", "type": "语法", "topic": "科技", "stem": "Select the correct passive form: 'The software ___ by engineers last year.'", "options": ["A. was developed", "B. developed", "C. is developed", "D. has develop"], "answer": "A", "analysis": "句子有时间状语 last year，需用一般过去时被动 was developed，A 正确。B 缺 be 动词；C 时态不符；D 动词形式错误。"}, {"id": "xi-g-003", "level": "IELTS", "type": "语法", "topic": "环境", "stem": "Choose the correct article usage: '___ Amazon is ___ largest rainforest.'", "options": ["A. The / the", "B. A / a", "C. An / the", "D. The / a"], "answer": "A", "analysis": "专有名词 the Amazon 与最高级前用 the，均须定冠词，A 正确。B、C、D 在冠词选择上违反专有名词与最高级规则。"}, {"id": "xi-g-005", "level": "IELTS", "type": "语法", "topic": "经济", "stem": "Choose the correct comparative: 'This policy is ___ than the previous one.'", "options": ["A. effective", "B. more effective", "C. most effective", "D. effectively"], "answer": "B", "analysis": "句中有 than，需用比较级 more effective，B 正确。A 是原级；C 是最高级；D 是副词，均不符合比较结构。"}, {"id": "xi-g-006", "level": "IELTS", "type": "语法", "topic": "健康", "stem": "Select the correct preposition: 'She suffered ___ a rare disease.'", "options": ["A. from", "B. with", "C. of", "D. by"], "answer": "A", "analysis": "固定搭配 suffer from 表示‘患……病/受……苦’，A 正确。B、C、D 均不与该动词构成规范搭配。"}, {"id": "xi-g-007", "level": "IELTS", "type": "语法", "topic": "文化", "stem": "Choose the correct relative clause: 'The book ___ I borrowed was fascinating.'", "options": ["A. who", "B. which", "C. whose", "D. what"], "answer": "B", "analysis": "先行词 book 为物，关系代词用 which（或 that），B 正确。A 用于人；C 表所属；D 不引导定语从句。"}, {"id": "xi-g-008", "level": "IELTS", "type": "语法", "topic": "媒体", "stem": "Which is correctly punctuated?", "options": ["A. The report said, the economy grew.", "B. The report said the economy grew.", "C. The report, said the economy grew.", "D. The report said; the economy grew."], "answer": "B", "analysis": "间接引语后接宾语从句无需逗号，B 正确。A 多余逗号；C 逗号错置；D 误用分号断开自然宾语从句。"}, {"id": "xi-g-009", "level": "IELTS", "type": "语法", "topic": "环境", "stem": "Choose the correct modal for necessity: 'Visitors ___ wear masks in the lab.'", "options": ["A. must", "B. might", "C. could", "D. would"], "answer": "A", "analysis": "表达强制规定用 must，A 正确。B 与 C 表可能；D 表意愿或假设，均不表达必要性。"}, {"id": "xi-g-010", "level": "IELTS", "type": "语法", "topic": "教育", "stem": "Select the correct verb form: 'If it rains, the trip ___ cancelled.'", "options": ["A. is", "B. was", "C. will be", "D. has been"], "answer": "C", "analysis": "真实条件句主句用一般将来时 will be，C 正确。A 为现在时；B 过去时；D 现在完成时，均不符主将从现规则。"}, {"id": "xi-g-011", "level": "IELTS", "type": "语法", "topic": "科技", "stem": "Choose the correct gerund subject: '___ early improves focus.'", "options": ["A. Exercise", "B. To exercising", "C. Exercised", "D. Exercises"], "answer": "A", "analysis": "动名词 exercising 可作主语，但选项中 A 的 Exercise 作名词‘锻炼’亦可作主语且最自然，此处取 A。B 形式错误；C 是过去分词；D 是动词第三人称，均不能作主语。"}, {"id": "xi-g-012", "level": "IELTS", "type": "语法", "topic": "社会", "stem": "Which sentence is in the passive voice?", "options": ["A. The committee approved the plan.", "B. The plan was approved by the committee.", "C. The committee approves plans.", "D. They approve the plan."], "answer": "B", "analysis": "被动语态结构为 be + 过去分词，B 中 was approved 符合，正确。A、C、D 均为主动语态。"}, {"id": "xi-g-013", "level": "IELTS", "type": "语法", "topic": "经济", "stem": "Choose the correct quantifier: '___ information was available to the public.'", "options": ["A. Many", "B. Few", "C. Much", "D. Several"], "answer": "C", "analysis": "information 为不可数名词，用 much 修饰，C 正确。A、D 修饰可数复数；B 修饰可数复数且表否定，均不适用。"}, {"id": "xi-g-014", "level": "IELTS", "type": "语法", "topic": "健康", "stem": "Select the correct tag question: 'They haven't arrived, ___?'", "options": ["A. have they", "B. haven't they", "C. did they", "D. are they"], "answer": "A", "analysis": "前句为否定现在完成时，反义疑问句用肯定 have they，A 正确。B 重复否定错误；C 与 D 动词与时态均不匹配。"}, {"id": "xi-g-015", "level": "IELTS", "type": "语法", "topic": "文化", "stem": "Choose the correct conjunction: 'He studied abroad ___ he could learn the language.'", "options": ["A. although", "B. because", "C. unless", "D. despite"], "answer": "B", "analysis": "后句说明目的/原因，用 because 引导原因状语从句，B 正确。A 表转折；C 表条件；D 是介词不能接从句。"}, {"id": "xi-w-001", "level": "IELTS", "type": "写作", "topic": "环境", "stem": "Task 2: Some people believe that individuals should take responsibility for protecting the environment, while others think governments should lead. Discuss both views and give your opinion.", "answer": "引言：环境危机需多方协作，个人与政府各有角色。主体段1：个人可通过减少消费、垃圾分类等行为产生累积效应。主体段2：政府拥有立法与税收工具，能系统性推动减排与可再生能源。结论：政府应设定框架，个人在框架内尽责，二者互补。", "analysis": "Task Response：双边讨论完整并明确给出个人见解，符合议题要求。Coherence and Cohesion：用清晰段落与连接词（while, consequently）展开逻辑。Lexical Resource：使用 cumulative effect、renewable energy 等学术词汇。Grammatical Range：混合使用条件句与被动语态，句式多样。"}, {"id": "xi-w-002", "level": "IELTS", "type": "写作", "topic": "教育", "stem": "Task 2: Universities should focus on academic subjects rather than sports and social activities. To what extent do you agree?", "answer": "立场：部分同意，学术为核心但活动不可忽视。主体段1：学术训练奠定专业知识与就业基础。主体段2：体育与社交培养团队协作与心理健康，提升综合竞争力。结论：应以学术为主、活动为辅，平衡发展。", "analysis": "Task Response：明确程度立场并论证，回应题目。Coherence：用让步—转折结构组织，层次分明。Lexical：employability、well-rounded 等用词准确。Grammar：比较级与情态动词使用恰当，错误少。"}, {"id": "xi-w-003", "level": "IELTS", "type": "写作", "topic": "科技", "stem": "Task 2: Advances in technology have made people less sociable. Do you agree or disagree?", "answer": "立场：不同意，技术改变而非削弱社交。主体段1：社交媒体扩大弱联系，便于跨地域维系关系。主体段2：过度使用可能减少面对面交流，但这是使用方式问题。结论：技术本身中性，关键在于节制与平衡。", "analysis": "Task Response：清晰反驳并区分‘技术’与‘使用方式’，论证有深度。Coherence：对比结构清晰，衔接自然。Lexical：weak ties、face-to-face 等术语贴切。Grammar：从句与对比句式准确。"}, {"id": "xi-w-004", "level": "IELTS", "type": "写作", "topic": "社会", "stem": "Task 2: The best way to reduce crime is to educate people while they are still young. To what extent do you agree?", "answer": "立场：同意教育是关键但非唯一。主体段1：早期教育提升就业机会，从根源降低犯罪动机。主体段2：仍需警力、司法与社会福利等配套措施。结论：教育优先但须综合治理。", "analysis": "Task Response：给出程度判断并补充其他手段，论证全面。Coherence：主体段并列且结论收束有力。Lexical：root cause、comprehensive governance 等表达学术。Grammar：条件与被动句式多样且正确。"}, {"id": "xi-w-005", "level": "IELTS", "type": "写作", "topic": "经济", "stem": "Task 2: Some countries are getting richer while others are getting poorer. What problems does this cause and what solutions can you suggest?", "answer": "问题：贫富国差距扩大引发 Migration 压力与全球不稳定。主体段1：富国可通过对债务减免与公平贸易帮助穷国。主体段2：穷国须改善治理与基础设施以吸引投资。结论：国际合作与国内改革双轨并行。", "analysis": "Task Response：问题—解决结构完整，覆盖题目两问。Coherence：问题段与解决段对应清晰。Lexical：debt relief、fair trade 等经济词汇准确。Grammar：因果与建议句型使用得当。"}, {"id": "xi-w-006", "level": "IELTS", "type": "写作", "topic": "健康", "stem": "Task 2: Some people say the government should pay for public healthcare, while others think individuals should pay. Discuss both views.", "answer": "观点1：政府付费保障公平，使低收入者也能就医。观点2：个人付费可减少浪费并分担财政压力。结论：基本医疗政府兜底，可选服务个人承担，混合模式更佳。", "analysis": "Task Response：双边充分讨论并给出折中方案。Coherence：用 whereas 对比两方，段落过渡顺畅。Lexical：universal coverage、out-of-pocket 等术语准确。Grammar：比较与条件句正确，句式有变化。"}, {"id": "xi-w-007", "level": "IELTS", "type": "写作", "topic": "文化", "stem": "Task 2: Globalisation threatens local cultures and traditions. To what extent do you agree?", "answer": "立场：部分同意，冲击存在但非必然消亡。主体段1：全球品牌与媒体挤压本土习俗空间。主体段2：许多文化借全球化获得展示与复兴平台。结论：应主动保护并创新传承，而非被动消亡。", "analysis": "Task Response：辩证立场清晰，论证有层次。Coherence：转折结构明确，结论提出对策。Lexical：cultural erosion、revitalisation 等用词高级。Grammar：从句与名词化结构多样。"}, {"id": "xi-w-008", "level": "IELTS", "type": "写作", "topic": "媒体", "stem": "Task 2: News media have too much influence on people's lives. Do you agree or disagree?", "answer": "立场：同意影响力过大但需规范而非禁止。主体段1：媒体塑造舆论并影响消费与投票行为。主体段2：算法与商业利益可能放大偏见，需透明与监管。结论：保障自由的同时强化媒介素养与问责。", "analysis": "Task Response：明确立场并平衡自由与监管，论证成熟。Coherence：因果与对比展开有序。Lexical：public opinion、media literacy 等表达准确。Grammar：情态动词与被动句运用恰当。"}, {"id": "xi-w-009", "level": "IELTS", "type": "写作", "topic": "环境", "stem": "Task 2: Many species are at risk of extinction due to human activity. What measures can governments and individuals take?", "answer": "政府：设立保护区、限制开发与打击非法贸易。个人：减少碳足迹、支持可持续产品与环保组织。结论：政策硬约束配合公众意识，方能遏制物种丧失。", "analysis": "Task Response：分别回应政府与个人的措施，覆盖题目。Coherence：分类论述清晰，结论呼应。Lexical：protected areas、carbon footprint 等术语准确。Grammar：并列与条件结构正确。"}, {"id": "xi-w-010", "level": "IELTS", "type": "写作", "topic": "教育", "stem": "Task 2: It is better for children to grow up in the countryside than in a big city. To what extent do you agree?", "answer": "立场：不同意绝对化，各有优劣。主体段1：乡村提供更安全自然的环境，利于身心。主体段2：城市拥有更优质教育与文化资源。结论：关键在于家庭与资源质量，而非城乡二元对立。", "analysis": "Task Response：反驳绝对化并给出平衡判断。Coherence：对比结构清晰，结论升华。Lexical：upbringing、access to resources 等用词准确。Grammar：比较级与让步从句使用正确。"}, {"id": "xi-l-001", "level": "IELTS", "type": "听力", "topic": "教育", "stem": "Listen: 'The lecture begins at half past nine in Room 204.' What time does the lecture start?", "options": ["A. 9:00", "B. 9:30", "C. 10:00", "D. 8:30"], "answer": "B", "analysis": "录音明确说‘half past nine’即9:30，B 正确。A 是整点干扰；C 与 D 为数字混淆项，需抓住 half past 这一关键表达。"}, {"id": "xi-l-002", "level": "IELTS", "type": "听力", "topic": "环境", "stem": "Listen: 'We should recycle paper, glass, and plastic every week.' Which item is NOT mentioned?", "options": ["A. paper", "B. glass", "C. metal", "D. plastic"], "answer": "C", "analysis": "录音列举了纸、玻璃、塑料，未提及金属，C 正确。A、B、D 均在录音中出现，属排除型细节题，需逐一比对。"}, {"id": "xi-l-003", "level": "IELTS", "type": "听力", "topic": "社会", "stem": "Listen: 'The museum is closed on Mondays but open from Tuesday to Sunday.' When is it open?", "options": ["A. Monday only", "B. Tuesday to Sunday", "C. weekends only", "D. every day"], "answer": "B", "analysis": "录音说明周一闭馆、周二至周日开放，B 正确。A 与事实相反；C 范围过窄；D 包含闭馆日，均错误。"}, {"id": "xi-l-004", "level": "IELTS", "type": "听力", "topic": "科技", "stem": "Listen: 'Please submit the assignment via the online portal by Frid
