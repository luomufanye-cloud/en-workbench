f organic waste into protein-rich animal feed, and a Dutch company now supplies this feed to commercial poultry farms.' Question: European consumers have widely accepted insects as food for humans. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "C", "analysis": "原文讨论的是黑水虻幼虫把废弃物加工成'动物饲料'，从未涉及欧洲消费者对'人类食用昆虫'的态度，选 NOT GIVEN。动物饲料与人类食品是两个不同范畴，原文对后者只字未提。"}, {"id": "yi-r-017", "level": "IELTS", "type": "阅读", "topic": "环境", "stem": "Passage excerpt: 'Climate models project that rising temperatures will render about half of the land currently used for coffee cultivation unsuitable by 2050, pushing growers to higher altitudes.' Question: The area suitable for coffee growing is expected to remain largely unchanged by 2050. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "B", "analysis": "原文预计到 2050 年约一半现有咖啡种植地将不再适宜，种植者被迫向高海拔迁移，题干说'基本不变'与原文矛盾，选 FALSE。若原文说适宜面积将扩大也构成矛盾；只有原文完全不谈面积变化时才选 NOT GIVEN。"}, {"id": "yi-r-018", "level": "IELTS", "type": "阅读", "topic": "动物", "stem": "Passage excerpt: 'After decades of overfishing, strict catch quotas allowed North Sea cod stocks to begin a slow recovery, although scientists caution that the population remains well below historical levels.' Question: Catch quotas have helped North Sea cod stocks start to recover. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "A", "analysis": "原文说严格的捕捞配额使鳕鱼种群开始缓慢恢复，题干是原文的同义改写，选 TRUE。注意原文同时说种群仍低于历史水平，但这不影响'开始恢复'成立；若原文说配额无效才选 FALSE。"}, {"id": "yi-r-019", "level": "IELTS", "type": "阅读", "topic": "动物", "stem": "Passage excerpt: 'The return of wolves to Yellowstone changed elk grazing behaviour, allowing willow trees along riverbanks to regrow and, in turn, reshaping habitats for songbirds and beavers.' Question: The wolf population in Yellowstone now numbers over two hundred animals. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "C", "analysis": "原文聚焦狼的回归引发的生态连锁反应，完全没有给出狼群数量的任何数据，选 NOT GIVEN。TFNG 题只考原文是否陈述，原文未提种群规模就既非 TRUE 也非 FALSE。"}, {"id": "yi-r-020", "level": "IELTS", "type": "阅读", "topic": "动物", "stem": "Passage excerpt: 'Beavers reintroduced to a Devon river were found to store storm water behind their dams, measurably reducing flood peaks in downstream villages.' Question: Beaver dams made flooding worse in nearby villages. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "B", "analysis": "原文说河狸坝蓄积雨水、显著削减下游村庄的洪峰，题干说'使洪水更严重'，与原文效果完全相反，选 FALSE。若原文说河狸对洪水无影响则与题干也不构成矛盾，但此处原文有明确的减灾结论。"}, {"id": "yi-r-021", "level": "IELTS", "type": "阅读", "topic": "经济", "stem": "Passage excerpt: 'Gorilla trekking permits in Rwanda cost $1,500 each, and a substantial share of this revenue funds anti-poaching patrols and community development projects near the parks.' Question: Money from gorilla permits helps pay for conservation work. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "A", "analysis": "原文指出许可费收入的相当部分用于反盗猎巡逻和社区项目，'帮助支付保护工作费用'与文意一致，选 TRUE。若原文说收入全部进入国库、与保护无关才选 FALSE；若未说明收入用途则选 NOT GIVEN。"}, {"id": "yi-r-022", "level": "IELTS", "type": "阅读", "topic": "科技", "stem": "Passage excerpt: 'A modified enzyme developed in Portsmouth can break down PET plastic within days, and the team is now engineering the enzyme to survive industrial processing temperatures.' Question: The enzyme-based recycling process is already cheaper than producing new plastic. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "C", "analysis": "原文只介绍酶能分解 PET 塑料及团队在改进其耐热性，从未比较该回收工艺与生产新塑料的成本，选 NOT GIVEN。成本比较属于原文未涉及的经济信息，不能想当然地判 TRUE。"}, {"id": "yi-r-023", "level": "IELTS", "type": "阅读", "topic": "社会", "stem": "Passage excerpt: 'A UK report found that the average garment is worn only seven to ten times before being discarded, as social media accelerates fashion cycles.' Question: Most clothes are worn more than thirty times before being thrown away. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "B", "analysis": "原文说平均每件衣服只穿七到十次就被丢弃，题干说'多数衣服穿三十次以上'，与原文数据矛盾，选 FALSE。此类数字型 TFNG 题要把题干数字与原文数字严格对照，明显不符即 FALSE。"}, {"id": "yi-r-024", "level": "IELTS", "type": "阅读", "topic": "社会", "stem": "Passage excerpt: 'Repair cafés, where volunteers mend household items free of charge, have spread to more than 2,500 locations worldwide since the first one opened in Amsterdam.' Question: Repair cafés now operate in many different countries. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "A", "analysis": "原文说修补咖啡馆已扩展到全球 2500 多个地点，'在世界各地运行'是其合理推述，选 TRUE。若原文说只在荷兰运营才选 FALSE；若只讲理念而不讲规模则选 NOT GIVEN。"}, {"id": "yi-r-025", "level": "IELTS", "type": "阅读", "topic": "社会", "stem": "Passage excerpt: 'Portugal's digital nomad visa requires applicants to show monthly earnings of at least four times the national minimum wage, and holders may stay for up to a year.' Question: The number of digital nomad visa applications to Portugal has doubled since 2021. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "C", "analysis": "原文只说明签证的收入门槛与停留时长，完全没有提及申请数量的任何变化，选 NOT GIVEN。申请量翻倍是原文未涉及的数据，切记不能根据常识或推测作答。"}, {"id": "yi-r-026", "level": "IELTS", "type": "阅读", "topic": "社会", "stem": "Passage excerpt: 'More than twenty-nine per cent of Japan's population is aged sixty-five or over, the highest proportion of any country in the world.' Question: Japan's population is younger than that of most developed nations. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "B", "analysis": "原文说日本 65 岁以上人口比例全球最高，题干说日本人口比多数发达国家'更年轻'，与原文矛盾，选 FALSE。'老龄人口比例最高'意味着老龄化程度最深，与'更年轻'直接冲突。"}, {"id": "yi-r-027", "level": "IELTS", "type": "阅读", "topic": "健康", "stem": "Passage excerpt: 'At Hogeweyk, a purpose-built Dutch village for people with dementia, residents live in ordinary-looking houses and shop on normal streets, all within a secure perimeter.' Question: Residents of Hogeweyk live in a secure environment designed to resemble an ordinary village. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "A", "analysis": "原文说居民住在普通样式的房子里、在正常街道购物，且整个区域有安全围界，题干'安全且像普通村庄的环境'正是这两点信息的合并，选 TRUE。若原文说环境像医院病房才选 FALSE。"}, {"id": "yi-r-028", "level": "IELTS", "type": "阅读", "topic": "社会", "stem": "Passage excerpt: 'A housing project in Berlin offers students rent-free rooms in exchange for regular visits to elderly residents, who gain companionship in return.' Question: Students who join the Berlin project achieve better exam results than their peers. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "C", "analysis": "原文只描述住房交换模式及其给老人带来的陪伴，从未比较参与学生的学业成绩，选 NOT GIVEN。'成绩更好'属于原文完全未涉及的因果关系，不能选 TRUE。"}, {"id": "yi-r-029", "level": "IELTS", "type": "阅读", "topic": "教育", "stem": "Passage excerpt: 'Although millions of learners enrol in massive open online courses each year, average completion rates remain below ten per cent, with most participants dropping out within the first fortnight.' Question: The majority of MOOC students complete the courses they sign up for. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "B", "analysis": "原文说平均结课率低于百分之十，即绝大多数人中途退课，题干说'多数学生完成课程'，与原文矛盾，选 FALSE。低于 10% 的完成率与'多数完成'互斥，此题考查对比例数据的准确解读。"}, {"id": "yi-r-030", "level": "IELTS", "type": "阅读", "topic": "教育", "stem": "Passage excerpt: 'In Germany, roughly half of all young people enter the dual vocational system, which combines part-time classroom study with paid training inside companies over two to three years.' Question: Many young Germans combine classroom learning with paid workplace training. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "A", "analysis": "原文说约半数德国青年进入'双元制'，即课堂学习与带薪企业培训相结合，题干是对该体系的概括转述，选 TRUE。若原文说职业教育已废除或只含课堂学习才选 FALSE；若未介绍该体系则选 NOT GIVEN。"}, {"id": "yi-r-031", "level": "IELTS", "type": "阅读", "topic": "文化", "stem": "Passage excerpt: 'Public libraries in Helsinki lend power tools, sewing machines and 3D printers, and host weekly workshops where residents learn repair and design skills.' Question: Attendance at Helsinki library workshops has tripled in five years. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "C", "analysis": "原文介绍赫尔辛基图书馆出借工具并举办工作坊，但没有任何关于参加人数增长的统计，选 NOT GIVEN。'参加人数翻三倍'是原文未提供的数据信息，属于典型的 NOT GIVEN 陷阱。"}, {"id": "yi-r-032", "level": "IELTS", "type": "阅读", "topic": "艺术", "stem": "Passage excerpt: 'Works by the street artist Banksy have fetched millions of pounds at auction, even though the artist reportedly intends them as critiques of the commercial art market.' Question: Banksy's works are typically sold for only a few hundred pounds. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "B", "analysis": "原文说班克西作品拍出数百万英镑，题干说'通常只卖几百英镑'，与原文价格信息直接矛盾，选 FALSE。判断依据是原文的拍卖价格而非艺术家的创作意图，意图部分只是补充信息。"}, {"id": "yi-r-033", "level": "IELTS", "type": "阅读", "topic": "艺术", "stem": "Passage excerpt: 'In a two-year programme, students who memorised and performed poems aloud showed measurable gains in public-speaking confidence and in their willingness to read difficult texts.' Question: Performing poetry aloud was linked to improvements in students' speaking confidence. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "A", "analysis": "原文明确说背诵并朗诵诗歌的学生在演讲自信方面有可测量的提升，题干与原文一致，选 TRUE。若原文说朗诵诗歌对自信没有影响才选 FALSE；若只讲记忆训练而不涉及自信则选 NOT GIVEN。"}, {"id": "yi-r-034", "level": "IELTS", "type": "阅读", "topic": "科技", "stem": "Passage excerpt: 'Sensor gloves that translate sign language into written text have attracted media attention, although critics question whether any glove can capture the facial grammar of full sign languages.' Question: The sensor gloves are currently priced at under fifty dollars. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "C", "analysis": "原文讨论手套的技术原理与学术争议，完全没有提及产品的价格信息，选 NOT GIVEN。价格属于典型的原文未涉及细节；判断时不要把媒体报道热度误解为产品已上市或定价。"}, {"id": "yi-r-035", "level": "IELTS", "type": "阅读", "topic": "科技", "stem": "Passage excerpt: 'Neural machine translation handles routine business documents well, but translators note that it still struggles with humour, dialect and culturally embedded idioms.' Question: Machine translation now matches professional human translators on literary and humorous texts. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "B", "analysis": "原文说机器翻译在幽默、方言和文化习语上仍有困难，题干说'已达到专业译者水平'，与原文矛盾，选 FALSE。注意原文的让步结构：承认常规文本处理得好，不等于承认困难领域也达标。"}, {"id": "yi-r-036", "level": "IELTS", "type": "阅读", "topic": "健康", "stem": "Passage excerpt: 'The World Health Organization warns that the misuse and overuse of antibiotics is accelerating the emergence of drug-resistant bacteria, which could make routine operations dangerous.' Question: Improper use of antibiotics speeds up the development of resistant bacteria. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "A", "analysis": "原文说抗生素的误用与滥用正在加速耐药菌的出现，题干是同义改写，选 TRUE。'misuse and overuse'对应'improper use'，'accelerating the emergence'对应'speeds up the development'；若原文说滥用无影响才选 FALSE。"}, {"id": "yi-r-037", "level": "IELTS", "type": "阅读", "topic": "健康", "stem": "Passage excerpt: 'In its first year, Mexico's tax on sugary drinks cut purchases of sweetened beverages by an average of about eight per cent, with larger falls among the poorest households.' Question: The sugar tax caused job losses in Mexico's beverage industry. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "C", "analysis": "原文只报告含糖饮料购买量的下降及不同收入群体的差异，完全没有提及就业影响，选 NOT GIVEN。购买量下降不等于裁员，凡原文没有的因果链条都不能自行推断为 TRUE。"}, {"id": "yi-r-038", "level": "IELTS", "type": "阅读", "topic": "健康", "stem": "Passage excerpt: 'Virtual reality exposure therapy has reduced phobia symptoms in controlled trials, but researchers stress that patients need sessions guided by trained clinicians to be effective.' Question: VR therapy works effectively without any professional supervision. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "B", "analysis": "原文强调疗效需要受过训练的临床医师引导，题干说'无需任何专业监督即可有效'，与原文的必要条件矛盾，选 FALSE。此类题干常删除原文的限制条件（clinician-guided）制造矛盾。"}, {"id": "yi-r-039", "level": "IELTS", "type": "阅读", "topic": "健康", "stem": "Passage excerpt: 'Prosthetic limbs produced on 3D printers can be manufactured for a small fraction of the cost of traditional prostheses, making them accessible to children in low-income countries.' Question: 3D-printed prosthetic limbs are considerably cheaper than traditional ones. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "A", "analysis": "原文说 3D 打印假肢的制造成本仅为传统假肢的一小部分，题干'便宜得多'与文意一致，选 TRUE。'a small fraction of the cost'与'considerably cheaper'互为同义表达；若成本相当或更高则选 FALSE。"}, {"id": "yi-r-040", "level": "IELTS", "type": "阅读", "topic": "科技", "stem": "Passage excerpt: 'Consumer fitness trackers count steps accurately, but independent tests show they perform poorly when estimating sleep stages and energy expenditure.' Question: Fitness trackers need to be charged every night. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "C", "analysis": "原文评价了手环在计步、睡眠分期和能耗估算上的准确性，完全没有提及充电频率，选 NOT GIVEN。电池续航属于原文未涉及的硬件细节，不能因产品常识而选 TRUE 或 FALSE。"}, {"id": "yi-r-041", "level": "IELTS", "type": "阅读", "topic": "科技", "stem": "Passage excerpt: 'More than 100 million fragments of debris orbit the Earth, and even flecks of paint can puncture satellite panels when they strike at orbital speeds.' Question: Even very small pieces of debris can damage spacecraft. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "A", "analysis": "原文明确说连油漆碎屑在轨道速度下都能击穿卫星面板，题干与原文一致，选 TRUE。此题考查 'even flecks of paint' 对应 'very small pieces of debris' 的同义替换；若原文说小碎片无害才选 FALSE。"}, {"id": "yi-r-042", "level": "IELTS", "type": "阅读", "topic": "科技", "stem": "Passage excerpt: 'Low-orbit satellite constellations promise broadband for remote regions, but astronomers warn that bright satellite trails are contaminating long-exposure telescope images.' Question: Astronomers regard the satellite constellations as harmless to their observations. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "B", "analysis": "原文说天文学家警告卫星轨迹正在污染望远镜长曝光影像，题干说天文学家认为'无害'，态度与原文相反，选 FALSE。做观点型 TFNG 要抓住原文中表示态度的动词（warn）与题干态度词是否一致。"}, {"id": "yi-r-043", "level": "IELTS", "type": "阅读", "topic": "科技", "stem": "Passage excerpt: 'Some companies claim that a single metal-rich asteroid could contain more platinum than has ever been mined on Earth, although no commercial mining mission has yet succeeded.' Question: Commercial asteroid mining has already begun successfully. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "B", "analysis": "原文明确说'尚无一次商业采矿任务成功'，题干说商业小行星采矿'已成功开始'，与原文矛盾，选 FALSE。原文的让步从句（although...）往往正是命题点，需重点读。"}, {"id": "yi-r-044", "level": "IELTS", "type": "阅读", "topic": "健康", "stem": "Passage excerpt: 'Six volunteers who spent a year in a Mars simulation habitat in Hawaii reported growing tension, but all completed their tasks and emerged in good physical health.' Question: The volunteers' sleep quality was monitored during the simulation. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "C", "analysis": "原文报告了队员的紧张情绪与身体健康状况，从未提及睡眠监测，选 NOT GIVEN。模拟实验原文没有说监测了哪些生理指标，就不能推断包括睡眠。"}, {"id": "yi-r-045", "level": "IELTS", "type": "阅读", "topic": "环境", "stem": "Passage excerpt: 'Thawing permafrost releases methane, a greenhouse gas that traps far more heat than carbon dioxide over short time-scales, creating a feedback loop that accelerates further warming.' Question: Melting permafrost releases a greenhouse gas more potent than CO2 in the short term. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "A", "analysis": "原文说永久冻土融化释放的甲烷在短时间尺度上吸热远超二氧化碳，题干是对该句的精确改写，选 TRUE。注意限定语 'over short time-scales' 与 'in the short term' 对应；漏掉限定语的题干才可能出错。"}, {"id": "yi-r-046", "level": "IELTS", "type": "阅读", "topic": "环境", "stem": "Passage excerpt: 'Restored oyster reefs in New York harbour filter excess nutrients from the water, and their rough structures dampen wave energy during storms.' Question: Oyster reefs can help reduce the force of storm waves. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "A", "analysis": "原文说牡蛎礁粗糙的结构能在风暴期间削弱波浪能量，题干'有助于减弱风暴浪的冲击力'与之对应，选 TRUE。'dampen wave energy'与'reduce the force of storm waves'同义；若原文说礁体加剧波浪才选 FALSE。"}, {"id": "yi-r-047", "level": "IELTS", "type": "阅读", "topic": "环境", "stem": "Passage excerpt: 'Trials show that adding small amounts of seaweed to cattle feed can cut methane emissions from digestion by as much as eighty per cent.' Question: Seaweed supplements eliminate all methane produced by cattle. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "B", "analysis": "原文说海藻添加剂最多可减少约八成的甲烷排放，题干说'消除全部甲烷'，把'减少 80%'夸大为'百分之百消除'，与原文矛盾，选 FALSE。绝对化措辞（all, completely）与原文的比例限定冲突时通常是 FALSE。"}, {"id": "yi-r-048", "level": "IELTS", "type": "阅读", "topic": "科技", "stem": "Passage excerpt: 'Thermal-imaging drones patrol Kenyan reserves at night, allowing rangers to spot poachers before they reach rhino herds, which had previously been impossible with foot patrols alone.' Question: Drones in Kenyan reserves are used exclusively during daylight hours. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "B", "analysis": "原文明确说热成像无人机'在夜间'巡逻，题干说'只在白天使用'，与原文时间信息矛盾，选 FALSE。TFNG 题中时间、地点、程度副词是最常见的改写点，需逐词核对。"}, {"id": "yi-r-049", "level": "IELTS", "type": "阅读", "topic": "环境", "stem": "Passage excerpt: 'Corals bred in Florida laboratories for heat tolerance are being replanted on degraded reefs, and early survival after one year has encouraged the researchers.' Question: The replanted corals survived for more than five years in the wild. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "C", "analysis": "原文只报告了移植后一年的早期存活情况，五年后的存活状况原文没有任何信息，选 NOT GIVEN。时间跨度被题干悄悄拉长而原文没有对应数据时，应选 NOT GIVEN 而非 TRUE。"}, {"id": "yi-r-050", "level": "IELTS", "type": "阅读", "topic": "环境", "stem": "Passage excerpt: 'By triggering controlled avalanches with explosives, researchers found that weak snow layers collapse step by step under rapid loading rather than failing all at once.' Question: Avalanche fatalities have increased worldwide in recent decades. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "C", "analysis": "原文描述的是人工触发雪崩的实验发现，完全没有涉及全球雪崩死亡人数的统计，选 NOT GIVEN。实验机制与伤亡趋势属于不同层面的信息，原文未提及后者。"}, {"id": "yi-r-051", "level": "IELTS", "type": "阅读", "topic": "城市", "stem": "Passage excerpt: 'Skyglow from cities travels hundreds of kilometres; researchers estimate that more than eighty per cent of North Americans can no longer see the Milky Way from their homes.' Question: Most North Americans are still able to see the Milky Way from where they live. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "B", "analysis": "原文说超过八成北美人在家中已看不到银河，题干说'多数人仍能看到'，与原文比例矛盾，选 FALSE。'more than 80% cannot see'意味着'能看到的人不足 20%'，与'most'直接冲突。"}, {"id": "yi-r-052", "level": "IELTS", "type": "阅读", "topic": "艺术", "stem": "Passage excerpt: 'Cinema broadcasts of Metropolitan Opera performances now reach millions of viewers who never attend the opera house in person, although in-house ticket revenue has declined.' Question: The Met's cinema broadcasts attract viewers who do not visit the opera house. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "A", "analysis": "原文明确说影院转播触达数百万'从未亲临歌剧院'的观众，题干与之完全一致，选 TRUE。让步分句（票房下滑）是干扰信息，不影响主句事实成立。"}, {"id": "yi-r-053", "level": "IELTS", "type": "阅读", "topic": "文化", "stem": "Passage excerpt: 'Ethnomusicologists are racing to digitise fragile wax-cylinder recordings of indigenous songs before the originals decay beyond recovery.' Question: The digitisation project receives most of its funding from national governments. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "C", "analysis": "原文只说学者在赶录脆弱的蜡筒录音，没有提及任何资金来源，选 NOT GIVEN。原文从未区分政府资助与其他资助，因此既不能证实也不能证伪题干。"}, {"id": "yi-r-054", "level": "IELTS", "type": "阅读", "topic": "文化", "stem": "Passage excerpt: 'In many European cities, traditional working-class urban dialects are fading as younger generations shift towards standard national varieties of speech.' Question: Urban dialects in European cities are gaining more young speakers. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "B", "analysis": "原文说年轻一代转向标准语，传统城市方言正在衰退，题干说方言'获得更多年轻使用者'，与原文趋势相反，选 FALSE。注意 'fading' 与 'gaining more speakers' 是一对反向表述。"}, {"id": "yi-r-055", "level": "IELTS", "type": "阅读", "topic": "教育", "stem": "Passage excerpt: 'Home education expanded sharply during the pandemic, and registration figures in several US states remain well above pre-2020 levels even after schools reopened.' Question: Home schooling in those states has returned to its pre-pandemic level. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "B", "analysis": "原文说复课后多个州的家庭教育注册数'仍远高于 2020 年前水平'，题干说'已回到疫情前水平'，与原文矛盾，选 FALSE。'remain well above'与'returned to'互斥，此题考查趋势描述的准确对应。"}, {"id": "yi-r-056", "level": "IELTS", "type": "阅读", "topic": "社会", "stem": "Passage excerpt: 'Childcare costs in the UK absorb nearly a third of the average family's income, one of the highest shares among OECD countries.' Question: High childcare costs have discouraged mothers from returning to full-time work in the UK. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "C", "analysis": "原文只比较各国托育费用占家庭收入的比例，完全没有讨论其与母亲就业的关系，选 NOT GIVEN。虽然现实中确有此类研究，但原文未提，就必须选 NOT GIVEN。"}, {"id": "yi-r-057", "level": "IELTS", "type": "阅读", "topic": "交通", "stem": "Passage excerpt: 'An audit of cycling infrastructure in several US cities found that protected bike lanes were overwhelmingly built in wealthier neighbourhoods first, while low-income areas waited years longer.' Question: In the cities audited, protected bike lanes tended to appear in wealthier neighbourhoods before poorer ones. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "A", "analysis": "原文说受保护自行车道'绝大多数先建在较富裕社区'，低收入区域等待更久，题干是对该发现的同义概括，选 TRUE。'overwhelmingly...first'与'tended to appear...before'对应；若原文说建设顺序随机或相反则选 FALSE。"}, {"id": "yi-r-058", "level": "IELTS", "type": "阅读", "topic": "交通", "stem": "Passage excerpt: 'China's high-speed rail network now exceeds 40,000 kilometres and carries about twice as many passengers annually as the country's domestic airlines.' Question: Japan's high-speed rail network is longer than China's. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "C", "analysis": "原文只给出中国高铁的里程与客流数据，完全没有提及其他国家高铁网络的长度，选 NOT GIVEN。不能依据课外知识判断日本网络更短，TFNG 的判断标准只有原文。"}, {"id": "yi-r-059", "level": "IELTS", "type": "阅读", "topic": "城市", "stem": "Passage excerpt: 'Cape Town averted its 'Day Zero' water shutdown in 2018 after residents cut daily consumption to below fifty litres per person, among the strictest rationing ever seen in a major city.' Question: Cape Town residents had to restrict their water use severely to avoid Day Zero. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "A", "analysis": "原文说居民把人均日用水压到 50 升以下才避免了'零日'危机，题干'被迫严格限制用水'与文意一致，选 TRUE。'among the strictest rationing'与'severely restrict'互为同义；若原文说用水不受限制则选 FALSE。"}, {"id": "yi-r-060", "level": "IELTS", "type": "阅读", "topic": "科技", "stem": "Passage excerpt: 'Ground-source heat pumps deliver three to four units of heat for every unit of electricity they consume, making them far more efficient than conventional resistance heating.' Question: Ground-source heat pumps normally pay for themselves within five years. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "C", "analysis": "原文只给出热泵的能效比（每度电产 3–4 度热），完全没有提及其安装投资的回收期，选 NOT GIVEN。能效高不等于回本快，涉及成本回收的结论原文未给出。"}, {"id": "yi-r-061", "level": "IELTS", "type": "阅读", "topic": "历史", "stem": "Passage: 'At low tide, licensed mudlarks search the Thames foreshore for artefacts. A hoard of Tudor coins unearthed near a former dock suggests that small-scale trading continued at the site long after larger ships moved downstream.' What does the coin find suggest?", "options": ["A. Coins were manufactured at the dockside workshops.", "B. The dock was abandoned once large vessels stopped calling there.", "C. Small-scale trade persisted at the dock after major shipping relocated.", "D. Trading at the site was prohibited during the Tudor period."], "answer": "C", "analysis": "原文关键句是 'small-scale trading continued at the site long after larger ships moved downstream'，即大船迁走后小规模贸易仍在继续，C 是原文的精确转述。B 与 continue 相反；A 无中生有（出土硬币不等于铸币）；D 与贸易持续的文意矛盾。"}, {"id": "yi-r-062", "level": "IELTS", "type": "阅读", "topic": "历史", "stem": "Passage: 'In the ruins of Pompeii, archaeologists found carbonised loaves still inside bakery ovens. One bakery contained eighty-one loaves stacked in orderly rows, and circular stamps on some breads point to regulation of weight and quality.' What do the eighty-one loaves most clearly indicate?", "options": ["A. Bread was baked only for the baker's own household.", "B. Bread was produced in bulk for distribution to customers.", "C. The bakery was in the middle of relocating when Vesuvius erupted.", "D. Volcanic heat destroyed most of the city's grain stores."], "answer": "B", "analysis": "八十一只面包成排堆放、部分还盖有监管重量与质量的印章，说明这是面向顾客的批量生产与配送，选 B。A 与规模和印章矛盾；C 属过度推断，原文只说面包还在炉中；D 原文未涉及粮仓。"}, {"id": "yi-r-063", "level": "IELTS", "type": "阅读", "topic": "历史", "stem": "Passage: 'Maya cities in the seasonal lowlands depended on sophisticated reservoirs lined with sand and lime, which filtered rainwater and stored it through months of drought, allowing large populations to survive the dry season.' According to the passage, the main purpose of the Maya reservoirs was to:", "options": ["A. irrigate maize fields throughout the year.", "B. raise fish as a protein source.", "C. store water across the dry months.", "D. protect cities from flooding."], "answer": "C", "analysis": "原文明确说水库 'stored it through months of drought'，让大量人口度过旱季，C 是原文主旨的直接转述。A 原文说的是饮用储备而非全年灌溉；B、D 均属原文未提及的功能。"}, {"id": "yi-r-064", "level": "IELTS", "type": "阅读", "topic": "历史", "stem": "Passage: 'Papermaking reached the Islamic world after the Battle of Talas in 751, when Chinese papermakers were captured and taken to Samarkand. Mills in Baghdad later spread the craft across North Africa and into Europe.' According to the passage, papermaking spread westward mainly through:", "options": ["A. trade caravans carrying finished paper.", "B. translated instruction manuals.", "C. monks travelling between monasteries.", "D. the movement of captured craftsmen."], "answer": "D", "analysis": "原文的因果链非常清楚：751 年塔拉斯之战后中国造纸工匠被俘至撒马尔罕，随后巴格达的作坊把技艺传向西方，D 正确。A、B、C 均非原文给出的传播途径，A 混淆了'成品纸的贸易'与'技术的传播'。"}, {"id": "yi-r-065", "level": "IELTS", "type": "阅读", "topic": "历史", "stem": "Passage: 'Aboriginal Australians have long practised \"cool burns\": small, patchy fires lit early in the season that clear dry undergrowth while leaving tree canopies and wildlife refuges intact.' According to the passage, cool burns differ from uncontrolled wildfires in that they:", "options": ["A. occur only after wildfires have started.", "B. remove all vegetation from the burnt area.", "C. burn at lower intensity and leave canopies largely unharmed.", "D. are used to clear land for agriculture."], "answer": "C", "analysis": "原文对比点在于 'small, patchy fires...leaving tree canopies and wildlife refuges intact'，即低强度、保留树冠，C 正确。B 与 'leaving refuges intact' 矛盾；A 颠倒了先后期关系；D 把火耕误读为农耕开荒，原文未提。"}, {"id": "yi-r-066", "level": "IELTS", "type": "阅读", "topic": "历史", "stem": "Passage: 'In 1630s Holland, contracts for tulip bulbs changed hands at ever higher prices, sometimes for the price of a house, even though the bulbs remained in the ground. In February 1637 prices collapsed almost overnight.' The passage implies that bulb prices were driven mainly by:", "options": ["A. a shortage of bulbs caused by crop disease.", "B. speculation rather than the flowers' practical value.", "C. government subsidies for tulip growers.", "D. rising demand for cut flowers at weddings."], "answer": "B", "analysis": "球茎还埋在土里其合约价格就已高过房价，随后一夜崩盘，这是典型的投机泡沫特征，可推断价格由投机驱动，B 正确。A、C 原文均未提及；D 是对花卉需求的字面误读，无法解释价格暴涨暴跌。"}, {"id": "yi-r-067", "level": "IELTS", "type": "阅读", "topic": "科技", "stem": "Passage: 'The last manned lighthouses in Britain were automated in the 1990s, ending two centuries of keepers' reports. Today, sensors check lamp performance and satellite links alert engineers ashore when faults occur.' What is the passage mainly about?", "options": ["A. The dangers of lighthouse keeping in the nineteenth century.", "B. The construction techniques used for offshore lighthouses.", "C. The replacement of human keepers by automated monitoring systems.", "D. The training required for modern lighthouse engineers."], "answer": "C", "analysis": "段落主线是'最后一批有人值守灯塔在 90 年代自动化'，随后说明传感器与卫星如何替代值守，C 概括全段。A、B、D 都只涉及边缘细节或原文未提内容，属于以偏概全或无中生有的干扰项。"}, {"id": "yi-r-068", "level": "IELTS", "type": "阅读", "topic": "社会", "stem": "Passage: 'Among listeners under twenty-five, a quarter now follow the news mainly through podcasts, drawn by conversational formats and the ability to multitask. Publishers have responded by commissioning daily news shows under ten minutes long.' According to the passage, why have publishers commissioned short daily news podcasts?", "options": ["A. To compete with radio dramas.", "B. To comply with new broadcasting regulations.", "C. To reduce the cost of hiring journalists.", "D. To cater for young listeners' formats and habits."], "answer": "D", "analysis": "原文逻辑链：年轻人爱听播客（对话形式、可一心多用）→ 出版方因此推出十分钟以内的每日新闻节目，D 准确概括这一因果。A、B、C 均为原文未提及的动机，属于无中生有的干扰项。"}, {"id": "yi-r-069", "level": "IELTS", "type": "阅读", "topic": "经济", "stem": "Passage: 'Second-hand clothing is expanding several times faster than the overall apparel market. Resale platforms attribute the boom to two forces: squeezed household budgets and growing unease about fast fashion's environmental footprint.' According to the passage, the growth of resale platforms is driven by:", "options": ["A. financial pressure and environmental concerns.", "B. declining quality of new garments.", "C. celebrity endorsements on social media.", "D. new taxes on new clothing."], "answer": "A", "analysis": "原文明确列举两大动力：'squeezed household budgets'（经济压力）与 'unease about...environmental footprint'（环保顾虑），A 是两者的合并转述。B、C、D 在原文中均无对应信息。"}, {"id": "yi-r-070", "level": "IELTS", "type": "阅读", "topic": "社会", "stem": "Passage: 'Tool libraries lend drills, ladders and sewing machines to members for a small annual fee. Organisers argue that a drill is typically used for just thirteen minutes in its lifetime, so sharing beats owning.' The writer mentions the thirteen-minute figure in order to:", "options": ["A. prove that drills are poorly manufactured.", "B. illustrate why shared ownership makes sense.", "C. discourage people from doing home repairs.", "D. show that membership fees are too high."], "answer": "B", "analysis": "'一把电钻一生只被使用约十三分钟'是用来论证'共享胜于拥有'的例证，服务于段落的论证目的，选 B。A 偷换了'使用时间短'与'质量差'；C 与鼓励维修的文意相反；D 属无中生有。"}, {"id": "yi-r-071", "level": "IELTS", "type": "阅读", "topic": "教育", "stem": "Passage: 'Supporters of tuition-free university say it removes debt barriers for poorer students. Opponents reply that free tuition is a subsidy enjoyed mainly by middle-class families whose children attend university in the largest numbers, and that grants targeted at low-income students would be fairer.' What is the opponents' main argument?", "options": ["A. Poorer students are unwilling to take on student loans.", "B. Universities would lower teaching quality without tuition income.", "C. Free tuition chiefly benefits families that are already better-off.", "D. Grants should replace all forms of public funding."], "answer": "C", "analysis": "反方观点的核心句是 'a subsidy enjoyed mainly by middle-class families'，即免费学费主要补贴了本已富裕的家庭，C 正确。A 未提及；B 是另一话题；D 曲解了原文——原文只主张定向助学金，并未说取代所有公共资助。"}, {"id": "yi-r-072", "level": "IELTS", "type": "阅读", "topic": "教育", "stem": "Passage: 'In Tennessee's Project STAR, pupils randomly assigned to small kindergarten classes outperformed peers in larger classes, and follow-up studies found the advantage still detectable years later in test scores and college attendance.' What did Project STAR find?", "options": ["A. Class size had no measurable effect on pupils.", "B. Benefits of small classes appeared only in reading.", "C. Small classes helped only the highest achievers.", "D. Early small-class benefits persisted into later schooling."], "answer": "D", "analysis": "原文两层信息：幼儿园小班成绩更好；追踪研究显示优势在多年后的考试与大学入学中仍可测得，D 完整概括两点。A 与结论相反；B、C 都是原文没有的范围限定（学科、群体）。"}, {"id": "yi-r-073", "level": "IELTS", "type": "阅读", "topic": "教育", "stem": "Passage: 'In a widely cited experiment, students who took notes by hand outperformed laptop users on conceptual questions. The researchers argued that because handwriting is slower, note-takers are forced to summarise and select, which deepens processing, whereas laptop users tend to transcribe verbatim.' Why did longhand note-takers perform better on conceptual questions?", "options": ["A. Summarising by hand encouraged deeper processing of the material.", "B. Laptops in the classroom were frequently disconnected from the network.", "C. Handwriters recorded more complete word-for-word notes.", "D. Conceptual questions were easier to read on paper."], "answer": "A", "analysis": "原文给出的机制是：手写慢→被迫概括与取舍→加工更深，A 正确。C 恰好说反——逐字记录的是用电脑的学生；B、D 均与原文机制无关，属于无中生有的干扰项。"}, {"id": "yi-r-074", "level": "IELTS", "type": "阅读", "topic": "教育", "stem": "Passage: 'Spaced repetition—reviewing material at expanding intervals—produces far better long-term retention than cramming, because each successful retrieval strengthens the memory trace just as the learner is about to forget.' According to the passage, why is spaced repetition effective?", "options": ["A. It removes the need for sleep after study.", "B. Retrieval just before forgetting strengthens memory.", "C. It shortens total study time to a single session.", "D. Expanding intervals reduce the difficulty of material."], "answer": "B", "analysis": "原文的因果解释是 'each successful retrieval strengthens the memory trace just as the learner is about to forget'，即在即将遗忘时成功提取能强化记忆，B 正确。A、D 无中生有；C 与间隔复习（多次）矛盾，恰是死记硬背的特征。"}, {"id": "yi-r-075", "level": "IELTS", "type": "阅读", "topic": "教育", "stem": "Passage: 'In Scandinavian forest schools, children spend most of the day outdoors in woodland, whatever the weather. Teachers report gains in motor coordination, resilience and the ability to judge risks, even though formal academic instruction is postponed until later grades.' What benefit of forest schools does the passage highlight?", "options": ["A. Earlier acquisition of literacy skills.", "B. Higher scores on standardised mathematics tests.", "C. Growth in physical coordination and risk judgement.", "D. Reduced costs for school buildings and staff."], "answer": "C", "analysis": "原文列举的收益是 'motor coordination, resilience and the ability to judge risks'，C 对应其中两点。A 与'正式学业指导推迟'矛盾；B 原文未提考试成绩；D 属于运营成本话题，原文未涉及。"}, {"id": "yi-r-076", "level": "IELTS", "type": "阅读", "topic": "教育", "stem": "Passage: 'A meta-analysis of dozens of studies found a small positive association between children's music training and mathematics achievement. The authors caution, however, that children who take music lessons tend to come from families with more books and higher incomes, which could explain part of the link.' What does the meta-analysis suggest about the music-maths link?", "options": ["A. Music training is proven to cause large gains in mathematics.", "B. Family background rules out any role for music training.", "C. Mathematics achievement causes children to study music.", "D. It is uncertain whether music training itself causes the gains."], "answer": "D", "analysis": "作者提醒学音乐的孩子多来自书籍更多、收入更高的家庭，即家庭背景这一混杂变量可能解释部分相关性，因此因果不明，D 正确。A 夸大为'证明因果'；B 过度推断（'part of the link'不等于全部）；C 颠倒因果方向且原文未提。"}, {"id": "yi-r-077", "level": "IELTS", "type": "阅读", "topic": "健康", "stem": "Passage: 'Art therapy helps some veterans with post-traumatic stress by externalising memories onto paper, therapists say. Transferring images from mind to canvas reduces avoidance, the hallmark of the condition, and allows trauma to be discussed at a safe distance.' According to the passage, art therapy works chiefly by:", "options": ["A. moving traumatic memories outside the mind, reducing avoidance.", "B. training veterans to become professional artists.", "C. replacing conventional medication entirely.", "D. encouraging veterans to forget their experiences."], "answer": "A", "analysis": "原文机制句是 'externalising memories onto paper...reduces avoidance'，即把记忆外化以减少回避，A 正确。B、C 均无中生有；D 与'保持安全距离地讨论创伤'矛盾——治疗目标是面对而非遗忘。"}, {"id": "yi-r-078", "level": "IELTS", "type": "阅读", "topic": "文化", "stem": "Passage: 'A growing number of museums are negotiating the return of artefacts to communities of origin. Several institutions have repatriated Benin bronzes taken in a nineteenth-century punitive expedition, arguing that provenance now outweighs the old defence of universal museums.' What is the passage mainly about?", "options": ["A. The declining popularity of museum visiting among tourists.", "B. Museums increasingly returning artefacts amid provenance debates.", "C. The failure of international law to protect cultural property.", "D. New storage techniques for bronze collections."], "answer": "B", "analysis": "段落主线：越来越多博物馆与来源社区谈判归还文物，多家机构已归还贝宁青铜器，理由是来源正当性压倒'普世博物馆'旧辩护，B 概括全文。A、C、D 或无中生有或仅是边缘细节。"}, {"id": "yi-r-079", "level": "IELTS", "type": "阅读", "topic": "文化", "stem": "Passage: 'Films shot in regional dialects once faced limited distribution, but subtitled streaming releases have carried them to global audiences. Directors say subtitles have turned local speech from a barrier into a mark of authenticity that viewers actively seek out.' According to the passage, subtitles have changed dialect films by:", "options": ["A. persuading actors to adopt standard pronunciation.", "B. shortening the length of regional film festivals.", "C. turning local speech into an attraction for global viewers.", "D. increasing government funding for dialect cinema."], "answer": "C", "analysis": "原文末句 'subtitles have turned local speech from a barrier into a mark of authenticity that viewers actively seek out' 表明方言从障碍变成了观众主动追寻的卖点，C 正确。A 与保留方言的文意相反；B、D 原文未提。"}, {"id": "yi-r-080", "level": "IELTS", "type": "阅读", "topic": "社会", "stem": "Passage: 'Public libraries have become de facto daytime refuges for people experiencing homelessness, offering warmth, seating and internet access. Recognising this, some library systems have hired social workers who connect vulnerable patrons with housing and health services instead of relying on security staff to remove them.' According to the passage, how have some libraries responded to homeless patrons?", "options": ["A. By restricting entry to card-holding members only.", "B. By extending opening hours into the night.", "C. By asking police to patrol reading rooms.", "D. By employing social workers to link them with services."], "answer": "D", "analysis": "原文明确说'一些图书馆系统雇用了社会工作者，把有需要的读者对接到住房与医疗服务'，D 是原句转述。A 与图书馆成为日间庇护所的事实矛盾；B、C 属于原文未提及或与'不再依赖安保驱离'相反的做法。"}, {"id": "yi-r-081", "level": "IELTS", "type": "阅读", "topic": "健康", "stem": "Passage: 'While about six per cent of British adults describe themselves as vegetarian or vegan, a far larger group—nearly a third—identify as flexitarians, eating meat occasionally while cutting it out on most days.' What does the passage indicate about dietary change in Britain?", "options": ["A. Partial meat reduction is far more common than strict vegetarianism.", "B. Vegetarianism has overtaken meat-eating as the majority habit.", "C. Most flexitarians plan to become vegan within a year.", "D. Labels such as flexitarian have no measurable meaning."], "answer": "A", "analysis": "原文数据对比：严格素食者约 6%，弹性素食者近三分之一，后者远多于前者，A 正确概括。B 与'偶尔吃肉'的整体格局矛盾；C、D 均为原文未提及的推断或评价。"}, {"id": "yi-r-082", "level": "IELTS", "type": "阅读", "topic": "健康", "stem": "Passage: 'The Mediterranean diet performs well in trials, but sticking to it is another matter. In one twelve-month study, roughly half of the participants had abandoned the eating pattern by the six-month mark, most citing cost and the effort of cooking from scratch.' What happened in the twelve-month study?", "options": ["A. All participants kept to the diet for the full year.", "B. About half quit the diet by the midway point.", "C. Participants were unable to afford any food at all.", "D. Researchers replaced home cooking with meal deliveries."], "answer": "B", "analysis": "原文说 'roughly half of the participants had abandoned the eating pattern by the six-month mark'，即到研究中期约半数人放弃，B 正确。A 与之矛盾；C 夸大（'citing cost'是放弃原因之一而非吃不起任何食物）；D 是改变实验条件的无中生有项。"}, {"id": "yi-r-083", "level": "IELTS", "type": "阅读", "topic": "健康", "stem": "Passage: 'Standing desks reduce sitting time modestly, but reviews find little evidence that they alone improve cardiovascular health; treadmill desks burn more calories yet measurably slow typing accuracy. Researchers conclude that desk design matters less than total daily movement.' What do the researchers conclude?", "options": ["A. Treadmill desks should replace all office furniture.", "B. Standing desks are dangerous for office workers.", "C. Overall daily activity matters more than the type of desk used.", "D. Cardiovascular health depends entirely on genetics."], "answer": "C", "analysis": "原文结论句 'desk design matters less than total daily movement' 表明桌型设计不如全天总活动量重要，C 正确。A 与打字准确率下降的细节矛盾；B 过度推断，原文只说证据不足；D 与全文讨论活动量的方向完全背离。"}, {"id": "yi-r-084", "level": "IELTS", "type": "阅读", "topic": "健康", "stem": "Passage: 'Volunteers who took a sixty-to-ninety-minute nap containing slow-wave sleep remembered twenty per cent more word pairs an hour later than those who stayed awake, and their memory advantage persisted into the following evening.' What did the nap study find?", "options": ["A. Napping erased the volunteers' short-term memories.", "B. Only nighttime sleep can consolidate new memories.", "C. Longer naps made volunteers too groggy to be tested.", "D. Slow-wave napping improved recall, with effects lasting hours."], "answer": "D", "analysis": "含慢波睡眠的 60–90 分钟小睡使一小时后的词对记忆多保留 20%，且优势延续到当晚，D 完整转述两点。A 与结果相反；B 与'小睡有效'矛盾；C 原文未提昏沉无法测试。"}, {"id": "yi-r-085", "level": "IELTS", "type": "阅读", "topic": "社会", "stem": "Passage: 'Weak social ties carry health risks comparable to smoking fifteen cigarettes a day, according to pooled analyses of long-term studies. Isolation raises the risk of premature death more than obesity or inactivity, though the biological pathways remain debated.' How does the passage describe the risk of weak social ties?", "options": ["A. As comparable in scale to a heavy smoking habit.", "B. As smaller than the risk posed by physical inactivity.", "C. As relevant only to elderly populations.", "D. As fully explained by known biological mechanisms."], "answer": "A", "analysis": "原文原句 'comparable to smoking fifteen cigarettes a day' 把社交联系薄弱的健康风险比作每天抽十五支烟，A 正确。B 与原文'高于肥胖或不运动'相反；C 无年龄限定；D 与 'pathways remain debated' 矛盾。"}, {"id": "yi-r-086", "level": "IELTS", "type": "阅读", "topic": "健康", "stem": "Passage: 'New Zealand doctors have begun issuing \"green prescriptions\"—structured plans for outdoor activity in parks. Early evaluations show that patients rarely keep them up unless a community support worker follows up, prompting calls to fund support alongside the prescription itself.' What challenge does the green prescription programme face?", "options": ["A. Patients refuse to visit parks near their homes.", "B. Adherence is poor without follow-up support workers.", "C. Doctors lack training to write exercise plans.", "D. Parks charge entry fees for prescribed activities."], "answer": "B", "analysis": "原文明确说 'patients rarely keep them up unless a community support worker follows up'，即没有社区支持人员跟进时依从性差，B 正确。A、C、D 均非原文提及的障碍，其中 C 把问题错误归因于医生。"}, {"id": "yi-r-087", "level": "IELTS", "type": "阅读", "topic": "城市", "stem": "Passage: 'Urban community gardens yield surprisingly little food per hectare compared with farms, yet evaluations consistently record their strongest effect elsewhere: neighbours who garden together report denser friendship networks and greater willingness to help one another.' According to the passage, the main benefit of community gardens is:", "options": ["A. outcompeting commercial farms in output.", "B. lowering city food prices overall.", "C. strengthening neighbourhood social ties.", "D. training residents as professional growers."], "answer": "C", "analysis": "原文用 'strongest effect elsewhere' 把重点引向社会效益：友谊网络更密、互助意愿更强，C 正确。A 与'每公顷产量出奇地低'相反；B、D 均为原文未提及的经济或职业推断。"}, {"id": "yi-r-088", "level": "IELTS", "type": "阅读", "topic": "城市", "stem": "Passage: 'Paris has converted streets outside primary schools into \"school streets\", closed to cars during drop-off and pick-up hours. Monitoring found sharply lower nitrogen dioxide levels at the gates, though some parents initially objected to longer walking routes.' What effect of school streets does the passage report?", "options": ["A. School attendance rates rose immediately.", "B. Traffic speeds increased outside the gates.", "C. School-run journeys became more dangerous.", "D. Nitrogen dioxide at the gates dropped markedly."], "answer": "D", "analysis": "原文监测结果是 'sharply lower nitrogen dioxide levels at the gates'，即校门口二氧化氮显著下降，D 正确。A 原文未提；B 与封路逻辑相反；C 与部分家长的抱怨（绕路）不同——抱怨的是路程变长而非更危险。"}, {"id": "yi-r-089", "level": "IELTS", "type": "阅读", "topic": "城市", "stem": "Passage: 'Milan's Bosco Verticale towers host around 900 trees on their balconies. The buildings rely on built-in irrigation lines and a team of arborists who prune from ropes twice a year; without that engineered care, horticulturists say, the forest would fail within a few seasons.' According to the passage, the vertical forest depends on:", "options": ["A. engineered irrigation and regular professional maintenance.", "B. rainfall alone, channelled by the balcony design.", "C. volunteers from the surrounding neighbourhood.", "D. trees that naturally thrive without pruning."], "answer": "A", "analysis": "原文末句点明：没有内置灌溉与园艺师每年两次的修剪，'森林'几个季度内就会失败，A 正确。B、D 与'依赖工程化养护'直接矛盾；C 原文未提及志愿者。"}, {"id": "yi-r-090", "level": "IELTS", "type": "阅读", "topic": "城市", "stem": "Passage: 'Rotterdam's water squares are sunken plazas that function as basketball courts and amphitheatres in dry weather. During cloudbursts, they fill with storm water, holding it until drains recover, which relieves pressure on the sewer system.' What is distinctive about the water squares' design?", "options": ["A. They are permanently flooded recreational lakes.", "B. They serve as public spaces that double as storm basins.", "C. They replace the city's entire sewer network.", "D. They filter storm water into drinking supplies."], "answer": "B", "analysis": "原文的核心设计特征是'一地两用'：晴天是球场和剧场，暴雨时是滞洪池，B 正确。A 的'永久积水'与'晴天可用'矛盾；C 夸大为取代整个排水系统；D 把滞洪误读为净水入饮用系统。"}, {"id": "yi-r-091", "level": "IELTS", "type": "阅读", "topic": "城市", "stem": "Passage: 'Tokyo's disaster parks look ordinary, but benches convert into cooking stoves, and beneath the lawns lie water tanks and emergency stores. Planners chose parks because they already sit within walking distance of most homes.' Why did planners base the facilities in parks?", "options": ["A. Parks are the only land the city owns.", "B. Parks are cheaper to build on than rooftops.", "C. Most residents can reach parks on foot.", "D. Parks hide the equipment from inspection."], "answer": "C", "analysis": "原文最后一句直接给出理由：'they already sit within walking distance of most homes'，即公园步行可达，C 正确。A、B、D 均非原文给出的规划理由，属于无中生有。"}, {"id": "yi-r-092", "level": "IELTS", "type": "阅读", "topic": "社会", "stem": "Passage: 'Around eighty per cent of Singaporeans live in public housing blocks built by the Housing and Development Board. Uniquely, each block must meet ethnic quotas that mirror the national mix, a policy designed to prevent the formation of single-community enclaves.' What is the purpose of the ethnic quotas?", "options": ["A. To limit the total number of flats per district.", "B. To decide the prices of resale flats.", "C. To reserve flats for government employees.", "D. To encourage mixed communities and avoid enclaves."], "answer": "D", "analysis": "原文目的句 'designed to prevent the formation of single-community enclaves' 表明配额是为了防止形成单一族群聚居区、促进混合社区，D 正确。A、B、C 都把配额误读为数量、价格或身份性规则，原文均无此意。"}, {"id": "yi-r-093", "level": "IELTS", "type": "阅读", "topic": "科技", "stem": "Passage: 'Autonomous haul trucks have worked round-the-clock shifts in Australian iron-ore mines for several years. Operators report higher utilisation than human-driven fleets, since the trucks neither rest nor hand over at shift changes, and they follow digital routes too precisely to wander off haul roads.' What advantage of autonomous trucks does the passage emphasise?", "options": ["A. Continuous operation without shift breaks.", "B. Lower purchase price than conventional trucks.", "C. The ability to repair themselves in the field.", "D. Faster speeds on public highways."], "answer": "A", "analysis": "原文强调 'neither rest nor hand over at shift changes'，即不停歇、不换班带来的更高利用率，A 正确。B、C、D 均无对应信息；D 还混淆了矿区作业与公路行驶。"}, {"id": "yi-r-094", "level": "IELTS", "type": "阅读", "topic": "科技", "stem": "Passage: 'Electronic ink screens reflect ambient light like paper, stay readable in direct sun and draw power only when the image changes. Their weakness is refresh rate: the slow redraw makes them unsuitable for video or fast scrolling.' According to the passage, the main limitation of e-ink screens is:", "options": ["A. poor readability in bright sunlight.", "B. slow refresh unsuited to moving content.", "C. heavy power consumption while idle.", "D. short lifespan compared with paper."], "answer": "B", "analysis": "原文结构是让步+转折：先列优点（阳光下可读、静态省电），再用 'Their weakness is refresh rate' 点出局限——重绘慢导致不适合视频与快速滚动，B 正确。A、C 与优点列表恰好相反；D 原文未提寿命。"}, {"id": "yi-r-095", "level": "IELTS", "type": "阅读", "topic": "科技", "stem": "Passage: 'Open-source code is becoming standard in scientific research because publishing it lets others verify results. Yet the volunteer maintainers who keep that code working are chronically underfunded, and several essential libraries have been abandoned mid-project.' What challenge does open-source science face?", "options": ["A. Journals refuse to publish any results computed by software.", "B. Researchers deliberately insert errors into shared code.", "C. Sustaining the maintenance of shared code is underfunded.", "D. Open-source licences prohibit academic use."], "answer": "C", "analysis": "原文转折句指出：维护代码的志愿者'长期资金不足'，若干关键库被中途弃维护，C 正确。A、B、D 均为原文未提及且与'开源正成为标准'的文意相冲突的干扰项。"}, {"id": "yi-r-096", "level": "IELTS", "type": "阅读", "topic": "动物", "stem": "Passage: 'Camera surveys in the deep Pacific off Peru have recorded dozens of species new to science, many inside areas licensed for seabed mining. Scientists stress that such baseline surveys must be completed before extraction begins, or changes caused by mining will be impossible to measure.' Why do scientists want baseline surveys finished before mining starts?", "options": ["A. To train mining crews in species identification.", "B. To identify commercially valuable fish stocks.", "C. To delay mining licences indefinitely.", "D. To make later mining impacts measurable."], "answer": "D", "analysis": "原文因果句 'or changes caused by mining will be impossible to measure' 表明：先有基线数据，日后采矿造成的变化才有对照可言，D 正确。A、B、C 均非原文所述目的；C 把科学诉求曲解为无限期拖延。"}, {"id": "yi-r-097", "level": "IELTS", "type": "阅读", "topic": "科技", "stem": "Passage: 'Engineered bamboo, laminated from treated strips, rivals steel in tensile strength while weighing far less. Colombian shaking-table tests showed bamboo-framed houses surviving simulated earthquakes that cracked concrete frames.' According to the passage, a key property of engineered bamboo is:", "options": ["A. high tensile strength combined with light weight.", "B. complete resistance to fire and insects.", "C. lower cost than any other building material.", "D. the ability to bend without any limit."], "answer": "A", "analysis": "原文首句 'rivals steel in tensile strength while weighing far less' 直接给出两大特性：抗拉强度可比钢材、重量轻得多，A 正确。B、C、D 均为无中生有或绝对化的表述，原文未提防火防虫、价格比较或无限弯曲。"}, {"id": "yi-r-098", "level": "IELTS", "type": "阅读", "topic": "交通", "stem": "Passage: 'Kite-assisted cargo ships tow computer-controlled kites a few hundred metres above the sea, where winds are stronger and steadier. Sea trials recorded fuel savings of ten to thirty-five per cent on suitable routes, and the kites can be retrofitted to existing vessels.' What do the sea trials of kite propulsion show?", "options": ["A. Every ship achieved identical savings.", "B. Fuel savings of up to about a third on favourable routes.", "C. Kites perform best when the ship is stationary.", "D. Retrofitting is impossible without rebuilding the hull."], "answer": "B", "analysis": "原文数据 'fuel savings of ten to thirty-five per cent on suitable routes'，即适宜航线上省油最高约三分之一，B 正确。A 忽略了区间与航线条件；C 与高空风筝助推的原理相悖；D 与 'can be retrofitted' 直接矛盾。"}, {"id": "yi-r-099", "level": "IELTS", "type": "阅读", "topic": "科技", "stem": "Passage: 'When wireless emergency alerts began pushing tornado warnings straight to mobile phones, the average lead time before a twister struck rose by several minutes, and studies associate those extra minutes with lower casualty rates, particularly at night.' According to the passage, phone-based alerts reduced casualties mainly by:", "options": ["A. increasing warning lead time before tornadoes strike.", "B. making tornadoes weaker over open farmland.", "C. replacing the need for storm shelters.", "D. recruiting volunteers as weather observers."], "answer": "A", "analysis": "原文逻辑：手机直推警报使预警提前量增加数分钟→额外几分钟与更低伤亡率相关，尤其夜间，A 正确概括因果。B 曲解（警报不改变龙卷风强度）；C 无中生有；D 与手机警报机制无关。"}, {"id": "yi-r-100", "level": "IELTS", "type": "阅读", "topic": "科技", "stem": "Passage: 'Fibre-optic strands glued along a bridge's girders act as continuous strain gauges: light passing through them changes as the structure flexes. Engineers receive early warning of overstress, allowing repairs to be scheduled before cracks spread.' What benefit do the fibre-optic sensors provide?", "options": ["A. They generate electricity for the bridge lighting.", "B. They automatically repair cracks in the girders.", "C. They replace the need for any human inspection.", "D. They enable maintenance to be planned before damage spreads."], "answer": "D", "analysis": "原文末句 'allowing repairs to be scheduled before cracks spread' 表明传感器支持预测性维护——在裂缝扩展前安排修理，D 正确。A、B 把'监测'夸大为'发电'或'自修'；C 过度绝对化，原文并未取消人工检查。"}, {"id": "yi-r-101", "level": "IELTS", "type": "阅读", "topic": "动物", "stem": "Passage: 'Flamingos often stand on one leg for hours, and research suggests the posture is surprisingly economical. Experiments with cadaver birds showed a passive locking mechanism in the hip that keeps the leg extended without muscular work, balancing the body over the standing limb.' What did the research find about flamingos' one-legged stance?", "options": ["A. It requires less muscular effort thanks to a passive locking mechanism.", "B. It is used only when the birds are sleeping in water.", "C. It causes lasting damage to the hip joints.", "D. It depends on continuous tiny muscle adjustments."], "answer": "A", "analysis": "原文指出髋部的被动锁合机制让腿保持伸展而无需肌肉做功，单腿站姿因而非常省力，A 正确。B 原文未限定场景；C 与'省力'结论相反；D 恰与'passive...without muscular work'矛盾。"}, {"id": "yi-r-102", "level": "IELTS", "type": "阅读", "topic": "动物", "stem": "Passage: 'New Caledonian crows carve hooked tools from twigs and, in laboratory tasks, retrieve food by using one tool to obtain a second, longer tool—evidence of planning several steps ahead rather than trial-and-error learning alone.' The laboratory tasks demonstrated that the crows could:", "options": ["A. count the number of food items available.", "B. plan multi-step solutions using tools in sequence.", "C. imitate human toolmakers exactly.", "D. distinguish colours faster than pigeons."], "answer": "B", "analysis": "原文描述乌鸦'用一件工具去获取第二件更长的工具'，即按顺序使用工具、提前规划多步方案，B 正确。A、C、D 均非该实验的设计目的或结果，属于与实验无关的横向比较或能力。"}, {"id": "yi-r-103", "level": "IELTS", "type": "阅读", "topic": "动物", "stem": "Passage: 'The lesser long-nosed bat migrates along a corridor of night-blooming cacti, pollinating agave plants as it feeds. Because agave reproduction in many regions depends on these bats, biologists warn that losing the corridor would ripple through plant communities and the tequila industry alike.' Why are the bats important to agave plants?", "options": ["A. They dig burrows that aerate the soil.", "B. They eat insects that destroy agave roots.", "C. They spread seeds only during winter months.", "D. They pollinate the plants while feeding."], "answer": "D", "analysis": "原文关键信息 'pollinating agave plants as it feeds' 说明蝙蝠在取食时为龙舌兰传粉，是其繁殖的关键，D 正确。A、B、C 均无原文依据；C 还添加了季节限定。"}, {"id": "yi-r-104", "level": "IELTS", "type": "阅读", "topic": "动物", "stem": "Passage: 'Elephants exchange calls pitched below the range of human hearing, which travel several kilometres through air and, in low-frequency form, through ground vibrations that herds can detect with the pads of their feet.' According to the passage, elephants' long-distance communication:", "options": ["A. uses infrasound travelling through air and ground.", "B. is audible to humans at close range.", "C. depends entirely on ground vibration alone.", "D. has been replaced by learned alarm whistles."], "answer": "A", "analysis": "原文说大象用低于人类听觉范围的次声交流，既通过空气传播数公里，也以地面振动形式被脚垫感知，A 正确。B 与'below the range of human hearing'矛盾；C 遗漏了空气传声；D 无中生有。"}, {"id": "yi-r-105", "level": "IELTS", "type": "阅读", "topic": "动物", "stem": "Passage: 'Where sea otters thrive, urchins are kept in check and kelp forests grow tall; where otters were hunted out, urchin barrens replaced the forests. Ecologists cite the otter as a textbook example of a predator whose presence shapes an entire habitat.' What role does the passage assign to sea otters?", "options": ["A. A keystone predator that controls urchin populations.", "B. A primary producer at the base of the food web.", "C. A scavenger that cleans up kelp debris.", "D. A competitor that displaces kelp-grazing fish."], "answer": "A", "analysis": "原文对比两个状态（有水獭→海胆受控、海藻林繁茂；水獭绝迹→海胆荒漠），并称之为'textbook example'，说明水獭是控制海胆、塑造生境的关键捕食者，A 正确。B、C、D 均与其营养级角色不符。"}, {"id": "yi-r-106", "level": "IELTS", "type": "阅读", "topic": "动物", "stem": "Passage: 'Cryptochrome proteins in robins' eyes may let them sense the Earth's magnetic field. In tunnel experiments, birds oriented correctly in shielded huts but lost their bearing when faint radio-frequency noise was added, suggesting the compass depends on a delicate quantum-scale mechanism.' What evidence supports the quantum-compass idea?", "options": ["A. Robins oriented correctly only after training with magnets.", "B. Radio-frequency noise disrupted the birds' orientation.", "C. Blindfolded robins navigated better than sighted ones.", "D. Cryptochrome was found in the birds' wing muscles."], "answer": "B", "analysis": "原文的实验对照是：屏蔽舱内定向正常，加入微弱射频噪声后定向丧失，说明定向依赖精微的量子尺度机制，B 是关键证据。A 的'磁铁训练'无中生有；C 原文未做蒙眼实验；D 与'eyes'不符。"}, {"id": "yi-r-107", "level": "IELTS", "type": "阅读", "topic": "动物", "stem": "Passage: 'Saharan desert ants wander circuitously in search of dead insects, yet head straight home once food is found. Researchers concluded that the ants integrate their path—counting steps and reading the pattern of polarised sky light—rather than following scent trails, which the hot surface would evaporate.' According to the passage, how do desert ants find their way home?", "options": ["A. By following scent trails laid on the outward journey.", "B. By memorising landmarks along the route.", "C. By combining step-counting with sky-light patterns.", "D. By communicating with nest-mates through touch."], "answer": "C", "analysis": "原文的机制句是 'counting steps and reading the pattern of polarised sky light'，即路径积分＝数步数＋读取天空偏振光，C 正确。A 被原文明确否定（气味会蒸发）；B、D 均非原文所述方式。"}, {"id": "yi-r-108", "level": "IELTS", "type": "阅读", "topic": "动物", "stem": "Passage: 'Salmon returning to spawn navigate thousands of kilometres at sea, apparently tracking magnetic signatures, then switch to smell in the final approach: as juveniles they imprint on the unique odour of their home river, and follow that scent upstream years later.' According to the passage, the final stage of the salmon's homing journey relies on:", "options": ["A. the magnetic field of the ocean floor.", "B. visual memory of coastal landmarks.", "C. following other salmon in the school.", "D. scent memories imprinted in youth."], "answer": "D", "analysis": "原文说幼年时对家乡河流的气味'打上烙印'，数年后循此气味逆流而上完成归程的最后一程，D 正确。A 对应的是海上远距离阶段而非最后阶段；B、C 原文未提。"}, {"id": "yi-r-109", "level": "IELTS", "type": "阅读", "topic": "动物", "stem": "Passage: 'Wolf choruses ripple through packs in the wild, and researchers tracking individuals found that a wolf howls far more often when a close companion has been taken away temporarily than when a mere pack-mate is absent. The finding suggests howls help maintain social bonds across distance.' What did the tracking study find?", "options": ["A. Wolves howl more when separated from close companions.", "B. Howling is used mainly to warn rival packs at night.", "C. Each wolf has a unique howl it never changes.", "D. Choruses occur only during the breeding season."], "answer": "A", "analysis": "原文的核心发现是 'a wolf howls far more often when a close companion has been taken away'，即亲密同伴被带走时嚎叫显著增多，A 正确。B、C、D 均非该研究的结论，属于方向偏离的干扰项。"}, {"id": "yi-r-110", "level": "IELTS", "type": "阅读", "topic": "动物", "stem": "Passage: 'Octopuses match their skin to backgrounds with uncanny accuracy, yet behavioural tests indicate they are colour-blind, seeing little beyond brightness and polarisation. The puzzle's likely answer lies in their skin: chromatophore cells respond to light directly, giving the body a form of peripheral vision the eyes cannot provide.' What puzzle does the passage explain?", "options": ["A. Why octopuses avoid bright polarised light.", "B. How colour-blind octopuses can still match colours.", "C. Why octopuses change colour only in darkness.", "D. How octopuses see farther than squid."], "answer": "B", "analysis": "段落结构是'谜题+解答'：色盲却能精准变色，答案在皮肤中的色素细胞可直接感光，B 概括这一谜题。A、C、D 均非原文讨论的问题；C 与'匹配背景'的日常场景相矛盾。"}, {"id": "yi-r-111", "level": "IELTS", "type": "阅读", "topic": "环境", "stem": "Read the paragraph and choose the most suitable heading. Paragraph: 'As seawater absorbs carbon dioxide, it becomes more acidic, and shell-building creatures pay the price. Oyster hatcheries on the American west coast already buffer their tanks with soda ash, because corrosive water has repeatedly dissolved the larvae of young oysters before they could settle.'", "options": ["A. The economics of Pacific oyster farming.", "B. Ocean acidification threatens shell-forming species.", "C. New recipes for soda ash production.", "D. Carbon dioxide emissions from hatcheries."], "answer": "B", "analysis": "段落主线：海水吸收 CO2 变酸→损害造壳生物→牡蛎育苗场已需加碱缓冲，B 准确概括'酸化威胁造壳物种'。A 偏离重点（未谈经济）；C 曲解了 soda ash 的用途；D 颠倒了因果—— hatcheries 是受害者而非排放者。"}, {"id": "yi-r-112", "level": "IELTS", "type": "阅读", "topic": "科技", "stem": "Read the paragraph and choose the most suitable heading. Paragraph: 'Aboard modern icebreakers, scientists work in floating laboratories equipped with drilling rigs that pull up sediment cores metres long. Because these cores contain climate records stretching back millions of years, each expedition is effectively a journey through geological time as well as polar ice.'", "options": ["A. Tourism cruises to the polar regions.", "B. Shipping routes opened by thinner ice.", "C. Competing territorial claims in the Arctic.", "D. Polar vessels that double as research platforms."], "answer": "D", "analysis": "段落围绕破冰船上的'漂浮实验室'与沉积物钻探展开，强调其科研功能，D 概括最全面。A、B、C 都与'科考'这一核心无关，属于同一话题（极地）下的方向偏离。"}, {"id": "yi-r-113", "level": "IELTS", "type": "阅读", "topic": "动物", "stem": "Read the paragraph and choose the most suitable heading. Paragraph: 'Krill, the shrimp-like staples of the Southern Ocean food web, are now harvested by factory trawlers that can process catches at sea. In response, an international commission divides the fishable area into zones and closes any zone where catches approach a set share of local krill biomass.'", "options": ["A. The feeding habits of baleen whales.", "B. Zonal management of a growing krill fishery.", "C. Refrigeration technology on fishing vessels.", "D. The discovery of new shrimp species."], "answer": "B", "analysis": "段落重心是管理措施：分区捕捞并在接近份额时关闭渔区，B 的 'zonal management' 精确对应。A 只是背景铺垫；C 混淆了'船上加工'与冷藏技术；D 无中生有。"}, {"id": "yi-r-114", "level": "IELTS", "type": "阅读", "topic": "环境", "stem": "Read the paragraph and choose the most suitable heading. Paragraph: 'Across the Himalayas and the Andes, meltwater lakes pooled behind ice dams are swelling as glaciers retreat. Villages downstream have little warning when such dams burst, so engineers now install cables that measure lake depth and trigger sirens the moment levels begin to fall.'", "options": ["A. The growth of adventure tourism at altitude.", "B. Traditional irrigation systems of mountain farms.", "C. Early-warning systems for glacial lake floods.", "D. How glaciers carve valleys over millennia."], "answer": "C", "analysis": "段落后半句是主旨所在：安装测深缆并在水位骤降时鸣警，即为冰湖溃决洪水建立预警，C 正确。A、B 均无涉及；D 谈的是地质过程，与'当代风险与技术应对'不符。"}, {"id": "yi-r-115", "level": "IELTS", "type": "阅读", "topic": "环境", "stem": "Read the paragraph and choose the most suitable heading. Paragraph: 'Each year, some 180 million tonnes of dust lift off the Sahara and ride trade winds across the Atlantic. Satellite tracking shows the largest share settles on the Amazon basin, where the phosphorus it carries replaces nutrients that constant rain washes out of the forest's nutrient-poor soils.'", "options": ["A. Methods of measuring rainfall in rainforests.", "B. The advance of the Sahara desert.", "C. Desert dust that fertilises the Amazon.", "D. Shipping hazards posed by Atlantic storms."], "answer": "C", "analysis": "段落两层：撒哈拉沙尘跨越大西洋＋其携带的磷补给雨林流失的养分，C '为亚马逊施肥的沙漠沙尘'同时涵盖两者。B 只谈沙尘起源；A、D 与原文主题无关。"}, {"id": "yi-r-116", "level": "IELTS", "type": "阅读", "topic": "健康", "stem": "Read the paragraph and choose the most suitable heading. Paragraph: 'In the deltas of South Asia, millions drink from wells sunk into sediments rich in naturally occurring arsenic. Because the poison accumulates over decades, the first skin lesions often appear long after a community has depended on the water, making testing campaigns difficult to target.'", "options": ["A. Modern methods of digging deeper tubewells.", "B. Industrial waste dumping in river deltas.", "C. Waterborne cholera outbreaks in cities.", "D. Delayed harm from arsenic in groundwater."], "answer": "D", "analysis": "段落主线是'天然砷质沉积物中的井水→毒性的长期累积→多年后才出现皮肤病变'，D 概括地下水砷的延迟危害。A、C 无中生有；B 与'naturally occurring'矛盾——砷是天然来源而非工业排放。"}, {"id": "yi-r-117", "level": "IELTS", "type": "阅读", "topic": "城市", "stem": "Read the paragraph and choose the most suitable heading. Paragraph: 'Replacing lead service lines costs several thousand dollars per household, which is why utilities once deferred the work. Full-scale substitution programmes, however, recoup part of the outlay through fewer lead-poisoning hospital visits and higher property values along renewed streets.'", "options": ["A. Charity schemes that pay household water bills.", "B. The invention of modern copper plumbing.", "C. How lead enters the atmosphere of old cities.", "D. Weighing the costs and paybacks of lead pipe replacement."], "answer": "D", "analysis": "段落结构是'成本高昂导致拖延→但全面更换可通过减少铅中毒就医和提升房价收回部分投入'，即权衡成本与回报，D 正确。B、C、A 均与'供水铅管更换的经济账'无关。"}, {"id": "yi-r-118", "level": "IELTS", "type": "阅读", "topic": "科技", "stem": "Read the paragraph and choose the most suitable heading. Paragraph: 'Reference-grade air monitoring stations cost more than many town budgets allow, so researchers have scattered cheap sensors that report particulate levels every few seconds. Their readings drift with humidity, yet when networks of them are cross-checked against one station, sudden pollution spikes can still be mapped street by street.'", "options": ["A. Government standards for factory chimney filters.", "B. Low-cost sensor networks that map local air pollution.", "C. The health effects of breathing fine particulates.", "D. Satellite observation of greenhouse gases."], "answer": "B", "analysis": "段落核心：廉价传感器网络虽会漂移，但经基准站校核后可逐街绘制污染峰值图，B 概括其作用。A、D 与地面传感器无关；C 偏离主线——段落谈监测手段而非健康后果。"}, {"id": "yi-r-119", "level": "IELTS", "type": "阅读", "topic": "交通", "stem": "Read the paragraph and choose the most suitable heading. Paragraph: 'Dockless bikes once piled up on pavements and fell into canals, forcing cities to impound them by the thousand. Operators now bid for capped fleets in exchange for painted parking bays, and GPS geofencing disables wheels left outside designated zones.'", "options": ["A. The invention of the safety bicycle.", "B. From bike chaos to regulated dockless schemes.", "C. Cycling holidays along restored canals.", "D. The rise of electric motorbike racing."], "answer": "B", "analysis": "段落呈现'乱象→治理'的对比：无桩单车曾堆积泛滥，如今通过限额竞拍、划设停车区与电子围栏进行规范，B 概括这一转变。A、C、D 均与'共享单车治理'无关。"}, {"id": "yi-r-120", "level": "IELTS", "type": "阅读", "topic": "交通", "stem": "Read the paragraph and choose the most suitable heading. Paragraph: 'Battery-electric buses cost roughly twice their diesel equivalents, yet depot accounts tell another story. Charged overnight at off-peak rates, a city bus saves enough on fuel and brake repairs over a decade to close much of the gap, while garages report quieter workshops and fewer oil leaks to mop up.'", "options": ["A. Diesel engine maintenance techniques.", "B. Overnight bus lanes and congestion charging.", "C. The lifetime economics of electric bus fleets.", "D. Hydrogen fuel experiments in aviation."], "answer": "C", "analysis": "段落用'购置贵但运营省'的总账逻辑（谷价充电、省燃料省刹车维修、十年内收回差价）讨论电动公交的全生命周期经济性，C 正确。A 只是维修话题的细节；B、D 与主题无关。"}, {"id": "yi-r-121", "level": "IELTS", "type": "阅读", "topic": "环境", "stem": "Read the paragraph and choose the most suitable heading. Paragraph: 'Aviation cannot yet electrify long-haul routes, so airlines have turned to fuel refined from used cooking oil and agricultural waste, which fits existing jet engines without modification. Supplies remain a fraction of demand, however, and critics argue that counting such fuels toward climate targets delays investment in alternatives.'", "options": ["A. The physics of jet engine combustion.", "B. In-flight meal waste on long-haul routes.", "C. Sustainable aviation fuel: promise and limits.", "D. Airport construction in remote regions."], "answer": "C", "analysis": "段落先介绍可持续航空燃料的优势（兼容现有发动机），再指出供应不足与'拖延替代技术投资'的批评，正反两面构成 C 的'前景与局限'。B 曲解了'废食用油'的用途；A、D 无中生有。"}, {"id": "yi-r-122", "level": "IELTS", "type": "阅读", "topic": "交通", "stem": "Read the paragraph and choose the most suitable heading. Paragraph: 'Cruise ships traditionally kept their diesel engines running in port to power lights, kitchens and air-conditioning. Shore power lets vessels plug into the electricity grid at the quay instead, cutting harbour-side emissions of nitrogen oxides almost to zero, though fitting older ships with the necessary connectors can be expensive.'", "options": ["A. The golden age of transatlantic liners.", "B. Deep-water port dredging projects.", "C. Ferry timetables and tidal windows.", "D. Cutting ship emissions through shore-side electricity."], "answer": "D", "analysis": "段落主线：靠港熄机、接入岸电→港区内氮氧化物排放几乎归零，D 概括'岸电减排'。A、B、C 均与岸电无关；'老船改造成本高'只是补充细节，不构成标题重心。"}, {"id": "yi-r-123", "level": "IELTS", "type": "阅读", "topic": "文化", "stem": "Read the paragraph and choose the most suitable heading. Paragraph: 'Towns certified by the Cittaslow movement pledge to keep local cheeses on shop shelves, limit big-box stores on the edge of town and shorten their meetings. Membership is not about nostalgia alone: certified towns report that slow branding attracts visitors who stay overnight rather than day-trip.'", "options": ["A. Cooking courses for visiting gourmets.", "B. Traffic-calming measures on rural roads.", "C. The decline of small agricultural cooperatives.", "D. Slow-certified towns that trade on local character."], "answer": "D", "analysis": "段落先讲'慢城'认证的承诺（保留地方食品、限制大卖场），再讲其经济回报（吸引过夜游客），D 的'以地方特色为卖点'同时覆盖两层。B、C、A 或只见树木不见森林，或无中生有。"}, {"id": "yi-r-124", "level": "IELTS", "type": "阅读", "topic": "城市", "stem": "Read the paragraph and choose the most suitable heading. Paragraph: 'On Hong Kong's rooftops, farmers in shorts and gloves tend beds of choi sum between air-conditioning units. The plots sell weekly vegetable boxes to neighbours, but their greater yield is social: volunteers report learning where food comes from and meeting flat-dwellers from floors they had never visited.'", "options": ["A. High-rise architecture trends in East Asia.", "B. Hydroponic technology for space stations.", "C. Rooftop farms that feed and connect communities.", "D. Supermarket supply chains for leafy greens."], "answer": "C", "analysis": "段落递进：卖菜是其一，'greater yield is social'点明更大收获是社会联结——志愿者了解食物来源、结识邻里，C 同时概括'供给食物'与'联结社区'。A、B、D 均偏离主线。"}, {"id": "yi-r-125", "level": "IELTS", "type": "阅读", "topic": "城市", "stem": "Read the paragraph and choose the most suitable heading. Paragraph: 'Thermal imaging flights over several cities reveal a striking pattern: leafy suburbs measure several degrees cooler than treeless districts of the same city on summer afternoons. Planners now treat canopy cover as infrastructure, budgeting for tree planting with the same seriousness as drainage.'", "options": ["A. Satellite surveillance of suburban gardens.", "B. Tree canopy as a cooling asset in city planning.", "C. Drainage engineering in flood-prone basements.", "D. Insurance premiums for summer heatwaves."], "answer": "B", "analysis": "段落由观测（有树街区更凉爽）推进到政策（把树冠覆盖率当作基础设施来预算），B 概括'树冠＝规划中的降温资产'。A 曲解了热成像用途；C、D 只与末句的比喻或无关话题相关。"}, {"id": "yi-r-126", "level": "IELTS", "type": "阅读", "topic": "环境", "stem": "Read the paragraph and choose the most suitable heading. Paragraph: 'Cities do not cool evenly after sunset. Streets of dark asphalt and concrete store the day's heat and release it slowly overnight, so the gap between urban and rural temperatures is widest in the small hours, leaving little relief for residents without air-conditioning.'", "options": ["A. Choosing paint colours for historic facades.", "B. Why urban nights stay hotter than the countryside.", "C. The effect of air-conditioning on electricity grids.", "D. Rural traditions of evening outdoor markets."], "answer": "B", "analysis": "段落解释机制：沥青与混凝土白天储热、夜间缓慢释放→城乡温差在凌晨最大，B 的'城市夜间为何更热'直指主旨。A、D 无中生有；C 只是末句提到的背景细节。"}, {"id": "yi-r-127", "level": "IELTS", "type": "阅读", "topic": "文化", "stem": "Read the paragraph and choose the most suitable heading. Paragraph: 'Volunteers with sound recorders have mapped the acoustic character of their boroughs: dawn birdsong in the cemetery, the thrum of extractor fans behind restaurants, church bells that mark the quarter-hours. The resulting archive is consulted by planners seeking to protect quiet corners before development erases them.'", "options": ["A. Noise-canceling technology in modern offices.", "B. Recording studio acoustics for orchestras.", "C. Bell founding as a medieval craft.", "D. Community sound maps that guide preservation."], "answer": "D", "analysis": "段落主线：志愿者录音绘制街区声景地图→档案被规划者用来保护安静角落，D 概括'社区声音地图服务保护'。A、B 与社区录音无关；C 只是列举中的一个细节。"}, {"id": "yi-r-128", "level": "IELTS", "type": "阅读", "topic": "文化", "stem": "Read the paragraph and choose the most suitable heading. Paragraph: 'Street vendors in many cities operate in a legal grey zone: their food shapes the city's culinary reputation, yet they trade without secure licences and can be moved on at a day's notice. Recent reforms issue renewable permits tied to hygiene training, letting vendors invest in carts and supplies for the first time.'", "options": ["A. Restaurant review columns in local papers.", "B. Recipes for the most popular street snacks.", "C. Licensing reforms that give vendors a foothold.", "D. Delivery apps competing with corner shops."], "answer": "C", "analysis": "段落呈现'灰色地带→改革发放可续期许可并与卫生培训挂钩→摊贩首次敢投资'的推进逻辑，C 概括许可制改革。B、A、D 均与'摊贩法律地位'这一核心无关。"}, {"id": "yi-r-129", "level": "IELTS", "type": "阅读", "topic": "历史", "stem": "Read the paragraph and choose the most suitable heading. Paragraph: 'At open-air museums across Scandinavia, staff in period costume plant heritage crops, forge nails and cook over open hearths, drawing on diaries and farm accounts rather than guesswork. Visitors may be handed a rake, because curators believe understanding comes through hands rather than glass cases.'", "options": ["A. Conservation chemistry in national archives.", "B. Reenactment grounded in archival research.", "C. Theme park rides based on Viking legends.", "D. The economics of museum gift shops."], "answer": "B", "analysis": "段落两个要点：复原活动'依据日记与农庄账簿而非猜测'（研究基础）＋'让参观者动手'（体验理念），B 的'基于档案研究的情景再现'最全面。A 是文献保护话题；C 把动手体验曲解为游乐项目；D 无中生有。"}, {"id": "yi-r-130", "level": "IELTS", "type": "阅读", "topic": "文化", "stem": "Read the paragraph and choose the most suitable heading. Paragraph: 'Frescoes in the Dunhuang caves fade a little more with every group of visitors, so conservators photograph the walls at ultra-high resolution and publish the images online. Scholars can now compare brushwork across caves without adding to the carbon dioxide and humidity that threaten the originals.'", "options": ["A. Pigment trade routes in the Tang dynasty.", "B. The rediscovery of a lost silk road fortress.", "C. Cave hotels carved into desert cliffs.", "D. Digital replicas that ease pressure on fragile caves."], "answer": "D", "analysis": "段落因果：壁画因游客而受损→超高清数字影像上线→学者无需亲临即可研究，从而减少威胁壁画的 CO2 与湿度，D 概括'数字副本为脆弱洞窟减压'。B、C、A 均与数字保护无关。"}, {"id": "yi-r-131", "level": "IELTS", "type": "阅读", "topic": "艺术", "stem": "Read the paragraph and choose the most suitable heading. Paragraph: 'Restorers once glued flaking plaster back onto frescoes with resins that yellowed within a generation. Today's principle is reversibility: adhesives are chosen so that a future conservator, with better knowledge or materials, can undo today's work without harming the original surface.'", "options": ["A. The chemistry of yellowing varnishes.", "B. Restoration ethics: leaving room to reverse decisions.", "C. Forgeries detected in Renaissance workshops.", "D. Tourist fees that fund cathedral repairs."], "answer": "B", "analysis": "段落由历史教训（旧树脂发黄）引出当代原则'可逆性'——未来修复者可无损撤销今日的干预，B 精确概括这一修复伦理。A 是引子细节；C、D 无中生有。"}, {"id": "yi-r-132", "level": "IELTS", "type": "阅读", "topic": "艺术", "stem": "Read the paragraph and choose the most suitable heading. Paragraph: 'Orchestras that once depended on ageing subscribers now record soundtracks for blockbuster games, and conservatoire students queue for courses in interactive scoring. Composers explain the attraction plainly: game music must
