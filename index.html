<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="英语跃迁工作台">
<meta name="theme-color" content="#FBF7F0">
<title>英语跃迁工作台 · CET6 → 雅思</title>
<style>
:root{
  --bg:#FBF7F0; --surface:#FFFFFF; --surface-2:#F6F0E6;
  --ink:#3A352F; --muted:#8A8178; --line:#ECE3D6;
  --terra:#C26B4A; --terra-soft:#F2DFD3; --terra-d:#A8553A;
  --sage:#7A9B76; --sage-soft:#E4EDE1; --sage-d:#5F8260;
  --gold:#C9A24B; --danger:#C0473B; --danger-soft:#F6DEDB;
  --shadow:0 6px 22px rgba(90,70,50,.10); --radius:16px;
  --r-sm:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.55;
  -webkit-font-smoothing:antialiased; padding-bottom:80px;
}
.wrap{max-width:960px;margin:0 auto;padding:0 14px}
/* Header */
header.top{
  background:linear-gradient(135deg,#F3E7DA,#FBF7F0 60%);
  border-bottom:1px solid var(--line); padding:18px 0 14px;
}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:12px;background:var(--terra);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;box-shadow:var(--shadow)}
.brand h1{font-size:20px;margin:0;letter-spacing:.5px}
.brand p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.stats{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:8px 12px;min-width:78px;box-shadow:var(--shadow)}
.chip b{display:block;font-size:18px;color:var(--terra-d)}
.chip span{font-size:11.5px;color:var(--muted)}
/* Tabs */
nav.tabs{position:sticky;top:0;z-index:20;background:rgba(251,247,240,.92);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin-top:0}
.tabs .wrap{display:flex;gap:6px;overflow-x:auto;padding:10px 14px}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);
  color:var(--muted);padding:8px 15px;border-radius:999px;font-size:14px;cursor:pointer;
  display:flex;align-items:center;gap:6px;white-space:nowrap;transition:.15s}
.tab.active{background:var(--terra);color:#fff;border-color:var(--terra);font-weight:600}
.tab svg{width:16px;height:16px}
/* Sections */
section.panel{display:none;animation:fade .25s ease}
section.panel.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;margin-top:14px;box-shadow:var(--shadow)}
.card h2{font-size:16px;margin:0 0 4px;display:flex;align-items:center;gap:8px}
.card .sub{color:var(--muted);font-size:12.5px;margin:0 0 12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
/* Buttons */
.btn{border:1px solid var(--terra);background:var(--terra);color:#fff;padding:9px 16px;
  border-radius:11px;font-size:14px;cursor:pointer;font-weight:600;transition:.15s}
.btn:hover{background:var(--terra-d)}
.btn.ghost{background:var(--surface);color:var(--terra);border-color:var(--terra-soft)}
.btn.ghost:hover{background:var(--terra-soft)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:9px}
.btn.soft{background:var(--sage-soft);color:var(--sage-d);border-color:var(--sage-soft)}
.btn.soft:hover{background:#D7E6D2}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{border:none;background:transparent;cursor:pointer;color:var(--terra);padding:4px}
/* Badges */
.badge{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:600;white-space:nowrap}
.b-cet6{background:var(--sage-soft);color:var(--sage-d)}
.b-ielts{background:var(--terra-soft);color:var(--terra-d)}
.b-type{background:var(--surface-2);color:var(--muted)}
.b-danger{background:var(--danger-soft);color:var(--danger)}
.b-ok{background:var(--sage-soft);color:var(--sage-d)}
.b-wrong{background:var(--danger-soft);color:var(--danger)}
/* Inputs */
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);
  border:1px solid var(--line);border-radius:10px;padding:8px 11px;background:var(--surface);width:100%}
textarea{resize:vertical;min-height:64px}
select{width:auto;min-width:120px}
label.fld{display:block;font-size:12.5px;color:var(--muted);margin:8px 0 3px}
/* Task list */
.task{display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid var(--line);
  border-radius:12px;margin-bottom:8px;background:var(--surface)}
.task .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s}
.task.done .box{background:var(--sage);border-color:var(--sage)}
.task.done .tname{color:var(--muted);text-decoration:line-through}
.task .tname{font-weight:600}
.tag-core{font-size:10.5px;background:var(--terra-soft);color:var(--terra-d);padding:1px 7px;border-radius:999px}
.tag-flex{font-size:10.5px;background:var(--surface-2);color:var(--muted);padding:1px 7px;border-radius:999px}
.overdue{border-color:var(--danger);background:var(--danger-soft)}
/* Quiz */
.filterbar{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.filterbar .fitem{display:flex;flex-direction:column;gap:3px}
.filterbar label{font-size:11.5px;color:var(--muted)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.q .qhead{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.q .stem{white-space:pre-wrap;margin:4px 0 10px;font-size:14.5px}
.opt{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);
  border-radius:10px;margin-bottom:7px;cursor:pointer;transition:.12s;background:var(--surface)}
.opt:hover{border-color:var(--terra)}
.opt.sel{border-color:var(--terra);background:var(--terra-soft)}
.opt.correct{border-color:var(--sage);background:var(--sage-soft)}
.opt.wrong{border-color:var(--danger);background:var(--danger-soft)}
.opt .mk{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-size:12px}
.opt.sel .mk{border-color:var(--terra);background:var(--terra);color:#fff}
.analysis{margin-top:8px;border-top:1px dashed var(--line);padding-top:10px;font-size:13px;color:#5b5249}
.analysis .at{font-weight:700;color:var(--terra-d);margin-bottom:3px}
.sample{background:var(--surface-2);border-radius:10px;padding:10px;font-size:13px;white-space:pre-wrap;margin-top:6px}
/* Daily reading — 梅花式一题一卡 */
.read-set{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.read-card{border-radius:16px;padding:16px;box-shadow:var(--shadow);position:relative;overflow:hidden;background:var(--surface)}
.read-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px}
.read-card.article{background:#FBF9F5;border:1px solid var(--line)}
.read-card.article::before{background:var(--sage)}
.read-card.question{border:1px solid var(--line)}
.read-card.question::before{background:var(--terra)}
.read-card.answer{border:1px dashed var(--terra-soft);background:#FFF9F5}
.read-card.answer::before{background:var(--terra)}
.read-hd{display:flex;align-items:center;gap:10px;margin-bottom:10px;position:relative;z-index:1}
.read-hd .ric{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:0 0 auto}
.read-card.article .ric{background:var(--sage-soft);color:var(--sage-d)}
.read-card.question .ric{background:var(--terra-soft);color:var(--terra-d)}
.read-card.answer .ric{background:var(--terra-soft);color:var(--terra-d)}
.read-hd h3{margin:0;font-size:15px;color:var(--ink)}
.read-hd .meta{margin-left:auto;font-size:11px;color:var(--muted);background:var(--surface-2);padding:3px 9px;border-radius:999px}
.read-passage{font-size:14.5px;line-height:1.75;color:#4a433c;white-space:pre-wrap;position:relative;z-index:1}
.read-question{font-size:15px;line-height:1.65;font-weight:700;color:var(--ink);margin-bottom:10px;position:relative;z-index:1}
.read-opts{display:flex;flex-direction:column;gap:7px;position:relative;z-index:1}
.read-opt{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:14px;cursor:pointer;transition:.12s}
.read-opt:hover{border-color:var(--terra)}
.read-opt.sel{border-color:var(--terra);background:var(--terra-soft)}
.read-opt .letter{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted);flex:0 0 auto}
.read-opt.sel .letter{border-color:var(--terra);background:var(--terra);color:#fff}
.read-details>summary{list-style:none;cursor:pointer}
.read-details>summary::-webkit-details-marker{display:none}
.read-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;background:none;border:none;padding:0;font-size:14px;font-weight:700;color:var(--terra-d);position:relative;z-index:1}
.read-summary{display:flex;align-items:center;gap:10px}
.read-answer{padding-top:12px;margin-top:12px;border-top:1px dashed var(--line);position:relative;z-index:1}
.read-answer .ans-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.read-answer .ans-val{font-size:20px;font-weight:800;color:var(--sage-d)}
.read-answer .ans-tag{font-size:11px;background:var(--sage-soft);color:var(--sage-d);padding:2px 9px;border-radius:999px;font-weight:600}
.read-answer .ans-body{font-size:13.5px;line-height:1.7;color:#5b5249;margin-top:8px}
/* Vocab */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.vcard{border:1px solid var(--line);border-radius:14px;padding:13px;background:var(--surface);box-shadow:var(--shadow)}
.vcard .vw{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.vcard .vp{color:var(--muted);font-size:13px}
.vcard .vm{margin:6px 0;font-size:13.5px}
.vcard .ve{font-size:12px;color:#6b6258;font-style:italic;border-left:3px solid var(--terra-soft);padding-left:8px}
.vcard .vact{display:flex;gap:6px;margin-top:8px}
.vcard.known{border-color:var(--sage);background:#F4F8F2}
.flash{text-align:center;max-width:520px;margin:0 auto}
.flash .fc{min-height:200px;border:1px solid var(--line);border-radius:18px;padding:30px 20px;text-align:center;
  background:var(--surface);box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;justify-content:center}
.flash .fc .big{font-size:30px;font-weight:700}
.flash .fc .ph{color:var(--muted);font-size:15px;margin-top:6px}
.flash .fc .ans{margin-top:14px;font-size:16px}
/* Resources */
.res{display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.res .ri{width:34px;height:34px;border-radius:9px;background:var(--terra-soft);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.res a{font-weight:600;color:var(--terra-d);text-decoration:none}
.res .rd{font-size:12px;color:var(--muted)}
/* Data */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px;overflow-x:auto;padding-bottom:6px}
.heat .d{width:13px;height:13px;border-radius:3px;background:var(--surface-2)}
.heat .d.l1{background:#E9D9C8}.heat .d.l2{background:#DCB89C}.heat .d.l3{background:#C98E66}.heat .d.l4{background:var(--terra)}
.logitem{border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:7px;font-size:13px;display:flex;justify-content:space-between;gap:8px}
.muted{color:var(--muted)}
/* 移动端右下角诊断按钮：默认小圆点，点击展开 */
.verchip{position:fixed;right:12px;bottom:78px;z-index:60;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:11px;padding:4px 10px;border-radius:999px;box-shadow:var(--shadow);cursor:pointer;font-family:inherit;transition:.2s}
.verchip.collapsed{padding:0;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px}
.verchip.collapsed .txt{display:none}
@media(max-width:480px){
  .verchip{padding:0;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px}
  .verchip .txt{display:none}
}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:11px 18px;border-radius:12px;font-size:13.5px;z-index:99;opacity:0;transition:.25s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
.empty{text-align:center;color:var(--muted);padding:26px;font-size:13.5px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:none;background:var(--surface);padding:7px 13px;cursor:pointer;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--terra);color:#fff;font-weight:600}
/* Weekly plan board */
.board{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px}
.col{flex:0 0 148px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:11px}
.col h3{font-size:13.5px;margin:0 0 1px}
.col .cdate{font-size:11px;color:var(--muted);margin-bottom:8px}
.col .cbar{height:5px;border-radius:3px;background:var(--surface);overflow:hidden;margin-bottom:8px}
.col .cbar i{display:block;height:100%;background:var(--sage);border-radius:3px}
.ptask{display:flex;gap:7px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 8px;margin-bottom:6px;font-size:12.5px}
.ptask.done .ptext{text-decoration:line-through;color:var(--muted)}
.ptask .pbox{width:16px;height:16px;border-radius:5px;border:2px solid var(--line);flex:0 0 auto;cursor:pointer;margin-top:1px;display:flex;align-items:center;justify-content:center}
.ptask.done .pbox{background:var(--sage);border-color:var(--sage)}
.ptask .pbox svg{width:11px;height:11px}
.ptask .pdel{margin-left:auto;cursor:pointer;color:var(--muted);border:none;background:none;font-size:13px;padding:0 2px}
.col .add{margin-top:4px}
.col .add input{padding:6px 8px;font-size:12.5px}
/* Speaking partner */
.spk-cat{margin-bottom:10px}
.prompt{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--surface);box-shadow:var(--shadow)}
.prompt .pq{font-size:16px;font-weight:700;line-height:1.5}
.prompt .ptip{font-size:12.5px;color:var(--muted);margin-top:6px}
.prompt .pwords{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.prompt .pwords span{font-size:11.5px;background:var(--sage-soft);color:var(--sage-d);padding:2px 8px;border-radius:999px}
.recbox{margin-top:12px}
.recbox textarea{min-height:80px}
.rate{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.model{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;font-size:13px}
.model .at{font-weight:700;color:var(--terra-d);margin-bottom:4px}
.model .mv{background:var(--surface-2);border-radius:10px;padding:10px;white-space:pre-wrap}
.sr-status{font-size:12.5px;color:var(--terra-d);margin-top:6px;min-height:18px}
/* Bottom nav (app shell) */
/* AI 搭子 */
.msgs{display:flex;flex-direction:column;gap:8px;max-height:54vh;overflow-y:auto;padding:4px 2px;scroll-behavior:smooth}
.msg{max-width:86%;padding:9px 12px;border-radius:14px;font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.msg.me{align-self:flex-end;background:var(--terra);color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg .spk{opacity:.65;cursor:pointer;margin-left:6px;font-size:12px}
.think{align-self:flex-start;color:var(--muted);font-size:13px;font-style:italic;padding:4px 8px}
.chatbar{display:flex;gap:8px;align-items:flex-end;margin-top:10px}
.chatbar textarea{flex:1;min-height:46px;max-height:120px;resize:none}
.cfgbox{border-top:1px dashed var(--line);padding-top:12px;margin-top:12px;display:flex;flex-direction:column;gap:8px}
.cfgbox .hint{font-size:12.5px;color:var(--muted);line-height:1.7}
.modehero{display:flex;align-items:center;gap:10px;margin:2px 0 10px}
.modehero .big{font-size:26px}
.bottomnav{display:none}
@media(max-width:560px){
  .stats .chip{min-width:64px;padding:7px 9px}
  .brand h1{font-size:18px}
  .vgrid{grid-template-columns:1fr}
  nav.tabs{display:none}
  .bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:rgba(251,247,240,.97);backdrop-filter:blur(8px);border-top:1px solid var(--line);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
  .btab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--muted);cursor:pointer;padding:3px 0}
  .btab svg{width:20px;height:20px}
  .btab.active{color:var(--terra)}
  body{padding-bottom:74px}
  .board{flex-wrap:nowrap}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
      </div>
      <div>
        <h1>英语跃迁工作台</h1>
        <p>CET6 → 雅思 · 训练 · 题库 · 词汇 · 打卡</p>
      </div>
    </div>
    <div class="stats" id="statStrip"></div>
  </div>
</header>

<nav class="tabs">
  <div class="wrap" id="tabBar"></div>
</nav>

<main class="wrap">
  <section class="panel active" id="tab-train"></section>
  <section class="panel" id="tab-bank"></section>
  <section class="panel" id="tab-vocab"></section>
  <section class="panel" id="tab-plan"></section>
  <section class="panel" id="tab-speak"></section>
  <section class="panel" id="tab-ai"></section>
  <section class="panel" id="tab-lib"></section>
  <section class="panel" id="tab-data"></section>
</main>

<button class="verchip" id="verChip" type="button"><span class="txt">🤖 AI搭子 v2.4.1 · 在线美音</span><span class="ico">🔧</span></button>
<div class="toast" id="toast"></div>

s": "v./n.", "zh": "引发；扳机", "example_en": "The news triggered a wave of selling on the stock market.", "example_zh": "这一消息引发了股市的抛售浪潮。", "level": "CET6"}, {"word": "trivial", "phonetic": "/ˈtrɪviəl/", "pos": "adj.", "zh": "琐碎的；不重要的", "example_en": "Don't waste time on trivial matters.", "example_zh": "不要在琐事上浪费时间。", "level": "CET6"}, {"word": "tumble", "phonetic": "/ˈtʌmbl/", "pos": "v.", "zh": "摔倒；暴跌", "example_en": "Share prices tumbled after the announcement.", "example_zh": "公告发布后股价暴跌。", "level": "CET6"}, {"word": "turbulent", "phonetic": "/ˈtɜːbjələnt/", "pos": "adj.", "zh": "动荡的；湍急的", "example_en": "The country went through a turbulent period in the 1990s.", "example_zh": "该国在20世纪90年代经历了动荡时期。", "level": "CET6"}, {"word": "undermine", "phonetic": "/ˌʌndəˈmaɪn/", "pos": "v.", "zh": "逐渐削弱；暗中破坏", "example_en": "Constant criticism can undermine a child's confidence.", "example_zh": "不断的批评会削弱孩子的自信心。", "level": "CET6"}, {"word": "undergo", "phonetic": "/ˌʌndəˈɡəʊ/", "pos": "v.", "zh": "经历；承受", "example_en": "The old theatre will undergo major renovation.", "example_zh": "这座老剧院将进行大规模翻修。", "level": "CET6"}, {"word": "underlie", "phonetic": "/ˌʌndəˈlaɪ/", "pos": "v.", "zh": "构成…的基础", "example_en": "Several factors underlie the current economic crisis.", "example_zh": "若干因素构成了当前经济危机的基础。", "level": "CET6"}, {"word": "utilize", "phonetic": "/ˈjuːtəlaɪz/", "pos": "v.", "zh": "利用；使用", "example_en": "The system utilizes the latest computer technology.", "example_zh": "该系统采用了最新的计算机技术。", "level": "CET6"}, {"word": "utter", "phonetic": "/ˈʌtə(r)/", "pos": "v./adj.", "zh": "说出；完全的", "example_en": "She stared at the ruined house in utter despair.", "example_zh": "她彻底绝望地盯着毁坏的房子。", "level": "CET6"}, {"word": "vague", "phonetic": "/veɪɡ/", "pos": "adj.", "zh": "模糊的；含糊的", "example_en": "His explanation of the accident was rather vague.", "example_zh": "他对事故的解释相当含糊。", "level": "CET6"}, {"word": "valid", "phonetic": "/ˈvælɪd/", "pos": "adj.", "zh": "有效的；有根据的", "example_en": "Your passport is valid for another three years.", "example_zh": "你的护照还有三年有效期。", "level": "CET6"}, {"word": "vanish", "phonetic": "/ˈvænɪʃ/", "pos": "v.", "zh": "消失；绝迹", "example_en": "The magician made the rabbit vanish into thin air.", "example_zh": "魔术师让兔子凭空消失了。", "level": "CET6"}, {"word": "velocity", "phonetic": "/vəˈlɒsəti/", "pos": "n.", "zh": "速度；速率", "example_en": "The rocket reached a velocity of 8 kilometres per second.", "example_zh": "火箭达到了每秒8公里的速度。", "level": "CET6"}, {"word": "venture", "phonetic": "/ˈventʃə(r)/", "pos": "n./v.", "zh": "风险企业；冒险", "example_en": "His business venture in the south proved very successful.", "example_zh": "他在南方的创业被证明非常成功。", "level": "CET6"}, {"word": "verbal", "phonetic": "/ˈvɜːbl/", "pos": "adj.", "zh": "口头的；言语的", "example_en": "They reached a verbal agreement on the price.", "example_zh": "他们就价格达成了口头协议。", "level": "CET6"}, {"word": "verge", "phonetic": "/vɜːdʒ/", "pos": "n.", "zh": "边缘", "example_en": "The species is on the verge of extinction.", "example_zh": "该物种正濒临灭绝。", "level": "CET6"}, {"word": "versatile", "phonetic": "/ˈvɜːsətaɪl/", "pos": "adj.", "zh": "多才多艺的；多用途的", "example_en": "Eggs are a versatile ingredient in cooking.", "example_zh": "鸡蛋是烹饪中用途广泛的食材。", "level": "CET6"}, {"word": "viable", "phonetic": "/ˈvaɪəbl/", "pos": "adj.", "zh": "可行的", "example_en": "Solar power is now a viable alternative to coal.", "example_zh": "太阳能如今是煤炭的可行替代品。", "level": "CET6"}, {"word": "vicious", "phonetic": "/ˈvɪʃəs/", "pos": "adj.", "zh": "恶毒的；凶残的", "example_en": "He wrote an article attacking the vicious rumour.", "example_zh": "他撰文抨击那则恶毒的谣言。", "level": "CET6"}, {"word": "violate", "phonetic": "/ˈvaɪəleɪt/", "pos": "v.", "zh": "违反；侵犯", "example_en": "The company was fined for violating environmental laws.", "example_zh": "该公司因违反环保法而被罚款。", "level": "CET6"}, {"word": "virtual", "phonetic": "/ˈvɜːtʃuəl/", "pos": "adj.", "zh": "虚拟的；事实上的", "example_en": "The website offers virtual tours of famous museums.", "example_zh": "该网站提供著名博物馆的虚拟参观。", "level": "CET6"}, {"word": "visualize", "phonetic": "/ˈvɪʒuəlaɪz/", "pos": "v.", "zh": "想象；使形象化", "example_en": "Try to visualize yourself succeeding in the interview.", "example_zh": "试着想象自己在面试中取得成功。", "level": "CET6"}, {"word": "vulnerable", "phonetic": "/ˈvʌlnərəbl/", "pos": "adj.", "zh": "脆弱的；易受伤的", "example_en": "Coastal cities are particularly vulnerable to flooding.", "example_zh": "沿海城市尤其容易受到洪水的侵袭。", "level": "CET6"}, {"word": "wary", "phonetic": "/ˈweəri/", "pos": "adj.", "zh": "谨慎的；警惕的", "example_en": "Investors are wary of putting money into risky projects.", "example_zh": "投资者对把钱投入高风险项目持谨慎态度。", "level": "CET6"}, {"word": "weary", "phonetic": "/ˈwɪəri/", "pos": "adj.", "zh": "疲惫的；厌倦的", "example_en": "The weary travellers finally reached the hotel at midnight.", "example_zh": "疲惫的旅行者终于在午夜抵达旅馆。", "level": "CET6"}, {"word": "wholesome", "phonetic": "/ˈhəʊlsəm/", "pos": "adj.", "zh": "有益健康的", "example_en": "The hotel serves simple, wholesome meals.", "example_zh": "这家旅馆供应简单而有益健康的饭菜。", "level": "CET6"}, {"word": "wield", "phonetic": "/wiːld/", "pos": "v.", "zh": "行使；挥舞", "example_en": "The department wields enormous power in the government.", "example_zh": "该部门在政府中行使着巨大的权力。", "level": "CET6"}, {"word": "wither", "phonetic": "/ˈwɪðə(r)/", "pos": "v.", "zh": "枯萎；凋谢", "example_en": "The flowers withered in the intense heat.", "example_zh": "花朵在酷热中枯萎了。", "level": "CET6"}, {"word": "wreck", "phonetic": "/rek/", "pos": "v./n.", "zh": "破坏；失事", "example_en": "The storm wrecked dozens of fishing boats.", "example_zh": "暴风雨毁坏了几十艘渔船。", "level": "CET6"}, {"word": "yield", "phonetic": "/jiːld/", "pos": "v./n.", "zh": "出产；让步；产量", "example_en": "The experiment yielded unexpected results.", "example_zh": "实验得出了出乎意料的结果。", "level": "CET6"}, {"word": "zeal", "phonetic": "/ziːl/", "pos": "n.", "zh": "热情；热忱", "example_en": "She served the community with great zeal.", "example_zh": "她满怀热情地为社区服务。", "level": "CET6"}, {"word": "pedagogy", "phonetic": "/ˈpedəɡɒɡi/", "pos": "n.", "zh": "教育学；教学法", "example_en": "The workshop introduced teachers to modern pedagogy based on collaborative learning.", "example_zh": "这次研讨会向教师介绍了基于协作学习的现代教学法。", "level": "IELTS"}, {"word": "tuition", "phonetic": "/tjuˈɪʃn/", "pos": "n.", "zh": "学费；教学", "example_en": "Tuition fees at British universities have risen sharply over the past decade.", "example_zh": "过去十年英国大学的学费大幅上涨。", "level": "IELTS"}, {"word": "syllabus", "phonetic": "/ˈsɪləbəs/", "pos": "n.", "zh": "教学大纲", "example_en": "The new syllabus places greater emphasis on critical thinking.", "example_zh": "新的教学大纲更加重视批判性思维。", "level": "IELTS"}, {"word": "aptitude", "phonetic": "/ˈæptɪtjuːd/", "pos": "n.", "zh": "天资，才能", "example_en": "The entrance test is designed to measure students' aptitude for scientific reasoning.", "example_zh": "入学测试旨在衡量学生科学推理的天赋。", "level": "IELTS"}, {"word": "vocational", "phonetic": "/vəʊˈkeɪʃənl/", "pos": "adj.", "zh": "职业的", "example_en": "Vocational training provides young people with practical skills for the workplace.", "example_zh": "职业培训为年轻人提供实用的职场技能。", "level": "IELTS"}, {"word": "numeracy", "phonetic": "/ˈnjuːmərəsi/", "pos": "n.", "zh": "计算能力", "example_en": "Poor numeracy skills can limit job opportunities in many industries.", "example_zh": "计算能力差会限制许多行业的就业机会。", "level": "IELTS"}, {"word": "dropout", "phonetic": "/ˈdrɒpaʊt/", "pos": "n.", "zh": "辍学者；中途退出者", "example_en": "The government introduced scholarships to reduce the dropout rate in rural areas.", "example_zh": "政府推出奖学金以降低农村地区的辍学率。", "level": "IELTS"}, {"word": "tutorial", "phonetic": "/tjuːˈtɔːriəl/", "pos": "n.", "zh": "导师辅导课", "example_en": "Students meet their supervisor once a week for a small-group tutorial.", "example_zh": "学生每周与导师见面一次，参加小组辅导课。", "level": "IELTS"}, {"word": "dissertation", "phonetic": "/ˌdɪsəˈteɪʃn/", "pos": "n.", "zh": "（学位）论文", "example_en": "She spent six months collecting data for her doctoral dissertation.", "example_zh": "她花了六个月时间为博士论文收集数据。", "level": "IELTS"}, {"word": "plagiarism", "phonetic": "/ˈpleɪdʒərɪzəm/", "pos": "n.", "zh": "剽窃", "example_en": "Universities use software to detect plagiarism in student essays.", "example_zh": "大学使用软件检测学生论文中的剽窃行为。", "level": "IELTS"}, {"word": "academia", "phonetic": "/ˌækəˈdiːmiə/", "pos": "n.", "zh": "学术界", "example_en": "After retiring from industry, he joined academia as a visiting professor.", "example_zh": "从业界退休后，他进入学术界担任客座教授。", "level": "IELTS"}, {"word": "scholarship", "phonetic": "/ˈskɒləʃɪp/", "pos": "n.", "zh": "奖学金；学问", "example_en": "She won a scholarship to study engineering at a university in Australia.", "example_zh": "她获得了奖学金，去澳大利亚一所大学学习工程学。", "level": "IELTS"}, {"word": "postgraduate", "phonetic": "/ˌpəʊstˈɡrædʒuət/", "pos": "n.", "zh": "研究生", "example_en": "The laboratory recruits postgraduates with a background in molecular biology.", "example_zh": "该实验室招聘具有分子生物学背景的研究生。", "level": "IELTS"}, {"word": "undergraduate", "phonetic": "/ˌʌndəˈɡrædʒuət/", "pos": "n.", "zh": "本科生", "example_en": "Undergraduates are required to attend at least two seminars each term.", "example_zh": "本科生每学期须至少参加两次研讨课。", "level": "IELTS"}, {"word": "enrolment", "phonetic": "/ɪnˈrəʊlmənt/", "pos": "n.", "zh": "注册，入学", "example_en": "Enrolment in online courses has grown dramatically since 2020.", "example_zh": "自2020年以来，在线课程的注册人数急剧增长。", "level": "IELTS"}, {"word": "rote", "phonetic": "/rəʊt/", "pos": "n.", "zh": "死记硬背", "example_en": "Critics argue that rote learning fails to develop genuine understanding.", "example_zh": "批评者认为死记硬背无法培养真正的理解力。", "level": "IELTS"}, {"word": "faculty", "phonetic": "/ˈfækəlti/", "pos": "n.", "zh": "系，学院；全体教员", "example_en": "The faculty of medicine occupies a newly built campus in the city centre.", "example_zh": "医学院位于市中心一个新建的校区。", "level": "IELTS"}, {"word": "extracurricular", "phonetic": "/ˌekstrəkəˈrɪkjələ(r)/", "pos": "adj.", "zh": "课外的", "example_en": "Extracurricular activities such as debating help students build confidence.", "example_zh": "辩论等课外活动有助于学生建立自信。", "level": "IELTS"}, {"word": "bachelor", "phonetic": "/ˈbætʃələ(r)/", "pos": "n.", "zh": "学士；单身汉", "example_en": "She completed her bachelor's degree in economics within three years.", "example_zh": "她在三年内完成了经济学学士学位。", "level": "IELTS"}, {"word": "remedial", "phonetic": "/rɪˈmiːdiəl/", "pos": "adj.", "zh": "补习的，补救的", "example_en": "Remedial classes are offered to students who fall behind in mathematics.", "example_zh": "学校为数学落后的学生提供补习班。", "level": "IELTS"}, {"word": "instructor", "phonetic": "/ɪnˈstrʌktə(r)/", "pos": "n.", "zh": "教员，指导者", "example_en": "The fitness instructor demonstrated each exercise before the class began.", "example_zh": "健身教练在上课前示范了每个动作。", "level": "IELTS"}, {"word": "qualification", "phonetic": "/ˌkwɒlɪfɪˈkeɪʃn/", "pos": "n.", "zh": "资格，学历", "example_en": "A teaching qualification is essential for this position in most countries.", "example_zh": "在大多数国家，教学资格是担任这一职位的必要条件。", "level": "IELTS"}, {"word": "prestigious", "phonetic": "/preˈstɪdʒəs/", "pos": "adj.", "zh": "有声望的", "example_en": "He was offered a place at one of the most prestigious universities in the world.", "example_zh": "他获得了世界最负盛名的大学之一的录取名额。", "level": "IELTS"}, {"word": "biodiversity", "phonetic": "/ˌbaɪəʊdaɪˈvɜːsəti/", "pos": "n.", "zh": "生物多样性", "example_en": "Tropical rainforests contain the greatest biodiversity on Earth.", "example_zh": "热带雨林拥有地球上最丰富的生物多样性。", "level": "IELTS"}, {"word": "sustainability", "phonetic": "/səˌsteɪnəˈbɪləti/", "pos": "n.", "zh": "可持续性", "example_en": "The city has adopted a long-term plan for environmental sustainability.", "example_zh": "该市制定了环境可持续性的长期规划。", "level": "IELTS"}, {"word": "deforestation", "phonetic": "/ˌdiːˌfɒrɪˈsteɪʃn/", "pos": "n.", "zh": "毁林，滥伐森林", "example_en": "Deforestation in the Amazon threatens thousands of plant and animal species.", "example_zh": "亚马逊地区的毁林威胁着数千种动植物。", "level": "IELTS"}, {"word": "afforestation", "phonetic": "/əˌfɒrɪˈsteɪʃn/", "pos": "n.", "zh": "植树造林", "example_en": "Afforestation programmes have turned former farmland into productive woodland.", "example_zh": "植树造林工程已把从前的农田变成了多产的林地。", "level": "IELTS"}, {"word": "contamination", "phonetic": "/kənˌtæmɪˈneɪʃn/", "pos": "n.", "zh": "污染", "example_en": "Tests revealed contamination of the town's drinking water supply.", "example_zh": "检测显示该镇的饮用水供应受到了污染。", "level": "IELTS"}, {"word": "emission", "phonetic": "/ɪˈmɪʃn/", "pos": "n.", "zh": "排放，排放物", "example_en": "The country has pledged to cut carbon emissions by half by 2035.", "example_zh": "该国承诺到2035年将碳排放减半。", "level": "IELTS"}, {"word": "biodegradable", "phonetic": "/ˌbaɪəʊdɪˈɡreɪdəbl/", "pos": "adj.", "zh": "可生物降解的", "example_en": "Supermarkets are replacing plastic bags with biodegradable alternatives.", "example_zh": "超市正在用可生物降解的替代品取代塑料袋。", "level": "IELTS"}, {"word": "conservation", "phonetic": "/ˌkɒnsəˈveɪʃn/", "pos": "n.", "zh": "保护，保存", "example_en": "The national park was created for the conservation of rare wildlife.", "example_zh": "建立这座国家公园是为了保护珍稀野生动物。", "level": "IELTS"}, {"word": "ecology", "phonetic": "/iˈkɒlədʒi/", "pos": "n.", "zh": "生态学", "example_en": "She studied the ecology of coastal wetlands for her master's degree.", "example_zh": "她在硕士阶段研究沿海湿地的生态学。", "level": "IELTS"}, {"word": "habitat", "phonetic": "/ˈhæbɪtæt/", "pos": "n.", "zh": "栖息地", "example_en": "Farming has destroyed much of the natural habitat of these birds.", "example_zh": "农业耕作破坏了这些鸟类的大部分自然栖息地。", "level": "IELTS"}, {"word": "erosion", "phonetic": "/ɪˈrəʊʒn/", "pos": "n.", "zh": "侵蚀", "example_en": "Tree roots help prevent soil erosion on steep hillsides.", "example_zh": "树根有助于防止陡坡上的水土流失。", "level": "IELTS"}, {"word": "pollutant", "phonetic": "/pəˈluːtənt/", "pos": "n.", "zh": "污染物", "example_en": "Factories along the river discharge pollutants into the water every day.", "example_zh": "沿河的工厂每天都向水中排放污染物。", "level": "IELTS"}, {"word": "extinction", "phonetic": "/ɪkˈstɪŋkʃn/", "pos": "n.", "zh": "灭绝", "example_en": "Scientists warn that the species faces extinction within twenty years.", "example_zh": "科学家警告说，该物种可能在二十年内灭绝。", "level": "IELTS"}, {"word": "predator", "phonetic": "/ˈpredətə(r)/", "pos": "n.", "zh": "捕食性动物", "example_en": "The introduction of a new predator upset the island's ecological balance.", "example_zh": "一种新捕食者的引入打破了该岛的生态平衡。", "level": "IELTS"}, {"word": "endangered", "phonetic": "/ɪnˈdeɪndʒəd/", "pos": "adj.", "zh": "濒危的", "example_en": "International trade in endangered species is strictly regulated.", "example_zh": "濒危物种的国际贸易受到严格监管。", "level": "IELTS"}, {"word": "vegetation", "phonetic": "/ˌvedʒəˈteɪʃn/", "pos": "n.", "zh": "植被", "example_en": "Satellite images show a steady decline in natural vegetation cover.", "example_zh": "卫星图像显示自然植被覆盖持续减少。", "level": "IELTS"}, {"word": "irrigation", "phonetic": "/ˌɪrɪˈɡeɪʃn/", "pos": "n.", "zh": "灌溉", "example_en": "Modern irrigation systems have transformed agriculture in arid regions.", "example_zh": "现代灌溉系统改变了干旱地区的农业。", "level": "IELTS"}, {"word": "arable", "phonetic": "/ˈærəbl/", "pos": "adj.", "zh": "适于耕种的", "example_en": "Only ten percent of the country's land is arable.", "example_zh": "该国只有百分之十的土地是可耕地。", "level": "IELTS"}, {"word": "fertile", "phonetic": "/ˈfɜːtaɪl/", "pos": "adj.", "zh": "肥沃的", "example_en": "The fertile soil of the river valley supports intensive farming.", "example_zh": "河谷肥沃的土壤支撑着精耕细作的农业。", "level": "IELTS"}, {"word": "saline", "phonetic": "/ˈseɪlaɪn/", "pos": "adj.", "zh": "含盐的", "example_en": "Rising sea levels have made many coastal wells saline.", "example_zh": "海平面上升使许多沿海水井变成了咸水井。", "level": "IELTS"}, {"word": "hazardous", "phonetic": "/ˈhæzədəs/", "pos": "adj.", "zh": "危险的，有害的", "example_en": "Hazardous waste must be transported in specially designed containers.", "example_zh": "有害废物必须用特制容器运输。", "level": "IELTS"}, {"word": "landfill", "phonetic": "/ˈlændfɪl/", "pos": "n.", "zh": "垃圾填埋场", "example_en": "Most household waste in the region still ends up in landfill.", "example_zh": "该地区大部分生活垃圾仍被送进填埋场。", "level": "IELTS"}, {"word": "renewable", "phonetic": "/rɪˈnjuːəbl/", "pos": "adj.", "zh": "可再生的", "example_en": "Wind and solar power are key sources of renewable energy.", "example_zh": "风能和太阳能是可再生能源的重要来源。", "level": "IELTS"}, {"word": "fossil", "phonetic": "/ˈfɒsl/", "pos": "n.", "zh": "化石", "example_en": "The fossils discovered in the cave are over two million years old.", "example_zh": "洞穴中发现的化石已有两百多万年历史。", "level": "IELTS"}, {"word": "glacier", "phonetic": "/ˈɡlæsiə(r)/", "pos": "n.", "zh": "冰川", "example_en": "Glaciers in the Himalayas are retreating at an alarming rate.", "example_zh": "喜马拉雅山的冰川正以惊人的速度消退。", "level": "IELTS"}, {"word": "hydroelectric", "phonetic": "/ˌhaɪdrəʊɪˈlektrɪk/", "pos": "adj.", "zh": "水力发电的", "example_en": "Norway generates most of its electricity from hydroelectric plants.", "example_zh": "挪威的大部分电力来自水电站。", "level": "IELTS"}, {"word": "geothermal", "phonetic": "/ˌdʒiːəʊˈθɜːml/", "pos": "adj.", "zh": "地热的", "example_en": "Iceland heats many of its homes using geothermal energy.", "example_zh": "冰岛利用地热能为许多家庭供暖。", "level": "IELTS"}, {"word": "greenhouse", "phonetic": "/ˈɡriːnhaʊs/", "pos": "n.", "zh": "温室", "example_en": "Farmers grow tomatoes in greenhouses throughout the winter.", "example_zh": "农民整个冬天都在温室里种植西红柿。", "level": "IELTS"}, {"word": "inundate", "phonetic": "/ˈɪnʌndeɪt/", "pos": "v.", "zh": "淹没", "example_en": "Heavy rainfall inundated hundreds of homes in the low-lying province.", "example_zh": "暴雨淹没了该低洼省份的数百户住宅。", "level": "IELTS"}, {"word": "sewage", "phonetic": "/ˈsuːɪdʒ/", "pos": "n.", "zh": "污水", "example_en": "Untreated sewage was discharged directly into the harbour.", "example_zh": "未经处理的污水被直接排入海港。", "level": "IELTS"}, {"word": "sediment", "phonetic": "/ˈsedɪmənt/", "pos": "n.", "zh": "沉积物", "example_en": "Scientists collected sediment samples from the ocean floor.", "example_zh": "科学家从海底采集了沉积物样本。", "level": "IELTS"}, {"word": "depletion", "phonetic": "/dɪˈpliːʃn/", "pos": "n.", "zh": "消耗，枯竭", "example_en": "The depletion of groundwater reserves is a growing concern.", "example_zh": "地下水储备的枯竭日益令人担忧。", "level": "IELTS"}, {"word": "ozone", "phonetic": "/ˈəʊzəʊn/", "pos": "n.", "zh": "臭氧", "example_en": "Chemicals used in old refrigerators damaged the ozone layer.", "example_zh": "旧冰箱使用的化学物质破坏了臭氧层。", "level": "IELTS"}, {"word": "replenish", "phonetic": "/rɪˈplenɪʃ/", "pos": "v.", "zh": "补充", "example_en": "Rainfall in spring replenished the reservoirs after a long drought.", "example_zh": "春季降雨在长期干旱后补充了水库蓄水。", "level": "IELTS"}, {"word": "fauna", "phonetic": "/ˈfɔːnə/", "pos": "n.", "zh": "动物群", "example_en": "The island's fauna includes several species found nowhere else.", "example_zh": "该岛的动物群包括几个别处没有的物种。", "level": "IELTS"}, {"word": "flora", "phonetic": "/ˈflɔːrə/", "pos": "n.", "zh": "植物群", "example_en": "Botanists have catalogued over a thousand species in the region's flora.", "example_zh": "植物学家已对该地区植物群中的一千多个物种进行了编目。", "level": "IELTS"}, {"word": "mammal", "phonetic": "/ˈmæml/", "pos": "n.", "zh": "哺乳动物", "example_en": "The whale is the largest mammal ever to have lived on Earth.", "example_zh": "鲸是地球上生存过的最大的哺乳动物。", "level": "IELTS"}, {"word": "reptile", "phonetic": "/ˈreptaɪl/", "pos": "n.", "zh": "爬行动物", "example_en": "Snakes and lizards are reptiles that regulate body temperature externally.", "example_zh": "蛇和蜥蜴是依靠外界调节体温的爬行动物。", "level": "IELTS"}, {"word": "amphibian", "phonetic": "/æmˈfɪbiən/", "pos": "n.", "zh": "两栖动物", "example_en": "Frogs are amphibians that live both in water and on land.", "example_zh": "青蛙是既生活在水中又生活在陆地上的两栖动物。", "level": "IELTS"}, {"word": "vertebrate", "phonetic": "/ˈvɜːtɪbrət/", "pos": "n.", "zh": "脊椎动物", "example_en": "Fish were the first vertebrates to evolve on the planet.", "example_zh": "鱼类是地球上最早进化出的脊椎动物。", "level": "IELTS"}, {"word": "livestock", "phonetic": "/ˈlaɪvstɒk/", "pos": "n.", "zh": "家畜，牲畜", "example_en": "Drought forced farmers to sell much of their livestock.", "example_zh": "干旱迫使农民卖掉了大部分牲畜。", "level": "IELTS"}, {"word": "poultry", "phonetic": "/ˈpəʊltri/", "pos": "n.", "zh": "家禽", "example_en": "The farm raises poultry for both meat and eggs.", "example_zh": "这个农场饲养家禽以供应肉和蛋。", "level": "IELTS"}, {"word": "pollination", "phonetic": "/ˌpɒləˈneɪʃn/", "pos": "n.", "zh": "授粉", "example_en": "Bees play a vital role in the pollination of crops.", "example_zh": "蜜蜂在农作物授粉中起着至关重要的作用。", "level": "IELTS"}, {"word": "germinate", "phonetic": "/ˈdʒɜːmɪneɪt/", "pos": "v.", "zh": "发芽", "example_en": "The seeds germinate within two weeks if the soil is warm enough.", "example_zh": "如果土壤足够温暖，种子两周内就会发芽。", "level": "IELTS"}, {"word": "photosynthesis", "phonetic": "/ˌfəʊtəʊˈsɪnθəsɪs/", "pos": "n.", "zh": "光合作用", "example_en": "Plants convert sunlight into energy through photosynthesis.", "example_zh": "植物通过光合作用把阳光转化为能量。", "level": "IELTS"}, {"word": "botanical", "phonetic": "/bəˈtænɪkl/", "pos": "adj.", "zh": "植物学的", "example_en": "The city maintains a beautiful botanical garden beside the river.", "example_zh": "这座城市在河边维护着一座美丽的植物园。", "level": "IELTS"}, {"word": "marine", "phonetic": "/məˈriːn/", "pos": "adj.", "zh": "海洋的", "example_en": "Plastic waste poses a serious threat to marine life.", "example_zh": "塑料垃圾对海洋生物构成严重威胁。", "level": "IELTS"}, {"word": "aquatic", "phonetic": "/əˈkwætɪk/", "pos": "adj.", "zh": "水生的", "example_en": "Pollution has reduced the variety of aquatic plants in the lake.", "example_zh": "污染减少了湖中水生植物的种类。", "level": "IELTS"}, {"word": "terrestrial", "phonetic": "/təˈrestriəl/", "pos": "adj.", "zh": "陆地的", "example_en": "The reserve protects both terrestrial and marine ecosystems.", "example_zh": "该保护区同时保护陆地和海洋生态系统。", "level": "IELTS"}, {"word": "wilderness", "phonetic": "/ˈwɪldənəs/", "pos": "n.", "zh": "荒野", "example_en": "Vast areas of wilderness remain untouched in northern Canada.", "example_zh": "加拿大北部仍有大片未遭破坏的荒野。", "level": "IELTS"}, {"word": "sanctuary", "phonetic": "/ˈsæŋktʃuəri/", "pos": "n.", "zh": "保护区；避难所", "example_en": "The island is a sanctuary for endangered sea birds.", "example_zh": "这座岛屿是濒危海鸟的保护区。", "level": "IELTS"}, {"word": "coral", "phonetic": "/ˈkɒrəl/", "pos": "n.", "zh": "珊瑚", "example_en": "Rising ocean temperatures have bleached large areas of coral.", "example_zh": "海洋温度上升导致大面积珊瑚白化。", "level": "IELTS"}, {"word": "hatch", "phonetic": "/hætʃ/", "pos": "v.", "zh": "孵化", "example_en": "The chicks hatch after roughly three weeks of incubation.", "example_zh": "雏鸟经过大约三周的孵化后破壳而出。", "level": "IELTS"}, {"word": "breed", "phonetic": "/briːd/", "pos": "v.", "zh": "繁殖；饲养", "example_en": "These horses are bred for racing on difficult terrain.", "example_zh": "这些马是为在复杂地形上比赛而饲养的。", "level": "IELTS"}, {"word": "herbivore", "phonetic": "/ˈhɜːbɪvɔː(r)/", "pos": "n.", "zh": "食草动物", "example_en": "The giraffe is a herbivore that feeds mainly on acacia leaves.", "example_zh": "长颈鹿是一种主要吃金合欢树叶的食草动物。", "level": "IELTS"}, {"word": "carnivore", "phonetic": "/ˈkɑːnɪvɔː(r)/", "pos": "n.", "zh": "食肉动物", "example_en": "Lions are large carnivores at the top of the food chain.", "example_zh": "狮子是处于食物链顶端的大型食肉动物。", "level": "IELTS"}, {"word": "pesticide", "phonetic": "/ˈpestɪsaɪd/", "pos": "n.", "zh": "杀虫剂", "example_en": "Excessive use of pesticides harms beneficial insects such as bees.", "example_zh": "杀虫剂的过度使用危害蜜蜂等有益昆虫。", "level": "IELTS"}, {"word": "fertiliser", "phonetic": "/ˈfɜːtəlaɪzə(r)/", "pos": "n.", "zh": "肥料", "example_en": "Farmers applied fertiliser to boost yields on the depleted soil.", "example_zh": "农民施肥以提高贫瘠土地的产量。", "level": "IELTS"}, {"word": "species", "phonetic": "/ˈspiːʃiːz/", "pos": "n.", "zh": "物种", "example_en": "Around one million species are at risk of extinction worldwide.", "example_zh": "全球约有100万个物种面临灭绝风险。", "level": "IELTS"}, {"word": "epidemic", "phonetic": "/ˌepɪˈdemɪk/", "pos": "n.", "zh": "流行病", "example_en": "The flu epidemic of 1918 killed millions of people worldwide.", "example_zh": "1918年的流感大流行导致全球数百万人死亡。", "level": "IELTS"}, {"word": "therapy", "phonetic": "/ˈθerəpi/", "pos": "n.", "zh": "治疗，疗法", "example_en": "Physical therapy helped him regain movement after the accident.", "example_zh": "物理治疗帮助他在事故后恢复了活动能力。", "level": "IELTS"}, {"word": "diagnosis", "phonetic": "/ˌdaɪəɡˈnəʊsɪs/", "pos": "n.", "zh": "诊断", "example_en": "Early diagnosis of the disease greatly improves the chances of recovery.", "example_zh": "疾病的早期诊断大大提高了康复的机会。", "level": "IELTS"}, {"word": "symptom", "phonetic": "/ˈsɪmptəm/", "pos": "n.", "zh": "症状", "example_en": "A high fever is a common symptom of the infection.", "example_zh": "高烧是这种感染的常见症状。", "level": "IELTS"}, {"word": "immunity", "phonetic": "/ɪˈmjuːnəti/", "pos": "n.", "zh": "免疫力", "example_en": "Vaccination gives the body immunity against certain viruses.", "example_zh": "疫苗接种使身体对某些病毒产生免疫力。", "level": "IELTS"}, {"word": "nutrition", "phonetic": "/njuˈtrɪʃn/", "pos": "n.", "zh": "营养", "example_en": "Good nutrition is essential for children's physical development.", "example_zh": "良好的营养对儿童的身体发育至关重要。", "level": "IELTS"}, {"word": "obesity", "phonetic": "/əʊˈbiːsəti/", "pos": "n.", "zh": "肥胖（症）", "example_en": "Obesity has become a major public health problem in many countries.", "example_zh": "肥胖已成为许多国家的主要公共健康问题。", "level": "IELTS"}, {"word": "sedentary", "phonetic": "/ˈsedntri/", "pos": "adj.", "zh": "久坐的", "example_en": "A sedentary lifestyle increases the risk of heart disease.", "example_zh": "久坐的生活方式会增加患心脏病的风险。", "level": "IELTS"}, {"word": "vaccine", "phonetic": "/ˈvæksiːn/", "pos": "n.", "zh": "疫苗", "example_en": "Researchers developed a vaccine against the virus in record time.", "example_zh": "研究人员在创纪录的时间内研制出了针对该病毒的疫苗。", "level": "IELTS"}, {"word": "hygiene", "phonetic": "/ˈhaɪdʒiːn/", "pos": "n.", "zh": "卫生", "example_en": "Simple hygiene measures such as handwashing can prevent many infections.", "example_zh": "洗手等简单的卫生措施可以预防许多感染。", "level": "IELTS"}, {"word": "pharmaceutical", "phonetic": "/ˌfɑːməˈsjuːtɪkl/", "pos": "adj.", "zh": "制药的", "example_en": "The pharmaceutical industry invests billions in drug research each year.", "example_zh": "制药业每年在药物研究上投入数十亿资金。", "level": "IELTS"}, {"word": "mortality", "phonetic": "/mɔːˈtæləti/", "pos": "n.", "zh": "死亡率", "example_en": "Infant mortality has fallen dramatically over the past fifty years.", "example_zh": "过去五十年间婴儿死亡率大幅下降。", "level": "IELTS"}, {"word": "rehabilitation", "phonetic": "/ˌriːəˌbɪlɪˈteɪʃn/", "pos": "n.", "zh": "康复", "example_en": "The centre offers rehabilitation programmes for people with drug addiction.", "example_zh": "该中心为吸毒者提供康复计划。", "level": "IELTS"}, {"word": "insomnia", "phonetic": "/ɪnˈsɒmniə/", "pos": "n.", "zh": "失眠（症）", "example_en": "Stress and irregular working hours are common causes of insomnia.", "example_zh": "压力和不规律的工作时间是失眠的常见原因。", "level": "IELTS"}, {"word": "metabolism", "phonetic": "/məˈtæbəlɪzəm/", "pos": "n.", "zh": "新陈代谢", "example_en": "Exercise speeds up the body's metabolism and burns calories.", "example_zh": "运动能加快身体的新陈代谢并消耗热量。", "level": "IELTS"}, {"word": "allergy", "phonetic": "/ˈælədʒi/", "pos": "n.", "zh": "过敏", "example_en": "She developed an allergy to peanuts during childhood.", "example_zh": "她在童年时期对花生产生了过敏。", "level": "IELTS"}, {"word": "ailment", "phonetic": "/ˈeɪlmənt/", "pos": "n.", "zh": "小病", "example_en": "Ginger tea is a traditional remedy for minor ailments.", "example_zh": "姜茶是治疗小毛小病的传统偏方。", "level": "IELTS"}, {"word": "surgery", "phonetic": "/ˈsɜːdʒəri/", "pos": "n.", "zh": "外科手术", "example_en": "He underwent surgery to repair a damaged knee ligament.", "example_zh": "他接受了修复膝关节韧带的手术。", "level": "IELTS"}, {"word": "therapeutic", "phonetic": "/ˌθerəˈpjuːtɪk/", "pos": "adj.", "zh": "有疗效的", "example_en": "Some patients find gardening has a therapeutic effect on their mood.", "example_zh": "一些病人发现园艺对情绪有治疗作用。", "level": "IELTS"}, {"word": "pandemic", "phonetic": "/pænˈdemɪk/", "pos": "n.", "zh": "（全球性）流行病", "example_en": "The pandemic forced universities to move their courses online.", "example_zh": "疫情迫使大学把课程转移到线上。", "level": "IELTS"}, {"word": "quarantine", "phonetic": "/ˈkwɒrəntiːn/", "pos": "n.", "zh": "隔离", "example_en": "Travellers arriving from affected regions were placed in quarantine for two weeks.", "example_zh": "来自疫区的旅客被隔离两周。", "level": "IELTS"}, {"word": "dietary", "phonetic": "/ˈdaɪətəri/", "pos": "adj.", "zh": "饮食的", "example_en": "Doctors recommend dietary changes to lower blood pressure.", "example_zh": "医生建议通过改变饮食来降低血压。", "level": "IELTS"}, {"word": "malnutrition", "phonetic": "/ˌmælnjuˈtrɪʃn/", "pos": "n.", "zh": "营养不良", "example_en": "Severe malnutrition still affects millions of children worldwide.", "example_zh": "严重的营养不良仍影响着全球数百万儿童。", "level": "IELTS"}, {"word": "calorie", "phonetic": "/ˈkæləri/", "pos": "n.", "zh": "卡路里", "example_en": "Fast food meals often contain far more calories than people realise.", "example_zh": "快餐通常含有的卡路里远超人们的想象。", "level": "IELTS"}, {"word": "longevity", "phonetic": "/lɒnˈdʒevəti/", "pos": "n.", "zh": "长寿", "example_en": "Researchers linked the islanders' longevity to their diet and active lifestyle.", "example_zh": "研究人员把岛民的长寿归因于他们的饮食和积极的生活方式。", "level": "IELTS"}, {"word": "infectious", "phonetic": "/ɪnˈfekʃəs/", "pos": "adj.", "zh": "传染性的", "example_en": "Measles is a highly infectious disease that spreads through the air.", "example_zh": "麻疹是一种通过空气传播的高传染性疾病。", "level": "IELTS"}, {"word": "antibiotic", "phonetic": "/ˌæntibaɪˈɒtɪk/", "pos": "n.", "zh": "抗生素", "example_en": "Overusing antibiotics can make bacteria resistant to treatment.", "example_zh": "抗生素的过度使用会使细菌产生耐药性。", "level": "IELTS"}, {"word": "dementia", "phonetic": "/dɪˈmenʃə/", "pos": "n.", "zh": "痴呆", "example_en": "Regular mental exercise may delay the onset of dementia in later life.", "example_zh": "经常的脑力活动可能推迟晚年痴呆的发病。", "level": "IELTS"}, {"word": "syndrome", "phonetic": "/ˈsɪndrəʊm/", "pos": "n.", "zh": "综合征", "example_en": "Workers who sit for long hours often suffer from a syndrome of neck and shoulder pain.", "example_zh": "长时间久坐的工人常患有颈肩疼痛综合征。", "level": "IELTS"}, {"word": "urban", "phonetic": "/ˈɜːbən/", "pos": "adj.", "zh": "城市的", "example_en": "Urban populations are growing faster than rural ones in most countries.", "example_zh": "在大多数国家，城市人口的增长快于农村人口。", "level": "IELTS"}, {"word": "rural", "phonetic": "/ˈrʊərəl/", "pos": "adj.", "zh": "农村的", "example_en": "Rural communities often lack access to quality healthcare.", "example_zh": "农村社区往往缺乏获得优质医疗服务的途径。", "level": "IELTS"}, {"word": "migration", "phonetic": "/maɪˈɡreɪʃn/", "pos": "n.", "zh": "迁移；移民", "example_en": "Seasonal migration of workers shapes the economy of the region.", "example_zh": "季节性劳工移民影响着该地区的经济。", "level": "IELTS"}, {"word": "migrant", "phonetic": "/ˈmaɪɡrənt/", "pos": "n.", "zh": "移民；候鸟", "example_en": "Millions of migrant workers send money home to their families each year.", "example_zh": "每年有数百万移民工人把钱寄回家。", "level": "IELTS"}, {"word": "disparity", "phonetic": "/dɪˈspærəti/", "pos": "n.", "zh": "差距，不平等", "example_en": "There is a widening disparity between rich and poor neighbourhoods.", "example_zh": "富裕社区和贫困社区之间的差距正在扩大。", "level": "IELTS"}, {"word": "poverty", "phonetic": "/ˈpɒvəti/", "pos": "n.", "zh": "贫困", "example_en": "Education is one of the most effective weapons against poverty.", "example_zh": "教育是对抗贫困最有效的武器之一。", "level": "IELTS"}, {"word": "welfare", "phonetic": "/ˈwelfeə(r)/", "pos": "n.", "zh": "福利", "example_en": "The government increased spending on child welfare programmes.", "example_zh": "政府增加了儿童福利项目的支出。", "level": "IELTS"}, {"word": "unemployment", "phonetic": "/ˌʌnɪmˈplɔɪmənt/", "pos": "n.", "zh": "失业", "example_en": "Unemployment rose sharply during the economic crisis.", "example_zh": "经济危机期间失业率急剧上升。", "level": "IELTS"}, {"word": "urbanization", "phonetic": "/ˌɜːbənaɪˈzeɪʃn/", "pos": "n.", "zh": "城市化", "example_en": "Rapid urbanization has transformed the landscape of southern China.", "example_zh": "快速的城市化改变了华南地区的面貌。", "level": "IELTS"}, {"word": "suburb", "phonetic": "/ˈsʌbɜːb/", "pos": "n.", "zh": "郊区", "example_en": "Many families moved to the suburbs in search of affordable housing.", "example_zh": "许多家庭为寻找负担得起的住房搬到了郊区。", "level": "IELTS"}, {"word": "metropolitan", "phonetic": "/ˌmetrəˈpɒlɪtən/", "pos": "adj.", "zh": "大都市的", "example_en": "The metropolitan area now houses over ten million people.", "example_zh": "这个大都市区现在居住着一千多万人。", "level": "IELTS"}, {"word": "municipal", "phonetic": "/mjuːˈnɪsɪpl/", "pos": "adj.", "zh": "市政的", "example_en": "The municipal government invested heavily in public transport.", "example_zh": "市政府在公共交通上投入巨资。", "level": "IELTS"}, {"word": "sanitation", "phonetic": "/ˌsænɪˈteɪʃn/", "pos": "n.", "zh": "公共卫生（设施）", "example_en": "Poor sanitation remains a major cause of disease in crowded cities.", "example_zh": "恶劣的卫生条件仍是拥挤城市中疾病的主要根源。", "level": "IELTS"}, {"word": "congestion", "phonetic": "/kənˈdʒestʃən/", "pos": "n.", "zh": "拥堵", "example_en": "Traffic congestion costs the city billions of dollars each year.", "example_zh": "交通拥堵每年给这座城市造成数十亿美元的损失。", "level": "IELTS"}, {"word": "pedestrian", "phonetic": "/pəˈdestriən/", "pos": "n.", "zh": "行人", "example_en": "The new bridge is reserved for pedestrians and cyclists.", "example_zh": "新桥专供行人和骑自行车者使用。", "level": "IELTS"}, {"word": "accommodation", "phonetic": "/əˌkɒməˈdeɪʃn/", "pos": "n.", "zh": "住宿", "example_en": "Student accommodation in the city is scarce and expensive.", "example_zh": "这座城市的学生住宿紧张而且昂贵。", "level": "IELTS"}, {"word": "dwelling", "phonetic": "/ˈdwelɪŋ/", "pos": "n.", "zh": "住处，住宅", "example_en": "The average dwelling in the city occupies less than fifty square metres.", "example_zh": "该市住宅的平均面积不足五十平方米。", "level": "IELTS"}, {"word": "residential", "phonetic": "/ˌrezɪˈdenʃl/", "pos": "adj.", "zh": "居住的，住宅的", "example_en": "The factory was moved away from the residential district.", "example_zh": "工厂被迁离了住宅区。", "level": "IELTS"}, {"word": "zoning", "phonetic": "/ˈzəʊnɪŋ/", "pos": "n.", "zh": "分区规划", "example_en": "City planners used zoning laws to separate industry from housing.", "example_zh": "城市规划者利用分区法规把工业区与住宅区分开。", "level": "IELTS"}, {"word": "renovation", "phonetic": "/ˌrenəˈveɪʃn/", "pos": "n.", "zh": "翻新", "example_en": "The renovation of the old library took nearly three years.", "example_zh": "老图书馆的翻新工程花了近三年时间。", "level": "IELTS"}, {"word": "demolition", "phonetic": "/ˌdeməˈlɪʃn/", "pos": "n.", "zh": "拆除", "example_en": "The demolition of the stadium made way for a new park.", "example_zh": "体育场的拆除为新公园腾出了地方。", "level": "IELTS"}, {"word": "skyscraper", "phonetic": "/ˈskaɪskreɪpə(r)/", "pos": "n.", "zh": "摩天大楼", "example_en": "A new skyscraper will dominate the city's skyline.", "example_zh": "一座新摩天大楼将主宰这座城市的天际线。", "level": "IELTS"}, {"word": "metropolis", "phonetic": "/məˈtrɒpəlɪs/", "pos": "n.", "zh": "大都市", "example_en": "Tokyo is one of the most densely populated metropolises in the world.", "example_zh": "东京是世界上人口最稠密的大都市之一。", "level": "IELTS"}, {"word": "outskirts", "phonetic": "/ˈaʊtskɜːts/", "pos": "n.", "zh": "郊外，市区边缘", "example_en": "They bought a cheaper house on the outskirts of the city.", "example_zh": "他们在城市边缘买了一套更便宜的房子。", "level": "IELTS"}, {"word": "slum", "phonetic": "/slʌm/", "pos": "n.", "zh": "贫民窟", "example_en": "A third of the city's population lives in slums without clean water.", "example_zh": "该市三分之一的人口住在没有清洁用水的贫民窟。", "level": "IELTS"}, {"word": "inequality", "phonetic": "/ˌɪnɪˈkwɒləti/", "pos": "n.", "zh": "不平等", "example_en": "Income inequality has widened in many developed economies.", "example_zh": "许多发达经济体的收入不平等已经扩大。", "level": "IELTS"}, {"word": "affluent", "phonetic": "/ˈæfluənt/", "pos": "adj.", "zh": "富裕的", "example_en": "Children from affluent families often enjoy better educational resources.", "example_zh": "富裕家庭的孩子往往享有更好的教育资源。", "level": "IELTS"}, {"word": "impoverished", "phonetic": "/ɪmˈpɒvərɪʃt/", "pos": "adj.", "zh": "贫困的", "example_en": "The charity provides food and medicine to impoverished communities.", "example_zh": "该慈善机构为贫困社区提供食品和药品。", "level": "IELTS"}, {"word": "homelessness", "phonetic": "/ˈhəʊmləsnəs/", "pos": "n.", "zh": "无家可归（现象）", "example_en": "Rising rents have contributed to a growth in homelessness.", "example_zh": "房租上涨加剧了无家可归现象。", "level": "IELTS"}, {"word": "vandalism", "phonetic": "/ˈvændəlɪzəm/", "pos": "n.", "zh": "故意破坏（公物等）", "example_en": "The park was closed at night to reduce vandalism.", "example_zh": "公园夜间关闭以减少故意破坏行为。", "level": "IELTS"}, {"word": "delinquency", "phonetic": "/dɪˈlɪŋkwənsi/", "pos": "n.", "zh": "（青少年）违法行为", "example_en": "Sports programmes can help reduce juvenile delinquency in deprived areas.", "example_zh": "体育项目有助于减少贫困地区的青少年违法行为。", "level": "IELTS"}, {"word": "absenteeism", "phonetic": "/ˌæbsənˈtiːɪzəm/", "pos": "n.", "zh": "旷工，旷课", "example_en": "Absenteeism at the factory rose during the heatwave.", "example_zh": "热浪期间工厂的旷工率上升。", "level": "IELTS"}, {"word": "citizenship", "phonetic": "/ˈsɪtɪzənʃɪp/", "pos": "n.", "zh": "公民身份", "example_en": "She applied for citizenship after living in the country for ten years.", "example_zh": "在该国生活十年后，她申请了公民身份。", "level": "IELTS"}, {"word": "taboo", "phonetic": "/təˈbuː/", "pos": "n.", "zh": "禁忌", "example_en": "Talking about salaries remains a taboo in many workplaces.", "example_zh": "谈论薪资在许多工作场所仍是禁忌。", "level": "IELTS"}, {"word": "solidarity", "phonetic": "/ˌsɒlɪˈdærəti/", "pos": "n.", "zh": "团结", "example_en": "The strike was a powerful display of workers' solidarity.", "example_zh": "这次罢工有力地展示了工人的团结。", "level": "IELTS"}, {"word": "stereotype", "phonetic": "/ˈsteriətaɪp/", "pos": "n.", "zh": "刻板印象", "example_en": "The media often reinforces gender stereotypes in advertising.", "example_zh": "媒体常在广告中强化性别刻板印象。", "level": "IELTS"}, {"word": "prejudice", "phonetic": "/ˈpredʒudɪs/", "pos": "n.", "zh": "偏见", "example_en": "Employers should guard against prejudice when interviewing candidates.", "example_zh": "雇主在面试时应警惕偏见。", "level": "IELTS"}, {"word": "anonymity", "phonetic": "/ˌænəˈnɪməti/", "pos": "n.", "zh": "匿名", "example_en": "Participants in the survey were guaranteed complete anonymity.", "example_zh": "调查参与者被保证完全匿名。", "level": "IELTS"}, {"word": "inhabitant", "phonetic": "/ɪnˈhæbɪtənt/", "pos": "n.", "zh": "居民", "example_en": "The town's inhabitants depend on fishing for their livelihood.", "example_zh": "小镇的居民以捕鱼为生。", "level": "IELTS"}, {"word": "cosmopolitan", "phonetic": "/ˌkɒzməˈpɒlɪtən/", "pos": "adj.", "zh": "世界性的，国际化的", "example_en": "London is a cosmopolitan city with residents from every continent.", "example_zh": "伦敦是一座居住着来自各大洲居民的国际都市。", "level": "IELTS"}, {"word": "recession", "phonetic": "/rɪˈseʃn/", "pos": "n.", "zh": "经济衰退", "example_en": "Consumer spending fell sharply during the recession.", "example_zh": "经济衰退期间消费支出急剧下降。", "level": "IELTS"}, {"word": "inflation", "phonetic": "/ɪnˈfleɪʃn/", "pos": "n.", "zh": "通货膨胀", "example_en": "Inflation eroded the purchasing power of ordinary households.", "example_zh": "通货膨胀侵蚀了普通家庭的购买力。", "level": "IELTS"}, {"word": "entrepreneur", "phonetic": "/ˌɒntrəprəˈnɜː(r)/", "pos": "n.", "zh": "企业家", "example_en": "The young entrepreneur founded her first company at the age of nineteen.", "example_zh": "这位年轻的企业家十九岁时就创办了自己的第一家公司。", "level": "IELTS"}, {"word": "monopoly", "phonetic": "/məˈnɒpəli/", "pos": "n.", "zh": "垄断", "example_en": "The court ruled that the company held an illegal monopoly in the market.", "example_zh": "法院裁定该公司在市场上持有非法垄断地位。", "level": "IELTS"}, {"word": "globalization", "phonetic": "/ˌɡləʊbəlaɪˈzeɪʃn/", "pos": "n.", "zh": "全球化", "example_en": "Globalization has linked national economies more closely than ever before.", "example_zh": "全球化使各国经济的联系比以往任何时候都更加紧密。", "level": "IELTS"}, {"word": "expenditure", "phonetic": "/ɪkˈspendɪtʃə(r)/", "pos": "n.", "zh": "支出", "example_en": "Government expenditure on education rose by eight percent this year.", "example_zh": "今年政府教育支出增长了百分之八。", "level": "IELTS"}, {"word": "revenue", "phonetic": "/ˈrevənjuː/", "pos": "n.", "zh": "财政收入，收益", "example_en": "Tourism provides a major source of revenue for the region.", "example_zh": "旅游业是该地区收入的主要来源。", "level": "IELTS"}, {"word": "fiscal", "phonetic": "/ˈfɪskl/", "pos": "adj.", "zh": "财政的", "example_en": "The minister announced new fiscal measures to stimulate growth.", "example_zh": "部长宣布了刺激增长的新财政措施。", "level": "IELTS"}, {"word": "monetary", "phonetic": "/ˈmʌnɪtri/", "pos": "adj.", "zh": "货币的", "example_en": "The central bank adjusted its monetary policy to curb inflation.", "example_zh": "央行调整货币政策以抑制通胀。", "level": "IELTS"}, {"word": "bankruptcy", "phonetic": "/ˈbæŋkrʌptsi/", "pos": "n.", "zh": "破产", "example_en": "The airline filed for bankruptcy after losing money for five years.", "example_zh": "这家航空公司在连续五年亏损后申请破产。", "level": "IELTS"}, {"word": "merchandise", "phonetic": "/ˈmɜːtʃəndaɪs/", "pos": "n.", "zh": "商品", "example_en": "The store's merchandise ranges from clothing to electronic goods.", "example_zh": "这家商店的商品从服装到电子产品应有尽有。", "level": "IELTS"}, {"word": "taxation", "phonetic": "/tækˈseɪʃn/", "pos": "n.", "zh": "征税，税制", "example_en": "Higher taxation on tobacco has reduced smoking rates.", "example_zh": "提高烟草税降低了吸烟率。", "level": "IELTS"}, {"word": "corporation", "phonetic": "/ˌkɔːpəˈreɪʃn/", "pos": "n.", "zh": "大公司", "example_en": "The corporation employs over a hundred thousand people worldwide.", "example_zh": "这家大公司在全球雇用十多万人。", "level": "IELTS"}, {"word": "multinational", "phonetic": "/ˌmʌltiˈnæʃnəl/", "pos": "n.", "zh": "跨国公司", "example_en": "Multinationals are increasingly held responsible for their environmental impact.", "example_zh": "跨国公司越来越多地被要求为其环境影响负责。", "level": "IELTS"}, {"word": "stakeholder", "phonetic": "/ˈsteɪkhəʊldə(r)/", "pos": "n.", "zh": "利益相关方", "example_en": "All stakeholders were consulted before the new policy was introduced.", "example_zh": "新政策出台前征求了所有利益相关方的意见。", "level": "IELTS"}, {"word": "outsourcing", "phonetic": "/ˈaʊtsɔːsɪŋ/", "pos": "n.", "zh": "外包", "example_en": "Outsourcing customer service cut the firm's operating costs significantly.", "example_zh": "外包客服大大降低了公司的运营成本。", "level": "IELTS"}, {"word": "downturn", "phonetic": "/ˈdaʊntɜːn/", "pos": "n.", "zh": "衰退，低迷", "example_en": "The tourism industry suffered a severe downturn after the crisis.", "example_zh": "危机过后旅游业遭受严重低迷。", "level": "IELTS"}, {"word": "austerity", "phonetic": "/ɒˈsterəti/", "pos": "n.", "zh": "（财政）紧缩", "example_en": "Austerity measures reduced public spending on hospitals and schools.", "example_zh": "紧缩措施削减了医院和学校的公共开支。", "level": "IELTS"}, {"word": "disposable", "phonetic": "/dɪˈspəʊzəbl/", "pos": "adj.", "zh": "可支配的；一次性的", "example_en": "Average disposable income has barely changed in a decade.", "example_zh": "十年间平均可支配收入几乎没有变化。", "level": "IELTS"}, {"word": "frugal", "phonetic": "/ˈfruːɡl/", "pos": "adj.", "zh": "节俭的", "example_en": "His frugal habits allowed him to save most of his salary.", "example_zh": "他节俭的习惯使他能够把大部分工资存起来。", "level": "IELTS"}, {"word": "affluence", "phonetic": "/ˈæfluəns/", "pos": "n.", "zh": "富裕", "example_en": "Rising affluence has changed the eating habits of urban families.", "example_zh": "日益富裕改变了城市家庭的饮食习惯。", "level": "IELTS"}, {"word": "scarcity", "phonetic": "/ˈskeəsəti/", "pos": "n.", "zh": "稀缺", "example_en": "Water scarcity is expected to worsen as the climate changes.", "example_zh": "随着气候变化，水资源短缺预计会加剧。", "level": "IELTS"}, {"word": "heritage", "phonetic": "/ˈherɪtɪdʒ/", "pos": "n.", "zh": "遗产", "example_en": "The old town was designated a world heritage site in 1995.", "example_zh": "老城区于1995年被列为世界遗产地。", "level": "IELTS"}, {"word": "multicultural", "phonetic": "/ˌmʌltiˈkʌltʃərəl/", "pos": "adj.", "zh": "多元文化的", "example_en": "Australia is a multicultural society built on decades of immigration.", "example_zh": "澳大利亚是建立在数十年移民基础上的多元文化社会。", "level": "IELTS"}, {"word": "artifact", "phonetic": "/ˈɑːtɪfækt/", "pos": "n.", "zh": "手工艺品，文物", "example_en": "Museum experts dated the artifact to the Bronze Age.", "example_zh": "博物馆专家断定该文物属于青铜时代。", "level": "IELTS"}, {"word": "vernacular", "phonetic": "/vəˈnækjələ(r)/", "pos": "n.", "zh": "本地话，方言", "example_en": "Many regional newspapers are printed in the local vernacular.", "example_zh": "许多地方报纸用当地语言印刷。", "level": "IELTS"}, {"word": "ritual", "phonetic": "/ˈrɪtʃuəl/", "pos": "n.", "zh": "仪式", "example_en": "The village still performs an ancient harvest ritual every autumn.", "example_zh": "村子每年秋天仍举行古老的丰收仪式。", "level": "IELTS"}, {"word": "folklore", "phonetic": "/ˈfəʊklɔː(r)/", "pos": "n.", "zh": "民间传说", "example_en": "The dragon appears frequently in Chinese folklore.", "example_zh": "龙在中国民间传说中经常出现。", "level": "IELTS"}, {"word": "secular", "phonetic": "/ˈsekjələ(r)/", "pos": "adj.", "zh": "世俗的", "example_en": "The country adopted a secular system of government in the 1920s.", "example_zh": "该国在20世纪20年代采用了世俗政体。", "level": "IELTS"}, {"word": "dialect", "phonetic": "/ˈdaɪəlekt/", "pos": "n.", "zh": "方言", "example_en": "Elderly residents in the valley still speak a traditional dialect.", "example_zh": "山谷里的老年居民仍说一种传统方言。", "level": "IELTS"}, {"word": "ancestral", "phonetic": "/ænˈsestrəl/", "pos": "adj.", "zh": "祖先的", "example_en": "The family returns to its ancestral village every spring.", "example_zh": "这家人每年春天都回到祖辈居住的村庄。", "level": "IELTS"}, {"word": "archaeological", "phonetic": "/ˌɑːkiəˈlɒdʒɪkl/", "pos": "adj.", "zh": "考古的", "example_en": "Archaeological excavations revealed the remains of a Roman settlement.", "example_zh": "考古发掘揭示了罗马人定居点的遗迹。", "level": "IELTS"}, {"word": "dynasty", "phonetic": "/ˈdɪnəsti/", "pos": "n.", "zh": "王朝", "example_en": "The porcelain was produced during the Ming dynasty.", "example_zh": "这件瓷器产于明代。", "level": "IELTS"}, {"word": "authenticity", "phonetic": "/ˌɔːθenˈtɪsəti/", "pos": "n.", "zh": "真实性", "example_en": "Experts questioned the authenticity of the ancient manuscript.", "example_zh": "专家质疑这份古代手稿的真实性。", "level": "IELTS"}, {"word": "artisan", "phonetic": "/ˈɑːtɪzən/", "pos": "n.", "zh": "工匠", "example_en": "Local artisans still weave the cloth using traditional looms.", "example_zh": "当地工匠仍用传统织机织布。", "level": "IELTS"}, {"word": "ethnicity", "phonetic": "/eθˈnɪsəti/", "pos": "n.", "zh": "种族渊源", "example_en": "The census records information about ethnicity and language.", "example_zh": "人口普查记录种族和语言方面的信息。", "level": "IELTS"}, {"word": "costume", "phonetic": "/ˈkɒstjuːm/", "pos": "n.", "zh": "服装", "example_en": "Performers wore traditional costumes at the spring festival.", "example_zh": "表演者在春节穿着传统服装。", "level": "IELTS"}, {"word": "manuscript", "phonetic": "/ˈmænjuskrɪpt/", "pos": "n.", "zh": "手稿", "example_en": "The library preserves medieval manuscripts written on animal skin.", "example_zh": "图书馆保存着写在兽皮上的中世纪手稿。", "level": "IELTS"}, {"word": "medieval", "phonetic": "/ˌmediˈiːvl/", "pos": "adj.", "zh": "中世纪的", "example_en": "The medieval castle attracts thousands of visitors each year.", "example_zh": "这座中世纪城堡每年吸引成千上万的游客。", "level": "IELTS"}, {"word": "renaissance", "phonetic": "/rɪˈneɪsns/", "pos": "n.", "zh": "文艺复兴；复兴", "example_en": "The city is enjoying a renaissance in arts and culture.", "example_zh": "这座城市正经历文化艺术复兴。", "level": "IELTS"}, {"word": "automation", "phonetic": "/ˌɔːtəˈmeɪʃn/", "pos": "n.", "zh": "自动化", "example_en": "Automation has eliminated many routine jobs in manufacturing.", "example_zh": "自动化消灭了制造业中许多重复性岗位。", "level": "IELTS"}, {"word": "innovation", "phonetic": "/ˌɪnəˈveɪʃn/", "pos": "n.", "zh": "创新", "example_en": "Innovation is essential for companies competing in global markets.", "example_zh": "创新对于在全球市场竞争的公司至关重要。", "level": "IELTS"}, {"word": "obsolete", "phonetic": "/ˈɒbsəliːt/", "pos": "adj.", "zh": "过时的", "example_en": "Rapid technological change renders many products obsolete within a few years.", "example_zh": "快速的技术变革使许多产品在几年内过时。", "level": "IELTS"}, {"word": "prototype", "phonetic": "/ˈprəʊtətaɪp/", "pos": "n.", "zh": "原型", "example_en": "The engineers built a prototype to test the new engine design.", "example_zh": "工程师制造了原型来测试新发动机设计。", "level": "IELTS"}, {"word": "biotechnology", "phonetic": "/ˌbaɪəʊtekˈnɒlədʒi/", "pos": "n.", "zh": "生物技术", "example_en": "Biotechnology is transforming medicine and agriculture worldwide.", "example_zh": "生物技术正在改变全球的医学和农业。", "level": "IELTS"}, {"word": "algorithm", "phonetic": "/ˈælɡərɪðəm/", "pos": "n.", "zh": "算法", "example_en": "The algorithm analyses user data to recommend relevant articles.", "example_zh": "该算法分析用户数据以推荐相关文章。", "level": "IELTS"}, {"word": "breakthrough", "phonetic": "/ˈbreɪkθruː/", "pos": "n.", "zh": "突破", "example_en": "Scientists announced a major breakthrough in cancer research.", "example_zh": "科学家宣布了癌症研究的重大突破。", "level": "IELTS"}, {"word": "artificial", "phonetic": "/ˌɑːtɪˈfɪʃl/", "pos": "adj.", "zh": "人造的，人工的", "example_en": "Artificial limbs have become far more sophisticated in recent years.", "example_zh": "近年来人造假肢变得精密得多。", "level": "IELTS"}, {"word": "surveillance", "phonetic": "/sɜːˈveɪləns/", "pos": "n.", "zh": "监视", "example_en": "Public surveillance cameras raised concerns about personal privacy.", "example_zh": "公共监控摄像头引发了对个人隐私的担忧。", "level": "IELTS"}, {"word": "telecommunication", "phonetic": "/ˌtelikəˌmjuːnɪˈkeɪʃn/", "pos": "n.", "zh": "电信", "example_en": "The telecommunication network covers even the remotest islands.", "example_zh": "电信网络甚至覆盖最偏远的岛屿。", "level": "IELTS"}, {"word": "encrypt", "phonetic": "/ɪnˈkrɪpt/", "pos": "v.", "zh": "加密", "example_en": "Banks encrypt customers' data to prevent unauthorised access.", "example_zh": "银行对客户数据进行加密以防止未经授权的访问。", "level": "IELTS"}, {"word": "robotics", "phonetic": "/rəʊˈbɒtɪks/", "pos": "n.", "zh": "机器人学", "example_en": "Robotics is increasingly used in surgery and elderly care.", "example_zh": "机器人技术越来越多地用于手术和老年护理。", "level": "IELTS"}, {"word": "bandwidth", "phonetic": "/ˈbændwɪdθ/", "pos": "n.", "zh": "带宽", "example_en": "The video call failed because of limited bandwidth in rural areas.", "example_zh": "由于农村地区带宽有限，视频通话失败了。", "level": "IELTS"}, {"word": "simulation", "phonetic": "/ˌsɪmjuˈleɪʃn/", "pos": "n.", "zh": "模拟", "example_en": "Flight simulators train pilots in a safe simulation of real conditions.", "example_zh": "飞行模拟器在安全模拟的真实条件下训练飞行员。", "level": "IELTS"}, {"word": "genetic", "phonetic": "/dʒəˈnetɪk/", "pos": "adj.", "zh": "基因的", "example_en": "Some diseases are caused by genetic factors rather than lifestyle.", "example_zh": "一些疾病是由基因而非生活方式引起的。", "level": "IELTS"}, {"word": "genome", "phonetic": "/ˈdʒiːnəʊm/", "pos": "n.", "zh": "基因组", "example_en": "Scientists completed the first map of the human genome in 2003.", "example_zh": "科学家于2003年完成了首张人类基因组图谱。", "level": "IELTS"}, {"word": "clone", "phonetic": "/kləʊn/", "pos": "v.", "zh": "克隆", "example_en": "Researchers successfully cloned a sheep in the 1990s.", "example_zh": "研究人员在上世纪90年代成功克隆了一只绵羊。", "level": "IELTS"}, {"word": "refute", "phonetic": "/rɪˈfjuːt/", "pos": "v.", "zh": "驳斥", "example_en": "The study refutes the claim that homework improves primary pupils' results.", "example_zh": "该研究驳斥了家庭作业能提高小学生成绩的说法。", "level": "IELTS"}, {"word": "entail", "phonetic": "/ɪnˈteɪl/", "pos": "v.", "zh": "需要，涉及", "example_en": "Promoting sustainable farming entails changing long-standing consumer habits.", "example_zh": "推广可持续农业需要改变长期形成的消费习惯。", "level": "IELTS"}, {"word": "supersede", "phonetic": "/ˌsuːpəˈsiːd/", "pos": "v.", "zh": "取代", "example_en": "Digital downloads have largely superseded physical music formats.", "example_zh": "数字下载已在很大程度上取代了实体音乐载体。", "level": "IELTS"}, {"word": "relinquish", "phonetic": "/rɪˈlɪŋkwɪʃ/", "pos": "v.", "zh": "放弃", "example_en": "The chairman refused to relinquish control of the family business.", "example_zh": "董事长拒绝放弃对家族企业的控制权。", "level": "IELTS"}, {"word": "ascertain", "phonetic": "/ˌæsəˈteɪn/", "pos": "v.", "zh": "查明，弄清", "example_en": "The police are trying to ascertain the cause of the accident.", "example_zh": "警方正努力查明事故原因。", "level": "IELTS"}, {"word": "elucidate", "phonetic": "/ɪˈluːsɪdeɪt/", "pos": "v.", "zh": "阐明", "example_en": "The professor elucidated the theory with a series of simple diagrams.", "example_zh": "教授用一系列简单的图表阐明了这个理论。", "level": "IELTS"}, {"word": "substantiate", "phonetic": "/səbˈstænʃieɪt/", "pos": "v.", "zh": "证实", "example_en": "The report failed to substantiate its claims with reliable evidence.", "example_zh": "该报告未能用可靠证据证实其主张。", "level": "IELTS"}, {"word": "perpetuate", "phonetic": "/pəˈpetʃueɪt/", "pos": "v.", "zh": "使长久持续", "example_en": "Biased reporting can perpetuate harmful stereotypes about immigrants.", "example_zh": "有偏见的报道会使对移民的有害刻板印象长期延续。", "level": "IELTS"}, {"word": "hamper", "phonetic": "/ˈhæmpə(r)/", "pos": "v.", "zh": "妨碍", "example_en": "Poor infrastructure continues to hamper economic development in the region.", "example_zh": "落后的基础设施继续阻碍该地区的经济发展。", "level": "IELTS"}, {"word": "hinder", "phonetic": "/ˈhɪndə(r)/", "pos": "v.", "zh": "阻碍", "example_en": "High import duties hinder the growth of international trade.", "example_zh": "高额进口关税阻碍了国际贸易的增长。", "level": "IELTS"}, {"word": "nurture", "phonetic": "/ˈnɜːtʃə(r)/", "pos": "v.", "zh": "培养，养育", "example_en": "Parents should nurture their children's curiosity about the natural world.", "example_zh": "父母应该培养孩子对自然界的好奇心。", "level": "IELTS"}, {"word": "curtail", "phonetic": "/kɜːˈteɪl/", "pos": "v.", "zh": "缩减，削减", "example_en": "The university curtailed spending on new buildings to protect teaching budgets.", "example_zh": "大学削减了新建筑开支以保护教学预算。", "level": "IELTS"}, {"word": "instill", "phonetic": "/ɪnˈstɪl/", "pos": "v.", "zh": "逐渐灌输", "example_en": "Teachers should instill a love of reading in young children.", "example_zh": "教师应该在幼儿心中培养对阅读的热爱。", "level": "IELTS"}, {"word": "prioritize", "phonetic": "/praɪˈɒrətaɪz/", "pos": "v.", "zh": "优先处理", "example_en": "Hospitals must prioritize patients with the most urgent conditions.", "example_zh": "医院必须优先救治病情最紧急的患者。", "level": "IELTS"}, {"word": "accentuate", "phonetic": "/əkˈsentʃueɪt/", "pos": "v.", "zh": "突出，强调", "example_en": "The lighting accentuates the sharp lines of the building's design.", "example_zh": "灯光突出了建筑设计的硬朗线条。", "level": "IELTS"}, {"word": "epitomize", "phonetic": "/ɪˈpɪtəmaɪz/", "pos": "v.", "zh": "集中体现", "example_en": "The company's rapid rise epitomizes the success of the digital economy.", "example_zh": "该公司的迅速崛起集中体现了数字经济的成功。", "level": "IELTS"}, {"word": "characterize", "phonetic": "/ˈkærəktəraɪz/", "pos": "v.", "zh": "以…为特征", "example_en": "The early novels are characterized by vivid descriptions of rural life.", "example_zh": "早期小说的特点是对乡村生活的生动描写。", "level": "IELTS"}, {"word": "mobilize", "phonetic": "/ˈməʊbəlaɪz/", "pos": "v.", "zh": "动员", "example_en": "The campaign mobilized thousands of volunteers to clean the beaches.", "example_zh": "该活动动员了数千名志愿者清理海滩。", "level": "IELTS"}, {"word": "publicize", "phonetic": "/ˈpʌblɪsaɪz/", "pos": "v.", "zh": "宣传", "example_en": "The charity used social media to publicize its fundraising appeal.", "example_zh": "慈善机构利用社交媒体宣传其募捐活动。", "level": "IELTS"}, {"word": "subsidize", "phonetic": "/ˈsʌbsɪdaɪz/", "pos": "v.", "zh": "补贴", "example_en": "The state subsidizes public transport to keep fares affordable.", "example_zh": "国家补贴公共交通以保持票价低廉。", "level": "IELTS"}, {"word": "decentralize", "phonetic": "/ˌdiːˈsentrəlaɪz/", "pos": "v.", "zh": "分散（权力等）", "example_en": "The reforms aimed to decentralize decision-making to local authorities.", "example_zh": "改革旨在把决策权下放给地方当局。", "level": "IELTS"}, {"word": "reiterate", "phonetic": "/riˈɪtəreɪt/", "pos": "v.", "zh": "重申", "example_en": "The minister reiterated the government's commitment to renewable energy.", "example_zh": "部长重申了政府对可再生能源的承诺。", "level": "IELTS"}, {"word": "outweigh", "phonetic": "/ˌaʊtˈweɪ/", "pos": "v.", "zh": "超过（重要性）", "example_en": "The benefits of exercise far outweigh the risks for most people.", "example_zh": "对大多数人来说，锻炼的好处远远大于风险。", "level": "IELTS"}, {"word": "dwindle", "phonetic": "/ˈdwɪndl/", "pos": "v.", "zh": "逐渐减少", "example_en": "Supplies of fresh water dwindle during the long dry season.", "example_zh": "漫长的旱季期间淡水供应逐渐减少。", "level": "IELTS"}, {"word": "proliferate", "phonetic": "/prəˈlɪfəreɪt/", "pos": "v.", "zh": "激增", "example_en": "Cheap smartphones have allowed social media to proliferate in developing countries.", "example_zh": "廉价智能手机使社交媒体在发展中国家迅速普及。", "level": "IELTS"}, {"word": "stagnate", "phonetic": "/stæɡˈneɪt/", "pos": "v.", "zh": "停滞", "example_en": "The economy stagnated for a decade due to political instability.", "example_zh": "由于政局不稳，经济停滞了十年。", "level": "IELTS"}, {"word": "rectify", "phonetic": "/ˈrektɪfaɪ/", "pos": "v.", "zh": "纠正", "example_en": "The airline offered compensation to rectify its earlier mistake.", "example_zh": "航空公司提出赔偿以弥补早前的过失。", "level": "IELTS"}, {"word": "retract", "phonetic": "/rɪˈtrækt/", "pos": "v.", "zh": "撤回，收回", "example_en": "The journal retracted the paper after discovering fabricated data.", "example_zh": "期刊在发现数据造假后撤回了这篇论文。", "level": "IELTS"}, {"word": "curb", "phonetic": "/kɜːb/", "pos": "v.", "zh": "控制，抑制", "example_en": "New taxes were introduced to curb carbon emissions.", "example_zh": "引入新税以控制碳排放。", "level": "IELTS"}, {"word": "embrace", "phonetic": "/ɪmˈbreɪs/", "pos": "v.", "zh": "欣然接受", "example_en": "Traditional retailers are slowly embracing online sales channels.", "example_zh": "传统零售商正慢慢接受在线销售渠道。", "level": "IELTS"}, {"word": "harness", "phonetic": "/ˈhɑːnɪs/", "pos": "v.", "zh": "利用", "example_en": "Engineers found new ways to harness the power of the tides.", "example_zh": "工程师找到了利用潮汐能的新方法。", "level": "IELTS"}, {"word": "jeopardise", "phonetic": "/ˈdʒepədaɪz/", "pos": "v.", "zh": "危及", "example_en": "Missing another deadline would jeopardise the entire project.", "example_zh": "再次错过最后期限将危及整个项目。", "level": "IELTS"}, {"word": "stipulate", "phonetic": "/ˈstɪpjuleɪt/", "pos": "v.", "zh": "规定", "example_en": "The contract stipulates that the work must be finished within six months.", "example_zh": "合同规定工程必须在六个月内完成。", "level": "IELTS"}, {"word": "underestimate", "phonetic": "/ˌʌndərˈestɪmeɪt/", "pos": "v.", "zh": "低估", "example_en": "People often underestimate the amount of sugar in processed food.", "example_zh": "人们常常低估加工食品中的含糖量。", "level": "IELTS"}, {"word": "upgrade", "phonetic": "/ˌʌpˈɡreɪd/", "pos": "v.", "zh": "升级", "example_en": "The council plans to upgrade the city's ageing water pipes.", "example_zh": "市政会计划升级该市老化的水管。", "level": "IELTS"}, {"word": "considerable", "phonetic": "/kənˈsɪdərəbl/", "pos": "adj.", "zh": "相当大的", "example_en": "The project required a considerable investment of time and money.", "example_zh": "该项目需要相当大的时间和资金投入。", "level": "IELTS"}, {"word": "extensive", "phonetic": "/ɪkˈstensɪv/", "pos": "adj.", "zh": "广泛的", "example_en": "The report is based on extensive interviews with local farmers.", "example_zh": "该报告基于对当地农民的广泛访谈。", "level": "IELTS"}, {"word": "rigorous", "phonetic": "/ˈrɪɡərəs/", "pos": "adj.", "zh": "严格的，严谨的", "example_en": "The theory has been tested through rigorous scientific experiments.", "example_zh": "该理论已经过严谨的科学实验检验。", "level": "IELTS"}, {"word": "ubiquitous", "phonetic": "/juːˈbɪkwɪtəs/", "pos": "adj.", "zh": "无处不在的", "example_en": "Smartphones have become ubiquitous in modern urban life.", "example_zh": "智能手机在现代城市生活中已无处不在。", "level": "IELTS"}, {"word": "prevalent", "phonetic": "/ˈprevələnt/", "pos": "adj.", "zh": "普遍的，盛行的", "example_en": "Obesity is particularly prevalent among children in wealthy countries.", "example_zh": "肥胖在富裕国家的儿童中尤为普遍。", "level": "IELTS"}, {"word": "paramount", "phonetic": "/ˈpærəmaʊnt/", "pos": "adj.", "zh": "至关重要的", "example_en": "Passenger safety is of paramount importance in aircraft design.", "example_zh": "乘客安全在飞机设计中至关重要。", "level": "IELTS"}, {"word": "indispensable", "phonetic": "/ˌɪndɪˈspensəbl/", "pos": "adj.", "zh": "不可或缺的", "example_en": "Reliable public transport is indispensable to a functioning city.", "example_zh": "可靠的公共交通对城市的正常运转不可或缺。", "level": "IELTS"}, {"word": "incompatible", "phonetic": "/ˌɪnkəmˈpætəbl/", "pos": "adj.", "zh": "不兼容的，矛盾的", "example_en": "Long working hours are often incompatible with family life.", "example_zh": "长时间工作往往与家庭生活难以兼顾。", "level": "IELTS"}, {"word": "intermittent", "phonetic": "/ˌɪntəˈmɪtənt/", "pos": "adj.", "zh": "间歇的", "example_en": "The expedition endured intermittent rain for most of the week.", "example_zh": "探险队在一周的大部分时间里断断续续地遭遇降雨。", "le
