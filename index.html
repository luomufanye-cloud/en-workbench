vel": "IELTS"}, {"word": "ephemeral", "phonetic": "/ɪˈfemərəl/", "pos": "adj.", "zh": "短暂的", "example_en": "Fashion is by nature ephemeral, changing from season to season.", "example_zh": "时尚本质上是短暂的，随季节而变化。", "level": "IELTS"}, {"word": "tangible", "phonetic": "/ˈtændʒəbl/", "pos": "adj.", "zh": "有形的，实实在在的", "example_en": "The training programme produced tangible improvements in staff performance.", "example_zh": "培训计划使员工表现有了切实的改善。", "level": "IELTS"}, {"word": "adverse", "phonetic": "/ˈædvɜːs/", "pos": "adj.", "zh": "不利的", "example_en": "The drug was withdrawn after reports of adverse side effects.", "example_zh": "在有不良反应的报告后，该药被撤出市场。", "level": "IELTS"}, {"word": "detrimental", "phonetic": "/ˌdetrɪˈmentl/", "pos": "adj.", "zh": "有害的", "example_en": "Excessive screen time can be detrimental to children's eyesight.", "example_zh": "过长的屏幕时间可能损害儿童的视力。", "level": "IELTS"}, {"word": "pristine", "phonetic": "/ˈprɪstiːn/", "pos": "adj.", "zh": "原始的，未受破坏的", "example_en": "The island's beaches remain pristine because few tourists visit them.", "example_zh": "由于游客稀少，岛上的海滩保持原始风貌。", "level": "IELTS"}, {"word": "congested", "phonetic": "/kənˈdʒestɪd/", "pos": "adj.", "zh": "拥堵的", "example_en": "Commuters spend hours each day on congested motorways.", "example_zh": "通勤者每天在拥堵的高速公路上耗费数小时。", "level": "IELTS"}, {"word": "sprawling", "phonetic": "/ˈsprɔːlɪŋ/", "pos": "adj.", "zh": "蔓延的，杂乱延伸的", "example_en": "The sprawling city now covers an area three times its 1990 size.", "example_zh": "这座不断蔓延的城市面积已是1990年的三倍。", "level": "IELTS"}, {"word": "irreversible", "phonetic": "/ˌɪrɪˈvɜːsəbl/", "pos": "adj.", "zh": "不可逆的", "example_en": "Scientists warn that the damage to the reef may be irreversible.", "example_zh": "科学家警告说，珊瑚礁受到的损害可能是不可逆的。", "level": "IELTS"}, {"word": "sustainable", "phonetic": "/səˈsteɪnəbl/", "pos": "adj.", "zh": "可持续的", "example_en": "We must find sustainable ways of meeting rising energy demand.", "example_zh": "我们必须找到满足日益增长的能源需求的可持续方式。", "level": "IELTS"}, {"word": "widespread", "phonetic": "/ˈwaɪdspred/", "pos": "adj.", "zh": "广泛的", "example_en": "The use of contactless payment is now widespread across the country.", "example_zh": "非接触式支付的使用现已遍及全国。", "level": "IELTS"}, {"word": "unprecedented", "phonetic": "/ʌnˈpresɪdentɪd/", "pos": "adj.", "zh": "前所未有的", "example_en": "The pandemic caused an unprecedented drop in international travel.", "example_zh": "疫情导致国际旅行出现前所未有的下降。", "level": "IELTS"}, {"word": "groundbreaking", "phonetic": "/ˈɡraʊndbreɪkɪŋ/", "pos": "adj.", "zh": "开创性的", "example_en": "Her groundbreaking research changed our understanding of the human brain.", "example_zh": "她开创性的研究改变了我们对人脑的认识。", "level": "IELTS"}, {"word": "plausible", "phonetic": "/ˈplɔːzəbl/", "pos": "adj.", "zh": "貌似合理的", "example_en": "His explanation sounded plausible, but the evidence told a different story.", "example_zh": "他的解释听起来有道理，但证据却表明了另一种情况。", "level": "IELTS"}, {"word": "hypothesis", "phonetic": "/haɪˈpɒθəsɪs/", "pos": "n.", "zh": "假设", "example_en": "The experiment was designed to test the original hypothesis.", "example_zh": "该实验旨在验证最初的假设。", "level": "IELTS"}, {"word": "inference", "phonetic": "/ˈɪnfərəns/", "pos": "n.", "zh": "推断，推论", "example_en": "The study's conclusions are an inference rather than a direct observation.", "example_zh": "该研究的结论是推断而非直接观察的结果。", "level": "IELTS"}, {"word": "implication", "phonetic": "/ˌɪmplɪˈkeɪʃn/", "pos": "n.", "zh": "可能的影响；含义", "example_en": "The findings have important implications for government education policy.", "example_zh": "这些发现对政府教育政策有重要影响。", "level": "IELTS"}, {"word": "ramification", "phonetic": "/ˌræmɪfɪˈkeɪʃn/", "pos": "n.", "zh": "（众多）后果", "example_en": "The court's decision will have far-reaching ramifications for the industry.", "example_zh": "法院的裁决将对这个行业产生深远的影响。", "level": "IELTS"}, {"word": "repercussion", "phonetic": "/ˌriːpəˈkʌʃn/", "pos": "n.", "zh": "影响，反响", "example_en": "The scandal had serious repercussions for the newspaper's reputation.", "example_zh": "这一丑闻对报社声誉造成了严重影响。", "level": "IELTS"}, {"word": "correlation", "phonetic": "/ˌkɒrəˈleɪʃn/", "pos": "n.", "zh": "相关性", "example_en": "Researchers found a strong correlation between sleep and academic performance.", "example_zh": "研究人员发现睡眠与学业表现之间有很强的相关性。", "level": "IELTS"}, {"word": "causality", "phonetic": "/kɔːˈzæləti/", "pos": "n.", "zh": "因果关系", "example_en": "A correlation between two variables does not prove causality.", "example_zh": "两个变量之间的相关性并不能证明因果关系。", "level": "IELTS"}, {"word": "anomaly", "phonetic": "/əˈnɒməli/", "pos": "n.", "zh": "异常（现象）", "example_en": "The unusually warm winter was seen as an anomaly in the climate record.", "example_zh": "这个异常温暖的冬天被视为气候记录中的异常现象。", "level": "IELTS"}], "questions": [{"id": "c6-v-001", "level": "CET6", "type": "词汇", "topic": "环境", "stem": "The government plans to ___ the use of plastic bags.", "options": ["A. abolish", "B. enhance", "C. maintain", "D. neglect"], "answer": "A", "analysis": "abolish 意为‘废除’，符合‘政府计划废除塑料袋使用’的环保语境。enhance 意为提升，与限制塑料袋的方向相反；maintain 意为维持现状，无法体现政策收紧；neglect 意为忽视，语义不符且主语是主动作为的政府。"}, {"id": "c6-v-002", "level": "CET6", "type": "词汇", "topic": "教育", "stem": "The professor's lecture was so ___ that few students could follow his reasoning.", "options": ["A. coherent", "B. obscure", "C. explicit", "D. transparent"], "answer": "B", "analysis": "obscure 意为‘晦涩难懂的’，与后半句‘几乎没有学生能跟上思路’逻辑一致。coherent 意为连贯的，explicit 意为明确的，transparent 意为清晰的，三者都表示易于理解，与句意矛盾。"}, {"id": "c6-v-003", "level": "CET6", "type": "词汇", "topic": "科技", "stem": "Scientists are trying to ___ the mysterious signals coming from deep space.", "options": ["A. decipher", "B. compose", "C. fabricate", "D. consolidate"], "answer": "A", "analysis": "decipher 意为‘破译、解读’，与‘神秘信号’搭配表示解读来自深空的信号。compose 意为创作，fabricate 意为捏造，consolidate 意为巩固合并，均不符合‘解读未知信号’的语境。"}, {"id": "c6-v-004", "level": "CET6", "type": "词汇", "topic": "社会", "stem": "Her ___ attitude toward the project irritated her colleagues who were working overtime.", "options": ["A. indifferent", "B. enthusiastic", "C. diligent", "D. committed"], "answer": "A", "analysis": "indifferent 意为‘漠不关心’，与同事加班努力形成对比，因而‘激怒’他们。enthusiastic 热情的、diligent 勤奋的、committed 投入的，均为积极态度，不会引发 irritation。"}, {"id": "c6-v-005", "level": "CET6", "type": "词汇", "topic": "经济", "stem": "The sudden ___ in oil prices triggered a wave of inflation across the region.", "options": ["A. surge", "B. plunge", "C. stagnation", "D. recession"], "answer": "A", "analysis": "surge 意为‘急剧上涨’，油价骤涨会引发输入型通胀，逻辑吻合。plunge 意为暴跌，通常抑制通胀；stagnation 停滞与 recession 衰退都不直接造成‘通胀浪潮’。"}, {"id": "c6-v-006", "level": "CET6", "type": "词汇", "topic": "健康", "stem": "Regular exercise can ___ the risk of developing chronic diseases.", "options": ["A. mitigate", "B. aggravate", "C. provoke", "D. deteriorate"], "answer": "A", "analysis": "mitigate 意为‘减轻、降低’，运动降低慢性病风险符合常识与医学结论。aggravate 加重、provoke 引发、deteriorate 恶化均为负面作用，与规律运动的益处相反。"}, {"id": "c6-v-007", "level": "CET6", "type": "词汇", "topic": "文化", "stem": "The festival is a ___ of the local community's traditions and beliefs.", "options": ["A. manifestation", "B. contradiction", "C. elimination", "D. distortion"], "answer": "A", "analysis": "manifestation 意为‘体现、表现形式’，节日是传统与信仰的体现，语义恰当。contradiction 矛盾、elimination 消除、distortion 歪曲均为负面或对立概念，不符合节日的正面承载作用。"}, {"id": "c6-v-008", "level": "CET6", "type": "词汇", "topic": "科技", "stem": "The new software is designed to ___ large amounts of data in real time.", "options": ["A. process", "B. discard", "C. conceal", "D. postpone"], "answer": "A", "analysis": "process 意为‘处理’，软件实时处理大量数据是典型功能描述。discard 丢弃、conceal 隐藏、postpone 推迟都不构成软件的核心正向用途，且与‘实时’语义不符。"}, {"id": "c6-v-009", "level": "CET6", "type": "词汇", "topic": "教育", "stem": "The book provides a ___ account of the historical events leading to the war.", "options": ["A. comprehensive", "B. superficial", "C. fragmentary", "D. biased"], "answer": "A", "analysis": "comprehensive 意为‘全面的’，对战争前因的全面叙述符合好书的特征。superficial 表面的、fragmentary 零散的、biased 有偏见的均为负面评价，通常不是褒义语境所期待的。"}, {"id": "c6-v-010", "level": "CET6", "type": "词汇", "topic": "社会", "stem": "Public trust in the institution has been ___ by a series of scandals.", "options": ["A. eroded", "B. reinforced", "C. restored", "D. elevated"], "answer": "A", "analysis": "eroded 意为‘侵蚀、削弱’，一系列丑闻削弱公众信任符合因果逻辑。reinforced 加强、restored 恢复、elevated 提升均为正向变化，与丑闻的破坏作用相反。"}, {"id": "c6-v-011", "level": "CET6", "type": "词汇", "topic": "环境", "stem": "The committee urged residents to ___ energy by turning off unused appliances.", "options": ["A. conserve", "B. squander", "C. exploit", "D. disperse"], "answer": "A", "analysis": "conserve 意为‘节约、保护’，关掉不用电器正是节约能源之举。squander 浪费、exploit 开发剥削、disperse 分散都与‘节能倡议’背道而驰。"}, {"id": "c6-v-012", "level": "CET6", "type": "词汇", "topic": "经济", "stem": "The company's profits ___ sharply after the new CEO restructured the business.", "options": ["A. soared", "B. dwindled", "C. faltered", "D. languished"], "answer": "A", "analysis": "soared 意为‘飙升’，重组后利润大涨是积极结果。dwindled 缩减、faltered 蹒跚不稳、languished 停滞萎靡均表示业绩不佳，与‘成功重组’的隐含预期不符。"}, {"id": "c6-v-013", "level": "CET6", "type": "词汇", "topic": "健康", "stem": "A balanced diet is ___ to maintaining good physical and mental health.", "options": ["A. indispensable", "B. irrelevant", "C. detrimental", "D. optional"], "answer": "A", "analysis": "indispensable 意为‘不可或缺的’，均衡饮食对健康必不可少是常识。irrelevant 无关、detrimental 有害、optional 可选的均否定其重要性，与科学结论矛盾。"}, {"id": "c6-v-014", "level": "CET6", "type": "词汇", "topic": "文化", "stem": "The novel's ___ ending left readers debating its true meaning for years.", "options": ["A. ambiguous", "B. definitive", "C. predictable", "D. monotonous"], "answer": "A", "analysis": "ambiguous 意为‘模棱两可的’，开放性结局令读者多年争论其含义，逻辑自洽。definitive 确定的、predictable 可预测的都会消除争论；monotonous 单调的与‘引发讨论’无关。"}, {"id": "c6-v-015", "level": "CET6", "type": "词汇", "topic": "科技", "stem": "Engineers must ___ the bridge regularly to ensure its structural safety.", "options": ["A. inspect", "B. neglect", "C. demolish", "D. fabricate"], "answer": "A", "analysis": "inspect 意为‘检查’，定期巡检以确保桥梁结构安全是工程规范。neglect 忽视会危及安全；demolish 拆除与‘确保安全’无关；fabricate 制造不符合‘已有桥梁’语境。"}, {"id": "c6-v-016", "level": "CET6", "type": "词汇", "topic": "社会", "stem": "The refugee crisis has ___ the need for international humanitarian cooperation.", "options": ["A. underscored", "B. diminished", "C. obscured", "D. nullified"], "answer": "A", "analysis": "underscored 意为‘凸显、强调’，难民危机凸显了国际合作之必要。diminished 削弱、obscured 掩盖、nullified 使无效都弱化了危机的警示作用，与事实相反。"}, {"id": "c6-v-017", "level": "CET6", "type": "词汇", "topic": "教育", "stem": "Students are encouraged to ___ their own opinions rather than merely memorize facts.", "options": ["A. articulate", "B. suppress", "C. duplicate", "D. abandon"], "answer": "A", "analysis": "articulate 意为‘清晰表达’，鼓励表达观点而非死记硬背是启发式教育的核心。suppress 压制、duplicate 复制、abandon 放弃均与‘鼓励独立思考’相悖。"}, {"id": "c6-v-018", "level": "CET6", "type": "词汇", "topic": "经济", "stem": "The central bank lowered interest rates to ___ economic growth during the slowdown.", "options": ["A. stimulate", "B. hinder", "C. constrain", "D. inhibit"], "answer": "A", "analysis": "stimulate 意为‘刺激’，降息以刺激经济放缓期的增长是标准货币政策。hinder 阻碍、constrain 限制、inhibit 抑制均为收缩性效果，与降息的扩张意图相反。"}, {"id": "c6-v-019", "level": "CET6", "type": "词汇", "topic": "环境", "stem": "Deforestation has ___ the natural habitat of countless species.", "options": ["A. devastated", "B. fortified", "C. preserved", "D. enriched"], "answer": "A", "analysis": "devastated 意为‘严重破坏’，毁林破坏了无数物种的自然栖息地。fortified 加固、preserved 保护、enriched 丰富均为保护性或正向作用，与毁林后果相反。"}, {"id": "c6-v-020", "level": "CET6", "type": "词汇", "topic": "健康", "stem": "Prolonged stress can ___ the body's immune system, making one prone to illness.", "options": ["A. compromise", "B. strengthen", "C. invigorate", "D. bolster"], "answer": "A", "analysis": "compromise 在此意为‘损害、削弱’，长期压力削弱免疫系统、使人易病，符合医学认知。strengthen 增强、invigorate 使活力充沛、bolster 支撑加强均为正向，与压力危害相反。"}, {"id": "c6-g-001", "level": "CET6", "type": "语法", "topic": "语法", "stem": "Not until the train pulled into the station ___ realize he had left his suitcase behind.", "options": ["A. did he", "B. he did", "C. he", "D. did"], "answer": "A", "analysis": "Not until 位于句首引起主句部分倒装，助动词 did 须提前，主语 he 紧随其后，故用 did he。he did 未倒装，违反否定副词前置规则；he 缺助动词；did 缺主语。"}, {"id": "c6-g-002", "level": "CET6", "type": "语法", "topic": "语法", "stem": "The report suggests that the committee ___ the proposal before the deadline.", "options": ["A. approve", "B. approves", "C. approved", "D. will approve"], "answer": "A", "analysis": "suggest 表‘建议’时，其宾语从句须用虚拟语气 (should) + 动词原形，should 常省略，故用 approve。approves/approved/will approve 均为直陈式，不符合虚拟语气要求。"}, {"id": "c6-g-003", "level": "CET6", "type": "语法", "topic": "语法", "stem": "___ hard he tried, he could not solve the equation within the time limit.", "options": ["A. However", "B. Whatever", "C. Whoever", "D. Wherever"], "answer": "A", "analysis": "However + 形容词/副词 引导让步状语从句，意为‘无论多……’，修饰 hard 正确。Whatever 后接名词；Whoever 指人；Wherever 表地点，均不能修饰副词 hard。"}, {"id": "c6-g-004", "level": "CET6", "type": "语法", "topic": "语法", "stem": "By the time we arrived at the theater, the movie ___ for ten minutes.", "options": ["A. had been playing", "B. has played", "C. was playing", "D. played"], "answer": "A", "analysis": "By the time + 过去时间，主句动作在‘到达’之前已持续，须用过去完成进行时 had been playing 强调持续。has played 现在完成时与过去时间冲突；was playing/played 不能体现‘先于此刻已持续’。"}, {"id": "c6-g-005", "level": "CET6", "type": "语法", "topic": "语法", "stem": "It was the scholarship ___ enabled her to study abroad.", "options": ["A. that", "B. which", "C. what", "D. who"], "answer": "A", "analysis": "本句为 It was ... that 强调句型，强调主语 the scholarship，连接词用 that（指物也可用 which，但强调句标准用 that 更规范且无逗号间隔）。what 不引导强调句；who 指人。"}, {"id": "c6-g-006", "level": "CET6", "type": "语法", "topic": "语法", "stem": "The professor insisted that the data ___ before drawing any conclusions.", "options": ["A. be verified", "B. is verified", "C. was verified", "D. will be verified"], "answer": "A", "analysis": "insist 表‘坚持要求’时从句用虚拟语气 (should) be verified，被动原形。is/was verified 为直陈式，will be verified 将来时，均违背虚拟语气规则。"}, {"id": "c6-g-007", "level": "CET6", "type": "语法", "topic": "语法", "stem": "Scarcely had the meeting begun ___ the power went out.", "options": ["A. when", "B. than", "C. then", "D. until"], "answer": "A", "analysis": "Scarcely ... when 为固定搭配，表示‘一……就……’，前半句倒装后半句用 when。than 用于 no sooner ... than；then/until 不与该结构搭配。"}, {"id": "c6-g-008", "level": "CET6", "type": "语法", "topic": "语法", "stem": "Had I known about the traffic, I ___ the earlier flight.", "options": ["A. would have taken", "B. will take", "C. take", "D. have taken"], "answer": "A", "analysis": "Had I known 为省略 if 的虚拟条件句（与过去事实相反），主句须用 would have taken。will take/take/have taken 均为直陈式，无法与过去虚拟条件呼应。"}, {"id": "c6-g-009", "level": "CET6", "type": "语法", "topic": "语法", "stem": "The man ___ is standing by the window is the new director.", "options": ["A. who", "B. which", "C. whose", "D. what"], "answer": "A", "analysis": "定语从句先行词 the man 指人，在从句中作主语，用 who（也可用 that）。which 指物；whose 表所属；what 不引导定语从句。"}, {"id": "c6-g-010", "level": "CET6", "type": "语法", "topic": "语法", "stem": "I would rather you ___ noise while I am working.", "options": ["A. didn't make", "B. don't make", "C. won't make", "D. haven't made"], "answer": "A", "analysis": "would rather 后接宾语从句须用虚拟语气：对现在/将来用一般过去时 didn't make。don't make 直陈式错误；won't make 将来时；haven't made 现在完成时均不符合句型。"}, {"id": "c6-g-011", "level": "CET6", "type": "语法", "topic": "语法", "stem": "The students, together with their teacher, ___ going on a field trip tomorrow.", "options": ["A. are", "B. is", "C. was", "D. be"], "answer": "A", "analysis": "主语是 The students，together with 短语为插入修饰语不影响主谓一致，谓语用复数 are。is/was 误将 teacher 视为主语；be 缺时态。"}, {"id": "c6-g-012", "level": "CET6", "type": "语法", "topic": "语法", "stem": "___ from the hill, the village looked extraordinarily peaceful at dusk.", "options": ["A. Seen", "B. Seeing", "C. To see", "D. Having saw"], "answer": "A", "analysis": "过去分词 Seen 表被动，村庄‘被看’（从山上看），主语 the village 与 see 为被动关系。Seeing 主动逻辑错；To see 表目的不符；Having saw 形式错误（应为 seen）。"}, {"id": "c6-g-013", "level": "CET6", "type": "语法", "topic": "语法", "stem": "She is the only one of the applicants who ___ fluent French.", "options": ["A. speaks", "B. speak", "C. speaking", "D. spoke"], "answer": "A", "analysis": "the only one of + 复数名词 + who 引导定语从时，who 指代 the only one，谓语用单数 speaks。speak 误用复数；speaking 非谓语；spoke 时态不符。"}, {"id": "c6-g-014", "level": "CET6", "type": "语法", "topic": "语法", "stem": "My suggestion is that everyone ___ a brief presentation next Monday.", "options": ["A. give", "B. gives", "C. gave", "D. will give"], "answer": "A", "analysis": "表语从句中 suggestion 等名词要求虚拟语气 (should) give，动词原形。gives/gave/will give 均为直陈式，不符合名词性虚拟语气。"}, {"id": "c6-g-015", "level": "CET6", "type": "语法", "topic": "语法", "stem": "No sooner ___ the room than the phone rang.", "options": ["A. had he entered", "B. he had entered", "C. he entered", "D. did he enter"], "answer": "A", "analysis": "No sooner 位于句首引起倒装，且其后用过去完成时 had he entered，固定搭配为 no sooner ... than。he had entered 未倒装；he entered 时态与结构均错；did he enter 时态不对。"}, {"id": "c6-r-001", "level": "CET6", "type": "阅读", "topic": "科技", "stem": "Passage: Artificial intelligence is reshaping the job market. While routine tasks are increasingly automated, demand for roles requiring creativity and emotional intelligence is rising. A recent study found that workers who continuously reskill adapt far better than those who resist change. \nQuestion: What is the main idea of the passage?", "options": ["A. AI is eliminating all jobs.", "B. Reskilling helps workers adapt to AI-driven changes.", "C. Emotional intelligence is no longer needed.", "D. Automation only affects routine tasks."], "answer": "B", "analysis": "文章核心：AI 改变就业市场，持续再技能化（reskill）的劳动者适应更好，故 B 正确。A 说消除所有工作过于绝对；C 与文中情感智能需求上升相反；D 说‘只’影响例行任务，文中还说创造性岗位需求上升，表述片面。"}, {"id": "c6-r-002", "level": "CET6", "type": "阅读", "topic": "环境", "stem": "Passage: Urban green spaces not only improve air quality but also reduce residents' stress levels. A survey across 12 cities revealed that neighborhoods with more parks reported 20% lower anxiety rates. City planners now prioritize green infrastructure. \nQuestion: What did the survey across 12 cities find?", "options": ["A. Parks increase anxiety by 20%.", "B. More parks correlate with lower anxiety rates.", "C. Green spaces worsen air quality.", "D. City planners ignore green infrastructure."], "answer": "B", "analysis": "调查明确发现公园更多的社区焦虑率低 20%，即 B‘更多公园与更低焦虑率相关’。A 把方向说反；C 与改善空气质量的论述矛盾；D 与规划者优先绿色基建相反。"}, {"id": "c6-r-003", "level": "CET6", "type": "阅读", "topic": "教育", "stem": "Passage: Bilingual education remains controversial. Proponents argue it preserves cultural identity and enhances cognitive flexibility, whereas critics worry it slows subject mastery. Longitudinal research, however, shows bilingual students eventually outperform peers academically. \nQuestion: What does longitudinal research indicate about bilingual students?", "options": ["A. They master subjects more slowly forever.", "B. They eventually outperform peers academically.", "C. They lose cultural identity.", "D. They have less cognitive flexibility."], "answer": "B", "analysis": "文中 longitudinal research 指出双语学生最终在学业上超过同侪，即 B。A 把‘初期慢’夸大成永远；C、D 均与支持者观点及研究结论相反。"}, {"id": "c6-r-004", "level": "CET6", "type": "阅读", "topic": "经济", "stem": "Passage: Remote work surged during the pandemic and has persisted. Companies report lower overhead costs, yet collaboration suffers. Economists predict a hybrid model will dominate, balancing flexibility with team cohesion. \nQuestion: What model do economists predict will dominate?", "options": ["A. Fully remote work.", "B. A hybrid model.", "C. Return to office entirely.", "D. Four-day workweek."], "answer": "B", "analysis": "文末明确指出经济学家预测混合模式（hybrid model）将主导，即 B。A、C 都只取一端，与‘平衡’相悖；D 文中未提及。"}, {"id": "c6-r-005", "level": "CET6", "type": "阅读", "topic": "社会", "stem": "Passage: Social media amplifies both connection and division. While it lets marginalized voices be heard, algorithms often create echo chambers that deepen polarization. Researchers urge platforms to increase transparency. \nQuestion: According to the passage, what is a negative effect of algorithms?", "options": ["A. They silence marginalized voices.", "B. They create echo chambers deepening polarization.", "C. They increase platform transparency.", "D. They strengthen real-world connections."], "answer": "B", "analysis": "文中说算法制造回音室、加深极化，即 B。A 与‘让边缘声音被听见’相反；C 是研究者呼吁而非算法现状；D 是社交媒体的正面作用，非算法负面。"}, {"id": "c6-r-006", "level": "CET6", "type": "阅读", "topic": "健康", "stem": "Passage: Sleep deprivation impairs memory consolidation and immune function. A clinical trial showed that adults sleeping under six hours nightly were 30% more likely to fall ill. Experts recommend consistent sleep schedules over sporadic long rests. \nQuestion: What did the clinical trial reveal?", "options": ["A. Long rests cure sleep deprivation.", "B. Under-six-hour sleepers were 30% more likely to get sick.", "C. Memory improves without sleep.", "D. Immune function is unrelated to sleep."], "answer": "B", "analysis": "试验结果：每晚不足六小时者患病概率高 30%，即 B。A 与‘规律作息优于偶尔长睡’相反；C、D 均违背文中睡眠对记忆与免疫重要的结论。"}, {"id": "c6-r-007", "level": "CET6", "type": "阅读", "topic": "文化", "stem": "Passage: Museums are reinventing themselves as interactive community hubs. By hosting workshops and digital exhibits, they attract younger audiences who once found them irrelevant. This shift reflects a broader redefinition of cultural preservation. \nQuestion: Why are museums hosting workshops and digital exhibits?", "options": ["A. To reduce operating costs.", "B. To attract younger audiences.", "C. To replace physical collections.", "D. To exclude older visitors."], "answer": "B", "analysis": "文中说这些举措是为了吸引曾觉得博物馆无关的年轻观众，即 B。A 成本未提；C‘取代实体收藏’过度推断；D‘排斥年长者’无依据且与社区中心定位矛盾。"}, {"id": "c6-r-008", "level": "CET6", "type": "阅读", "topic": "科技", "stem": "Passage: Renewable energy capacity doubled in the past decade, yet storage remains the bottleneck. Without affordable batteries, surplus solar power is wasted at night. Breakthroughs in solid-state technology may soon change this. \nQuestion: What is described as the current bottleneck for renewables?", "options": ["A. Lack of solar panels.", "B. Energy storage.", "C. Government policy.", "D. Public indifference."], "answer": "B", "analysis": "文中明确说 storage（储能）仍是瓶颈，即 B。A 与产能翻倍矛盾；C、D 文中未提，属无中生有。"}, {"id": "c6-r-009", "level": "CET6", "type": "阅读", "topic": "经济", "stem": "Passage: Inflation eased last quarter, but core prices stayed sticky due to wage growth. The central bank signaled patience, avoiding hasty rate cuts that could reignite price pressures. Markets responded with cautious optimism. \nQuestion: Why did the central bank avoid hasty rate cuts?", "options": ["A. To prevent reigniting inflation.", "B. Because inflation was zero.", "C. Markets demanded cuts.", "D. Wage growth had stopped."], "answer": "A", "analysis": "文中说央行避免仓促降息以免重新点燃价格压力，即 A。B 与核心价格黏性矛盾；C 市场是谨慎乐观而非要求降息；D 工资增长仍在推高核心价格。"}, {"id": "c6-r-010", "level": "CET6", "type": "阅读", "topic": "社会", "stem": "Passage: Volunteerism declined among young adults during economic hardship but rebounded as conditions improved. Communities relying on volunteers faced service gaps, highlighting their fragility. \nQuestion: What happened to volunteerism during economic hardship?", "options": ["A. It increased steadily.", "B. It declined among young adults.", "C. It replaced paid work.", "D. It had no effect on services."], "answer": "B", "analysis": "文中说经济困难期年轻人志愿服务下降，即 B。A 方向相反；C‘取代有偿工作’无依据；D 与‘服务出现缺口’矛盾。"}, {"id": "c6-r-011", "level": "CET6", "type": "阅读", "topic": "教育", "stem": "Passage: Standardized testing faces growing criticism for measuring memorization over critical thinking. Some schools adopt portfolio assessments, though critics note inconsistent scoring. The debate continues without consensus. \nQuestion: What is a criticism of portfolio assessments mentioned?", "options": ["A. They encourage memorization.", "B. Scoring is inconsistent.", "C. They are too easy.", "D. Students reject them."], "answer": "B", "analysis": "文中对档案评估的批评是其评分不一致（inconsistent scoring），即 B。A 是标准化考试的毛病；C、D 文中未提及。"}, {"id": "c6-r-012", "level": "CET6", "type": "阅读", "topic": "环境", "stem": "Passage: Microplastics have been detected in mountaintop snow and deep ocean trenches, evidence of pervasive pollution. Researchers warn that filtration alone cannot solve the crisis; reducing production is essential. \nQuestion: What do researchers say is essential to solve microplastic pollution?", "options": ["A. More filtration systems.", "B. Reducing plastic production.", "C. Ignoring the problem.", "D. Banning all seafood."], "answer": "B", "analysis": "研究者强调仅靠过滤不够，必须减少生产，即 B。A 是文中说‘不能仅靠’的部分；C、D 均非文中建议且极端。"}, {"id": "c6-r-013", "level": "CET6", "type": "阅读", "topic": "科技", "stem": "Passage: Gene editing offers hope for inherited diseases, yet ethical concerns about designer babies persist. International guidelines urge caution, permitting therapeutic use while banning enhancement. \nQuestion: What use of gene editing do international guidelines permit?", "options": ["A. Enhancement for appearance.", "B. Therapeutic use.", "C. Creating designer babies.", "D. Unrestricted editing."], "answer": "B", "analysis": "指南允许治疗性用途（therapeutic use）而禁止增强，即 B。A、C 属被禁的增强/设计婴儿；D 无限制编辑与‘谨慎、禁止增强’相悖。"}, {"id": "c6-r-014", "level": "CET6", "type": "阅读", "topic": "文化", "stem": "Passage: Streaming platforms diluted national film industries by favoring global hits, but also gave local creators unprecedented reach. The result is a tension between cultural homogenization and diversity. \nQuestion: What is the double effect of streaming platforms?", "options": ["A. Only harmed local industries.", "B. Both diluted industries and expanded creators' reach.", "C. Ended cultural diversity.", "D. Made national films dominate."], "answer": "B", "analysis": "文中指出流媒体既稀释了民族电影业，又给本地创作者空前触达，即 B 的双重效应。A 片面；C‘终结多样性’与‘多样性张力’不符；D 与全球热片受宠相反。"}, {"id": "c6-r-015", "level": "CET6", "type": "阅读", "topic": "健康", "stem": "Passage: Telemedicine expanded access in rural areas but revealed a digital divide: elderly patients lacking broadband were left behind. Policymakers propose subsidies to close the gap. \nQuestion: What problem did telemedicine reveal in rural areas?", "options": ["A. Doctors refused to work remotely.", "B. A digital divide leaving elderly behind.", "C. Broadband was too cheap.", "D. Patients preferred hospitals."], "answer": "B", "analysis": "文中说远程医疗暴露了数字鸿沟，缺宽带的老年患者被落下，即 B。A、C、D 均非文中所述，C 甚至与事实相反。"}, {"id": "c6-c-001", "level": "CET6", "type": "完形", "topic": "社会", "stem": "Although the two countries share a border, their cultures remain distinctly ___.", "options": ["A. diverse", "B. similar", "C. identical", "D. uniform"], "answer": "A", "analysis": "Although 表转折，前文‘共享边界’与‘文化明显不同’形成对比，diverse 不同/多元正确。similar 相似、identical 相同、uniform 一致的均与转折逻辑矛盾。"}, {"id": "c6-c-002", "level": "CET6", "type": "完形", "topic": "环境", "stem": "The diplomat spoke with such ___ that both sides accepted the compromise.", "options": ["A. tact", "B. rudeness", "C. ignorance", "D. hostility"], "answer": "A", "analysis": "tact 意为‘得体、圆滑’，外交官言谈得体使双方接受妥协，因果合理。rudeness 粗鲁、ignorance 无知、hostility 敌意都会破坏谈判，与结果矛盾。"}, {"id": "c6-c-003", "level": "CET6", "type": "完形", "topic": "教育", "stem": "Her argument was so ___ that the opponent had no choice but to concede.", "options": ["A. compelling", "B. feeble", "C. vague", "D. trivial"], "answer": "A", "analysis": "compelling 意为‘令人信服的’，论点有力使对手不得不让步，逻辑通顺。feeble 薄弱、vague 模糊、trivial 琐碎均无法迫使对方认输。"}, {"id": "c6-c-004", "level": "CET6", "type": "完形", "topic": "科技", "stem": "The algorithm can ___ patterns invisible to human analysts within seconds.", "options": ["A. detect", "B. overlook", "C. conceal", "D. distort"], "answer": "A", "analysis": "detect 意为‘探测、识别’，算法在数秒内识别人眼难见模式，符合 AI 优势。overlook 忽略、conceal 隐藏、distort 歪曲都与‘算法强于人类’的语境相反。"}, {"id": "c6-c-005", "level": "CET6", "type": "完形", "topic": "经济", "stem": "Despite the recession, the firm managed to ___ its market position through innovation.", "options": ["A. consolidate", "B. forfeit", "C. undermine", "D. relinquish"], "answer": "A", "analysis": "consolidate 意为‘巩固’，通过创新在衰退中巩固市场地位，语义积极合理。forfeit 丧失、undermine 削弱、relinquish 放弃均为负面，与‘managed to’的成就意味冲突。"}, {"id": "c6-c-006", "level": "CET6", "type": "完形", "topic": "健康", "stem": "Chronic sleep loss can ___ one's ability to concentrate during the day.", "options": ["A. impair", "B. enhance", "C. sharpen", "D. restore"], "answer": "A", "analysis": "impair 意为‘损害’，长期缺眠损害日间专注力，符合常识。enhance 增强、sharpen 使敏锐、restore 恢复均为正面，与缺眠危害相反。"}, {"id": "c6-c-007", "level": "CET6", "type": "完形", "topic": "文化", "stem": "The mural ___ the city's history from its founding to the present day.", "options": ["A. depicts", "B. conceals", "C. contradicts", "D. erases"], "answer": "A", "analysis": "depicts 意为‘描绘’，壁画描绘城市历史合乎情理。conceals 隐藏、contradicts 矛盾、erases 抹去都与壁画记录历史的功能相悖。"}, {"id": "c6-c-008", "level": "CET6", "type": "完形", "topic": "社会", "stem": "The witness gave a ___ account of the event, leaving no room for doubt.", "options": ["A. credible", "B. dubious", "C. fictitious", "D. erratic"], "answer": "A", "analysis": "credible 意为‘可信的’，证言可信故无可怀疑，逻辑一致。dubious 可疑、fictitious 虚构、erratic 反复无常均会留下疑点，与‘no room for doubt’矛盾。"}, {"id": "c6-c-009", "level": "CET6", "type": "完形", "topic": "科技", "stem": "Engineers designed the device to ___ extreme temperatures without malfunctioning.", "options": ["A. withstand", "B. succumb to", "C. amplify", "D. provoke"], "answer": "A", "analysis": "withstand 意为‘承受、抵御’，设备设计用于承受极端温度而不故障，语义恰当。succumb to 屈服于会出故障；amplify 放大、provoke 引发温度均不合逻辑。"}, {"id": "c6-c-010", "level": "CET6", "type": "完形", "topic": "经济", "stem": "The merger will ___ the company's global reach and reduce redundant costs.", "options": ["A. expand", "B. shrink", "C. constrain", "D. limit"], "answer": "A", "analysis": "expand 意为‘扩大’，合并扩大全球覆盖并减少冗余成本，属典型协同效应。shrink 缩小、constrain 限制、limit 限定均为收缩，与合并的扩张意图相反。"}, {"id": "c6-t-001", "level": "CET6", "type": "翻译", "topic": "社会", "stem": "随着城市化进程加快，越来越多的年轻人选择在大城市定居，但同时也面临着高昂的生活成本。", "answer": "With the acceleration of urbanization, a growing number of young people choose to settle in big cities, yet they also face high living costs.", "analysis": "结构用 With + 名词化短语作伴随状语；‘城市化进程加快’译为 the acceleration of urbanization 比直译更地道。关键词：acceleration（加快）、settle（定居）、living costs（生活成本）。注意 yet 表转折连接前后分句。"}, {"id": "c6-t-002", "level": "CET6", "type": "翻译", "topic": "环境", "stem": "只有采取紧急的全球行动，我们才能有效应对气候变化带来的挑战。", "answer": "Only by taking urgent global action can we effectively address the challenges posed by climate change.", "analysis": "‘只有…才’用 Only by + 动名词 置于句首，主句须部分倒装 can we。关键词：urgent（紧急的）、address（应对）、pose（带来）。注意 address 比 deal with 更正式书面，符合六级语体。"}, {"id": "c6-t-003", "level": "CET6", "type": "翻译", "topic": "教育", "stem": "研究表明，批判性思维能力的培养比单纯的知识记忆更为重要。", "answer": "Research shows that cultivating critical thinking skills is more important than mere memorization of knowledge.", "analysis": "‘研究表明’用 Research shows that 从句；‘培养…能力’译为 cultivating ... skills 动名词作主语。关键词：cultivate（培养）、critical thinking（批判性思维）、memorization（记忆）。比较级 more important than 连接两主语。"}, {"id": "c6-t-004", "level": "CET6", "type": "翻译", "topic": "科技", "stem": "人工智能的迅速发展正在深刻改变各行各业的生产方式。", "answer": "The rapid development of artificial intelligence is profoundly transforming the way industries operate.", "analysis": "‘迅速发展’译 the rapid development of；‘深刻改变’用 profoundly transforming 体现程度。关键词：profoundly（深刻地）、transform（改变）、operate（运作）。注意‘各行各业的生产方式’处理为 the way industries operate 简洁达意。"}, {"id": "c6-t-005", "level": "CET6", "type": "翻译", "topic": "经济", "stem": "尽管面临诸多困难，这家初创公司依然实现了稳步增长。", "answer": "Despite numerous difficulties, the startup has still achieved steady growth.", "analysis": "‘尽管’用 Despite + 名词短语，比 Although 从句更紧凑；‘初创公司’译 startup。关键词：numerous（诸多的）、steady（稳步的）、achieve（实现）。注意主句用现在完成时 has achieved 强调对现在的影响。"}, {"id": "c6-l-001", "level": "CET6", "type": "听力", "topic": "社会", "stem": "Transcript: M: Did you hear the city council approved the new bike lane project? W: Yes, but only after months of debate. They finally agreed to fund half of it, the rest comes from a national grant. \nQuestion: How will the bike lane project be funded?", "options": ["A. Entirely by the city council.", "B. Half by the city, half by a national grant.", "C. Entirely by a national grant.", "D. By private donations only."], "answer": "B", "analysis": "对话明确说市议会出资一半，其余来自国家补助（national grant），即 B。A、C 说‘全部’与半数矛盾；D 私人捐款未提及。"}, {"id": "c6-l-002", "level": "CET6", "type": "听力", "topic": "教育", "stem": "Transcript: W: Professor, I missed the lecture on Monday. Is the quiz still on Friday? M: Yes, but I'll post the slides tonight so you can catch up. The quiz covers chapters three and four. \nQuestion: What will the professor do to help the student?", "options": ["A. Cancel the Friday quiz.", "B. Post the lecture slides online.", "C. Give a private lecture.", "D. Extend the deadline."], "answer": "B", "analysis": "教授说今晚会把幻灯片发上网供其补学，即 B。A 与‘测验照常周五’相反；C、D 私人补课与延期的说法对话中均未出现。"}, {"id": "c6-l-003", "level": "CET6", "type": "听力", "topic": "健康", "stem": "Transcript: M: You look exhausted. W: I've been working night shifts for two weeks. My doctor says I need to reset my sleep schedule or I'll burn out. \nQuestion: What does the woman's doctor advise?", "options": ["A. Quit the night shifts immediately.", "B. Reset her sleep schedule.", "C. Take more night shifts.", "D. Ignore the exhaustion."], "answer": "B", "analysis": "医生明确建议重置作息（reset my sleep schedule）否则会透支，即 B。A‘立即辞职’过度；C、D 与建议相反。"}, {"id": "c6-l-004", "level": "CET6", "type": "听力", "topic": "经济", "stem": "Transcript: W: The stock dropped 8% after the earnings report. M: Yeah, investors expected higher revenue. The CEO promised cost cuts to recover confidence. \nQuestion: Why did the stock drop according to the man?", "options": ["A. The CEO resigned.", "B. Investors expected higher revenue.", "C. Costs were cut too fast.", "D. Earnings beat expectations."], "answer": "B", "analysis": "男士说投资者本预期更高营收，故股价下跌，即 B。A 辞职未提；C 成本是 CEO 承诺要削减以恢复信心，非下跌原因；D 与‘不及预期’相反。"}, {"id": "c6-l-005", "level": "CET6", "type": "听力", "topic": "科技", "stem": "Transcript: M: The new app uses facial recognition to unlock your phone. W: Convenient, but I worry about privacy. M: They say data stays on the device, never uploaded. \nQuestion: What reassures the woman about privacy?", "options": ["A. The app is free.", "B. Data stays on the device, not uploaded.", "C. Facial recognition is disabled.", "D. The company deletes all data."], "answer": "B", "analysis": "男士说数据只留在本机、从不上传，这缓解了女士对隐私的担忧，即 B。A 免费未提；C 人脸识别并未关闭而是用于解锁；D‘公司删除数据’与‘留在本机’不符。"}, {"id": "ie-r-001", "level": "IELTS", "type": "阅读", "topic": "环境", "stem": "Passage excerpt: 'The government introduced a carbon tax in 2019, and emissions fell by 12% within two years.' According to the passage, the carbon tax was introduced before 2020. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "A", "analysis": "原文明确说明碳税于2019年推出，2019年早于2020年，因此陈述与文意一致，选 TRUE。FALSE 用于文意相反的情况，此处并无相反信息；NOT GIVEN 用于文中未提及，而本句时间点可直接推断，故不选。"}, {"id": "ie-r-002", "level": "IELTS", "type": "阅读", "topic": "环境", "stem": "Passage excerpt: 'Solar panels have become cheaper, yet their adoption in rural areas remains limited by maintenance costs.' According to the passage, solar panels are now too expensive for most households. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "B", "analysis": "原文指出太阳能板已变得更便宜（cheaper），并说明农村推广受限的原因是维护成本而非购置价格，因此‘太贵’与文意相反，选 FALSE。TRUE 与 cheaper 矛盾；NOT GIVEN 不适用，因为文中对价格有明确相反表述。"}, {"id": "ie-r-003", "level": "IELTS", "type": "阅读", "topic": "科技", "stem": "Passage excerpt: 'Researchers developed a new battery that charges in seconds.' According to the passage, the new battery will be available to consumers next year. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "C", "analysis": "原文只说明研究者开发出秒充电池，并未提及上市时间或明年是否会面向消费者，因此选 NOT GIVEN。TRUE/FALSE 都要求文中有明确或可推断的肯定或相反信息，而此处属文中未提及的内容。"}, {"id": "ie-r-004", "level": "IELTS", "type": "阅读", "topic": "健康", "stem": "Passage excerpt: 'A 2021 study found that meditation reduced anxiety in 60% of participants.' According to the passage, meditation had no effect on the remaining 40% of participants. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "C", "analysis": "原文只说明60%的参与者焦虑减轻，并未交代其余40%是否‘无效果’，他们可能减轻不明显或效果未知，故选 NOT GIVEN。FALSE 需要文中明确否定该结论，而本句仅未说明，不能推断为相反。"}, {"id": "ie-r-005", "level": "IELTS", "type": "阅读", "topic": "教育", "stem": "Passage excerpt: 'The school replaced textbooks with tablets, and test scores improved by 8%.' According to the passage, the use of tablets caused the improvement in test scores. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "C", "analysis": "原文提到换用平板后成绩提升8%，但仅呈现时间先后，并未证明因果关系，因此‘导致’属于过度推断，选 NOT GIVEN。TRUE 需文中明确归因，FALSE 需明确否定因果，二者均缺乏依据。"}, {"id": "ie-r-006", "level": "IELTS", "type": "阅读", "topic": "经济", "stem": "Passage excerpt: 'Inflation reached 9% in 2022, the highest in four decades.' According to the passage, inflation in 2022 was higher than in any year since 1982. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "A", "analysis": "原文称2022年通胀率达9%，为40年来最高；40年前即约1982年，故可推断其高于1982年以来任何一年，选 TRUE。FALSE 与‘最高’矛盾；NOT GIVEN 不成立，因为时间范围可合理推断。"}, {"id": "ie-r-007", "level": "IELTS", "type": "阅读", "topic": "社会", "stem": "Passage excerpt: 'Urban populations grew, but public transport investment stayed flat.' According to the passage, investment in public transport kept pace with population growth. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "B", "analysis": "原文指出人口在增长而公共交通投资‘持平（stayed flat）’，明确否定了投资跟上人口增长的说法，选 FALSE。TRUE 与 stayed flat 直接矛盾；NOT GIVEN 不适用，因为二者对比关系清晰。"}, {"id": "ie-r-008", "level": "IELTS", "type": "阅读", "topic": "文化", "stem": "Passage excerpt: 'The festival dates back to the 15th century and attracts visitors worldwide.' According to the passage, the festival was first held in the 16th century. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "B", "analysis": "原文明确说明节日起源于15世纪，因此‘首次于16世纪举办’与文意相反，选 FALSE。TRUE 与 dates back to the 15th century 矛盾；NOT GIVEN 不成立，因为有明确的相反时间信息。"}, {"id": "ie-r-009", "level": "IELTS", "type": "阅读", "topic": "环境", "stem": "Passage excerpt: 'Recycling rates in the city rose from 20% to 45% between 2010 and 2020.' According to the passage, the city recycled nearly half of its waste by 2020. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "A", "analysis": "原文说明2020年回收率达45%，‘nearly half（接近一半）’与45%相符，选 TRUE。FALSE 与数据矛盾；NOT GIVEN 不成立，因为45%可直接对应‘近一半’的表述。"}, {"id": "ie-r-010", "level": "IELTS", "type": "阅读", "topic": "科技", "stem": "Passage excerpt: 'The algorithm was trained on 10 million images but performed poorly on rare objects.' According to the passage, the algorithm works perfectly on all image types. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "B", "analysis": "原文称算法在罕见物体上表现不佳（performed poorly），直接否定了‘对所有图像类型都完美’的说法，选 FALSE。TRUE 与 poorly 矛盾；NOT GIVEN 不适用，因为有明确相反证据。"}, {"id": "ie-r-011", "level": "IELTS", "type": "阅读", "topic": "媒体", "stem": "Passage excerpt: 'News consumption shifted from print to social media among younger readers.' According to the passage, older readers also abandoned print entirely. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "C", "analysis": "原文只说明年轻读者从纸媒转向社交媒体，并未提及老年读者是否‘完全放弃’纸媒，故选 NOT GIVEN。TRUE/FALSE 都缺乏文中依据，不能由年轻群体的行为推断老年群体。"}, {"id": "ie-r-012", "level": "IELTS", "type": "阅读", "topic": "健康", "stem": "Passage excerpt: 'The vaccine was 90% effective in clinical trials conducted in 2020.' According to the passage, the vaccine was less than 90% effective in real-world use. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "C", "analysis": "原文仅给出临床试验中90%的有效率，未提及真实世界使用中的有效率，因此‘低于90%’属文中未提及，选 NOT GIVEN。TRUE/FALSE 需文中对真实世界效果有明确或相反说明，此处缺失。"}, {"id": "ie-r-013", "level": "IELTS", "type": "阅读", "topic": "经济", "stem": "Passage excerpt: 'The company's profits doubled after it entered the Asian market in 2018.' According to the passage, entering the Asian market was the sole reason for the profit increase. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "C", "analysis": "原文陈述进入亚洲市场后利润翻倍，但未说明这是‘唯一原因’，可能还有成本下降等因素，故选 NOT GIVEN。TRUE 需明确归因于唯一因素；FALSE 需明确否定唯一性，二者均无依据。"}, {"id": "ie-r-014", "level": "IELTS", "type": "阅读", "topic": "社会", "stem": "Passage excerpt: 'Homelessness increased by 15% despite a growing economy.' According to the passage, the growing economy eliminated homelessness. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "B", "analysis": "原文明确指出无家可归者增加15%，直接否定了‘经济增长消除了无家可归现象’的说法，选 FALSE。TRUE 与 increased by 15% 完全矛盾；NOT GIVEN 不成立，因为有明确相反信息。"}, {"id": "ie-r-015", "level": "IELTS", "type": "阅读", "topic": "教育", "stem": "Passage excerpt: 'Bilingual children outperformed monolingual peers in cognitive flexibility tests.' According to the passage, bilingual children scored lower in all academic subjects. (TRUE / FALSE / NOT GIVEN)", "options": ["A. TRUE", "B. FALSE", "C. NOT GIVEN"], "answer": "C", "analysis": "原文仅说明双语儿童在认知灵活性测试中表现更好，并未涉及‘所有学科成绩更低’，二者话题不同，故选 NOT GIVEN。FALSE 看似合理，但文中未对学科成绩做相反陈述，不能据此推断。"}, {"id": "ie-r-016", "level": "IELTS", "type": "阅读", "topic": "环境", "stem": "Passage excerpt: 'The Amazon stores around 100 billion tonnes of carbon. Deforestation now removes roughly 1 billion tonnes annually.' What is the main consequence of continued deforestation mentioned in the passage?", "options": ["A. Increased rainfall in the region", "B. A gradual release of stored carbon into the atmosphere", "C. Faster regrowth of native species", "D. Lower global food prices"], "answer": "B", "analysis": "文中指出雨林储存巨量碳且砍伐每年释放约10亿吨，因此持续砍伐的主要后果是储存的碳逐步释放到大气中，选 B。A 与雨林调节降水的作用相悖；C 与森林减少相反；D 文中未提及，属无关干扰项。"}, {"id": "ie-r-017", "level": "IELTS", "type": "阅读", "topic": "科技", "stem": "Passage excerpt: 'Quantum computers excel at optimization problems but remain error-prone. Researchers hope error correction will mature by 2030.' The writer's attitude toward quantum computing is best described as:", "options": ["A. wholly dismissive", "B. cautiously optimistic", "C. openly hostile", "D. completely indifferent"], "answer": "B", "analysis": "文中既指出量子计算机的优势也承认其易出错，并期待纠错技术成熟，体现‘谨慎乐观’的态度，选 B。A 和 C 与承认优势相矛盾；D 与‘研究者希望’的积极期待不符。"}, {"id": "ie-r-018", "level": "IELTS", "type": "阅读", "topic": "教育", "stem": "Passage excerpt: 'Finland's education system emphasizes play and reduces standardized testing. Students still rank among the top globally.' Which factor does the passage credit for student success?", "options": ["A. Extensive homework and tutoring", "B. A play-based approach with less testing", "C. Strict discipline and long school days", "D. Private funding of public schools"], "answer": "B", "analysis": "文中强调芬兰以游戏化教学并减少标准化考试，同时学生排名仍居前列，因此把成功归因于‘以玩为主、减少考试’的模式，选 B。A、C 与减少考试/强调玩相悖；D 文中未提及。"}, {"id": "ie-r-019", "level": "IELTS", "type": "阅读", "topic": "经济", "stem": "Passage excerpt: 'Remote work cut office costs but widened regional inequality as talent concentrated in big cities.' The passage suggests that remote work:", "options": ["A. eliminated all regional economic gaps", "B. reduced costs while increasing inequality", "C. mainly benefited rural areas", "D. ended the need for offices completely"], "answer": "B", "analysis": "文中明确说远程办公降低了办公成本却加剧了地区不平等，选 B。A 与‘widened inequality’相反；C 与人才集中于大城市相悖；D 中‘完全不需要办公室’过于绝对，文中仅说成本下降。"}, {"id": "ie-r-020", "level": "IELTS", "type": "阅读", "topic": "健康", "stem": "Passage excerpt: 'Sitting for over eight hours daily raises cardiovascular risk, yet standing desks alone do not reverse it.' According to the passage, standing desks:", "options": ["A. fully eliminate heart disease risk", "B. are insufficient by themselves to reverse the risk", "C. cause more harm than sitting", "D. are recommended only for athletes"], "answer": "B", "analysis": "文中明确指出仅靠站立办公桌无法逆转久坐风险，选 B。A 与‘do not reverse it’矛盾；C 文中未比较危害大小；D 无依据，文中未限定使用人群。"}, {"id": "ie-r-021", "level": "IELTS", "type": "阅读", "topic": "社会", "stem": "Passage excerpt: 'The gig economy offers flexibility but leaves workers without benefits or stability.' The author primarily views the gig economy as:", "options": ["A. an unmixed blessing", "B. a trade-off between freedom and security", "C. a failure that should be banned", "D. identical to traditional employment"], "answer": "B", "analysis": "文中既肯定灵活性又指出缺乏保障与稳定，体现‘自由与保障之间的权衡’，选 B。A 与指出弊端矛盾；C 文中未主张禁止；D 与‘缺乏福利’的差别相悖。"}, {"id": "ie-r-022", "level": "IELTS", "type": "阅读", "topic": "文化", "stem": "Passage excerpt: 'Museums are digitizing collections, reaching audiences who never visited physically.' The main benefit of digitization described is:", "options": ["A. higher ticket revenue", "B. broader public access", "C. fewer staff needed", "D. permanent closure of buildings"], "answer": "B", "analysis": "文中说数字化让从未实地参观的观众也能接触藏品，主要好处是‘扩大公众可及性’，选 B。A 文中未提票价收入；C、D 均属无依据推断，文中未说裁员或闭馆。"}, {"id": "ie-r-023", "level": "IELTS", "type": "阅读", "topic": "媒体", "stem": "Passage excerpt: 'Algorithms prioritize engaging content, sometimes spreading misinformation faster than facts.' The passage implies that algorithms:", "options": ["A. always promote accurate news", "B. can amplify false information", "C. are controlled by governments", "D. have no effect on readers"], "answer": "B", "analysis": "文中说明算法优先推送引人互动的内容，有时让虚假信息比事实传播更快，即‘可能放大错误信息’，选 B。A 与‘spreading misinformation’矛盾；C、D 文中均无依据。"}, {"id": "ie-r-024", "level": "IELTS", "type": "阅读", "topic": "科技", "stem": "Passage excerpt: 'Electric vehicles reduce local emissions but depend on batteries whose mining harms ecosystems.' The passage presents EVs as:", "options": ["A. entirely harmless", "B. beneficial locally yet environmentally costly to produce", "C. worse than petrol cars overall", "D. illegal in most countries"], "answer": "B", "analysis": "文中指出电动车减少本地排放但电池采矿危害生态，即‘本地有益、生产环境代价高’，选 B。A 与采矿危害矛盾；C 文中未做整体优劣判断；D 无依据。"}, {"id": "ie-r-025", "level": "IELTS", "type": "阅读", "topic": "环境", "stem": "Passage excerpt: 'Cities planting trees lowered summer temperatures by up to 4°C in pilot districts.' The passage concludes that urban trees:", "options": ["A. are purely decorative", "B. can meaningfully reduce urban heat", "C. increase energy use", "D. harm air quality"], "answer": "B", "analysis": "文中用试点数据说明植树使夏季气温最多降低4°C，即‘能显著缓解城市热岛’，选 B。A 与降温功能矛盾；C、D 均与文中益处相反或无依据。"}, {"id": "ie-r-026", "level": "IELTS", "type": "阅读", "topic": "环境", "stem": "Which paragraph heading best matches Paragraph A, which discusses how melting ice alters ocean currents? (Heading match)", "options": ["i. The disruption of marine circulation", "ii. Economic benefits of tourism", "iii. Historical fishing methods", "iv. Urban transport reform", "v. The rise of renewable energy"], "answer": "i", "analysis": "段落A讲述融冰改变洋流，与标题i‘海洋环流的中断’直接对应，选 i。ii、iii 属旅游与渔业历史，话题无关；iv、v 涉及城市交通与可再生能源，均不匹配融冰改洋流的内容。"}, {"id": "ie-r-027", "level": "IELTS", "type": "阅读", "topic": "科技", "stem": "Which paragraph heading best matches Paragraph B, which explains the principle of machine learning through data patterns? (Heading match)", "options": ["i. The history of printing", "ii. Learning from patterns in data", "iii. The decline of agriculture", "iv. Classical music theory", "v. Space exploration milestones"], "answer": "ii", "analysis": "段落B解释机器学习通过数据模式运作，与标题ii‘从数据模式中学习’一致，选 ii。i、iii、iv、v 分别涉及印刷、农业、音乐、航天，均与机器学习原理无关。"}, {"id": "ie-r-028", "level": "IELTS", "type": "阅读", "topic": "社会", "stem": "Which paragraph heading best matches Paragraph C, which describes rising loneliness among city dwellers? (Heading match)", "options": ["i. The growth of suburban malls", "ii. Declining social isolation in villages", "iii. Urban solitude on the increase", "iv. The revival of crafts", "v. Global trade agreements"], "answer": "iii", "analysis": "段落C描述城市居民孤独感上升，与标题iii‘城市孤独感增加’对应，选 iii。ii 方向相反（说农村隔离下降）；i、iv、v 涉及商场、手工艺、贸易，均不匹配。"}, {"id": "ie-r-029", "level": "IELTS", "type": "阅读", "topic": "经济", "stem": "Which paragraph heading best matches Paragraph D, which argues that automation threatens mid-skill jobs? (Heading match)", "options": ["i. The future of high-skill roles", "ii. Threats to middle-tier employment", "iii. The cost of higher education", "iv. Agricultural subsidies", "v. The origin of money"], "answer": "ii", "analysis": "段落D论述自动化威胁中等技能岗位，与标题ii‘对中层级就业的威胁’相符，选 ii。i 谈高技能岗位，方向不同；iii、iv、v 涉及教育成本、农业补贴、货币起源，均无关。"}, {"id": "ie-r-030", "level": "IELTS", "type": "阅读", "topic": "健康", "stem": "Which paragraph heading best matches Paragraph E, which reviews studies linking sleep loss to poor memory? (Heading match)", "options": ["i. Benefits of daytime naps", "ii. Memory impairment from insufficient sleep", "iii. The popularity of gyms", "iv. Vegetarian diets", "v. Airport security changes"], "answer": "ii", "analysis": "段落E综述睡眠不足与记忆力差的研究，与标题ii‘睡眠不足导致记忆受损’对应，选 ii。i 谈午睡好处，文中未涉及；iii、iv、v 涉及健身房、素食、机场安检，均不匹配。"}, {"id": "ie-v-001", "level": "IELTS", "type": "词汇", "topic": "环境", "stem": "Choose the word that best replaces 'mitigate' in: 'Policies aim to mitigate the effects of climate change.'", "options": ["A. worsen", "B. alleviate", "C. ignore", "D. exaggerate"], "answer": "B", "analysis": "mitigate 意为‘减轻、缓解’，与 alleviate 同义，选 B。A worsen（恶化）为反义；C ignore（忽视）和 D exaggerate（夸大）均不符合‘缓解影响’的语境。"}, {"id": "ie-v-002", "level": "IELTS", "type": "词汇", "topic": "教育", "stem": "Choose the synonym of 'comprehensive' in: 'The report gave a comprehensive overview of the system.'", "options": ["A. brief", "B. thorough", "C. biased", "D. optional"], "answer": "B", "analysis": "comprehensive 意为‘全面的、详尽的’，与 thorough 同义，选 B。A brief（简短）为反义；C biased（有偏见的）和 D optional（可选的）均不表达‘全面’之意。"}, {"id": "ie-v-003", "level": "IELTS", "type": "词汇", "topic": "科技", "stem": "The new software is highly _____, adapting to each user's behavior. Which word fits?", "options": ["A. rigid", "B. sophisticated", "C. obsolete", "D. random"], "answer": "B", "analysis": "句意为软件能适应用户行为，sophisticated（精密的、复杂的）符合‘高度智能化’语境，选 B。A rigid（死板的）与 adapt 矛盾；C obsolete（过时的）和 D random（随机的）均不符。"}, {"id": "ie-v-004", "level": "IELTS", "type": "词汇", "topic": "经济", "stem": "Choose the correct meaning of 'volatile' in: 'The stock market remained volatile throughout the year.'", "options": ["A. stable", "B. unpredictable", "C. profitable", "D. regulated"], "answer": "B", "analysis": "volatile 意为‘波动剧烈、易变的’，与 unpredictable（不可预测的）相符，选 B。A stable（稳定）为反义；C profitable（盈利的）和 D regulated（受监管的）不是 volatile 的含义。"}, {"id": "ie-v-005", "level": "IELTS", "type": "词汇", "topic": "社会", "stem": "Which word best completes: 'The reform aimed to _____ the gap between rich and poor.'", "options": ["A. widen", "B. narrow", "C. conceal", "D. celebrate"], "answer": "B", "analysis": "改革的目标是缩小贫富差距，narrow the gap 为固定搭配‘缩小差距’，选 B。A widen（扩大）与改革目的相反；C conceal（掩盖）和 D celebrate（庆祝）不合逻辑。"}, {"id": "ie-v-006", "level": "IELTS", "type": "词汇", "topic": "健康", "stem": "Choose the word closest in meaning to 'detrimental': 'Smoking has detrimental effects on health.'", "options": ["A. beneficial", "B. harmful", "C. neutral", "D. temporary"], "answer": "B", "analysis": "detrimental 意为‘有害的’，与 harmful 同义，选 B。A beneficial（有益的）为反义；C neutral（中性的）和 D temporary（暂时的）均不表达‘有害’。"}, {"id": "ie-v-007", "level": "IELTS", "type": "词汇", "topic": "文化", "stem": "The festival is a _____ tradition passed down for centuries. Which fits?", "options": ["A. fleeting", "B. enduring", "C. fictional", "D. recent"], "answer": "B", "analysis": "句意为传承数世纪的传统，enduring（持久的）符合‘延续至今’之意，选 B。A fleeting（短暂的）和 D recent（最近的）与‘数世纪’矛盾；C fictional（虚构的）不符合真实传承。"}, {"id": "ie-v-008", "level": "IELTS", "type": "词汇", "topic": "媒体", "stem": "Choose the synonym of 'scrutinize' in: 'Journalists scrutinize official statements carefully.'", "options": ["A. ignore", "B. examine", "C. publish", "D. fabricate"], "answer": "B", "analysis": "scrutinize 意为‘仔细审查、审视’，与 examine 同义，选 B。A ignore（忽视）为反义；C publish（发布）和 D fabricate（捏造）均非‘审查’之意。"}, {"id": "ie-v-009", "level": "IELTS", "type": "词汇", "topic": "科技", "stem": "The device is _____ to water damage and must be kept dry. Which word fits?", "options": ["A. immune", "B. vulnerable", "C. indifferent", "D. superior"], "answer": "B", "analysis": "句意为设备怕水需保持干燥，vulnerable（易受伤害的）符合‘易受水损’之意，选 B。A immune（免疫的）与需防潮矛盾；C indifferent（冷漠的）和 D superior（优越的）均不表‘易受损’。"}, {"id": "ie-v-010", "level": "IELTS", "type": "词汇", "topic": "环境", "stem": "Choose the correct meaning of 'sustainable' in: 'We need sustainable sources of energy.'", "options": ["A. cheap", "B. able to continue long-term", "C. dangerous", "D. imported"], "answer": "B", "analysis": "sustainable 意为‘可持续的、能长期维持的’，与 able to continue long-term 相符，选 B。A cheap（便宜）、C dangerous（危险）、D imported（进口的）均非其含义。"}, {"id": "ie-v-011", "level": "IELTS", "type": "词汇", "topic": "经济", "stem": "The company's profits _____ after the product launch. Which word best fits if profits rose sharply?", "options": ["A. plummeted", "B. soared", "C. stagnated", "D. vanished"], "answer": "B", "analysis": "若利润急剧上升，soared（飙升）最贴切，选 B。A plummeted（骤降）为反义；C stagnated（停滞）和 D vanished（消失）均表示无增长，与‘上升’矛盾。"}, {"id": "ie-v-012", "level": "IELTS", "type": "词汇", "topic": "社会", "stem": "Choose the synonym of 'marginalized' in: 'The policy helps marginalized communities.'", "options": ["A. empowered", "B. excluded", "C. wealthy", "D. urban"], "answer": "B", "analysis": "marginalized 意为‘被边缘化的、被排斥的’，与 excluded 同义，选 B。A empowered（被赋权的）为反义；C wealthy（富裕的）和 D urban（城市的）并非其含义。"}, {"id": "ie-v-013", "level": "IELTS", "type": "词汇", "topic": "教育", "stem": "A good essay should be _____, with each paragraph supporting the main argument. Which fits?", "options": ["A. coherent", "B. chaotic", "C. redundant", "D. ambiguous"], "answer": "A", "analysis": "好文章应条理清晰、各段支撑主旨，coherent（连贯的）符合，选 A。B chaotic（混乱的）、C redundant（冗余的）、D ambiguous（含糊的）均为负面特征，与‘好文章’矛盾。"}, {"id": "ie-v-014", "level": "IELTS", "type": "词汇", "topic": "健康", "stem": "Choose the word that best replaces 'requisite' in: 'Sleep is requisite for recovery.'", "options": ["A. unnecessary", "B. essential", "C. optional", "D. harmful"], "answer": "B", "analysis": "requisite 意为‘必需的’，与 essential 同义，选 B。A unnecessary（不必要的）和 C optional（可选的）为反义；D harmful（有害的）不符合‘恢复所需’语境。"}, {"id": "ie-v-015", "level": "IELTS", "type": "词汇", "topic": "媒体", "stem": "The article was _____, presenting both sides of the debate fairly. Which fits?", "options": ["A. biased", "B. balanced", "C. sensational", "D. deceptive"], "answer": "B", "analysis": "句意为文章公平呈现双方观点，balanced（平衡的）符合，选 B。A biased（有偏见的）、C sensational（煽情的）、D deceptive（欺骗的）均为不公平或负面特征，与‘fairly’矛盾。"}, {"id": "ie-g-001", "level": "IELTS", "type": "语法", "topic": "教育", "stem": "Choose the grammatically correct sentence:", "options": ["A. Each of the students have a book.", "B. Each of the students has a book.", "C. Each of the students having a book.", "D. Each of the students is having a book."], "answer": "B", "analysis": "each of + 复数名词作主语时谓语用单数 has，选 B。A 误用 have；C 缺少谓语动词；D is having 不用于拥有类状态动词，且 each 仍需单数，但 having 在此不恰当。"}, {"id": "ie-g-002", "level": "IELTS", "type": "语法", "topic": "环境", "stem": "Fill the blank: 'If the temperature _____, sea levels will rise.'", "options": ["A. rise", "B. rises", "C. rose", "D. will rise"], "answer": "B", "analysis": "在真实条件句（if + 一般现在时，主句将来时）中，if 从句用一般现在时 rises，选 B。A rise 主语为单数需加 -s；C rose 为过去式，用于虚拟；D will rise 不能用于 if 条件从句。"}, {"id": "ie-g-003", "level": "IELTS", "type": "语法", "topic": "科技", "stem": "Choose the correct passive form: 'The software _____ by the team last year.'", "options": ["A. develops", "B. developed", "C. was developed", "D. has develop"], "answer": "C", "analysis": "句中有 last year 表过去，且主语 software 为受动者，需用一般过去时被动 was developed，选 C。A develops 主动现在时；B developed 主动过去时；D has develop 形式错误。"}, {"id": "ie-g-004", "level": "IELTS", "type": "语法", "topic": "社会", "stem": "Which sentence uses the present perfect correctly?", "options": ["A. I live here since 2010.", "B. I have lived here since 2010.", "C. I lived here since 2010.", "D. I am living here since 2010."], "answer": "B", "analysis": "since + 过去时间点需用现在完成时 have lived，选 B。A live 为一般现在时不能与 since 连用；C lived 为过去时；D am living 进行时不搭配 since 表持续。"}, {"id": "ie-g-005", "level": "IELTS", "type": "语法", "topic": "经济", "stem": "Choose the correct comparative: 'This year's growth is _____ than last year's.'", "options": ["A. more strong", "B. stronger", "C. strong", "D. most strong"], "answer": "B", "analysis": "strong 为单音节形容词，比较级直接加 -er 为 stronger，选 B。A more strong 形式错误（应为 stronger）；C strong 是原级；D most strong 最高级形式错误。"}, {"id": "ie-g-006", "level": "IELTS", "type": "语法", "topic": "健康", "stem": "Choose the correct article usage: '_____ elderly need more social support.'", "options": ["A. A", "B. An", "C. The", "D. No article"], "answer": "C", "analysis": "the + 形容词（the elderly）表一类人‘老年人’，需用定冠词 The，选 C。A、B 为不定冠词，不能用于类指；D 缺冠词则语法错误。"}, {"id": "ie-g-007", "level": "IELTS", "type": "语法", "topic": "文化", "stem": "Choose the correct relative clause: 'The museum _____ we visited is famous.'", "options": ["A. which", "B. who", "C. whose", "D. what"], "answer": "A", "analysis": "先行词 museum 为物，且在从句中作 visited 的宾语，用 which（或 that），选 A。B who 用于人；C whose 表所属；D what 不引导限定性定语从句。"}, {"id": "ie-g-008", "level": "IELTS", "type": "语法", "topic": "媒体", "stem": "Choose the correct preposition: 'She is interested _____ environmental issues.'", "options": ["A. on", "B. at", "C. in", "D. for"], "answer": "C", "analysis": "固定搭配 be interested in 表‘对……感兴趣’，选 C。A on、B at、D for 均不与 interested 构成正确搭配。"}, {"id": "ie-g-009", "level": "IELTS", "type": "语法", "topic": "科技", "stem": "Choose the correct modal for speculation about the past: 'They _____ missed the train; it left on time.'", "options": ["A. must have", "B. can't have", "C. should have", "D. will have"], "answer": "B", "analysis": "后句说火车准点出发，可推断‘他们不可能错过’，用 can't have + 过去分词表对过去的否定推测，选 B。A must have 表肯定推测，与语境相反；C should have 表本应；D will have 不用于此推测。"}, {"id": "ie-g-010", "level": "IELTS", "type": "语法", "topic": "环境", "stem": "Choose the correct parallel structure: 'The policy aims to reduce waste and _____ emissions.'", "options": ["A. lowering", "B. to lower", "C. lower", "D. lowered"], "answer": "B", "analysis": "并列结构应与 to reduce 保持一致，用 to lower（aims to reduce ... and to lower ...），选 B。A lowering 破坏平行；C、D 形式不对应前面的 to 不定式。"}, {"id": "ie-w-001", "level": "IELTS", "type": "写作", "topic": "社会", "stem": "Some people believe that governments should invest more in public transport than in roads. To what extent do you agree or disagree? (Task 2)", "answer": "Thesis: Governments should prioritise public transport investment because it reduces congestion and emissions more efficiently. Body 1: Public transport moves more people per kilometre, cutting traffic and pollution. Body 2: Road expansion induces demand and encourages car use, worsening sustainability. Counter: Roads remain vital for freight and rural access, so a balanced mix is needed. Conclusion: A shift toward public transport is justified, not an outright abandonment of roads.", "analysis": "评分要点：Task Response 需明确立场并兼顾反方（balanced mix），避免一边倒；Coherence 用主题句+解释+例证推进；Lexical 使用 prioritise / congestion / induce demand 等学术词；Grammar 展示定语从句与对比结构。四项均衡可达 Band 7+。"}, {"id": "ie-w-002", "level": "IELTS", "type": "写作", "topic": "科技", "stem": "Nowadays, more people work from home. Do the advantages outweigh the disadvantages? (Task 2)", "answer": "Thesis: The benefits of remote work outweigh drawbacks if supported by clear policies. Advantages: flexibility boosts productivity and cuts commuting emissions. Disadvantages: isolation and blurred boundaries harm well-being and teamwork. Solution: hybrid models and virtual collaboration tools mitigate the downsides. Conclusion: With safeguards, remote work is net positive.", "analysis": "评分要点：Task Response 须衡量双方并给出结论（outweigh）；Coherence 用利弊对照段落；Lexical 体现 blurred boundaries / hybrid models 等；Grammar 使用条件句与比较级。注意避免只列点不展开，每点需解释与结果。"}, {"id": "ie-w-003", "level": "IELTS", "type": "写作", "topic": "教育", "stem": "Universities should focus on career preparation rather than academic knowledge. Discuss both views and give your opinion. (Task 2)", "answer": "View 1: Career-focused courses improve employability and meet labour-market needs. View 2: Broad academic education fosters critical thinking and adaptability beyond one job. Opinion: A combination is ideal—core academics plus practical modules. Conclusion: Universities should integrate both rather than choose one.", "analysis": "评分要点：Task Response 必须讨论双方并表态；Coherence 用 View1/View2/Opinion 清晰分段；Lexical 用 employability / adaptability / integrate；Grammar 展示 rather than 与对比从句。双边讨论题型切忌只写一方。"}, {"id": "ie-w-004", "level": "IELTS", "type": "写作", "topic": "环境", "stem": "Individual action is useless in fighting climate change; only governments and corporations can help. To what extent do you agree? (Task 2)", "answer": "Thesis: I disagree that individual action is useless; it complements systemic change. Point 1: Collective consumer choices shift demand toward green products, pressuring corporations. Point 2: Individual advocacy influences policy and social norms. Concession: Systemic action is essential and larger in scale. Conclusion: Individual and institutional efforts are mutually reinforcing.", "analysis": "评分要点：Task Response 需反驳极端立场并承认制度作用（concession）；Coherence 用 Point/Concession 推进；Lexical 用 complement / mutually reinforcing / norms；Grammar 用让步从句。反驳型题目要部分肯定对方以显辩证。"}, {"id": "ie-w-005", "level": "IELTS", "type": "写作", "topic": "媒体", "stem": "Social media has damaged real-life communication skills among young people. To what extent do you agree or disagree? (Task 2)", "answer": "Thesis: Social media has mixed effects; it does not simply damage skills. Point 1: Heavy use can reduce face-to-face practice and deepen awkwardness. Point 2: It also builds written communication and global connections. Balanced view: Moderation and digital literacy education determine outcomes. Conclusion: Effects depend on usage, not the medium alone.", "analysis": "评分要点：Task Response 避免绝对化，给出 balanced view；Coherence 用 Point1/Point2/Balanced 分层；Lexical 用 face-to-face / digital literacy / medium；Grammar 用条件与对比结构。结论应回归‘使用方式决定结果’以体现批判思维。"}, {"id": "ie-l-001", "level": "IELTS", "type": "听力", "topic": "教育", "stem": "Listening script: 'The library will be closed for renovation from the 10th to the 17th of March.' When will the library reopen?", "options": ["A. March 9th", "B. March 10th", "C. March 17th", "D. March 18th"], "answer": "D", "analysis": "文中说图书馆3月10日至17日装修关闭，故17日之后、即18日重新开放，选 D。A、B 为关闭期内；C 17日仍是关闭最后一天，尚未开放。"}, {"id": "ie-l-002", "level": "IELTS", "type": "听力", "topic": "环境", "stem": "Listening script: 'We collected 200 samples, but only 150 were usable due to contamination.' How many samples were unusable?", "options": ["A. 50", "B. 150", "C. 200", "D. 350"], "answer": "A", "analysis": "共采集200份，可用150份，不可用为200−150=50份，选 A。B 是可用数；C 是总数；D 无依据。"}, {"id": "ie-l-003", "level": "IELTS", "type": "听力", "topic": "社会", "stem": "Listening script: 'The meeting was moved from Room 2 to Room 5 because of the conference.' Where is the meeting now?", "options": ["A. Room 2", "B. Room 5", "C. The conference hall", "D. Outside"], "answer": "B", "analysis": "说话人明确说会议从2室改到5室，故现在在 Room 5，选 B。A 是原地点；C 会议厅是改地点的原因而非会议地点；D 无依据。"}, {"id": "ie-l-004", "level": "IELTS", "type": "听力", "topic": "科技", "stem": "Listening script: 'The app update is free, but the premium version costs $9.99 per month.' How much is the premium version annually?", "options": ["A. $9.99", "B. $99.90", "C. $119.88", "D. Free"], "answer": "C", "analysis": "高级版每月$9.99，一年12个月共9.99×12=$119.88，选 C。A 是月费；B 是10个月错误计算；D 免费仅指基础更新，不含高级版。"}, {"id": "ie-l-005", "level": "IELTS", "type": "听力", "topic": "健康", "stem": "Listening script: 'Patients should take one tablet in the morning and two at night.' What is the daily total dosage?", "options": ["A. 1 tablet", "B. 2 tablets", "C. 3 tablets", "D. 4 tablets"], "answer": "C", "analysis": "早晨1片加晚上2片，每日共3片，选 C。A、B 仅算其中一次；D 无依据。"}, {"id": "ie-l-006", "level": "IELTS", "type": "听力", "topic": "经济", "stem": "Listening script: 'Sales rose 20% in Q1, then fell 5% in Q2.' Compared with the start of Q1, sales at end of Q2 are:", "options": ["A. 15% lower", "B. 25% higher", "C. 14% higher", "D. unchanged"], "answer": "C", "analysis": "先涨20%再降5%，净变化约为 1.20×0.95=1.14，即比Q1初高14%，选 C。A 误将两百分比相减；B 误将两百分比相加；D 明显错误。"}, {"id": "ie-l-007", "level": "IELTS", "type": "听力", "topic": "文化", "stem": "Listening script: 'The exhibition opens at 9 a.m. and the guided tour starts at 11 a.m.' When does the guided tour begin?", "options": ["A. 9 a.m.", "B. 10 a.m.", "C. 11 a.m.", "D. 2 p.m."], "answer": "C", "analysis": "说话人明确说导览11点开始，选 C。A 是展览开放时间；B、D 文中未提及。"}, {"id": "ie-l-008", "level": "IELTS", "type": "听力", "topic": "媒体", "stem": "Listening script: 'Submit your essay by Friday; late work will not be accepted.' What happens if you submit on Saturday?", "options": ["A. It receives a penalty", "B. It is not accepted", "C. It gets an extension", "D. It is graded normally"], "answer": "B", "analysis": "文中说周五后提交不予接受，周六属迟到故不被接受，选 B。A 惩罚、C 延期、D 正常评分均与‘will not be accepted’矛盾。"}, {"id": "ie-l-009", "level": "IELTS", "type": "听力", "topic": "环境", "stem": "Listening script: 'The train departs at 6:45 and the journey takes 90 minutes.' What time does it arrive?", "options": ["A. 7:15", "B. 7:45", "C. 8:15", "D. 8:45"], "answer": "C", "analysis": "6:45出发，行驶90分钟即1.5小时，到达时间为8:15，选 C。A、B 时间计算不足；D 多了半小时。"}, {"id": "ie-l-010", "level": "IELTS", "type": "听力", "topic": "教育", "stem": "Listening script: 'The course has 12 weeks, with a break in week 7.' How many weeks of teaching are there?", "options": ["A. 11 weeks", "B. 12 weeks", "C. 13 weeks", "D. 6 weeks"], "answer": "A", "analysis": "课程共12周但第7周为休息，实际教学周为12−1=11周，选 A。B 未扣除休息周；C 多算；D 仅算前半错误。"}, {"id": "x6-v-001", "level": "CET6", "type": "词汇", "topic": "环境", "stem": "The government plans to ___ the use of plastic bags in all supermarkets.", "options": ["A. abolish", "B. enhance", "C. maintain", "D. neglect"], "answer": "A", "analysis": "abolish 意为“废除、取消”，政府禁用塑料袋用 abolish 最贴切。enhance 表示“提升”，与限制使用相悖；maintain 指“维持现状”，neglect 指“忽视、疏于管理”，均不符合政策主动禁止的语境。"}, {"id": "x6-v-002", "level": "CET6", "type": "词汇", "topic": "教育", "stem": "Universities should ___ students' ability to think independently rather than memorize facts.", "options": ["A. cultivate", "B. abandon", "C. suppress", "D. postpone"], "answer": "A", "analysis": "cultivate 意为“培养”，与 ability to think independently 搭配自然。abandon 指“放弃”，suppress 指“压制”，均与教育目标相反；postpone 表示“推迟”，不能接能力培养。"}, {"id": "x6-v-003", "level": "CET6", "type": "词汇", "topic": "科技", "stem": "Tech companies must constantly ___ to survive in a fast-changing market.", "options": ["A. innovate", "B. replicate", "C. stagnate", "D. regress"], "answer": "A", "analysis": "innovate 意为“创新”，符合科技企业持续发展的需要。replicate 指“复制”，stagnate 指“停滞”，regress 指“倒退”，三者均无法帮助企业在快速变化的市场中存活。"}, {"id": "x6-v-004", "level": "CET6", "type": "词汇", "topic": "社会", "stem": "New policies aim to ___ poverty in remote mountainous areas.", "options": ["A. alleviate", "B. aggravate", "C. intensify", "D. provoke"], "answer": "A", "analysis": "alleviate 意为“缓解、减轻”，与 poverty 搭配表示扶贫。aggravate 和 intensify 都表示“加重”，与政策目标相反；provoke 指“激起、引发”，不用于贫困。"}, {"id": "x6-v-005", "level": "CET6", "type": "词汇", "topic": "经济", "stem": "House prices tend to ___ depending on interest rates and demand.", "options": ["A. fluctuate", "B. stabilize", "C. solidify", "D. freeze"], "answer": "A", "analysis": "fluctuate 意为“波动”，准确描述房价随利率和需求上下变化。stabilize 与 solidify 表示“稳定、固化”，freeze 表示“冻结”，均与“depending on”所暗示的不稳定性矛盾。"}, {"id": "x6-v-006", "level": "CET6", "type": "词汇", "topic": "文化", "stem": "It is important to ___ traditional crafts before they disappear.", "options": ["A. preserve", "B. discard", "C. abandon", "D. dissolve"], "answer": "A", "analysis": "preserve 意为“保护、保存”，与 traditional crafts 搭配表达保护传统手艺。discard 与 abandon 表示“丢弃、放弃”，dissolve 指“溶解、解散”，都与原意相反。"}, {"id": "x6-v-007", "level": "CET6", "type": "词汇", "topic": "健康", "stem": "His health began to ___ after years of overwork and poor diet.", "options": ["A. deteriorate", "B. improve", "C. recover", "D. strengthen"], "answer": "A", "analysis": "deteriorate 意为“恶化”，对应 overwork 和 poor diet 带来的负面影响。improve、recover、strengthen 均表示“好转、增强”，与语境中健康下滑的趋势相反。"}, {"id": "x6-v-008", "level": "CET6", "type": "词汇", "topic": "工作", "stem": "Under pressure from the board, the CEO decided to ___ from his position.", "options": ["A. resign", "B. persist", "C. retain", "D. insist"], "answer": "A", "analysis": "resign 意为“辞职”，与 from his position 搭配表示辞去职务。persist 和 insist 表示“坚持”，retain 表示“保留”，都不符合压力下离任的语境。"}, {"id": "x6-v-009", "level": "CET6", "type": "词汇", "topic": "环境", "stem": "Industrial waste has severely ___ the local river, killing fish stocks.", "options": ["A. contaminated", "B. purified", "C. refreshed", "D. ventilated"], "answer": "A", "analysis": "contaminate 意为“污染”，与 killing fish stocks 形成因果呼应。purified 与 refreshed 表示“净化、使清新”，ventilated 指“通风”，均与污染致鱼死亡的后果相反。"}, {"id": "x6-v-010", "level": "CET6", "type": "词汇", "topic": "教育", "stem": "Children ___ language skills more easily than adults do.", "options": ["A. acquire", "B. require", "C. inquire", "D. expire"], "answer": "A", "analysis": "acquire 意为“习得、获得”，常用于语言、知识等技能的自然获取。require 表示“需要”，inquire 指“询问”，expire 指“到期”，均不能与 language skills 搭配表达学习。"}, {"id": "x6-v-011", "level": "CET6", "type": "词汇", "topic": "科技", "stem": "Many routine jobs are being ___ by artificial intelligence and robotics.", "options": ["A. automated", "B. humanized", "C. randomized", "D. generalized"], "answer": "A", "analysis": "automated 意为“自动化”，描述 AI 和机器人接管重复性工作。humanized 表示“人性化”，randomized 指“随机化”，generalized 指“概括化”，均不符合技术替代人力的语境。"}, {"id": "x6-v-012", "level": "CET6", "type": "词汇", "topic": "社会", "stem": "The law prohibits employers from ___ against workers based on gender.", "options": ["A. discriminating", "B. distinguishing", "C. contributing", "D. distributing"], "answer": "A", "analysis": "discriminate 意为“歧视”，discriminate against 是固定搭配，指基于性别的不公平对待。distinguish 指“区分”（中性），contribute 指“贡献”，distribute 指“分配”，都不含贬义歧视义。"}, {"id": "x6-v-013", "level": "CET6", "type": "词汇", "topic": "经济", "stem": "During the crisis, the cost of living ___ and many families struggled.", "options": ["A. inflated", "B. deflated", "C. declined", "D. shrank"], "answer": "A", "analysis": "inflate 意为“（使）膨胀、物价上涨”，inflated 描述生活成本上升。deflate、decline、shrink 均表示“下降、缩减”，与 families struggled 的高物价困境相反。"}, {"id": "x6-v-014", "level": "CET6", "type": "词汇", "topic": "文化", "stem": "The festival allows younger generations to ___ their ancestors' customs.", "options": ["A. inherit", "B. surrender", "C. forfeit", "D. abandon"], "answer": "A", "analysis": "inherit 意为“继承”，用于习俗、传统由后代承接。surrender 与 forfeit 表示“放弃、丧失”，abandon 指“遗弃”，都与传承祖先习俗的正面语境相反。"}, {"id": "x6-v-015", "level": "CET6", "type": "词汇", "topic": "健康", "stem": "Doctors recommend a daily vitamin ___ to improve immunity.", "options": ["A. supplement", "B. substitute", "C. surplus", "D. substitute"], "answer": "A", "analysis": "supplement 意为“补充剂”，vitamin supplement 是常见搭配指维生素补剂。substitute 表示“替代品”，surplus 指“过剩”，均不能准确表达日常额外补充营养素之意。"}, {"id": "x6-v-016", "level": "CET6", "type": "词汇", "topic": "工作", "stem": "Chronic stress can ___ your productivity and damage team morale.", "options": ["A. undermine", "B. enhance", "C. boost", "D. uplift"], "answer": "A", "analysis": "undermine 意为“逐渐削弱、损害”，描述压力对效率和士气的负面作用。enhance、boost、uplift 均表示“提升、鼓舞”，与负面结果相反。"}, {"id": "x6-v-017", "level": "CET6", "type": "词汇", "topic": "环境", "stem": "We must ___ natural resources for future generations instead of wasting them.", "options": ["A. conserve", "B. consume", "C. exhaust", "D. deplete"], "answer": "A", "analysis": "conserve 意为“节约、保护（资源）”，与 for future generations 呼应。consume、exhaust、deplete 都表示“消耗、耗尽”，与保护资源的意图相反。"}, {"id": "x6-v-018", "level": "CET6", "type": "词汇", "topic": "教育", "stem": "A good teacher can ___ students about the wider world beyond textbooks.", "options": ["A. enlighten", "B. confuse", "C. obscure", "D. mislead"], "answer": "A", "analysis": "enlighten 意为“启发、开导”，指教师帮助学生认识更广阔的世界。confuse 与 obscure 表示“使困惑、使模糊”，mislead 指“误导”，均为负面义，与好老师的形象不符。"}, {"id": "x6-v-019", "level": "CET6", "type": "词汇", "topic": "科技", "stem": "Engineers use computer models to ___ how the bridge will behave under stress.", "options": ["A. simulate", "B. calculate", "C. celebrate", "D. accelerate"], "answer": "A", "analysis": "simulate 意为“模拟”，准确表达用计算机模型仿真桥梁受力情况。calculate 偏“计算具体数值”，celebrate 指“庆祝”，accelerate 指“加速”，都不如 simulate 贴切。"}, {"id": "x6-v-020", "level": "CET6", "type": "词汇", "topic": "社会", "stem": "Without support, the elderly may feel ___ and cut off from society.", "options": ["A. marginalized", "B. prioritized", "C. celebrated", "D. integrated"], "answer": "A", "analysis": "marginalized 意为“被边缘化”，与 cut off from society 呼应，描述老人被社会忽视。prioritized 指“被优先对待”，celebrated 指“被颂扬”，integrated 指“融入”，均与原意相反。"}, {"id": "x6-v-021", "level": "CET6", "type": "词汇", "topic": "经济", "stem": "The government agreed to ___ the struggling farmers with direct payments.", "options": ["A. subsidize", "B. tax", "C. fine", "D. penalize"], "answer": "A", "analysis": "subsidize 意为“补贴、资助”，direct payments 即补贴形式。tax、fine、penalize 都表示“征税、罚款、惩罚”，与帮扶困境中农民的意图相反。"}, {"id": "x6-v-022", "level": "CET6", "type": "词汇", "topic": "文化", "stem": "Modern cities are increasingly ___ , with people from many backgrounds living together.", "options": ["A. diverse", "B. uniform", "C. identical", "D. monotonous"], "answer": "A", "analysis": "diverse 意为“多元的”，与 many backgrounds 对应。uniform、identical、monotonous 都表示“单一、雷同、单调”，与多元共处的描述相反。"}, {"id": "x6-v-023", "level": "CET6", "type": "词汇", "topic": "健康", "stem": "Obesity has become ___ among children in developed countries.", "options": ["A. prevalent", "B. rare", "C. scarce", "D. absent"], "answer": "A", "analysis": "prevalent 意为“普遍的、流行的”，描述儿童肥胖在发达国家的常见程度。rare、scarce、absent 均表示“罕见、缺乏、不存在”，与已成为社会问题的语境相反。"}, {"id": "x6-v-024", "level": "CET6", "type": "词汇", "topic": "工作", "stem": "A good manager knows how to ___ tasks to team members effectively.", "options": ["A. delegate", "B. monopolize", "C. concentrate", "D. accumulate"], "answer": "A", "analysis": "delegate 意为“委派、授权”，delegate tasks 是管理常用表达。monopolize 指“垄断”，concentrate 指“集中”，accumulate 指“积累”，都不表达合理分配任务给团队之意。"}, {"id": "x6-v-025", "level": "CET6", "type": "词汇", "topic": "环境", "stem": "Reducing carbon ___ is a key goal of the international climate agreement.", "options": ["A. emissions", "B. admissions", "C. omissions", "D. permissions"], "answer": "A", "analysis": "emissions 意为“排放物”，carbon emissions 是固定用法指碳排放。admissions 指“准许进入”，omissions 指“遗漏”，permissions 指“许可”，拼写相近但语义完全不同。"}, {"id": "x6-v-026", "level": "CET6", "type": "词汇", "topic": "教育", "stem": "Language barriers remain a major ___ to cross-cultural communication.", "options": ["A. obstacle", "B. advantage", "C. catalyst", "D. facilitator"], "answer": "A", "analysis": "obstacle 意为“障碍”，语言障碍阻碍跨文化交流。advantage 指“优势”，catalyst 与 facilitator 都指“促进因素”，均为正面义，与 remains a major 困难语境相反。"}, {"id": "x6-v-027", "level": "CET6", "type": "词汇", "topic": "科技", "stem": "As machines take over, many factory workers fear their skills will become ___ .", "options": ["A. redundant", "B. essential", "C. vital", "D. indispensable"], "answer": "A", "analysis": "redundant 意为“多余的、被淘汰的”，描述技能因自动化而不再被需要。essential、vital、indispensable 都表示“必不可少的”，与工人担忧被取代的语境相反。"}, {"id": "x6-v-028", "level": "CET6", "type": "词汇", "topic": "社会", "stem": "His ___ answer left everyone unsure of his true position.", "options": ["A. ambiguous", "B. explicit", "C. definite", "D. clear"], "answer": "A", "analysis": "ambiguous 意为“模棱两可的”，与 left everyone unsure 呼应。explicit、definite、clear 都表示“明确、清晰”，与令人不确定的结果相反。"}, {"id": "x6-v-029", "level": "CET6", "type": "词汇", "topic": "经济", "stem": "The country is running a large trade ___ , importing far more than it exports.", "options": ["A. deficit", "B. surplus", "C. profit", "D. bonus"], "answer": "A", "analysis": "deficit 意为“逆差、赤字”，进口大于出口即贸易逆差。surplus 指“顺差、盈余”，profit 与 bonus 指“利润、奖金”，均与进口远超出口的描述相反。"}, {"id": "x6-v-030", "level": "CET6", "type": "词汇", "topic": "文化", "stem": "The ancient temple is part of our national ___ and must be protected.", "options": ["A. heritage", "B. garbage", "C. burden", "D. liability"], "answer": "A", "analysis": "heritage 意为“遗产”，national heritage 指国家文化遗产。garbage 指“垃圾”，burden 与 liability 指“负担、债务”，均为贬义，与应受保护的古寺语境相反。"}, {"id": "x6-v-031", "level": "CET6", "type": "词汇", "topic": "健康", "stem": "Physical ___ such as massage can relieve muscle pain effectively.", "options": ["A. therapy", "B. surgery", "C. injury", "D. trauma"], "answer": "A", "analysis": "therapy 意为“疗法、治疗”，physical therapy 指物理治疗/按摩疗法。surgery 指“外科手术”，injury 与 trauma 指“受伤、创伤”，按摩属于理疗而非手术或伤害。"}, {"id": "x6-v-032", "level": "CET6", "type": "词汇", "topic": "工作", "stem": "She showed great ___ in launching the new product without waiting for orders.", "options": ["A. initiative", "B. hesitation", "C. reluctance", "D. passivity"], "answer": "A", "analysis": "initiative 意为“主动性、首创精神”，主动推出产品体现积极性。hesitation 与 reluctance 表示“犹豫、不情愿”，passivity 指“被动”，均为消极义，与语境相反。"}, {"id": "x6-v-033", "level": "CET6", "type": "词汇", "topic": "环境", "stem": "___ development seeks to meet today's needs without harming the future.", "options": ["A. Sustainable", "B. Temporary", "C. Destructive", "D. Reckless"], "answer": "A", "analysis": "sustainable 意为“可持续的”，sustainable development 是固定术语。temporary 指“临时的”，destructive 与 reckless 指“破坏性的、鲁莽的”，都与兼顾未来的理念相反。"}, {"id": "x6-v-034", "level": "CET6", "type": "词汇", "topic": "教育", "stem": "Improving digital ___ is essential in an age of online information.", "options": ["A. literacy", "B. illiteracy", "C. ignorance", "D. negligence"], "answer": "A", "analysis": "literacy 意为“素养”，digital literacy 指数字素养。illiteracy 指“文盲”，ignorance 与 negligence 指“无知、疏忽”，均为负面，与提升能力的要求相反。"}, {"id": "x6-v-035", "level": "CET6", "type": "词汇", "topic": "科技", "stem": "The ___ meeting allowed colleagues in three countries to attend at once.", "options": ["A. virtual", "B. actual", "C. physical", "D. tangible"], "answer": "A", "analysis": "virtual 意为“虚拟的”，virtual meeting 指线上虚拟会议。actual、physical、tangible 都表示“实际的、实体的”，与跨国线上参会的虚拟特性相反。"}, {"id": "x6-g-001", "level": "CET6", "type": "语法", "topic": "语法", "stem": "Not until the train pulled out ___ that he had left his passport on the seat.", "options": ["A. did he realize", "B. he realized", "C. he did realize", "D. realized he"], "answer": "A", "analysis": "Not until 位于句首引起主句部分倒装，助动词 did 提前到主语 he 之前。B 未倒装，C 语序错误，D 完全倒装混乱，均不符合否定词前置的倒装规则。"}, {"id": "x6-g-002", "level": "CET6", "type": "语法", "topic": "语法", "stem": "The professor insisted that the report ___ submitted before Friday.", "options": ["A. be", "B. is", "C. was", "D. will be"], "answer": "A", "analysis": "insist 表示“坚持要求”时，其后的宾语从句用(should)+动词原形的虚拟语气，故用 be。is/was/will be 均为陈述语气，此处表达要求而非事实，故不适用。"}, {"id": "x6-g-003", "level": "CET6", "type": "语法", "topic": "语法", "stem": "Scarcely had she finished the speech ___ the audience burst into applause.", "options": ["A. when", "B. than", "C. then", "D. as"], "answer": "A", "analysis": "scarcely...when... 是固定搭配，表示“一……就……”，且 scarcely 提前用部分倒装。than 常与 no sooner 搭配（no sooner...than），then 与 as 均不用于此结构。"}, {"id": "x6-g-004", "level": "CET6", "type": "语法", "topic": "语法", "stem": "___ hard you try, you cannot please everyone in the office.", "options": ["A. However", "B. Whatever", "C. Whoever", "D. Wherever"], "answer": "A", "analysis": "However + 形容词/副词 引导让步状语从句，此处 however hard 表示“无论多努力”。whatever 后接名词，whoever 指人，wherever 指地点，均不能修饰 hard 这一副词。"}, {"id": "x6-g-005", "level": "CET6", "type
