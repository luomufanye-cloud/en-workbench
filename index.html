ay.' How should the work be submitted?", "options": ["A. by email", "B. online portal", "C. in person", "D. by post"], "answer": "B", "analysis": "录音明确说通过在线门户提交，B 正确。A、C、D 均为常见提交方式干扰项，需注意听清 via the online portal。"}, {"id": "xi-l-005", "level": "IELTS", "type": "听力", "topic": "健康", "stem": "Listen: 'The doctor recommended drinking at least two litres of water daily.' What is the minimum daily amount?", "options": ["A. 1 litre", "B. 2 litres", "C. 3 litres", "D. 5 litres"], "answer": "B", "analysis": "录音说‘至少两升’，最低即为2升，B 正确。A 低于要求；C 与 D 高于最低值，属数字干扰，需抓住 at least。"}, {"id": "xi-l-006", "level": "IELTS", "type": "听力", "topic": "经济", "stem": "Listen: 'The ticket costs fifteen pounds for adults and ten for children.' How much for a child?", "options": ["A. 5", "B. 10", "C. 15", "D. 20"], "answer": "B", "analysis": "录音说明儿童票10英镑，B 正确。A 与 D 为干扰数字；C 是成人票价，需区分 adults 与 children 的对应数值。"}, {"id": "xi-l-007", "level": "IELTS", "type": "听力", "topic": "文化", "stem": "Listen: 'The festival originated in the 18th century and celebrates the harvest.' When did it start?", "options": ["A. 17th century", "B. 18th century", "C. 19th century", "D. 20th century"], "answer": "B", "analysis": "录音说起源于18世纪，B 正确。A、C、D 为相邻世纪干扰，需准确捕捉序数词 eighteenth。"}, {"id": "xi-l-008", "level": "IELTS", "type": "听力", "topic": "媒体", "stem": "Listen: 'The interview was broadcast on Radio 4 at eight in the evening.' Which station aired it?", "options": ["A. Radio 2", "B. Radio 4", "C. TV 1", "D. Online only"], "answer": "B", "analysis": "录音明确说在 Radio 4 播出，B 正确。A 是其他电台干扰；C 与 D 未提及，需锁定电台编号。"}, {"id": "xi-l-009", "level": "IELTS", "type": "听力", "topic": "教育", "stem": "Listen: 'You must bring your student card and a pencil to the exam.' Which is required?", "options": ["A. passport", "B. student card", "C. calculator", "D. textbook"], "answer": "B", "analysis": "录音要求带学生证和铅笔，B 正确。A、C、D 均未在必带清单中，属排除型细节题。"}, {"id": "xi-l-010", "level": "IELTS", "type": "听力", "topic": "环境", "stem": "Listen: 'The train to the lake departs at quarter past eight.' What is the departure time?", "options": ["A. 8:15", "B. 8:45", "C. 7:45", "D. 9:15"], "answer": "A", "analysis": "录音说‘quarter past eight’即8:15，A 正确。B 是 quarter to 混淆；C 与 D 为数字干扰，需辨清 past 与 to。"}, {"id": "xi-l-011", "level": "IELTS", "type": "听力", "topic": "社会", "stem": "Listen: 'The meeting was postponed from Wednesday to Thursday.' When is it now?", "options": ["A. Wednesday", "B. Thursday", "C. Tuesday", "D. Friday"], "answer": "B", "analysis": "录音说明会议从周三改到周四，B 正确。A 是原定日干扰；C 与 D 未提及，需抓住 postponed to。"}, {"id": "xi-l-012", "level": "IELTS", "type": "听力", "topic": "科技", "stem": "Listen: 'The app updates automatically every two weeks.' How often does it update?", "options": ["A. daily", "B. weekly", "C. every two weeks", "D. monthly"], "answer": "C", "analysis": "录音说每两周自动更新，C 正确。A、B、D 频率均不符，需捕捉 every two weeks 这一间隔表达。"}, {"id": "xi-l-013", "level": "IELTS", "type": "听力", "topic": "健康", "stem": "Listen: 'She felt dizzy and was advised to rest for three days.' How long was the rest?", "options": ["A. 1 day", "B. 2 days", "C. 3 days", "D. 1 week"], "answer": "C", "analysis": "录音建议休息三天，C 正确。A、B 少于建议；D 多于建议，属数字干扰，需锁定 three days。"}, {"id": "xi-l-014", "level": "IELTS", "type": "听力", "topic": "经济", "stem": "Listen: 'Profits rose by 12% compared with last year.' By how much did profits rise?", "options": ["A. 2%", "B. 12%", "C. 20%", "D. 21%"], "answer": "B", "analysis": "录音说利润上涨12%，B 正确。A 与 C、D 为邻近数字干扰，需准确抓取 twelve percent。"}, {"id": "xi-l-015", "level": "IELTS", "type": "听力", "topic": "文化", "stem": "Listen: 'The painting was created by a French artist in 1905.' What is the artist's nationality?", "options": ["A. Italian", "B. French", "C. German", "D. Spanish"], "answer": "B", "analysis": "录音说明画家是法国人，B 正确。A、C、D 为其他国籍干扰，需抓住 French 这一形容词。"}, {"id": "xi-l-016", "level": "IELTS", "type": "听力", "topic": "媒体", "stem": "Listen: 'The article was written by a journalist based in Tokyo.' Where is the writer located?", "options": ["A. London", "B. Tokyo", "C. Paris", "D. New York"], "answer": "B", "analysis": "录音说记者驻东京，B 正确。A、C、D 为其他城市干扰，需锁定 based in Tokyo。"}, {"id": "xi-l-017", "level": "IELTS", "type": "听力", "topic": "环境", "stem": "Listen: 'We planted over three hundred trees in the park.' Approximately how many trees?", "options": ["A. 30", "B. 300", "C. 3000", "D. 30,000"], "answer": "B", "analysis": "录音说种了三百多棵树，B 正确。A 少一个零；C 与 D 多零，属数量级干扰，需注意 hundred 与 thousand 的区分。"}, {"id": "xi-l-018", "level": "IELTS", "type": "听力", "topic": "教育", "stem": "Listen: 'The course includes lectures, tutorials, and a final project.' Which is part of the course?", "options": ["A. a field trip", "B. a final project", "C. an exam only", "D. a thesis"], "answer": "B", "analysis": "录音列出课程含讲座、辅导课与期末项目，B 正确。A、C、D 未在列举中，属排除型细节题。"}, {"id": "xi-l-019", "level": "IELTS", "type": "听力", "topic": "社会", "stem": "Listen: 'The new library will open on the first of June.' When does it open?", "options": ["A. June 1", "B. July 1", "C. May 1", "D. June 11"], "answer": "A", "analysis": "录音说6月1日开放，A 正确。B 与 C 为相邻月份干扰；D 混淆了日期数字，需抓住 first of June。"}, {"id": "xi-l-020", "level": "IELTS", "type": "听力", "topic": "科技", "stem": "Listen: 'The device weighs just 250 grams and fits in your pocket.' What is its weight?", "options": ["A. 25 g", "B. 250 g", "C. 2.5 kg", "D. 25 kg"], "answer": "B", "analysis": "录音说明设备仅重250克，B 正确。A 少一个零；C 与 D 为千克级干扰，需注意 gram 与 kilogram 的单位换算。"}, {"id": "y6-v-001", "level": "CET6", "type": "词汇", "topic": "环境", "stem": "Cities around the world are planting rooftop gardens to ___ the urban heat island effect.", "options": ["A. alleviate", "B. aggravate", "C. mobilize", "D. disregard"], "answer": "A", "analysis": "alleviate 意为‘缓解、减轻’，与‘应对城市热岛效应’的目标一致。aggravate 意为‘加剧’，效果相反；mobilize 意为‘动员’；disregard 意为‘无视’，均不合语境。"}, {"id": "y6-v-002", "level": "CET6", "type": "词汇", "topic": "科技", "stem": "Engineers spent two years ___ the sensor until it could detect air pollutants in real time.", "options": ["A. abandoning", "B. refining", "C. concealing", "D. dismantling"], "answer": "B", "analysis": "refine 意为‘改进、完善’，指反复调试使传感器达到要求。abandon 放弃，与‘花了两年时间’的坚持矛盾；conceal 隐藏；dismantle 拆除，均与研发进程不符。"}, {"id": "y6-v-003", "level": "CET6", "type": "词汇", "topic": "教育", "stem": "Whether homework improves learning remains ___ among researchers, with studies reaching opposite conclusions.", "options": ["A. inevitable", "B. unanimous", "C. controversial", "D. obsolete"], "answer": "C", "analysis": "controversial 意为‘有争议的’，与‘研究结果相互矛盾’呼应。inevitable 不可避免的；unanimous 全体一致的，与 opposite conclusions 直接矛盾；obsolete 过时的。"}, {"id": "y6-v-004", "level": "CET6", "type": "词汇", "topic": "健康", "stem": "Doctors ___ patients to limit screen time before bedtime, as blue light delays sleep.", "options": ["A. compel", "B. forbid", "C. permit", "D. advise"], "answer": "D", "analysis": "advise sb to do sth 意为‘建议某人做某事’，符合医生给出建议的语气。compel 强迫，语气过重；forbid 禁止，过于绝对，医生无权强制；permit 允许，与‘限制屏幕时间’的语义相反。"}, {"id": "y6-v-005", "level": "CET6", "type": "词汇", "topic": "经济", "stem": "The central bank raised interest rates to ___ inflation, which had climbed to a forty-year high.", "options": ["A. curb", "B. amplify", "C. prolong", "D. sponsor"], "answer": "A", "analysis": "curb 意为‘遏制、抑制’，加息的目的正是抑制通胀。amplify 放大、增强，方向相反；prolong 延长，通胀居高不下并非央行所愿；sponsor 赞助，语义不搭。"}, {"id": "y6-v-006", "level": "CET6", "type": "词汇", "topic": "工作", "stem": "Employees who feel their contributions are ___ tend to lose motivation and eventually quit.", "options": ["A. rewarded", "B. overlooked", "C. documented", "D. scheduled"], "answer": "B", "analysis": "overlooked 意为‘被忽视的’，贡献被忽视才会失去动力。rewarded 被奖励，与 lose motivation 矛盾；documented 被记录；scheduled 被安排，均与员工心理感受无关。"}, {"id": "y6-v-007", "level": "CET6", "type": "词汇", "topic": "旅行", "stem": "The old town's ___ streets, barely wide enough for two people to pass, attract photographers from around the world.", "options": ["A. spacious", "B. broad", "C. narrow", "D. vacant"], "answer": "C", "analysis": "narrow 意为‘狭窄的’，与‘仅容两人通过’一致。spacious 和 broad 都表示宽敞，与后半句矛盾；vacant 意为‘空置的’，不能描述街道的宽度。"}, {"id": "y6-v-008", "level": "CET6", "type": "词汇", "topic": "媒体", "stem": "Editors must verify sources carefully to avoid spreading ___ information online.", "options": ["A. confidential", "B. authentic", "C. unanimous", "D. misleading"], "answer": "D", "analysis": "misleading 意为‘误导性的’，是编辑需要核实信源以防传播的内容。confidential 机密的；authentic 真实的，真实信息无需避免传播；unanimous 一致的，均不合逻辑。"}, {"id": "y6-v-009", "level": "CET6", "type": "词汇", "topic": "社会", "stem": "Volunteers worked through the night to distribute food and blankets to the ___ families after the flood.", "options": ["A. displaced", "B. prosperous", "C. skeptical", "D. reluctant"], "answer": "A", "analysis": "displaced 意为‘流离失所的’，准确描述洪灾后失去家园的家庭。prosperous 富裕的，与受灾处境矛盾；skeptical 怀疑的；reluctant 不情愿的，均不能作为受助对象的定语。"}, {"id": "y6-v-010", "level": "CET6", "type": "词汇", "topic": "文化", "stem": "The museum's new exhibit ___ the daily life of ordinary people in medieval Europe.", "options": ["A. distorts", "B. depicts", "C. suspends", "D. withholds"], "answer": "B", "analysis": "depict 意为‘描绘、描画’，展览描绘中世纪普通人的生活，搭配自然。distort 歪曲，贬义且无依据；suspend 暂停；withhold 扣留、保留，均不与 exhibit 的展示功能搭配。"}, {"id": "y6-v-011", "level": "CET6", "type": "词汇", "topic": "健康", "stem": "A ___ cough that lasts more than three weeks should be examined by a doctor.", "options": ["A. temporary", "B. mild", "C. persistent", "D. occasional"], "answer": "C", "analysis": "persistent 意为‘持续性的’，与‘持续三周以上’呼应。temporary 临时的、mild 轻微的、occasional 偶尔的，均与持续时间长的描述矛盾。"}, {"id": "y6-v-012", "level": "CET6", "type": "词汇", "topic": "科技", "stem": "Thanks to its efficient chip, the laptop can ___ for up to twenty hours on a single charge.", "options": ["A. endure", "B. persist", "C. survive", "D. operate"], "answer": "D", "analysis": "operate 意为‘运行、工作’，指设备持续运转。endure 忍受，宾语应为痛苦；persist 坚持，不及物且多指人的行为；survive 幸存，搭配不当，均不能描述电脑续航。"}, {"id": "y6-v-013", "level": "CET6", "type": "词汇", "topic": "环境", "stem": "Coral bleaching occurs when rising sea temperatures ___ the algae that give corals their color.", "options": ["A. expel", "B. nurture", "C. attract", "D. clone"], "answer": "A", "analysis": "expel 意为‘排出、驱走’，海水升温导致珊瑚排出共生的藻类从而白化。nurture 滋养，效果相反；attract 吸引；clone 克隆，均不符合白化的机理。"}, {"id": "y6-v-014", "level": "CET6", "type": "词汇", "topic": "经济", "stem": "Small retailers complain that online platforms have ___ away most of their customers.", "options": ["A. wandered", "B. lured", "C. stumbled", "D. gripped"], "answer": "B", "analysis": "lure 意为‘引诱’，lure away 为固定搭配，指电商抢走顾客。wander 漫游，主语应为人且不接 away 的宾语；stumble 绊倒；grip 抓紧，均不合搭配。"}, {"id": "y6-v-015", "level": "CET6", "type": "词汇", "topic": "教育", "stem": "Lectures alone cannot ___ deep understanding; students need discussion and hands-on practice.", "options": ["A. postpone", "B. evaluate", "C. foster", "D. regulate"], "answer": "C", "analysis": "foster 意为‘培养、促进’，深化理解需要讨论与实践来培养。postpone 推迟；evaluate 评估；regulate 监管，均不能与 understanding 构成‘使之产生’的动宾关系。"}, {"id": "y6-v-016", "level": "CET6", "type": "词汇", "topic": "工作", "stem": "The manager promised to look into my complaint, but weeks passed and nothing ___ happened.", "options": ["A. virtually", "B. instantly", "C. merely", "D. whatsoever"], "answer": "D", "analysis": "whatsoever 用于否定句中强调‘丝毫（没有）’，nothing whatsoever happened 指毫无进展。virtually 几乎；instantly 立刻；merely 仅仅，三者都无法在否定句中起到强调‘完全没有’的作用。"}, {"id": "y6-v-017", "level": "CET6", "type": "词汇", "topic": "社会", "stem": "Housing prices have risen far beyond the ___ of ordinary young families in major cities.", "options": ["A. means", "B. limits", "C. borders", "D. schemes"], "answer": "A", "analysis": "beyond one's means 为固定搭配，意为‘超出某人的财力’。limits 泛指限制；borders 边界，多指地理界线；schemes 计划，均无‘支付能力’的含义。"}, {"id": "y6-v-018", "level": "CET6", "type": "词汇", "topic": "科技", "stem": "Facial recognition systems remain ___ to changes in lighting and camera angle.", "options": ["A. immune", "B. indifferent", "C. contrary", "D. vulnerable"], "answer": "D", "analysis": "vulnerable to 意为‘易受…影响、对…脆弱’，指人脸识别易受光照和角度干扰。immune 免疫的，意思恰好相反；indifferent 冷漠的，多形容人的态度；contrary 相反的，搭配不符。"}, {"id": "y6-v-019", "level": "CET6", "type": "词汇", "topic": "健康", "stem": "Regular brisk walking can ___ lower blood pressure without any medication.", "options": ["A. drastically", "B. appreciably", "C. negligibly", "D. accidentally"], "answer": "B", "analysis": "appreciably 意为‘明显地、可察觉地’，说明快走能明显降压。drastically 剧烈地、极端地，程度过重且常带负面含义；negligibly 微不足道地，否定了锻炼效果；accidentally 偶然地，不合语境。"}, {"id": "y6-v-020", "level": "CET6", "type": "词汇", "topic": "文化", "stem": "The tea ceremony has remained ___ unchanged for more than six centuries.", "options": ["A. radically", "B. deliberately", "C. virtually", "D. artificially"], "answer": "C", "analysis": "virtually 意为‘几乎、实际上’，virtually unchanged 指‘几乎原封未动’。radically 根本地，与 unchanged 矛盾；deliberately 故意地；artificially 人工地，均不合逻辑。"}, {"id": "y6-v-021", "level": "CET6", "type": "词汇", "topic": "媒体", "stem": "The documentary ___ a heated national debate about factory farming within days of its release.", "options": ["A. ignited", "B. extinguished", "C. suppressed", "D. concluded"], "answer": "A", "analysis": "ignite 意为‘点燃、引发’，ignite a debate 为常见搭配。extinguish 扑灭、suppress 压制，均与‘引发热议’相反；conclude 结束，debate 刚开始而非结束。"}, {"id": "y6-v-022", "level": "CET6", "type": "词汇", "topic": "旅行", "stem": "Tourists are strongly advised to ___ the narrow mountain road during snowstorms.", "options": ["A. approach", "B. avoid", "C. widen", "D. pave"], "answer": "B", "analysis": "avoid 意为‘避开’，暴风雪中应避开险路。approach 接近，与建议相反；widen 加宽、pave 铺路，是道路施工方的行为，游客无权也无力实施。"}, {"id": "y6-v-023", "level": "CET6", "type": "词汇", "topic": "经济", "stem": "The country's exports ___ last year as global demand for electronics slumped.", "options": ["A. soared", "B. stabilized", "C. fluctuated", "D. shrank"], "answer": "D", "analysis": "shrank 意为‘萎缩、缩减’，与需求下滑（slumped）构成因果。soared 飙升，方向相反；stabilized 趋稳，与下滑矛盾；fluctuated 波动，不表示持续减少。"}, {"id": "y6-v-024", "level": "CET6", "type": "词汇", "topic": "社会", "stem": "Local charities have ___ the gap left by shrinking government welfare programs.", "options": ["A. widened", "B. ignored", "C. filled", "D. created"], "answer": "C", "analysis": "fill the gap 为固定搭配，意为‘填补空缺’，慈善组织弥补了福利缩减留下的缺口。widened 扩大缺口、ignored 忽视缺口均与慈善的职能相反；created 制造缺口，逻辑颠倒。"}, {"id": "y6-v-025", "level": "CET6", "type": "词汇", "topic": "教育", "stem": "International students must ___ in the university's health insurance plan unless they have private coverage.", "options": ["A. enroll", "B. descend", "C. evacuate", "D. expire"], "answer": "A", "analysis": "enroll in 意为‘注册加入（计划/课程）’。descend 下降；evacuate 撤离；expire 到期、失效，均为不及物动词或语义不搭，不能与 in the plan 构成‘参加保险’之意。"}, {"id": "y6-v-026", "level": "CET6", "type": "词汇", "topic": "科技", "stem": "The translation app works well for everyday phrases but ___ when handling idioms.", "options": ["A. thrives", "B. accelerates", "C. resumes", "D. falters"], "answer": "D", "analysis": "falter 意为‘失灵、出岔子’，与 but 构成转折，指处理习语时表现不佳。thrive 兴旺，与转折逻辑矛盾；accelerate 加速；resume 恢复，均不表示‘表现变差’。"}, {"id": "y6-v-027", "level": "CET6", "type": "词汇", "topic": "健康", "stem": "Too much vitamin A can be ___ to the liver, so supplements should be taken with care.", "options": ["A. beneficial", "B. toxic", "C. neutral", "D. irrelevant"], "answer": "B", "analysis": "toxic 意为‘有毒的、有害的’，与‘过量摄入需谨慎’呼应。beneficial 有益的，意思相反；neutral 中性的，不构成警告的理由；irrelevant 无关的，不能说明危害。"}, {"id": "y6-v-028", "level": "CET6", "type": "词汇", "topic": "文化", "stem": "Traditional weaving techniques are passed from mothers to daughters by ___, not from textbooks.", "options": ["A. instinct", "B. chance", "C. imitation", "D. illusion"], "answer": "C", "analysis": "by imitation 意为‘通过模仿’，口传身授靠模仿习得。instinct 本能，若靠本能则无需母亲传授；by chance 偶然地；illusion 幻觉，均不合传承技艺的语境。"}, {"id": "y6-v-029", "level": "CET6", "type": "词汇", "topic": "工作", "stem": "Two weeks into the job, she was already ___ with the endless paperwork.", "options": ["A. overwhelmed", "B. entertained", "C. acquainted", "D. blessed"], "answer": "A", "analysis": "be overwhelmed with 意为‘被…压得喘不过气’，与 endless paperwork 呼应。entertained 感到有趣的；acquainted 熟悉的，不含‘不堪重负’之意；blessed 有福的，均与繁重文书工作的负面语境不符。"}, {"id": "y6-v-030", "level": "CET6", "type": "词汇", "topic": "环境", "stem": "Scientists warn that the wetland will ___ completely if the drought continues for another season.", "options": ["A. flourish", "B. revive", "C. persist", "D. vanish"], "answer": "D", "analysis": "vanish 意为‘完全消失’，与干旱持续导致湿地干涸的推断一致。flourish 繁茂、revive 复苏，与干旱威胁相反；persist 坚持、持续，不能表示湿地消失。"}, {"id": "y6-v-031", "level": "CET6", "type": "词汇", "topic": "媒体", "stem": "The journalist refused to name her sources, calling the information strictly ___.", "options": ["A. fake", "B. hollow", "C. confidential", "D. spontaneous"], "answer": "C", "analysis": "confidential 意为‘机密的’，记者以保密为由拒绝透露信源。fake 假的，记者不会以此为由拒绝透露；hollow 空洞的；spontaneous 自发的，均不合新闻伦理语境。"}, {"id": "y6-v-032", "level": "CET6", "type": "词汇", "topic": "经济", "stem": "Consumers tend to ___ their spending on luxuries when the economic outlook darkens.", "options": ["A. boost", "B. curb", "C. justify", "D. calculate"], "answer": "B", "analysis": "curb 意为‘削减、抑制’，经济前景黯淡时消费者会收紧奢侈品开支。boost 刺激、增加，方向相反；justify 为…辩护；calculate 计算，均不合消费心理。"}, {"id": "y6-v-033", "level": "CET6", "type": "词汇", "topic": "社会", "stem": "Opinions on the new zoning law are sharply ___: renters welcome it, while homeowners oppose it.", "options": ["A. polarized", "B. unanimous", "C. muted", "D. exaggerated"], "answer": "A", "analysis": "polarized 意为‘两极分化的’，与冒号后‘租客支持、房主反对’的对立一致。unanimous 全体一致的，与对立矛盾；muted 缄默的；exaggerated 夸张的，均不合语境。"}, {"id": "y6-v-034", "level": "CET6", "type": "词汇", "topic": "科技", "stem": "Engineers ran thousands of ___ before putting the bridge design into construction.", "options": ["A. hazards", "B. shortcuts", "C. premises", "D. simulations"], "answer": "D", "analysis": "simulation 意为‘模拟、仿真’，指施工前的数字模拟测试。hazard 危险；shortcut 捷径；premise 前提，均不是工程师验证设计所用的手段。"}, {"id": "y6-v-035", "level": "CET6", "type": "词汇", "topic": "健康", "stem": "Sleep deprivation ___ one's judgment, which is why drowsy driving is so dangerous.", "options": ["A. sharpens", "B. restores", "C. impairs", "D. quickens"], "answer": "C", "analysis": "impair 意为‘损害、削弱’，缺觉损害判断力正是疲劳驾驶危险的原因。sharpens 使敏锐、restores 恢复、quickens 加快，均与危险性的解释相反。"}, {"id": "y6-v-036", "level": "CET6", "type": "词汇", "topic": "工作", "stem": "After ten years at the firm, he was ___ to head the Asian division.", "options": ["A. demoted", "B. promoted", "C. dismissed", "D. reprimanded"], "answer": "B", "analysis": "promote 意为‘晋升’，被提拔领导亚洲分部符合十年资历后的职业发展。demote 降职、dismiss 解雇、reprimand 申斥，均与‘出任分部主管’的升迁语义矛盾。"}, {"id": "y6-v-037", "level": "CET6", "type": "词汇", "topic": "文化", "stem": "The novelist is widely ___ for her vivid portraits of immigrant life.", "options": ["A. celebrated", "B. notorious", "C. condemned", "D. forgotten"], "answer": "A", "analysis": "celebrated 意为‘受赞誉的、著名的’，与 vivid portraits 的正面评价搭配。notorious 臭名昭著的、condemned 受谴责的，均为贬义；forgotten 被遗忘的，与 widely 矛盾。"}, {"id": "y6-v-038", "level": "CET6", "type": "词汇", "topic": "旅行", "stem": "Backpackers often ___ on a shoestring, staying in hostels and cooking their own meals.", "options": ["A. splurge", "B. invest", "C. gamble", "D. travel"], "answer": "D", "analysis": "travel on a shoestring 为固定表达，意为‘穷游、花很少的钱旅行’。splurge 挥霍，与住青旅、自己做饭的节俭方式相反；invest 投资；gamble 赌博，均不合搭配。"}, {"id": "y6-v-039", "level": "CET6", "type": "词汇", "topic": "经济", "stem": "The report ___ that remote work may widen the pay gap between big cities and small towns.", "options": ["A. doubts", "B. denies", "C. suggests", "D. forbids"], "answer": "C", "analysis": "suggest 意为‘表明、暗示’，研究报告提出一种可能的结论。doubt 怀疑与 deny 否认均与报告提出观点的功能矛盾；forbid 禁止，报告无权禁止，搭配不当。"}, {"id": "y6-v-040", "level": "CET6", "type": "词汇", "topic": "社会", "stem": "The city council voted to ___ the historic theater rather than sell it to developers.", "options": ["A. demolish", "B. preserve", "C. lease", "D. auction"], "answer": "B", "analysis": "preserve 意为‘保护、保存’，‘不卖给开发商’暗示议会选择保护这座剧院。demolish 拆毁，与不出售的保护意图相反；lease 出租、auction 拍卖，均属变相处置资产。"}, {"id": "y6-v-041", "level": "CET6", "type": "词汇", "topic": "教育", "stem": "Good teachers ___ a love of reading in children long before exams enter the picture.", "options": ["A. suspend", "B. instill", "C. confiscate", "D. postpone"], "answer": "B", "analysis": "instill 意为‘逐步灌输、培养（观念）’，instill a love of reading 为地道搭配。suspend 暂停；confiscate 没收；postpone 推迟，均不能与‘培养热爱’构成合理动宾。"}, {"id": "y6-v-042", "level": "CET6", "type": "词汇", "topic": "环境", "stem": "Beach clean-up drives have ___ thousands of volunteers over the past decade.", "options": ["A. mobilized", "B. dissuaded", "C. confined", "D. dismissed"], "answer": "A", "analysis": "mobilize 意为‘动员’，动员志愿者参加净滩活动。dissuade 劝阻、confine 限制、dismiss 解散，均与召集志愿者的积极行动相反。"}, {"id": "y6-v-043", "level": "CET6", "type": "词汇", "topic": "健康", "stem": "The new drug underwent rigorous trials before it was ___ for public use.", "options": ["A. banned", "B. recalled", "C. approved", "D. withdrawn"], "answer": "C", "analysis": "approve 意为‘批准’，新药须经严格试验后才获批上市。ban 禁止、recall 召回、withdraw 撤回，均与‘经过严格试验后投入使用’的逻辑相反。"}, {"id": "y6-v-044", "level": "CET6", "type": "词汇", "topic": "科技", "stem": "Data centers ___ enormous amounts of electricity, prompting a shift toward greener cooling systems.", "options": ["A. generate", "B. recycle", "C. conserve", "D. consume"], "answer": "D", "analysis": "consume 意为‘消耗’，数据中心耗电量巨大才需要更环保的散热方案。generate 产生，数据中心是用电方而非发电方；recycle 回收；conserve 节约，与巨大耗电的语境矛盾。"}, {"id": "y6-v-045", "level": "CET6", "type": "词汇", "topic": "经济", "stem": "The subsidy is designed to ___ small farms against a flood of cheap imports.", "options": ["A. expose", "B. shield", "C. convert", "D. condemn"], "answer": "B", "analysis": "shield ... against ... 意为‘保护…免受…’，补贴旨在保护小农场免受低价进口冲击。expose 暴露，效果相反；convert 转变；condemn 谴责，均不合搭配。"}, {"id": "y6-v-046", "level": "CET6", "type": "词汇", "topic": "社会", "stem": "Noise pollution is often ___ as a mere nuisance rather than a public health issue.", "options": ["A. dismissed", "B. escalated", "C. financed", "D. celebrated"], "answer": "A", "analysis": "dismiss ... as ... 意为‘把…轻视为…’，噪音污染常被轻描淡写为小麻烦。escalate 升级；finance 资助；celebrate 赞颂，均与‘不被重视’的语境相反。"}, {"id": "y6-v-047", "level": "CET6", "type": "词汇", "topic": "文化", "stem": "Calligraphy requires years of practice before one's brushstrokes acquire genuine ___.", "options": ["A. ignorance", "B. fatigue", "C. elegance", "D. urgency"], "answer": "C", "analysis": "elegance 意为‘优雅、韵致’，苦练多年后笔法才显功力与美感。ignorance 无知；fatigue 疲劳；urgency 紧迫，均不是书法追求的境界。"}, {"id": "y6-v-048", "level": "CET6", "type": "词汇", "topic": "工作", "stem": "The intern was praised for her ___: she spotted an error that senior staff had missed.", "options": ["A. negligence", "B. hesitation", "C. arrogance", "D. alertness"], "answer": "D", "analysis": "alertness 意为‘警觉、机敏’，冒号后‘发现老员工漏掉的错误’正是机敏的体现。negligence 疏忽、hesitation 犹豫、arrogance 傲慢，均与受表扬的原因矛盾。"}, {"id": "y6-v-049", "level": "CET6", "type": "词汇", "topic": "媒体", "stem": "Sensational headlines are often written to ___ readers into clicking rather than to inform them.", "options": ["A. restrain", "B. entice", "C. postpone", "D. discourage"], "answer": "B", "analysis": "entice 意为‘诱使’，entice sb into doing sth 指标题党诱导点击。restrain 抑制、discourage 使打消念头，方向相反；postpone 推迟，语义不搭。"}, {"id": "y6-v-050", "level": "CET6", "type": "词汇", "topic": "旅行", "stem": "The fishing village has become a ___ destination for hikers since the trail was featured in a travel magazine.", "options": ["A. trendy", "B. hazardous", "C. remote", "D. forbidden"], "answer": "A", "analysis": "trendy 意为‘时兴的、热门的’，被杂志报道后成为热门目的地顺理成章。hazardous 危险的、forbidden 禁止进入的，与游客蜂拥而至矛盾；remote 偏远的不必然是吸引游客的原因。"}, {"id": "y6-v-051", "level": "CET6", "type": "词汇", "topic": "教育", "stem": "Cramming boosts short-term recall, but the memorized facts quickly ___ from memory.", "options": ["A. emerge", "B. restore", "C. fade", "D. accumulate"], "answer": "C", "analysis": "fade 意为‘逐渐消退’，与 but 转折后‘突击记忆难以持久’呼应。emerge 出现；restore 恢复（及物动词）；accumulate 积累，均与遗忘的方向相反。"}, {"id": "y6-v-052", "level": "CET6", "type": "词汇", "topic": "经济", "stem": "Analysts expect the tourism sector to ___ rapidly once visa rules are relaxed.", "options": ["A. collapse", "B. stagnate", "C. retreat", "D. rebound"], "answer": "D", "analysis": "rebound 意为‘反弹、复苏’，签证放宽后旅游业回暖。collapse 崩溃、stagnate 停滞，与利好政策的结果相反；retreat 后退，多用于军事或价格回落，不合语境。"}, {"id": "y6-v-053", "level": "CET6", "type": "词汇", "topic": "健康", "stem": "Doctors stress that prevention is far more ___ than treatment for chronic diseases.", "options": ["A. effective", "B. toxic", "C. painful", "D. costly"], "answer": "A", "analysis": "effective 意为‘有效的’，预防比治疗更有效是公共卫生的基本共识。toxic 有毒的、painful 疼痛的，明显不合；costly 昂贵的，与‘预防更省钱’的事实相反。"}, {"id": "y6-v-054", "level": "CET6", "type": "词汇", "topic": "社会", "stem": "The new subway line is expected to ___ traffic congestion in the eastern suburbs.", "options": ["A. preserve", "B. relieve", "C. multiply", "D. postpone"], "answer": "B", "analysis": "relieve 意为‘缓解’，地铁开通缓解拥堵是常见表述。preserve 保存、postpone 推迟，不能与拥堵搭配；multiply 成倍增加，与地铁的作用相反。"}, {"id": "y6-v-055", "level": "CET6", "type": "词汇", "topic": "文化", "stem": "Ancient scripts still ___ scholars because no one has fully deciphered them.", "options": ["A. bore", "B. comfort", "C. confirm", "D. baffle"], "answer": "D", "analysis": "baffle 意为‘使困惑’，至今无人完全破译的古文字令学者困惑。bore 使厌倦，与‘持续吸引学者研究’矛盾；comfort 安慰；confirm 证实，均不合逻辑。"}, {"id": "y6-v-056", "level": "CET6", "type": "词汇", "topic": "科技", "stem": "The company ___ its privacy policy after users complained about data sharing.", "options": ["A. concealed", "B. abolished", "C. revised", "D. violated"], "answer": "C", "analysis": "revise 意为‘修订’，因用户投诉而修订隐私政策合乎逻辑。conceal 隐瞒政策则与回应投诉的目的相反；abolish 彻底废除，隐私政策不可废止；violate 违反，主客颠倒。"}, {"id": "y6-v-057", "level": "CET6", "type": "词汇", "topic": "工作", "stem": "Flexible hours have ___ morale in the department, internal surveys suggest.", "options": ["A. boosted", "B. drained", "C. frozen", "D. taxed"], "answer": "A", "analysis": "boost 意为‘提升、鼓舞’，弹性工作制提振士气。drain 耗尽、freeze 冻结、tax 加重负担，均与调查反映的积极结果相反。"}, {"id": "y6-v-058", "level": "CET6", "type": "词汇", "topic": "环境", "stem": "Overfishing has pushed several tuna species to the ___ of extinction.", "options": ["A. summit", "B. bottom", "C. horizon", "D. brink"], "answer": "D", "analysis": "on the brink of extinction 为固定搭配，意为‘濒临灭绝的边缘’。summit 顶峰；bottom 底部；horizon 地平线，均不与 extinction 构成习语。"}, {"id": "y6-v-059", "level": "CET6", "type": "词汇", "topic": "教育", "stem": "Only students with a GPA above 3.5 are ___ for the honors program.", "options": ["A. exempt", "B. eligible", "C. immune", "D. inferior"], "answer": "B", "analysis": "eligible 意为‘有资格的’，eligible for 指符合资格要求。exempt 被免除的（免于义务而非获得资格）；immune 免疫的；inferior 低人一等的，均不合句意。"}, {"id": "y6-v-060", "level": "CET6", "type": "词汇", "topic": "健康", "stem": "Yoga and meditation are widely recommended as ways to ___ stress without medication.", "options": ["A. endure", "B. magnify", "C. manage", "D. inherit"], "answer": "C", "analysis": "manage 意为‘调控、应对’，manage stress 为高频搭配，指有效管理压力。endure 忍受，态度消极且非所推荐；magnify 放大；inherit 继承，均不合语境。"}, {"id": "y6-v-061", "level": "CET6", "type": "词汇", "topic": "科技", "stem": "The robotics team ___ a working prototype in just six weeks, far ahead of schedule.", "options": ["A. assembled", "B. demolished", "C. postponed", "D. dismantled"], "answer": "A", "analysis": "assemble 意为‘组装’，组装出可运行的原型机。demolish 拆毁、dismantle 拆解，与‘提前完成任务’的成果相反；postpone 推迟，逻辑矛盾。"}, {"id": "y6-v-062", "level": "CET6", "type": "词汇", "topic": "社会", "stem": "Charities appealed for donations to help ___ families through the harsh winter.", "options": ["A. wealthy", "B. vacant", "C. hostile", "D. needy"], "answer": "D", "analysis": "needy 意为‘贫困的、缺衣少食的’，慈善机构募捐帮助贫困家庭过冬。wealthy 富裕的，与受助对象相反；vacant 空置的；hostile 怀有敌意的，均不合语境。"}, {"id": "y6-v-063", "level": "CET6", "type": "词汇", "topic": "经济", "stem": "A weaker currency makes exports cheaper but ___ the cost of imported goods.", "options": ["A. lowers", "B. subsidizes", "C. inflates", "D. exempts"], "answer": "C", "analysis": "inflate 意为‘抬高（价格）’，本币贬值推高进口商品成本。lower 降低，与贬值推高进口成本相反；subsidize 补贴；exempt 免除，均不合经济学逻辑。"}, {"id": "y6-v-064", "level": "CET6", "type": "词汇", "topic": "文化", "stem": "The film festival ___ works by emerging directors from over forty countries each spring.", "options": ["A. bans", "B. showcases", "C. withholds", "D. dubs"], "answer": "B", "analysis": "showcase 意为‘展示’，电影节为各国新导演提供展示平台。ban 禁映、withhold 扣押，与电影节宗旨相反；dub 配音，语义不搭。"}, {"id": "y6-v-065", "level": "CET6", "type": "词汇", "topic": "健康", "stem": "Health officials ___ residents to boil tap water until the contamination scare was resolved.", "options": ["A. urged", "B. permitted", "C. discouraged", "D. assisted"], "answer": "A", "analysis": "urge 意为‘敦促、力劝’，水质污染期间官方紧急敦促居民煮沸自来水。permit 允许，语气太弱，无法体现紧急性；discourage 劝阻，方向相反；assist 协助，搭配不符。"}, {"id": "y6-v-066", "level": "CET6", "type": "词汇", "topic": "工作", "stem": "Constant interruptions ___ his ability to concentrate on complex tasks.", "options": ["A. facilitated", "B. quickened", "C. restored", "D. undermined"], "answer": "D", "analysis": "undermine 意为‘逐渐削弱’，频繁打断削弱专注力。facilitate 促进、restore 恢复，与干扰的负面影响相反；quicken 加快，注意力无法被‘加快’。"}, {"id": "y6-v-067", "level": "CET6", "type": "词汇", "topic": "媒体", "stem": "Podcasts have ___ traditional radio among commuters under thirty.", "options": ["A. restored", "B. overtaken", "C. surrendered", "D. nourished"], "answer": "B", "analysis": "overtake 意为‘超过、赶超’，播客在年轻通勤族中已超越传统广播。restore 恢复、nourish 滋养，主语是播客而非广播，逻辑不通；surrender 投降，搭配不当。"}, {"id": "y6-v-068", "level": "CET6", "type": "词汇", "topic": "旅行", "stem": "The island's ___ scenery has made it a favorite setting for filmmakers.", "options": ["A. gloomy", "B. vacant", "C. picturesque", "D. shabby"], "answer": "C", "analysis": "picturesque 意为‘风景如画的’，与‘受电影人青睐的取景地’一致。gloomy 阴郁的、shabby 破旧的，为贬义，不构成吸引力；vacant 空置的，不形容风景。"}, {"id": "y6-v-069", "level": "CET6", "type": "词汇", "topic": "社会", "stem": "The food bank provides free meals, no questions asked, to anyone in ___.", "options": ["A. need", "B. vain", "C. return", "D. debt"], "answer": "A", "analysis": "in need 为固定搭配，意为‘处于困境（需要帮助）的’。in vain 徒劳；in return 作为回报；in debt 负债，均不能表示‘需要帮助的人’这一完整含义。"}, {"id": "y6-v-070", "level": "CET6", "type": "词汇", "topic": "教育", "stem": "The professor ___ the students' essays with detailed comments over the weekend.", "options": ["A. drafted", "B. shelved", "C. discarded", "D. annotated"], "answer": "D", "analysis": "annotate 意为‘批注、加注’，教授批改论文并写详细评语。draft 起草，对象应为新文稿；shelve 搁置、discard 丢弃，与‘写详细评语’的认真态度矛盾。"}, {"id": "y6-v-071", "level": "CET6", "type": "词汇", "topic": "科技", "stem": "Engineers had to ___ the satellite's orbit slightly to avoid a collision with space debris.", "options": ["A. abandon", "B. duplicate", "C. modify", "D. publicize"], "answer": "C", "analysis": "modify 意为‘微调、修改’，为避免碰撞而调整卫星轨道。abandon 放弃轨道则卫星失效；duplicate 复制轨道；publicize 公布，均不合避险逻辑。"}, {"id": "y6-v-072", "level": "CET6", "type": "词汇", "topic": "经济", "stem": "The new trade agreement is expected to ___ billions of dollars in foreign investment.", "options": ["A. repel", "B. attract", "C. deduct", "D. ration"], "answer": "B", "analysis": "attract 意为‘吸引’，贸易协定吸引外资为常规表述。repel 排斥、repel investment 方向相反；deduct 扣除；ration 定量配给，均与招商引资的目标矛盾。"}, {"id": "y6-v-073", "level": "CET6", "type": "词汇", "topic": "文化", "stem": "Folk songs often ___ the hardships and joys of rural life generations ago.", "options": ["A. conceal", "B. forbid", "C. measure", "D. capture"], "answer": "D", "analysis": "capture 意为‘生动记录、捕捉’，民谣生动记录了先辈的生活。conceal 掩盖，与民谣传唱生活的功能相反；forbid 禁止；measure 测量，均不合句意。"}, {"id": "y6-v-074", "level": "CET6", "type": "词汇", "topic": "健康", "stem": "Regular checkups can ___ health problems before any symptoms appear.", "options": ["A. detect", "B. infect", "C. neglect", "D. complicate"], "answer": "A", "analysis": "detect 意为‘查出、发现’，体检能在症状出现前发现问题。infect 感染，主客颠倒；neglect 忽视，与体检的目的相反；complicate 使复杂，语义不合。"}, {"id": "y6-v-075", "level": "CET6", "type": "词汇", "topic": "媒体", "stem": "The anchor apologized on air after the network ___ an unverified story.", "options": ["A. fact-checked", "B. sponsored", "C. aired", "D. censored"], "answer": "C", "analysis": "air 意为‘播出’，播出未经核实的报道后主播致歉。fact-checked 事实核查，与‘未核实’矛盾；censored 审查删减，播出的恰是未审查内容；sponsored 赞助，不合语境。"}, {"id": "y6-v-076", "level": "CET6", "type": "词汇", "topic": "工作", "stem": "Her promotion came as no surprise: she had ___ managed three major projects that year.", "options": ["A. barely", "B. single-handedly", "C. reluctantly", "D. allegedly"], "answer": "B", "analysis": "single-handedly 意为‘单枪匹马地’，独立完成三个大项目是晋升的充分理由。barely 勉强，语气含贬义，不足以支撑晋升；reluctantly 不情愿地；allegedly 据称，与事实陈述不符。"}, {"id": "y6-v-077", "level": "CET6", "type": "词汇", "topic": "环境", "stem": "Strict emission standards forced factories to ___ their production methods.", "options": ["A. abandon", "B. intensify", "C. display", "D. upgrade"], "answer": "D", "analysis": "upgrade 意为‘升级、改造’，排放标准倒逼工厂升级工艺。abandon 放弃生产方式则无法经营；intensify 加强，指强度而非改进；display 展示，语义不搭。"}, {"id": "y6-v-078", "level": "CET6", "type": "词汇", "topic": "教育", "stem": "Lifelong learning is no longer ___: job skills now expire faster than ever.", "options": ["A. optional", "B. compulsory", "C. affordable", "D. fictional"], "answer": "A", "analysis": "optional 意为‘可有可无的’，后半句‘技能很快过时’说明终身学习已是必需。compulsory 强制的，与‘不再是’连用意为‘不再强制’，逻辑不符；affordable 负担得起的；fictional 虚构的。"}, {"id": "y6-v-079", "level": "CET6", "type": "词汇", "topic": "社会", "stem": "Rescue teams worked ___ to reach the trapped miners before nightfall.", "options": ["A. casually", "B. tirelessly", "C. hesitantly", "D. partially"], "answer": "B", "analysis": "tirelessly 意为‘不知疲倦地’，与抢救被困矿工的紧迫行动匹配。casually 随意地、hesitantly 犹豫地，与争分夺秒的救援矛盾；partially 部分地，语义不通。"}, {"id": "y6-v-080", "level": "CET6", "type": "词汇", "topic": "经济", "stem": "Rising raw-material costs have squeezed the company's already thin ___ margins.", "options": ["A. loss", "B. credit", "C. tax", "D. profit"], "answer": "D", "analysis": "profit margin 意为‘利润率’，原材料涨价压缩本就微薄的利润。loss margin 非惯用搭配；credit margin 信用额度；tax margin 税边际际，均不合商业语境。"}, {"id": "y6-v-081", "level": "CET6", "type": "词汇", "topic": "工作", "stem": "The committee will ___ the proposal's feasibility before allocating any funds.", "options": ["A. assess", "B. neglect", "C. exaggerate", "D. conceal"], "answer": "A", "analysis": "assess 意为‘评估’，拨款前先评估可行性合乎程序。neglect 忽视、conceal 隐瞒，与审慎决策流程矛盾；exaggerate 夸大，委员会不会夸大待审方案的可行性。"}, {"id": "y6-v-082", "level": "CET6", "type": "词汇", "topic": "科技", "stem": "Smart-home devices can ___ electricity use by learning a household's daily routines.", "options": ["A. multiply", "B. optimize", "C. discard", "D. sabotage"], "answer": "B", "analysis": "optimize 意为‘优化’，智能设备通过学习作息优化用电。multiply 成倍增加，与节能目标相反；discard 丢弃；sabotage 蓄意破坏，均不合产品功能描述。"}, {"id": "y6-v-083", "level": "CET6", "type": "词汇", "topic": "文化", "stem": "The ancient palace was declared a World Heritage site, ___ its outstanding architectural significance.", "options": ["A. questioning", "B. exaggerating", "C. affirming", "D. ignoring"], "answer": "C", "analysis": "affirm 意为‘确认、肯定’，入选世遗即肯定其建筑价值。question 质疑、ignore 无视，与授予称号的行为矛盾；exaggerate 夸大，为贬义，不合官方认定语境。"}, {"id": "y6-v-084", "level": "CET6", "type": "词汇", "topic": "健康", "stem": "Flu viruses ___ rapidly, which is why vaccines must be updated every year.", "options": ["A. stabilize", "B. vanish", "C. rest", "D. mutate"], "answer": "D", "analysis": "mutate 意为‘变异’，病毒快速变异导致疫苗需每年更新。stabilize 趋稳、vanish 消失，则疫苗无需更新；rest 休眠，语义不搭。"}, {"id": "y6-v-085", "level": "CET6", "type": "词汇", "topic": "社会", "stem": "The town's only hospital closed, forcing residents to travel ___ for emergency care.", "options": ["A. elsewhere", "B. backward", "C. instead", "D. regardless"], "answer": "A", "analysis": "elsewhere 意为‘去别处’，本地医院关闭后只能去外地就医。backward 向后；instead 代替（副词，不能修饰 travel 表示地点）；regardless 无论如何，均不合句意。"}, {"id": "y6-v-086", "level": "CET6", "type": "词汇", "topic": "教育", "stem": "Group projects ___ skills that exams rarely measure, such as negotiation and delegation.", "options": ["A. suppress", "B. cultivate", "C. forbid", "D. postpone"], "answer": "B", "analysis": "cultivate 意为‘培养’，小组项目培养考试难以考查的协作能力。suppress 压制、forbid 禁止，与项目制的教育目的相反；postpone 推迟，语义不搭。"}, {"id": "y6-v-087", "level": "CET6", "type": "词汇", "topic": "媒体", "stem": "Live blogs allow journalists to ___ developments to readers as events unfold.", "options": ["A. conceal", "B. delay", "C. relay", "D. refute"], "answer": "C", "analysis": "relay 意为‘传递、转播’，直播博客把事态进展实时传递给读者。conceal 隐瞒、delay 延迟，与‘实时直播’的特性相反；refute 驳斥，宾语应是观点而非进展。"}, {"id": "y6-v-088", "level": "CET6", "type": "词汇", "topic": "环境", "stem": "Melting permafrost releases methane, which in turn ___ global warming.", "options": ["A. offsets", "B. reverses", "C. contains", "D. accelerates"], "answer": "D", "analysis": "accelerate 意为‘加速’，甲烷释放会加剧变暖，形成恶性循环。offset 抵消、reverse 逆转、contain 遏制，均与温室气体排放的升温效应相反。"}, {"id": "y6-v-089", "level": "CET6", "type": "词汇", "topic": "经济", "stem": "The auditor's report shed ___ on questionable transfers inside the firm.", "options": ["A. light", "B. doubt", "C. shade", "D. smoke"], "answer": "A", "analysis": "shed light on 为固定搭配，意为‘揭示、阐明’。doubt 虽可搭配 cast doubt on，但动词是 shed 时不能连用；shade 阴影；smoke 烟雾，均无此习语。"}, {"id": "y6-v-090", "level": "CET6", "type": "词汇", "topic": "健康", "stem": "Studies show that even light daily activity is ___ with better heart health.", "options": ["A. incompatible", "B. associated", "C. identical", "D. inconsistent"], "answer": "B", "analysis": "be associated with 意为‘与…相关联’，符合研究结果表述。incompatible 不兼容的、inconsistent 不一致的，均与‘有益心脏’的结论矛盾；identical 完全相同的，程度失实。"}, {"id": "y6-v-091", "level": "CET6", "type": "词汇", "topic": "旅行", "stem": "The travel agency refunded us in full after the tour was ___.", "options": ["A. put off", "B. taken off", "C. called off", "D. worn off"], "answer": "C", "analysis": "call off 意为‘取消’，行程取消后全额退款合乎逻辑。put off 推迟，推迟通常改期而非退款；take off 起飞；wear off 逐渐消退，均不合搭配。"}, {"id": "y6-v-092", "level": "CET6", "type": "词汇", "topic": "工作", "stem": "Despite years of loyal service, she was ___ when the firm downsized last spring.", "options": ["A. promoted", "B. retained", "C. rewarded", "D. laid off"], "answer": "D", "analysis": "be laid off 意为‘被裁员’，与 downsized（缩减规模）呼应，despite 表示惋惜的转折。promoted 晋升、retained 留用、rewarded 奖励，均与裁员的语境相反。"}, {"id": "y6-v-093", "level": "CET6", "type": "词汇", "topic": "文化", "stem": "The museum repatriated the bronzes, ending a long-standing ___ with the source country.", "options": ["A. alliance", "B. dispute", "C. treaty", "D. merger"], "answer": "B", "analysis": "dispute 意为‘争端’，归还文物终结了围绕文物的长期争议。alliance 结盟、treaty 条约，与‘因文物归属产生的摩擦’不符；merger 合并，用于企业。"}, {"id": "y6-v-094", "level": "CET6", "type": "词汇", "topic": "社会", "stem": "Free bus fares have made the city center ___ to low-income workers again.", "options": ["A. accessible", "B. vulnerable", "C. invisible", "D. inferior"], "answer": "A", "analysis": "accessible 意为‘可及的、方便到达的’，免费公交让低收入者重新负担得起进城。vulnerable 脆弱的；invisible 看不见的；inferior 低劣的，均不能描述交通便利性。"}, {"id": "y6-v-095", "level": "CET6", "type": "词汇", "topic": "科技", "stem": "The app alerts users whenever their screen time ___ the daily limit they set.", "options": ["A. meets", "B. sets", "C. lowers", "D. exceeds"], "answer": "D", "analysis": "exceed 意为‘超过’，超出自设时限才触发提醒。meet 达到（中性，通常不触发警告）；set 设定，主语应为人；lowers 降低，与提醒功能矛盾。"}, {"id": "y6-v-096", "level": "CET6", "type": "词汇", "topic": "教育", "stem": "The exam board ___ its grading criteria to make assessment more transparent.", "options": ["A. complicated", "B. abolished", "C. clarified", "D. concealed"], "answer": "C", "analysis": "clarify 意为‘澄清、阐明’，明确评分标准以提高透明度。complicate 使复杂化、conceal 隐瞒，与‘更透明’的目标相反；abolish 废除评分标准则无法评估。"}, {"id": "y6-v-097", "level": "CET6", "type": "词汇", "topic": "环境", "stem": "Conservationists want the wetland ___ as a protected refuge for migratory birds.", "options": ["A. designated", "B. demolished", "C. auctioned", "D. drained"], "answer": "A", "analysis": "designate 意为‘指定、划定’，be designated as a refuge 指被划定为保护区。demolish 拆毁、drain 排干、auction 拍卖，均与保护目标背道而驰。"}, {"id": "y6-v-098", "level": "CET6", "type": "词汇", "topic": "经济", "stem": "Consumer confidence ___ sharply after the bank failures, deepening the recession.", "options": ["A. rallied", "B. stabilized", "C. recovered", "D. plunged"], "answer": "D", "analysis": "plunge 意为‘骤降’，银行倒闭后消费者信心暴跌并加深衰退。rally 回稳、stabilize 趋稳、recover 复苏，均与‘加深衰退’的因果链矛盾。"}, {"id": "y6-v-099", "level": "CET6", "type": "词汇", "topic": "健康", "stem": "The clinic offers ___ counseling for patients learning to live with chronic illness.", "options": ["A. hostile", "B. supportive", "C. occasional", "D. commercial"], "answer": "B", "analysis": "supportive 意为‘给予支持的’，慢性病患者需要支持性心理疏导。hostile 敌对的，与治疗环境相反；occasional 偶尔的，无法体现持续关怀；commercial 商业的，不合医疗公益语境。"}, {"id": "y6-v-100", "level": "CET6", "type": "词汇", "topic": "媒体", "stem": "Advertising revenue has shifted decisively from print ___ to online platforms.", "options": ["A. bankrupt", "B. manual", "C. digital", "D. rural"], "answer": "C", "analysis": "digital 意为‘数字化的’，广告收入从纸媒转向数字平台是行业趋势。bankrupt 破产的；manual 手工的；rural 农村的，均不能描述线上平台属性。"}, {"id": "y6-g-001", "level": "CET6", "type": "语法", "topic": "社会", "stem": "I wish the neighbors ___ their dog barking at all hours of the night.", "options": ["A. would stop", "B. stopped", "C. have stopped", "D. will stop"], "answer": "A", "analysis": "wish 后接虚拟语气；对他人反复发生的恼人行为表示愿望时，用 ‘wish + would + 动词原形’。stopped 表对现在状态的虚拟，不如 would stop 贴切；have stopped 和 will stop 不是虚拟形式，wish 后不可用。"}, {"id": "y6-g-002", "level": "CET6", "type": "语法", "topic": "环境", "stem": "Look at the sky — those black clouds are gathering. It ___ rain any minute.", "options": ["A. was about to", "B. is about to", "C. has been about to", "D. would"], "answer": "B", "analysis": "be about to do 表示‘马上就要发生’，依据现在迹象（乌云密布）判断，用现在时 is about to。was about to 是过去时，与 Look at the sky 的现在语境不符；would 表过去将来，不用于即时判断。"}, {"id": "y6-g-003", "level": "CET6", "type": "语法", "topic": "科技", "stem": "The researcher ___ work won the national award declined all interview requests.", "options": ["A. who", "B. whom", "C. whose", "D. which"], "answer": "C", "analysis": "先行词 researcher 与 work 之间是所属关系（‘其研究’），须用所有格关系代词 whose。who 作主语、whom 作宾语，均不能修饰 work；which 指物，不能指人。"}, {"id": "y6-g-004", "level": "CET6", "type": "语法", "topic": "工作", "stem": "___ twice about the risks, he still signed the contract without hesitation.", "options": ["A. Having warned", "B. Warning", "C. To warn", "D. Having been warned"], "answer": "D", "analysis": "主语 he 与 warn 之间是被动关系（被提醒），且提醒动作先于签署，应用完成式被动分词 Having been warned。Having warned 表主动，主客颠倒；To warn 表目的，逻辑不通。"}, {"id": "y6-g-005", "level": "CET6", "type": "语法", "topic": "教育", "stem": "Never before ___ such a fierce debate over a school uniform policy in this district.", "options": ["A. has there been", "B. there has been", "C. there was", "D. was there"], "answer": "A", "analysis": "否定词 Never before 置于句首须部分倒装；由 before 可知是到现在为止的经历，用现在完成时，故选 has there been。there has been 未倒装；was there 倒装了但时态不能与 before 搭配表‘前所未有’。"}, {"id": "y6-g-006", "level": "CET6", "type": "语法", "topic": "社会", "stem": "The lights are off and the car is gone — they ___ to the concert.", "options": ["A. must go", "B. must have gone", "C. should go", "D. should have gone"], "answer": "B", "analysis": "对已发生的事作有把握的推测用 must have done（‘一定是已经去了’）。must go 是对现在的推测或义务；should go 表建议；should have done 表‘本应做而未做’，含责备，均不合句意。"}, {"id": "y6-g-007", "level": "CET6", "type": "语法", "topic": "经济", "stem": "The grant will be withdrawn ___ the research team publishes its findings by June.", "options": ["A. in case", "B. so that", "C. unless", "D. provided"], "answer": "C", "analysis": "句意为‘若团队六月前不发表成果，经费将被收回’，条件为否定，用 unless（除非）。provided 表肯定条件（‘只要…就’），与 withdrawn 的负面结果矛盾；in case 以防；so that 表目的。"}, {"id": "y6-g-008", "level": "CET6", "type": "语法", "topic": "科技", "stem": "By next March, the construction crew ___ on the new bridge for three full years.", "options": ["A. will work", "B. has worked", "C. would work", "D. will have worked"], "answer": "D", "analysis": "By next March 是将来时间点，动作持续到该时点，须用将来完成时 will have worked。will work 一般将来时不能与‘持续三年’的完成含义匹配；has worked 是现在完成时，时间锚点错误。"}, {"id": "y6-g-009", "level": "CET6", "type": "语法", "topic": "健康", "stem": "___ as the medicine is, it cannot cure every illness.", "options": ["A. Effective", "B. Though effective", "C. It is effective", "D. If effective"], "answer": "A", "analysis": "‘形容词 + as + 主语 + be’ 是让步倒装结构，相当于 however effective the medicine is。Though effective as 搭配错误；It is effective as 不构成让步从句；If effective 表条件而非让步。"}, {"id": "y6-g-010", "level": "CET6", "type": "语法", "topic": "工作", "stem": "With the report ___, the committee adjourned earlier than planned.", "options": ["A. finishing", "B. finished", "C. to finish", "D. to be finished"], "answer": "B", "analysis": "with 复合结构中，report 与 finish 是被动完成关系（报告已被完成），用过去分词 finished。finishing 表主动进行；to finish / to be finished 表将来，与‘提前散会’的既成事实不符。"}, {"id": "y6-g-011", "level": "CET6", "type": "语法", "topic": "社会", "stem": "It is high time we ___ this meeting; everyone is exhausted.", "options": ["A. start", "B. will start", "C. started", "D. have started"], "answer": "C", "analysis": "It is (high) time 后的从句须用过去式虚拟语气（started）表示‘早该做’。start 一般现在时、will start 将来时、have started 完成时均违反该句型的虚拟要求。"}, {"id": "y6-g-012", "level": "CET6", "type": "语法", "topic": "文化", "stem": "Nobody phoned while I was out, ___?", "options": ["A. didn't he", "B. did he", "C. didn't they", "D. did they"], "answer": "D", "analysis": "陈述部分含否定词 nobody，反意疑问部分须用肯定形式；指代 nobody 等不定代词时用人称 they，故选 did they。didn't he / did he 的代词错误；didn't they 前否定后肯定，违反‘前否后肯’规则。"}, {"id": "y6-g-013", "level": "CET6", "type": "语法", "topic": "经济", "stem": "It was not until the audit was published ___ the true scale of the fraud became clear.", "options": ["A. that", "B. when", "C. which", "D. then"], "answer": "A", "analysis": "It was not until ... that ... 为强调句型，被强调的是时间状语从句，连接词只能用 that。when 和 which 不能用于此强调结构；then 不是从属连词，句子结构不完整。"}, {"id": "y6-g-014", "level": "CET6", "type": "语法", "topic": "文化", "stem": "The archaeologists ___ for a month before they unearthed the first fragment.", "options": ["A. dug", "B. had been digging", "C. have been digging", "D. would dig"], "answer": "B", "analysis": "挖掘动作发生在‘挖出第一块碎片’之前并持续了一段时间，须用过去完成进行时 had been digging。dug 一般过去时无‘持续’含义；have been digging 时态与过去语境不符；would dig 表过去将来，逻辑颠倒。"}, {"id": "y6-g-015", "level": "CET6", "type": "语法", "topic": "社会", "stem": "___ the pilot's split-second reaction, the crash would have been far worse.", "options": ["A. As for", "B. In spite of", "C. But for", "D. In case of"], "answer": "C", "analysis": "But for 意为‘要不是’，引出含蓄虚拟条件，与主句 would have been worse 呼应。As for 至于；In spite of 尽管（表让步，不引出虚拟条件）；In case of 万一，均不合虚拟句结构。"}, {"id": "y6-g-016", "level": "CET6", "type": "语法", "topic": "旅行", "stem": "The village ___ my grandmother was born has changed beyond recognition.", "options": ["A. which", "B. that", "C. when", "D. where"], "answer": "D", "analysis": "先行词 village 是地点，且从句中缺地点状语（was born 不及物），用关系副词 where。which/that 在从句中须作主语或宾语，此处不缺；when 表时间，与地点先行词不符。"}, {"id": "y6-g-017", "level": "CET6", "type": "语法", "topic": "社会", "stem": "The witness seems ___ the whole incident, judging by her detailed account.", "options": ["A. to have seen", "B. to see", "C. to be seeing", "D. seeing"], "answer": "A", "analysis": "‘似乎已经目睹’表示不定式动作先于 seems 发生，用不定式完成式 to have seen。to see 与主句时态无法体现‘已完成’；to be seeing 表进行；seeming 后不可直接接动名词。"}, {"id": "y6-g-018", "level": "CET6", "type": "语法", "topic": "旅行", "stem": "So ___ was the storm that all ferries were grounded for two days.", "options": ["A. severely", "B. severe", "C. severity", "D. severest"], "answer": "B", "analysis": "So + 形容词 + that 结果状语从句中，so 后须接形容词原级 severe。severely 是副词；severity 是名词；severest 最高级前不能由 so 直接修饰该结构。"}, {"id": "y6-g-019", "level": "CET6", "type": "语法", "topic": "环境", "stem": "A new cycle lane ___ along the riverbank when I cycled past this morning.", "options": ["A. built", "B. was built", "C. was being built", "D. has built"], "answer": "C", "analysis": "‘今早路过时’自行车道正在修建中，表示过去某时正在进行的被动动作，用过去进行时被动语态 was being built。was built 一般过去被动，不含‘正在进行’；built 和 has built 主动语态错误。"}, {"id": "y6-g-020", "level": "CET6", "type": "语法", "topic": "社会", "stem": "Either the minister or his aides ___ expected to attend the opening ceremony.", "options": ["A. is", "B. are", "C. was", "D. has"], "answer": "B", "analysis": "either ... or ... 连接并列主语时谓语遵循就近原则，靠近谓语的 aides 为复数，且由上下文用现在时，故选 are。is/has 与就近的复数主语不一致；was 时态与 are expected 的现在语境不符。"}, {"id": "y6-g-021", "level": "CET6", "type": "语法", "topic": "环境", "stem": "If the volcano ___ again this winter, the evacuation plan would be activated immediately.", "options": ["A. will erupt", "B. erupts", "C. were to erupt", "D. would have erupted"], "answer": "C", "analysis": "主句为 would be activated，从句须用虚拟语气；对将来不太可能发生的事用 were to do 型虚拟。will erupt 和 erupts 为真实条件句；would have erupted 是对过去的虚拟，与 this winter 矛盾。"}, {"id": "y6-g-022", "level": "CET6", "type": "语法", "topic": "文化", "stem": "She talks about the mountain village as though she ___ there her whole life.", "options": ["A. had lived", "B. has lived", "C. lives", "D. is living"], "answer": "A", "analysis": "as though 引导的从句用虚拟语气；与过去事实相反（她并未在那里住过一生）用过去完成时 had lived。has lived 和 lives 是陈述语气，不合 as though 的虚拟要求；is living 同理。"}, {"id": "y6-g-023", "level": "CET6", "type": "语法", "topic": "工作", "stem": "The last guest ___, the staff began clearing the exhibition hall.", "options": ["A. left", "B. had left", "C. leaving", "D. having left"], "answer": "D", "analysis": "这是独立主格结构：guest 与 leave 是主动关系且动作先于 began，用完成式分词 having left。left 单独作谓语则两个分句间缺少连词；leaving 不能体现‘先离开后清场’的时间先后。"}, {"id": "y6-g-024", "level": "CET6", "type": "语法", "topic": "社会", "stem": "___ matters most in this debate is not cost but safety.", "options": ["A. What", "B. Which", "C. That", "D. It"], "answer": "A", "analysis": "主语从句中 matters 前缺主语，须用连接代词 what（‘最重要的东西’）。Which 表选择，前文无选择范围；That 引导主语从句时从句成分须完整；It 不能引导从句。"}, {"id": "y6-g-025", "level": "CET6", "type": "语法", "topic": "工作", "stem": "You ___ all these documents — the digital copies were perfectly acceptable.", "options": ["A. needn't print", "B. needn't have printed", "C. didn't need to print", "D. mustn't print"], "answer": "B", "analysis": "文档已经打印了，表示‘本不必做却做了’用 needn't have done。needn't print 和 mustn't print 是针对现在/将来的情态，与已完成的动作不符；didn't need to print 只说明‘过去不必’，不包含‘实际做了’的懊悔含义。"}, {"id": "y6-g-026", "level": "CET6", "type": "语法", "topic": "媒体", "stem": "When ___ about the delay, the spokesperson declined to comment.", "options": ["A. asking", "B. to ask", "C. asked", "D. having asked"], "answer": "C", "analysis": "状语从句省略：当从句主语与主句主语一致且谓语含 be 时，保留‘连词 + 分词’；spokesperson 与 ask 是被动关系，用 asked。asking 表主动，主客颠倒；to ask 和 having asked 不用于此类省略结构。"}, {"id": "y6-g-027", "level": "CET6", "type": "语法", "topic": "经济", "stem": "The consultant, ___ we owe the entire turnaround, has announced her retirement.", "options": ["A. who", "B. whom", "C. to whom", "D. from whom"], "answer": "C", "analysis": "owe sth to sb 决定关系代词前须加介词 to，即 to whom we owe the turnaround（我们把扭转局面的功劳归功于她）。who 不能直接作介词宾语；whom 缺少介词；from whom 与 owe 的搭配不符。"}, {"id": "y6-g-028", "level": "CET6", "type": "语法", "topic": "教育", "stem": "The fellowship made ___ for her to complete her doctorate in Germany.", "options": ["A. possible", "B. it possible", "C. that possible", "D. possible that"], "answer": "B", "analysis": "make + it + adj. + for sb to do 结构中，it 作形式宾语，真正的宾语是不定式短语，possible 紧跟其后。省略 it 则形容词失去先行形式宾语；that 不能充当形式宾语用于此结构。"}, {"id": "y6-g-029", "level": "CET6", "type": "语法", "topic": "科技", "stem": "The new processor runs roughly three times ___ the previous model.", "options": ["A. as slow as", "B. faster as", "C. so fast than", "D. as fast as"], "answer": "D", "analysis": "倍数比较结构为‘倍数 + as + 形容词原级 + as’，故选 as fast as。faster as 搭配错误；so fast than 混淆了 as...as 与比较级 than；as slow as 意思相反。"}, {"id": "y6-g-030", "level": "CET6", "type": "语法", "topic": "文化", "stem": "The library's rare-books section ___ closed to the public since the flood.", "options": ["A. has been", "B. is", "C. was", "D. had been"], "answer": "A", "analysis": "since 引导的时间状语要求主句用完成时；closed 的状态从洪水之后持续到现在，用现在完成时 has been。is 和 was 为一般时态，不能与 since 搭配表持续；had been 过去完成时缺过去基准点。"}, {"id": "y6-g-031", "level": "CET6", "type": "语法", "topic": "社会", "stem": "It is vital that every signature ___ before the ballots are counted.", "options": ["A. verifies", "B. be verified", "C. is verified", "D. will be verified"], "answer": "B", "analysis": "It is vital that 句型要求从句用虚拟语气‘(should +) 动词原形’，且 signature 与 verify 是被动关系，故用 be verified。verifies、is verified 和 will be verified 都是陈述语气，违反该句型要求。"}, {"id": "y6-g-032", "level": "CET6", "type": "语法", "topic": "健康", "stem": "He was not wearing a helmet; otherwise he ___ far more serious injuries.", "options": ["A. sustained", "B. would sustain", "C. would have sustained", "D. had sustained"], "answer": "C", "analysis": "otherwise 隐含对过去的虚拟条件（‘要是戴了头盔的话’），主句用 would have done。would sustain 是对现在/将来的虚拟；sustained 和 had sustained 是陈述语气，与 otherwise 的虚拟含义不符。"}, {"id": "y6-g-033", "level": "CET6", "type": "语法", "topic": "科技", "stem": "The tunnel was completed two years ahead of schedule, ___ astonished the entire industry.", "options": ["A. which", "B. that", "C. what", "D. it"], "answer": "A", "analysis": "which 引导非限制性定语从句并可指代前面整个句子（‘提前两年完工’这件事）。that 不能引导非限制性定语从句；what 不能引导定语从句；it 缺连词，两分句无法衔接。"}, {"id": "y6-g-034", "level": "CET6", "type": "语法", "topic": "工作", "stem": "___ I fully understand your concern, I cannot make an exception for one client.", "options": ["A. Until", "B. While", "C. Unless", "D. Provided"], "answer": "B", "analysis": "句意为‘尽管我理解你的顾虑，但不能破例’，while 表让步（‘虽然、尽管’）。Until 直到；Unless 除非；Provided 假如，三者都不表达让步转折关系。"}, {"id": "y6-g-035", "level": "CET6", "type": "语法", "topic": "社会", "stem": "The crowd ___ peacefully toward the square when the rain began.", "options": ["A. dispersed", "B. had dispersed", "C. disperse", "D. were dispersing"], "answer": "D", "analysis": "when the rain began 表示过去某一时刻，此时动作正在进行，用过去进行时 were dispersing。dispersed 一般过去时表已完成；had dispersed 过去完成时表示‘此前已散去’，与‘正走向广场’矛盾。"}, {"id": "y6-g-036", "level": "CET6", "type": "语法", "topic": "经济", "stem": "The auditors still have three regional branches ___.", "options": ["A. to inspect", "B. inspecting", "C. inspected", "D. to be inspecting"], "answer": "A", "analysis": "have + 宾语 + to do 表示‘有…要做’，不定式与宾语是主动关系且指将来，用 to inspect。inspecting 表进行；inspected 表被动完成；to be inspecting 不定式进行式不能作此种后置定语。"}, {"id": "y6-g-037", "level": "CET6", "type": "语法", "topic": "文化", "stem": "She is one of the few delegates who ___ fluent Mandarin.", "options": ["A. speaks", "B. speak", "C. speaking", "D. spoken"], "answer": "B", "analysis": "先行词是 the few delegates（复数），定语从句谓语用复数 speak。A 项 speaks 违反‘one of + 复数名词 + who + 复数动词’规则（区别于 the only one of... who + 单数）；speaking 非谓语不能作谓语；spoken 时态语态错误。"}, {"id": "y6-g-038", "level": "CET6", "type": "语法", "topic": "教育", "stem": "Not only ___ the application deadline, but he also submitted the wrong form.", "options": ["A. he missed", "B. he did miss", "C. missed he", "D. did he miss"], "answer": "D", "analysis": "Not only 位于句首时，其后分句须部分倒装，即助动词提前：did he miss。he missed 未倒装；he did miss 加了强调却仍未倒装；missed he 是完全倒装，不适用于谓语动词倒装。"}, {"id": "y6-g-039", "level": "CET6", "type": "语法", "topic": "经济", "stem": "If only I ___ the contract more carefully before signing it!", "options": ["A. read", "B. have read", "C. had read", "D. would read"], "answer": "C", "analysis": "If only 表示‘要是…就好了’，对已发生的事（签约前没细读）的懊悔用过去完成时 had read。read（过去式）表对现在的虚拟；have read 完成时不是虚拟形式；would read 不用于 if only 的从句。"}, {"id": "y6-g-040", "level": "CET6", "type": "语法", "topic": "旅行", "stem": "The scouts spoke in whispers ___ their conversation should carry across the valley.", "options": ["A. although", "B. lest", "C. whereas", "D. unless"], "answer": "B", "analysis": "lest 意为‘唯恐、以免’，引导目的状语从句且从句常用 should + 动词原形（should carry）。although 虽然；whereas 然而；unless 除非，均不能与 should 表‘以防被听见’的逻辑。"}, {"id": "y6-g-041", "level": "CET6", "type": "语法", "topic": "文化", "stem": "Organizers promised that the refurbished venue ___ by the end of the month.", "options": ["A. would open", "B. will open", "C. opened", "D. has opened"], "answer": "A", "analysis": "主句 promised 是过去时，宾语从句时态须呼应，用过去将来时 would open。will open 时态不呼应；opened 过去时不能表示‘相对于过去将来的开业’；has opened 完成时与 promised 的过去锚点矛盾。"}, {"id": "y6-g-042", "level": "CET6", "type": "语法", "topic": "环境", "stem": "The new regulation stops short ___ banning single-use plastics outright.", "options": ["A. from", "B. for", "C. of", "D. in"], "answer": "C", "analysis": "stop short of doing 为固定搭配，意为‘差一点就做…、未完全走到那一步’。from、for、in 均不能与 stop short 构成该习语，属介词搭配误用。"}, {"id": "y6-g-043", "level": "CET6", "type": "语法", "topic": "经济", "stem": "Suppose the grant ___ withdrawn halfway through the project — what would you do?", "options": ["A. is", "B. was", "C. be", "D. were"], "answer": "D", "analysis": "Suppose 引导对将来的虚拟假设，与主句 would do 呼应，be 动词用 were。is 和 was 是陈述语气；be 为虚拟语气的原形，但 suppose 后从句应用 were（虚拟式）。"}, {"id": "y6-g-044", "level": "CET6", "type": "语法", "topic": "科技", "stem": "The data do ___ that ocean temperatures are rising, whatever skeptics claim.", "options": ["A. showed", "B. showing", "C. to show", "D. show"], "answer": "D", "analysis": "助动词 do/does/did 置于谓语动词前表示强调，其后的动词须用原形：do show（确实表明）。showed 是过去式，与 do 不能连用；showing 和 to show 是非谓语形式，不能作谓语。"}, {"id": "y6-g-045", "level": "CET6", "type": "语法", "topic": "社会", "stem": "There will be days ___ everything seems to go wrong at once.", "options": ["A. when", "B. which", "C. that", "D. where"], "answer": "A", "analysis": "先行词 days 是时间名词，从句中不缺主语或宾语、缺时间状语，用关系副词 when。which 和 that 在从句中须充当主语或宾语；where 表地点，与时间先行词不符。"}, {"id": "y6-g-046", "level": "CET6", "type": "语法", "topic": "健康", "stem": "The instrument requires ___ with a reference standard before each measurement.", "options": ["A. to calibrate", "B. calibrating", "C. calibrated", "D. be calibrated"], "answer": "B", "analysis": "require/want/need 等动词后接动名词时主动形式表被动含义：requires calibrating 相当于 requires to be calibrated。to calibrate 主动不定式不合习惯；calibrated 过去分词不能作 require 的宾语；be calibrated 缺少引导词。"}, {"id": "y6-g-047", "level": "CET6", "type": "语法", "topic": "经济", "stem": "The average salary in the coastal cities is now far higher than ___ in most inland provinces.", "options": ["A. it", "B. one", "C. that", "D. those"], "answer": "C", "analysis": "比较对象须对应：that 代替 the average salary，避免重复。it 指同一事物，不合比较逻辑；one 泛指同类中的任意一个，特指性不足；those 表复数，与 salary 单数矛盾。"}, {"id": "y6-g-048", "level": "CET6", "type": "语法", "topic": "旅行", "stem": "The visitors stood at the rail of the ferry, ___ photos of the receding coastline.", "options": ["A. took", "B. taking", "C. taken", "D. to take"], "answer": "B", "analysis": "现在分词 taking 作伴随状语，表示与 stood 同时进行的主动动作。took 是谓语形式，与 stood 并列缺少连词；taken 表被动；to take 表目的或将来，不能表伴随。"}, {"id": "y6-g-049", "level": "CET6", "type": "语法", "topic": "工作", "stem": "He can't ___ the report himself — he was on assignment abroad all last week.", "options": ["A. have written", "B. write", "C. had written", "D. be writing"], "answer": "A", "analysis": "can't have done 表示对过去情况的否定推测（‘不可能写了’），与‘他整周在国外’呼应。write 是对现在的推测；had written 须依托完成时结构，不能独立接在 can't 后；be writing 是对现在进行的推测。"}, {"id": "y6-g-050", "level": "CET6", "type": "语法", "topic": "媒体", "stem": "The host repeated the question to make herself ___ over the noise of the crowd.", "options": ["A. hear", "B. to hear", "C. hearing", "D. heard"], "answer": "D", "analysis": "make oneself done 表示‘使自己被…’，herself 与 hear 是被动关系，用过去分词 heard。hear 主动方向错误；to hear 不定式不能作 make 的宾补；hearing 表主动进行，均不合逻辑。"}, {"id": "y6-g-051", "level": "CET6", "type": "语法", "topic": "科技", "stem": "This scheme differs from the previous one ___ it rewards long-term subscribers rather than new users.", "options": ["A. so that", "B. now that", "C. in that", "D. except that"], "answer": "C", "analysis": "in that 意为‘在于、因为’，引出差异的具体方面。so that 表目的或结果；now that 既然；except that 除了…之外，均不能表示‘区别在于’。"}, {"id": "y6-g-052", "level": "CET6", "type": "语法", "topic": "经济", "stem": "The regulator tripled the fines ___ repeat offenders more effectively.", "options": ["A. deterring", "B. to deter", "C. for deterring", "D. deterred"], "answer": "B", "analysis": "不定式 to deter 作目的状语，说明提高罚款的目的。deterring 分词不能单独作目的状语置于句末修饰谓语；for detearing 介词短语表达目的不地道；deterred 是谓语/过去分词，结构错误。"}, {"id": "y6-g-053", "level": "CET6", "type": "语法", "topic": "环境", "stem": "A series of minor tremors ___ recorded overnight, but no damage was reported.", "options": ["A. was", "B. were", "C. have", "D. are"], "answer": "A", "analysis": "a series of 作主语时谓语通常与 series 保持一致用单数，且语境为过去时，故选 was。were 与中心词 series 的单数形式不符；have 和 are 时态错误且 have 不能单独表被动。"}, {"id": "y6-g-054", "level": "CET6", "type": "语法", "topic": "社会", "stem": "Little ___ that the brief interview would redirect her entire career.", "options": ["A. she knew", "B. she knows", "C. does she know", "D. did she know"], "answer": "D", "analysis": "Little 是否定副词，置于句首须部分倒装；句中 would redirect 表过去，从句用过去时，故选 did she know。she knew 未倒装；does she know 倒装但时态与过去语境不符；she knows 既未倒装又时态错误。"}, {"id": "y6-g-055", "level": "CET6", "type": "语法", "topic": "经济", "stem": "If the shipment ___ tomorrow morning, the store can still meet the launch date.", "options": ["A. will arrive", "B. would arrive", "C. arrives", "D. arrived"], "answer": "C", "analysis": "真实条件句中，if 从句用一般现在时表将来，主句用情态动词/现在时，即‘主将从现’，故选 arrives。will arrive 和 would arrive 不能用于 if 条件从句；arrived 过去式与 tomorrow 矛盾。"}, {"id": "y6-g-056", "level": "CET6", "type": "语法", "topic": "科技", "stem": "The first prototype failed the stress test, and ___ the second.", "options": ["A. so did", "B. neither did", "C. so was", "D. did neither"], "answer": "B", "analysis": "第二个原型‘也’没有通过（failed 表否定含义），须用 neither + 助动词 + 主语的倒装结构 neither did the second。so did 表肯定重复；so was 助动词错误；did neither 语序不对。"}, {"id": "y6-g-057", "level": "CET6", "type": "语法", "topic": "文化", "stem": "The diary entries were written in cipher ___ the plans would not fall into the wrong hands.", "options": ["A. so that", "B. in case", "C. even though", "D. as if"], "answer": "A", "analysis": "so that 引导目的状语从句（‘为了使计划不落入他人之手’），从句用 would 表目的。in case 以防，侧重预防而非目的结果；even though 表让步；as if 表虚拟比较，均不合句意。"}, {"id": "y6-g-058", "level": "CET6", "type": "语法", "topic": "旅行", "stem": "We ___ the earlier ferry, but nobody bothered to check the timetable.", "options": ["A. caught", "B. must have caught", "C. could have caught", "D. should catch"], "answer": "C", "analysis": "could have done 表示‘本可以做到却没做’，与‘没人查时刻表’的惋惜呼应。caught 陈述既成事实，与 but 转折矛盾；must have caught 是对已发生事情的肯定推测；should catch 是对现在/将来的建议。"}, {"id": "y6-g-059", "level": "CET6", "type": "语法", "topic": "社会", "stem": "Having missed the last bus, ___.", "options": ["A. a taxi was hailed on the corner", "B. I hailed a taxi on the corner", "C. the taxi was hailed by me", "D. a taxi on the corner hailed me"], "answer": "B", "analysis": "分词短语的逻辑主语必须与主句主语一致：错过末班车的是‘我’，故主句主语用 I hailed a taxi。A、C 的主语是 taxi，造成悬垂分词；D 中 taxi 成了打招呼的人，逻辑荒谬。"}, {"id": "y6-g-060", "level": "CET6", "type": "语法", "topic": "健康", "stem": "Under no circumstances ___ the seal on the specimen container before inspection.", "options": ["A. you should break", "B. you break", "C. broke you", "D. should you break"], "answer": "D", "analysis": "Under no circumstances 是否定意义的介词短语，置于句首时句子须部分倒装：should you break。you should break 未倒装；you break 既未倒装又缺情态；broke you 是错误的完全倒装形式。"}, {"id": "y6-g-061", "level": "CET6", "type": "语法", "topic": "经济", "stem": "The announcement ___ the plant would close by spring shocked the whole town.", "options": ["A. what", "B. that", "C. which", "D. whether"], "answer": "B", "analysis": "‘工厂将关闭’是 announcement 的具体内容，构成同位语从句，须用 that 引导且不作从句成分。what 不能引导同位语从句；which 表选择；whether 表‘是否’，与既成公告的事实矛盾。"}, {"id": "y6-g-062", "level": "CET6", "type": "语法", "topic": "工作", "stem": "Don't phone me at nine — I ___ the children to school at that hour.", "options": ["A. will drive", "B. am driving", "C. have driven", "D. will be driving"], "answer": "D", "analysis": "表示将来某一时刻正在进行的动作用将来进行时 will be driving。will drive 只表将来的动作，不能与 at that hour 呼应表‘届时正在’；have driven 完成时与将来时间点矛盾。"}, {"id": "y6-g-063", "level": "CET6", "type": "语法", "topic": "健康", "stem": "After five years in the emergency room, she ___ working under intense pressure.", "options": ["A. is used to", "B. used to", "C. was used to", "D. uses to"], "answer": "A", "analysis": "be used to doing 意为‘习惯于做某事’，to 为介词后接动名词；语境为现在状态，用 is used to。used to do 表示‘过去常常做（现在不做了）’，语义与时态均不符。"}, {"id": "y6-g-064", "level": "CET6", "type": "语法", "topic": "文化", "stem": "Some historians believe the original manuscript may ___ during the great fire of 1666.", "options": ["A. destroy", "B. be destroyed", "C. have been destroyed", "D. have destroyed"], "answer": "C", "analysis": "对过去的推测用 may have done；manuscript 与 destroy 是被动关系，故用 may have been destroyed。be destroyed 是对现在的推测；have destroyed 主动方向错误；destroy 不能直接接在 may 后表完成。"}, {"id": "y6-g-065", "level": "CET6", "type": "语法", "topic": "教育", "stem": "___ was it that finally changed your mind about graduate school?", "options": ["A. What", "B. That", "C. Which", "D. Who"], "answer": "A", "analysis": "这是强调句的疑问形式：强调句 It was ... that ... 变为疑问句即 What was it that ...，强调的成分未知，用 what 询问。That 不能同时充当被强调成分；Which 表有限选择，语境无范围；Who 只指人，而答案可能是事情。"}, {"id": "y6-g-066", "level": "CET6", "type": "语法", "topic": "工作", "stem": "___ no further objections, the chair moved on to the vote.", "options": ["A. There being", "B. There was", "C. It being", "D. Being"], "answer": "A", "analysis": "There being... 是独立主格结构，相当于 As there were no further objections。There was 是完整谓语，与主句之间缺连词；It being 指代不明；Being 单独使用则逻辑主语与主句不一致。"}, {"id": "y6-g-067", "level": "CET6", "type": "语法", "topic": "社会", "stem": "___ I carry those boxes for you? They look rather heavy.", "options": ["A. Will", "B. Must", "C. Should", "D. Shall"], "answer": "D", "analysis": "Shall I ...? 用于第一人称疑问句，表示主动提出帮助（‘我来帮你拿好吗？’）。Will 表意愿或预测；Must 表必须；Should 表建议，均不用于主动提供帮助的句式。"}, {"id": "y6-g-068", "level": "CET6", "type": "语法", "topic": "健康", "stem": "___ any participant feel unwell during the trial, contact the on-site physician at once.", "options": ["A. Would", "B. Were", "C. Should", "D. Had"], "answer": "C", "analysis": "Should any participant feel unwell 是省略 if 的虚拟条件倒装（= If any participant should feel unwell），表示可能性较小的假设。Would 不用于条件倒装；Were 表虚拟但与原形 feel 连用错误；Had 用于过去虚拟，时态不符。"}, {"id": "y6-g-069", "level": "CET6", "type": "语法", "topic": "文化", "stem": "This is the first time the summer festival ___ called off in its eighty-year history.", "options": ["A. was", "B. has been", "C. had been", "D. is"], "answer": "B", "analysis": "This/It is the first time (that) ... 句型要求从句用现在完成时 has been called off。was 和 had been 用于 It was the first time 的过去语境，与 This is 矛盾；is 一般现在时不能体现‘到目前为止的经历’。"}, {"id": "y6-g-070", "level": "CET6", "type": "语法", "topic": "工作", "stem": "No matter how ___ the deadline seems, the safety checks cannot be skipped.", "options": ["A. pressing", "B. pressed", "C. press", "D. to press"], "answer": "A", "analysis": "how 后接形容词或副词；seem 是系动词，前面须用形容词作表语，故选 pressing（紧迫的）。pressed 过去分词含被动义；press 是动词不能作 seem 的表语；to press 不定式不合语法。"}, {"id": "y6-r-001", "level": "CET6", "type": "阅读", "topic": "环境", "stem": "Vertical farms stack crops in city warehouses under LED lights, using up to 95% less water than open fields. Because produce travels only a few blocks to consumers, spoilage and transport emissions drop sharply. The catch is electricity: lighting and climate control make leafy greens costlier than field-grown ones. Question: What is the main drawback of vertical farming according to the passage?", "options": ["A. Excessive water consumption", "B. High energy costs", "C. Long supply chains", "D. Poor food quality"], "answer": "B", "analysis": "文中明确指出 The catch is electricity，照明与温控推高了成本，故选 B。A 与‘省水 95%’矛盾；C 与‘仅几个街区之遥’相反；D 无任何依据，文中未质疑品质。"}, {"id": "y6-r-002", "level": "CET6", "type": "阅读", "topic": "工作", "stem": "Visa programs in dozens of countries now invite digital nomads — remote workers who live abroad while keeping jobs at home. Supporters say the visitors spend freely on local services. Critics counter that longer stays push up rents in popular neighborhoods, squeezing out permanent residents. Question: What concern do critics raise about digital nomads?", "options": ["A. They damage historic sites.", "B. They take jobs from locals.", "C. Longer stays drive up local rents.", "D. They refuse to pay any taxes."], "answer": "C", "analysis": "批评者指出长居推高热门街区房租、挤走原住民，与 C 一致。A 文中未提及；B 与‘工作仍在本国’不符；D 属过度推断，文中只谈房租问题。"}, {"id": "y6-r-003", "level": "CET6", "type": "阅读", "topic": "环境", "stem": "London expanded its ultra-low emission zone in 2023, charging drivers of older, polluting vehicles a daily fee to enter the city center. Monitoring stations soon recorded lower nitrogen-dioxide levels inside the zone. Small businesses with older vans, however, complained that upgrading fleets strained their budgets. Question: What does the passage say about the emission zone policy?", "options": ["A. It cut pollution but burdened some businesses.", "B. It was welcomed by all drivers.", "C. It increased nitrogen-dioxide levels.", "D. It failed to change driving habits."], "answer": "A", "analysis": "文中先说监测到二氧化氮下降，再说小企业抱怨换车负担，可见政策‘降污但加重部分企业负担’。B 与小企业的抱怨矛盾；C 与 lower levels 相反；D 文中未提及习惯改变与否。"}, {"id": "y6-r-004", "level": "CET6", "type": "阅读", "topic": "社会", "stem": "Roughly a third of all food produced is lost or wasted, from farm storage to household bins. When food rots in landfill, it releases methane, a greenhouse gas far more potent than carbon dioxide. Cutting waste is therefore treated as a climate strategy as much as an ethical one. Question: Why is food waste considered a climate issue?", "options": ["A. It forces farmers to expand their fields.", "B. It raises the price of food imports.", "C. Transporting waste consumes too much fuel.", "D. Rotting food releases a potent greenhouse gas."], "answer": "D", "analysis": "文中指出填埋腐烂的食物会释放强效温室气体甲烷，这正是食物浪费被视为气候问题的原因。A、B、C 文中均未提及，属无中生有。"}, {"id": "y6-r-005", "level": "CET6", "type": "阅读", "topic": "媒体", "stem": "A report found that popular apps for children shared location data and viewing habits with advertisers, often without clear parental consent. Regulators responded with record fines and new rules requiring privacy settings to be on by default. Developers argue that personalized content depends on such data. Question: What did regulators require in the new rules?", "options": ["A. A complete ban on children's apps.", "B. Privacy settings to be on by default.", "C. Higher minimum ages for users.", "D. Free access to premium features."], "answer": "B", "analysis": "新规要求隐私设置默认开启（on by default）。A 项全面封禁过度；C 项提高年龄门槛、D 项免费功能文中均未提及；A 项与‘开出罚单并立规’的监管思路不符。"}, {"id": "y6-r-006", "level": "CET6", "type": "阅读", "topic": "教育", "stem": "Once dismissed as a pastime, competitive gaming is now a scholarship sport at hundreds of universities, with dedicated arenas and coaching staff. Supporters point to teamwork and strategic thinking; skeptics worry that screen time crowds out physical exercise. Both sides agree on one thing: audience numbers now rival traditional sports finals. Question: What can be inferred about esports from the passage?", "options": ["A. Its popularity has grown to rival traditional sports.", "B. Universities generally ban competitive gaming.", "C. Coaches treat it as a purely physical sport.", "D. Its audiences have steadily declined."], "answer": "A", "analysis": "双方都承认观众规模已比肩传统体育决赛，可推知其流行程度。B 与‘数百所高校设奖学金’矛盾；C 与‘团队协作与战略思维’的定位相反；D 与 audience numbers rival 相矛盾。"}, {"id": "y6-r-007", "level": "CET6", "type": "阅读", "topic": "文化", "stem": "Audiobook sales have surged while print sales hold steady, prompting claims that listening is replacing reading. Cognitive research complicates the story: for straightforward narratives, comprehension after listening matches that after reading. When texts are dense or technical, however, eyes tend to outperform ears. Question: What does the research suggest about listening versus reading?", "options": ["A. Listening always equals reading in comprehension.", "B. Print sales have collapsed in recent years.", "C. Format matters most with dense, technical texts.", "D. Audiobooks suit every kind of material."], "answer": "C", "analysis": "研究表明文本密集或专业性强时‘眼睛胜过耳朵’，即文本类型决定形式优劣。A 的 always 过于绝对，与 however 后的转折矛盾；B 与 print sales hold steady 相反；D 与文意不符。"}, {"id": "y6-r-008", "level": "CET6", "type": "阅读", "topic": "教育", "stem": "Hundreds of schools now timetable short breathing and meditation sessions. Early trials link the practice to modest drops in student anxiety and fewer playground conflicts. Researchers caution that effects fade unless the exercises are woven into everyday routines rather than treated as one-off lessons. Question: According to researchers, mindfulness programs work best when they are ___.", "options": ["A. taught as separate subjects", "B. led by outside experts", "C. kept brief and rare", "D. integrated into daily routines"], "answer": "D", "analysis": "研究者提醒若不融入日常，效果会消退，故最佳方式是融入日常。A 的‘单独授课’恰是被否定的 one-off lessons；C 与‘效果消退’的告诫矛盾；B 文中未涉及。"}, {"id": "y6-r-009", "level": "CET6", "type": "阅读", "topic": "健康", "stem": "Therapy dogs now visit hospitals, care homes, and even exam halls. Small studies report lower blood pressure and reduced anxiety among patients after animal visits, though sample sizes are tiny. Scientists call for larger trials but see little downside: the worst outcome, they note, is a happier patient. Question: What is the scientists' overall attitude toward animal-assisted therapy?", "options": ["A. Cautiously positive", "B. Firmly opposed", "C. Completely indifferent", "D. Openly hostile"], "answer": "A", "analysis": "科学家呼吁更大规模试验（谨慎）但同时认为‘最坏结果不过是病人更开心’（积极），故为谨慎乐观。B、D 与‘几乎无副作用’的评价矛盾；C 与‘呼吁继续研究’的态度不符。"}, {"id": "y6-r-010", "level": "CET6", "type": "阅读", "topic": "环境", "stem": "Marine biologists grow coral fragments on underwater frames before transplanting them onto damaged reefs. Restored patches attract fish within months, and survival rates exceed seventy percent in calm waters. A warming ocean remains the ceiling on such efforts: transplanted corals die in repeated heat waves just like wild ones. Question: What ultimately limits coral restoration projects?", "options": ["A. The cost of underwater frames", "B. A shortage of trained divers", "C. Repeated marine heat waves", "D. Low survival rates in calm water"], "answer": "C", "analysis": "文中说升温的海洋仍是这类努力的上限，移植珊瑚在热浪中同样死亡。A、B 未提及；D 恰与‘平静水域存活率超七成’相反。"}, {"id": "y6-r-011", "level": "CET6", "type": "阅读", "topic": "科技", "stem": "Desalination plants now supply drinking water to hundreds of millions of people, from Gulf states to coastal Australia. Reverse-osmosis technology has halved the energy needed per liter over two decades. The remaining headaches are brine discharge, which can harm marine life, and the plants' vulnerability to oil spills. Question: Which problem with desalination is mentioned in the passage?", "options": ["A. Excessive electricity pricing", "B. Harmful brine discharge", "C. Falling demand for water", "D. Frequent plant closures"], "answer": "B", "analysis": "文中明确提到 brine discharge 会危害海洋生物。A 项能耗已‘减半’且说的是定价问题；C 与‘供应数亿人’矛盾；D 未提及。"}, {"id": "y6-r-012", "level": "CET6", "type": "阅读", "topic": "经济", "stem": "Sweden accepts cards or phones almost everywhere, and many bank branches no longer handle cash at all. Convenience and lower robbery rates are clear gains. Yet pensioner groups note that people who cannot use digital payments — through age, disability, or distrust — risk being locked out of daily commerce. Question: Which group is potentially disadvantaged by a cashless society?", "options": ["A. Frequent travelers", "B. Small retailers only", "C. Bank employees", "D. People unable to use digital payments"], "answer": "D", "analysis": "文中指出因年龄、残障或不信任而无法使用电子支付的人可能被排除在日常商业之外。A、C 未提及；B 项 only 过于绝对，文中强调的是消费者而非仅零售商。"}, {"id": "y6-r-013", "level": "CET6", "type": "阅读", "topic": "社会", "stem": "Tiny homes — dwellings under 40 square meters — appeal to buyers priced out of conventional housing. Advocates praise lower bills and simpler living; critics point to zoning codes written for large lots and to the social strain of so little space. A few cities now allow tiny-home villages as transitional housing for the homeless. Question: What is one barrier facing tiny homes, according to the passage?", "options": ["A. Zoning rules designed for larger lots", "B. Lack of buyer interest", "C. Their high construction costs", "D. Bans on transitional housing"], "answer": "A", "analysis": "批评者指出为大地块制定的分区法规构成障碍。B 与‘受买不起传统住房者青睐’矛盾；C 与‘更低账单’的经济优势不符；D 与‘一些城市已允许’相反。"}, {"id": "y6-r-014", "level": "CET6", "type": "阅读", "topic": "经济", "stem": "Online resale platforms have turned secondhand clothing into one of fashion's fastest-growing segments, especially among younger shoppers. Buyers cite sustainability, uniqueness, and price. Brands have taken note: several luxury houses now run their own certified pre-owned services, hoping to capture value they once lost to eBay. Question: How have luxury brands responded to the growth of resale?", "options": ["A. By cutting prices on new items", "B. By launching certified pre-owned services", "C. By banning online platforms", "D. By ignoring the secondhand market"], "answer": "B", "analysis": "文中说数家奢侈品牌自营认证二手业务。A、C、D 均与‘希望夺回曾流失的价值’的主动策略不符。"}, {"id": "y6-r-015", "level": "CET6", "type": "阅读", "topic": "教育", "stem": "Countries such as Germany and Switzerland channel nearly half of school-leavers into apprenticeships that mix classroom study with paid on-the-job training. Youth unemployment in these countries stays comparatively low. Critics argue that early tracking can lock teenagers into careers, while defenders say the system simply makes choices explicit. Question: What is a criticism of the apprenticeship model mentioned in the passage?", "options": ["A. It ignores classroom study entirely.", "B. Its graduates earn the least.", "C. Early tracking may fix careers too soon.", "D. It raises youth unemployment."], "answer": "C", "analysis": "批评者认为过早分流会把少年‘锁进’职业。A 与‘课堂学习与带薪实训结合’矛盾；B 未提及；D 与‘青年失业率较低’相反。"}, {"id": "y6-r-016", "level": "CET6", "type": "阅读", "topic": "科技", "stem": "The pandemic turned broadband into a utility as vital as electricity, exposing a stubborn gap: rural households still lack high-speed access at several times the rate of urban ones. Governments responded with subsidy programs, yet rollout lags where population density is too low to attract commercial providers. Question: Why does the rollout lag in some rural areas?", "options": ["A. Households refuse the subsidies.", "B. Low population density makes service unprofitable.", "C. Farmers prefer wireless technology.", "D. Subsidy programs are illegal there."], "answer": "B", "analysis": "文末指出人口密度过低难以吸引商业运营商，导致铺设滞后。A 与‘政府已补贴’的背景不符；C、D 文中均无依据。"}, {"id": "y6-r-017", "level": "CET6", "type": "阅读", "topic": "科技", "stem": "Suborbital flights now sell seats to private passengers for brief minutes above the atmosphere. Firms promise falling prices as vehicles are reused, and some plan orbital hotels by the 2030s. Astronomers complain that satellite and launch traffic is brightening the night sky, complicating telescope observations. Question: What objection to the new space industry is raised in the passage?", "options": ["A. Seats are priced too cheaply.", "B. It endangers commercial airliners.", "C. It brightens the sky for astronomy.", "D. It discourages rocket reuse."], "answer": "C", "analysis": "天文学家抱怨卫星与发射活动令夜空变亮、干扰望远镜观测。A 与‘票价高、承诺降价’的表述无关；B 未提及；D 与‘复用火箭降价’的行业方向相反。"}, {"id": "y6-r-018", "level": "CET6", "type": "阅读", "topic": "健康", "stem": "Digital-detox retreats, where guests surrender phones on arrival, report booming bookings. Guests describe the first day as restless and the third as liberating. Psychologists add a note of caution: a week without screens rarely survives contact with home unless users also change daily habits, like charging phones in the bedroom. Question: What do psychologists point out about digital detoxes?", "options": ["A. Retreats are too expensive for mos
