name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon

      - name: Publish APK to repository
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/en-app.apk
          ls -la apk/
          git config user.name "workbuddy-bot"
          git config user.email "actions@github.com"
          git add apk/en-app.apk
          git commit -m "chore: build apk $(date +%Y%m%d-%H%M)" || echo "no changes"
          git pull --rebase origin main || git pull --no-rebase origin main || true
          git push

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: en-app-apk
          path: apk/en-app.apk
